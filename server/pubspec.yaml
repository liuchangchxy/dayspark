name: dayspark_server
description: DaySpark self-hosted sync backend.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  argon2_web: ^0.3.0
  crypto: ^3.0.3
  dart_jsonwebtoken: ^3.4.1
  dayspark_contracts:
    path: ../packages/dayspark_contracts
  drift: ^2.24.0
  path: ^1.9.0
  rrule: ^0.2.18
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  sqlite3: ^2.4.0
  timezone: ^0.11.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.24.0
  lints: ^6.0.0
  test: ^1.26.0
