function mins(t){if(!t)return 0;const a=t.split(':').map(Number);return a[0]*60+a[1];}
function fmt(m){m=Math.max(0,Math.min(1439,Math.round(m)));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function addDays(iso,n){const [y,m,d]=iso.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d+n));return dt.toISOString().slice(0,10);}
function weekday(iso){const [y,m,d]=iso.split('-').map(Number);return ['周日','周一','周二','周三','周四','周五','周六'][new Date(Date.UTC(y,m-1,d)).getUTCDay()];}
function md(iso){const [,m,d]=iso.split('-').map(Number);return m+' 月 '+d+' 日';}
function mdShort(iso){const [,m,d]=iso.split('-').map(Number);return m+'/'+d;}
function dayNum(iso){return Number(iso.split('-')[2]);}
function calOf(id){return CAL[id]||CAL.personal;}
function allTodos(){return TODOS.concat(state.localTodos).filter(t=>!state.deletedTodos.includes(t.id));}
function todoById(id){return allTodos().find(t=>t.id===id);}
function eventById(id){return EVENTS.find(e=>e.id===id&&!state.deletedEvents.includes(e.id));}
function detailSource(ref){if(!ref)return null;return ref.type==='event'?eventById(ref.id):todoById(ref.id);}
function draftFor(ref){
  const src=detailSource(ref);
  if(!src)return null;
  const key=ref.type+':'+ref.id;
  if(!state.draft||state.draftKey!==key){
    state.draft=JSON.parse(JSON.stringify(src));
    state.draftKey=key;
  }
  return state.draft;
}
function clearDraft(){state.draft=null;state.draftKey=null;}
function draftRef(){
  if(!state.draftKey)return null;
  const i=state.draftKey.indexOf(':');
  return {type:state.draftKey.slice(0,i),id:state.draftKey.slice(i+1)};
}
function activeEditRef(){return state.drawer||draftRef()||activeDetailRef();}
function commitDraft(){
  const ref=activeEditRef();
  if(!ref||!state.draft||state.draftKey!==ref.type+':'+ref.id)return false;
  const target=detailSource(ref);
  if(!target)return false;
  Object.assign(target,state.draft);
  return true;
}
function restorePlan(){
  state.screen=state.planReturn||'today';
  state.variant=state.planReturnVariant||'normal';
  state.drawer=state.planReturnDrawer||null;
  state.drawerEdit=!!state.planReturnEdit;
  state.planReturnDrawer=null;state.planReturnEdit=false;state.planReturnVariant='normal';
}
function planMeta(t,base){
  if(!t.plan)return '';
  const time=fmt(mins(t.plan.start))+'–'+fmt(mins(t.plan.end));
  return (base&&t.plan.date===base?'':mdShort(t.plan.date)+' ')+time;
}
function planDeadline(t){
  if(!t)return '';
  let out='';
  if(t.due)out+=` · <span class="due-pill ${isOverdue(t)?'is-red':''}">${isOverdue(t)?'已逾期 · ':''}截止 ${dueText(t)}</span>`;
  if(t.missed)out+=` · <span class="missed">已遗漏 ${t.missed} 次</span>`;
  return out;
}
function pickTodoId(pref){const t=todoById(pref)||allTodos().find(x=>!isDone(x))||allTodos()[0];return t?t.id:'';}
function pickEventId(pref){const e=eventById(pref)||EVENTS.find(x=>!state.deletedEvents.includes(x.id));return e?e.id:'';}
function isDone(t){return t.status==='done'||state.done?.has?.(t.id);}
function isOverdue(t){return !isDone(t)&&t.due&&t.due<TODAY;}
function hasPlanToday(t){return t.plan&&t.plan.date===TODAY;}
function hasPlanOn(t,day){return t.plan&&t.plan.date===day;}
function noDateTodos(){return allTodos().filter(t=>!isDone(t)&&!t.plan&&!t.due&&!isOverdue(t)&&!t.missed).sort((a,b)=>Number(b.id.startsWith('local-'))-Number(a.id.startsWith('local-')));}
function isMultiDay(e){return e.startDate&&e.endDate&&e.startDate!==e.endDate;}
function calHidden(id){return (state.hiddenCals||[]).includes(id);}
function calIdByName(n){return Object.keys(CAL).find(k=>CAL[k].name===n)||'personal';}
function calCount(id){return EVENTS.filter(e=>e.cal===id&&!state.deletedEvents.includes(e.id)).length+allTodos().filter(t=>t.cal===id).length;}
function calIds(){return Object.keys(CAL).filter(id=>!state.deletedCals.includes(id));}
function hiddenCalCount(){return EVENTS.filter(e=>!state.deletedEvents.includes(e.id)&&calHidden(e.cal)).length+allTodos().filter(t=>calHidden(t.cal)).length;}
function hiddenCalNames(){return (state.hiddenCals||[]).map(id=>'「'+calOf(id).name+'」').join('');}
function eventsOn(day){
  return EVENTS.filter(e=>!state.deletedEvents.includes(e.id)).filter(e=>!calHidden(e.cal)).filter(e=>{
    if(e.date===day)return true;
    if(e.startDate&&e.endDate)return day>=e.startDate&&day<=e.endDate;
    return false;
  });
}
function allDayOn(day){return eventsOn(day).filter(e=>e.allDay||isMultiDay(e));}
function timedEventsOn(day){return eventsOn(day).filter(e=>!e.allDay&&!isMultiDay(e));}
function plansOn(day){return allTodos().filter(t=>!isDone(t)&&!calHidden(t.cal)&&t.plan&&t.plan.date===day).map(t=>({todo:t,start:mins(t.plan.start),end:mins(t.plan.end)}));}
function deadlinesOn(day){return allTodos().filter(t=>!isDone(t)&&!calHidden(t.cal)&&t.due===day);}
function timedDeadlinesOn(day){return deadlinesOn(day).filter(t=>t.dueTime);}
function dateDeadlinesOn(day){return deadlinesOn(day).filter(t=>!t.dueTime);}
function packBlocks(items){
  const sorted=items.slice().sort((a,b)=>a.start-b.start||a.end-b.end);
  const out=[];let cluster=[];let clusterEnd=-1;
  function flush(){
    if(!cluster.length)return;
    const laneEnds=[];
    cluster.forEach(it=>{
      let lane=laneEnds.findIndex(end=>end<=it.start);
      if(lane<0){lane=laneEnds.length;laneEnds.push(it.end);}else{laneEnds[lane]=it.end;}
      it.lane=lane;
    });
    cluster.forEach(it=>it.lanes=laneEnds.length);
    out.push(...cluster);cluster=[];clusterEnd=-1;
  }
  sorted.forEach(it=>{
    if(cluster.length&&it.start>=clusterEnd)flush();
    cluster.push(it);clusterEnd=Math.max(clusterEnd,it.end);
  });
  flush();
  return out;
}
function timeBlocks(day){
  const items=[];
  timedEventsOn(day).forEach(e=>items.push({kind:'event',id:e.id,title:e.title,cal:e.cal,start:mins(e.start),end:mins(e.end),loc:e.loc,live:e.live,repeat:e.repeat,instance:e.instance}));
  plansOn(day).forEach(p=>items.push({kind:'plan',id:p.todo.id,title:p.todo.title,cal:p.todo.cal,start:p.start,end:p.end,todo:p.todo}));
  return packBlocks(items);
}
function pct(m){return Math.max(0,Math.min(100,(m-480)/720*100));}
function dueText(t){if(!t.due)return '';return t.dueTime?mdShort(t.due)+' '+t.dueTime:mdShort(t.due);}
function setToast(msg){state.toast=msg;render();setTimeout(()=>{state.toast=null;render();},2200);}
function addLocalTodo(fields){
  state.localNo++;
  state.localTodos.unshift(Object.assign({id:'local-'+state.localNo,cal:'personal',priority:0},fields));
}

/* ---------------- today ---------------- */
function pageState(title,sub,action){
  return `<div class="page-state-wrap"><div class="page-state"><span class="page-state-ico">${ico('alert',24)}</span><b>${esc(title)}</b>${sub?`<p>${esc(sub)}</p>`:''}<button type="button" class="page-state-btn" data-action="noop">${action||'重试'}</button></div></div>`;
}
function listSkeleton(n){
  return `<div class="list-skel">${Array.from({length:n||6},()=>`<div class="list-skel-row"><span class="list-skel-dot"></span><div class="list-skel-main"><div class="sf-skel" style="width:58%"></div><div class="sf-skel" style="width:36%;height:7px;margin-top:6px"></div></div><div class="sf-skel" style="width:42px;height:10px"></div></div>`).join('')}</div>`;
}
function todaySkeleton(){
  return `<div class="today-grid"><section class="task-col"><div class="zone-label">任务</div>${listSkeleton(5)}</section><section class="time-col"><div class="zone-label">时间</div>${Array.from({length:4},(_,i)=>`<div class="sf-skel" style="height:${i===1?52:44}px;border-radius:8px;margin-bottom:8px"></div>`).join('')}</section></div>`;
}
function todayPage(opts={}){
  const variant=opts.variant||state.variant;
  let drawer=opts.drawer!==undefined?opts.drawer:state.drawer;
  if(drawer===undefined||drawer===null){
    if(variant==='detail')drawer={type:'todo',id:pickTodoId('report')};
  }
  let capture=opts.capture||state.capture;
  if(variant==='capture')capture='parsed';
  const empty=variant==='empty';
  return `<div class="page today-page">
    ${todayHead(empty,variant==='loading'?'loading':variant==='error'?'error':'')}
    ${variant==='error'?pageState('操作没有完成，请重试。','你的数据还在本地；恢复后再继续。'):variant==='loading'?todaySkeleton():`<div class="today-grid">
      <section class="task-col"><div class="zone-label">任务</div>${empty?todayEmptyTasks():todayTaskSections()}</section>
      <section class="time-col"><div class="zone-label">时间</div>${empty?todayEmptyTime():todayTimeSections()}</section>
    </div>`}
    ${capturePanel(capture,{shift:!!drawer})}
    ${drawer?detailDrawer(drawer):''}
    ${opts.command?commandOverlay():''}
    ${opts.plan?planPicker():''}
    ${state.undoId||state.variant==='undo'?undoBar(state.variant==='undo'):''}
    ${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}
  </div>`;
}
function todayCounts(){
  const live=allTodos().filter(t=>!isDone(t));
  const overdue=live.filter(t=>isOverdue(t)||t.missed);
  const due=live.filter(t=>t.due===TODAY);
  return {
    overdue:overdue.length,
    due:due.length,
    unplanned:noDateTodos().length,
    done:allTodos().filter(t=>isDone(t)).length
  };
}
function todayHead(empty,status){
  const c=todayCounts();
  return pageHead({
    title:md(TODAY),
    sub:weekday(TODAY)+' · 第 47 周',
    right:'',
    mode:`<div class="ph-sum">${status==='loading'?'读取今天…':status==='error'?'读取失败':empty?'今天没有安排':`${c.overdue} 逾期 · ${c.due} 今天截止 · ${c.unplanned} 无日期 · ${c.done} 已完成`}</div>`
  });
}
function missedCard(t){
  return `<div class="missed-card"><div><b>${esc(t.title)}</b><small>${esc(t.repeat||'')} · 已遗漏 ${t.missed} 次 · 完成只影响这一次</small></div><div class="missed-card-actions"><button type="button" data-action="toggle-done" data-id="${t.id}">完成这一次</button></div></div>`;
}
function overdueToolbar(list){
  const oldest=list.slice().sort((a,b)=>(a.due||'').localeCompare(b.due||''))[0];
  return `<div class="overdue-toolbar"><span><b>${list.length} 项已逾期</b>${oldest&&oldest.due?' · 最早 '+mdShort(oldest.due):''}</span><span>按截止日排序</span></div>`;
}
function todayTaskSections(){
  const all=allTodos().filter(t=>!isDone(t));
  const missed=all.filter(t=>t.missed);
  const hideMissed=state.variant==='missed';
  let overdue=all.filter(t=>!hasPlanToday(t)&&(isOverdue(t)||t.missed)&&!(hideMissed&&t.missed));
  if(state.variant==='overdue')overdue=overdue.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
  const due=all.filter(t=>!hasPlanToday(t)&&t.due===TODAY);
  const plannedDue=all.filter(t=>hasPlanToday(t)&&t.due===TODAY);
  const plannedOverdue=all.filter(t=>hasPlanToday(t)&&(isOverdue(t)||t.missed));
  const unplanned=noDateTodos();
  const done=allTodos().filter(t=>isDone(t));
  let out='';
  if(hideMissed&&missed.length)out+=missed.map(missedCard).join('');
  if(state.variant==='overdue'&&overdue.length)out+=overdueToolbar(overdue);
  if(overdue.length)out+=groupHead('已逾期',overdue.length,{red:true})+overdue.map(t=>taskRow(t)).join('');
  if(due.length)out+=groupHead('今天截止',due.length)+due.map(t=>taskRow(t)).join('');
  const plannedBits=[];
  if(plannedOverdue.length)plannedBits.push(`${plannedOverdue.length} 项已逾期 / 已遗漏`);
  if(plannedDue.length)plannedBits.push(`${plannedDue.length} 项今天截止`);
  if(plannedBits.length)out+=`<div class="state-note" style="margin:2px 0 8px">另有 ${plannedBits.join('、')}，显示在右侧时间区。</div>`;
  if(unplanned.length){
    out+=groupHead('无日期',unplanned.length);
    out+=unplanned.slice(0,3).map(t=>taskRow(t)).join('');
    if(unplanned.length>3)out+=`<button type="button" class="more-row" data-action="inbox-nodate">${ico('arrowright',10)}查看无日期 ${unplanned.length} 项</button>`;
  }
  if(done.length){
    out+=`<button type="button" class="group-head" data-action="toggle-completed" aria-expanded="${state.completedOpen||state.variant==='completed'}"><span>今日已完成</span><span class="count">${done.length}</span><span class="chev">${ico('chevron-right',11)}</span></button>`;
    if(state.completedOpen||state.variant==='completed')out+=done.map(t=>taskRow(t)).join('');
  }
  return out||todayEmptyTasks();
}
function todayTimeSections(){
  const allDay=allDayOn(TODAY);
  const blocks=timeBlocks(TODAY);
  const past=blocks.filter(b=>b.end<=NOW);
  const running=blocks.filter(b=>b.start<=NOW&&b.end>NOW);
  const future=blocks.filter(b=>b.start>NOW);
  let out='';
  if(allDay.length){
    out+=`<div class="allday-strip"><span class="allday-label">全天</span>${allDay.map(e=>{const c=calOf(e.cal);return `<button type="button" class="allday-chip" data-action="open-event" data-id="${e.id}" style="--ev-bg:${c.bg};--ev-ink:${c.ink};--ev-bar:${c.color}"><span>${esc(e.title)}</span></button>`;}).join('')}</div>`;
  }
  if(past.length){
    out+=`<button type="button" class="time-head" data-action="toggle-early" aria-expanded="${state.earlyOpen}"><span>今日早前</span><span class="count">${past.length}</span><span class="chev" style="margin-left:auto">${ico('chevron-right',11)}</span></button>`;
    if(state.earlyOpen)out+=past.map(b=>timelineRow(b,true)).join('');
  }
  out+=`<div class="time-head is-now"><span>现在</span><span class="th-time">15:00</span></div>`;
  if(running.length)out+=running.map(b=>timelineRow(b)).join('');
  out+=`<div class="now-line"></div>`;
  if(future.length){
    out+=`<div class="time-head"><span>接下来</span><span class="count">${future.length}</span></div>`;
    out+=future.map(b=>timelineRow(b)).join('');
  }
  if(!allDay.length&&!blocks.length)out+=`<div class="time-empty">今天没有时间安排。</div>`;
  return out;
}
function todayEmptyTasks(){return `<div class="empty-state">${ico('check',27)}<div class="empty-title">今天清空了</div><div class="empty-sub">用下面的捕获条记下一件事，它会先进未安排。</div></div>`;}
function todayEmptyTime(){return `<div class="time-empty">今天没有时间安排。可以从日历把待办安排到时间上。</div>`;}
function groupHead(label,count,opts={}){
  return `<div class="group-head ${opts.red?'is-red':''}"><span>${label}</span><span class="count">${count}</span></div>`;
}
function taskRow(t,opts={}){
  const done=isDone(t);
  const c=calOf(t.cal);
  const plan=t.plan?planMeta(t,opts.planBase||TODAY):'';
  const due=t.due?dueText(t):'';
  const showDue=opts.showDue!==false;
  return `<div class="task-row ${done?'is-done':''}" role="button" tabindex="0" data-action="open-todo" data-id="${t.id}">
    <button type="button" class="check ${done?'is-on':''}" data-action="toggle-done" data-id="${t.id}" role="checkbox" aria-checked="${done}" aria-label="完成 ${esc(t.title)}">${done?ico('check',8):''}</button>
    <div class="task-main">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta">
        <span class="cal-dot" style="background:${c.color}"></span><span>${c.name}</span>
        ${t.repeat?`<span class="sep">·</span><span>${esc(t.repeat)}</span>`:''}
        ${t.missed?`<span class="missed">已遗漏 ${t.missed}</span>`:''}
        ${plan?`<span class="sep">·</span><span class="plan-meta">${ico('clock',9)} ${plan}</span>`:''}
      </div>
    </div>
    <div class="task-side">
      ${showDue&&due?`<span class="due-pill ${isOverdue(t)?'is-red':''}">${esc(due)}</span>`:''}
      <button type="button" class="row-act" data-action="plan-todo" data-id="${t.id}" aria-label="安排 ${esc(t.title)}">${ico('calendar',12)}</button>
    </div>
  </div>`;

function inboxList(){

function allList(){
  const rows=allTodos().filter(t=>!isDone(t));
  const dueToday=rows.filter(t=>t.due===TODAY);
  const past=rows.filter(t=>t.due&&t.due<TODAY);
  const missed=rows.filter(t=>!t.due&&t.missed);
  const later=rows.filter(t=>t.due&&t.due>TODAY);
  const noDue=rows.filter(t=>!t.due&&!t.missed);
  const done=allTodos().filter(t=>isDone(t));
  if(!rows.length&&!done.length)return emptyState('这里还没有待办','从捕获条记一件事，它会先进未安排。');
  let out='';
  if(dueToday.length)out+=groupHead('今天截止',dueToday.length)+dueToday.map(t=>todoRow(t,{planBase:TODAY})).join('');
  const overdue=[...past,...missed];
  if(overdue.length)out+=groupHead('已逾期 / 已遗漏',overdue.length,{red:true})+overdue.map(t=>todoRow(t)).join('');
  if(later.length)out+=groupHead('之后',later.length)+later.map(t=>todoRow(t)).join('');
  if(noDue.length)out+=groupHead('无截止',noDue.length)+noDue.map(t=>todoRow(t,{planBase:TODAY})).join('');

}

function weekHead(days){
  return `<div class="week-head"><div class="axis-spacer"></div>${days.map(d=>`<button type="button" class="day-head ${d===TODAY?'is-today':''}" data-action="cal-day" data-date="${d}"><span>${weekday(d)}</span><b>${dayNum(d)}</b></button>`).join('')}</div>`;
}
function weekAllDay(days){
  const chips=[];
  EVENTS.filter(e=>!state.deletedEvents.includes(e.id)&&!calHidden(e.cal)&&(e.allDay||isMultiDay(e))).forEach(e=>{
    const start=e.date||e.startDate;
    const end=e.date||e.endDate;
    const from=Math.max(0,days.indexOf(start));
    const to=Math.min(6,days.indexOf(end));
    if(days.indexOf(start)<0&&days.indexOf(end)<0)return;
    if(to<from)return;
    const c=calOf(e.cal);
    chips.push(`<button type="button" class="allday-chip" data-action="open-event" data-id="${e.id}" style="grid-column:${from+1} / span ${to-from+1};--ev-bg:${c.bg};--ev-ink:${c.ink};--ev-bar:${c.color}"><span>${esc(e.title)}${state.variant==='allday'&&isMultiDay(e)?' · '+mdShort(e.startDate)+'–'+mdShort(e.endDate):''}</span></button>`);
  });
  return `<div class="allday-row"><div class="axis-label">全天</div><div class="allday-grid">${chips.join('')}</div></div>${state.variant==='allday'?`<div class="allday-note">跨午夜的定时事件（22:00 → 次日 02:00）不进 08:00–20:00 时间轴，只作为跨天条目出现；时间网格不画它。</div>`:''}`;
}
function weekDeadline(days){

}
function hourLabels(){

function dayColumn(day){

function calBlock(b){

  return `<button type="button" class="cal-block ${isPlan?'is-plan':''} ${short?'is-short':''} ${isSeries?'is-series':''}" data-action="${isPlan?'open-todo':'open-event'}" data-id="${b.id}" style="top:${pct(b.start)}%;height:${Math.max(2.4,h)}%;left:${b.lane/b.lanes*100}%;width:${100/b.lanes}%;${isPlan?`--bar:${c.color}`:`--bar:${c.color};--bg:${c.bg}`}">

}

function monthItems(day){

function durationText(item){
  if(item.allDay)return '全天';
  if(item.startDate&&item.endDate){const days=Math.round((new Date(item.endDate+'T00:00:00')-new Date(item.startDate+'T00:00:00'))/86400000)+1;return days+' 天';}
  if(item.start&&item.end){const d=mins(item.end)-mins(item.start);if(d>=60)return Math.floor(d/60)+' 小时'+(d%60?' '+d%60+' 分钟':'');return d+' 分钟';}

}
function todoStatusLine(t){

  if(isOverdue(t))return '已逾期';

  const item=draftFor(ref);
  if(!item)return '';

  const v=state.variant;

  const fields=isEvent?`

      ${timeError?'<div class="form-error form-row full">结束时间必须晚于开始时间。</div>':''}

      <div class="form-row"><label class="form-label">地点</label><input class="form-input" data-mfield="loc" value="${esc(item.loc||'')}" placeholder="添加地点"></div>
      ${repeatDesktop(item)}
      <div class="form-row"><label class="form-label">提醒</label><select class="form-select" data-mfield="remind">${remindOptions(item.remind).map(r=>`<option value="${r}" ${(item.remind||'不提醒')===r?'selected':''}>${r}</option>`).join('')}</select></div>
    </div>`:`
    <div class="form-grid">
      <div class="form-row"><label class="form-label">截止日期</label><input type="date" class="form-input" data-mfield="due" value="${item.due||''}"></div>
      <div class="form-row"><label class="form-label">截止时间</label><input type="time" class="form-input" data-mfield="dueTime" value="${item.dueTime||''}"></div>
      <div class="form-row full"><label class="form-label">计划执行</label><button type="button" class="form-input" data-action="plan-todo" data-id="${item.id}" style="text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px">${item.plan?md(item.plan.date)+' '+fmt(mins(item.plan.start))+'–'+fmt(mins(item.plan.end)):'未安排'}${ico('chevron-right',11)}</button></div>
      ${repeatDesktop(item)}
      <div class="form-row"><label class="form-label">提醒</label><select class="form-select" data-mfield="remind">${remindOptions(item.remind).map(r=>`<option value="${r}" ${(item.remind||'不提醒')===r?'selected':''}>${r}</option>`).join('')}</select></div>

    </div>`;
  return `<aside class="drawer ${inline?'inline':'overlay'}" role="dialog" aria-label="${isEvent?'日程':'待办'}编辑">
    <header class="drawer-head"><span class="drawer-kind">${isEvent?'日程':'待办'} · 编辑</span><button type="button" class="drawer-close" data-action="close-drawer" aria-label="关闭">${ico('x',13)}</button></header>
    <div class="drawer-body">
      <div class="d-eyebrow"><span class="cal-dot" style="background:${c.color}"></span>${c.name}${done?' · 已完成':''}</div>
      ${v==='save-error'?`<div class="inline-alert is-red" style="margin:4px 0 10px"><b>保存失败 · 未写入。</b> 表单内容还在；检查网络后重试。<button type="button" class="mini" data-action="retry-save" style="margin-left:6px">重试保存</button></div>`:''}

      ${v==='crossday'?`<div class="inline-alert" style="margin:4px 0 10px"><b>结束在次日。</b><br>22:00 → 11/21 02:00；时间轴只把它当作跨天条目，不进当天网格。保存前请确认结束日期。</div>`:''}
      <label class="form-label" for="detail-title">标题</label>
      <input class="form-input" id="detail-title" data-mfield="title" value="${esc(title)}" style="font-size:17px;font-weight:600;margin-top:4px" aria-invalid="${titleError}">
      ${titleError?'<div class="form-error" style="margin-top:4px">标题不能为空。</div>':''}
      ${!isEvent?`<button type="button" class="d-complete" data-action="toggle-done" data-id="${item.id}"><span class="check ${done?'is-on':''}">${done?ico('check',9):''}</span>${done?'本次已完成':item.repeat?'完成这一次':'标记完成'}</button>`:''}
      ${!isEvent&&item.repeat&&item.missed&&!done?`<div class="state-note" style="margin:2px 0 8px">当前实例 ${md(TODAY)} · 已遗漏 ${item.missed} 次。</div>`:''}
      <div class="d-sec" style="margin-top:14px;padding-top:0;border-top:0">${fields}</div>
      ${!isEvent?`<div class="d-sec"><div class="d-sec-head"><span>优先级</span></div><div class="filter-chip-row" style="margin-top:6px">${priorityChips(item,true)}</div></div>`:''}
      <div class="d-sec"><div class="d-sec-head"><span>标签</span>${isEvent?'<span style="font-size:8.5px;color:var(--faint)">日程标签只读</span>':'<button type="button" data-action="noop">添加</button>'}</div><div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap">${(item.tags||[]).map(t=>`<span class="tag"><i></i>${esc(t)}</span>`).join('')||'<span class="tag">无标签</span>'}</div></div>
      <div class="d-sec"><div class="d-sec-head"><span>备注</span></div><textarea class="form-textarea" data-mfield="note" style="margin-top:7px">${esc(item.note||'')}</textarea></div>
      ${!isEvent?`<div class="d-sec"><div class="d-sec-head"><span>子任务 ${(item.subtasks||[]).filter(s=>s.done).length}/${(item.subtasks||[]).length}</span><button type="button" data-action="noop">添加</button></div>${(item.subtasks||[]).map(s=>`<div class="subtask ${s.done?'is-done':''}"><span class="check ${s.done?'is-on':''}">${s.done?ico('check',7):''}</span><span>${esc(s.title)}</span></div>`).join('')||'<div class="subtask">还没有子任务</div>'}</div>`:''}
      <div class="d-sec"><div class="d-sec-head"><span>附件</span><button type="button" data-action="noop">上传</button></div><div class="attach">${ico('folder',13)} ${item.attach?esc(item.attach):'没有附件'}</div></div>
    </div>
    <div class="d-foot"><button type="button" class="d-act primary" data-action="${v==='save-error'?'retry-save':'save-detail'}">${v==='save-error'?'重试保存':'保存'}</button><button type="button" class="d-act" data-action="close-drawer">取消</button><button type="button" class="d-act danger" data-action="delete">删除到回收站</button></div>
    ${state.confirmDelete||state.variant==='delete'?`<div class="confirm-scrim"><div class="confirm-modal" role="dialog" aria-modal="true" aria-label="确认删除"><h3>删除「${esc(title)}」？</h3><p>${deleteCopy(item,isEvent)}</p><div class="cf-actions"><button type="button" data-action="cancel-delete">取消</button><button type="button" class="cf-danger" data-action="confirm-delete">删除到回收站</button></div></div></div>`:''}
  </aside>`;
}

function trashPageBody(v){
  if(v==='loading')return listSkeleton(5);
  if(v==='error')return pageState('操作没有完成，请重试。','回收站没有读到；本地数据仍在。');
  const empty=`<div class="empty-state">${ico('trash',27)}<div class="empty-title">回收站是空的</div><div class="empty-sub">删除的待办和日程会先来到这里。</div></div>`;
  if(v==='empty')return empty;
  const row=(t,s)=>`<div class="trash-row"><div class="trash-main"><div>${t}</div><div class="trash-sub">${s}</div></div><div class="trash-actions"><button type="button">恢复</button><button type="button" class="danger">永久删除</button></div></div>`;
  const todos=row('整理旧照片','2026-11-18 · 生活')+row('买猫粮','2026-11-15 · 家事');
  const events=row('季度复盘草稿','2026-11-16 · 工作');
  return `<div class="simple-sec"><span>待办</span><span>2 项</span></div><div class="simple-group">${todos}</div><div class="simple-sec"><span>日程</span><span>1 项</span></div><div class="simple-group">${events}</div>`;
}
function trashPage(v){
  return `<div class="edit-page"><div class="edit-bar"><b>回收站</b><span class="edit-spacer"></span>${v==='normal'?`<button type="button" class="edit-save" style="background:var(--red)">清空回收站</button>`:''}</div><div class="edit-body"><div class="simple-wrap">${trashPageBody(v)}</div></div></div>`;
}
function trashMobile(v){
  return mobileShell('回收站',trashPageBody(v),{back:true,actions:v==='normal'?`<button type="button" class="tool" style="color:var(--red)">清空</button>`:''});
}
function newItemPage(isEvent){
  // 这是 Capture 的「整页宿主」：字段、类型、默认值与浮动捕获完全同一套，
  // 只是当它由深链（小组件、Cmd+K 动作）打开时占满一页，而不是浮在页面上。
  // 它不引入第二套创建模型，也不带详情编辑器才有的标签/子任务/附件。
  const v=state.variant;
  const expanded=v==='template';
  const titleError=v==='validation';
  const saving=v==='save-error';
  const title=expanded?(isEvent?'和设计团队评审方案':'交季度总结'):'';
  const cal=isEvent?'work':(state.defaultCal||'personal');
  const multi=isEvent&&v==='multiday';
  const allDay=isEvent&&(v==='allday'||multi);
  const facts=isEvent
    ? `<span class="new-fact"><i class="cal-dot" style="background:${calOf(cal).color}"></i>${calOf(cal).name}</span><span class="new-fact">${ico('clock',10)} ${multi?'全天 · 11/20–11/22':allDay?'全天 · 11/20':'11/20 11:00–12:00'}</span><span class="new-fact">${ico('bell',10)} 15 分钟前</span>`
    : `<span class="new-fact is-empty">无日期</span><span class="new-fact"><i class="cal-dot" style="background:${calOf(cal).color}"></i>${calOf(cal).name}</span><span class="new-fact is-empty">无截止</span>`;
  const fields=isEvent?`
      <div class="cp-field"><span class="k">时间</span><span class="v">${multi?'全天 · 11/20–11/22':allDay?'全天 · 11/20':(expanded?'11/21 10:00–11:00':'11/20 11:00–12:00')}</span></div>
      <div class="cp-field"><span class="k">全天</span><span class="v">${allDay?'是':'否'}</span></div>
      ${multi?'<div class="cp-field"><span class="k">结束日期</span><span class="v">11/22 · 周日</span></div><div class="cp-field"><span class="k">天数</span><span class="v">3 天</span></div>':''}
      <div class="cp-field"><span class="k">日历</span><span class="v">${calOf(cal).name}</span></div>
      <div class="cp-field"><span class="k">地点</span><span class="v">${expanded?'会议室 B':'未填写'}</span></div>
      <div class="cp-field"><span class="k">重复</span><span class="v">不重复</span></div>
      <div class="cp-field"><span class="k">提醒</span><span class="v">15 分钟前</span></div>`:`
      <div class="cp-field"><span class="k">截止</span><span class="v ${expanded?'is-due':''}">${expanded?ico('flag',11)+' 11/21 18:00':'无截止'}</span></div>
      <div class="cp-field"><span class="k">计划执行</span><span class="v ${expanded?'is-plan':''}">${expanded?ico('clock',11)+' 11/21 15:00–16:00':'未安排'}</span></div>
      <div class="cp-field"><span class="k">重复</span><span class="v">不重复</span></div>
      <div class="cp-field"><span class="k">提醒</span><span class="v">不提醒</span></div>
      <div class="cp-field"><span class="k">日历</span><span class="v">${calOf(cal).name}${cal===(state.defaultCal||'personal')?' · 默认':''}</span></div>
      <div class="cp-field"><span class="k">优先级</span><span class="v">中</span></div>
      <div class="cp-field"><span class="k">标签</span><span class="v">无标签</span></div>`;
  return `<div class="page new-page">
    ${pageHead({title:isEvent?'新建日程':'记一件事',sub:'Capture 的整页形态：字段和浮动捕获完全一致；不点开的字段不写入。',right:`<button type="button" class="tool" data-action="noop">取消</button><button type="button" class="tool primary" data-action="noop">${saving?'重试保存':(isEvent?'创建日程':'记下待办')}</button>`})}
    <div class="new-body"><div class="new-wrap">
      ${saving?`<div class="inline-alert is-red"><b>保存失败 · 未写入。</b> 这一页的内容还在；检查网络后重试。</div>`:''}
      ${v==='dirty'?`<div class="inline-alert"><b>还没有保存。</b><br>离开会丢弃这次输入；也可以留下继续编辑。</div>`:''}
      <div class="new-type">
        <button type="button" class="new-type-btn ${isEvent?'':'is-on'}" data-action="noop">${ico('check',10)} 待办</button>
        <button type="button" class="new-type-btn ${isEvent?'is-on':''}" data-action="noop">${ico('calendar',10)} 日程</button>
        <span class="new-type-note">${isEvent?'从时间槽进入，所以是日程。':'默认是待办；只有主动切到日程才会变。'}</span>
      </div>
      <label class="form-label" for="new-title" style="margin:12px 0 4px;display:block">标题</label>
      <input class="form-input" id="new-title" value="${esc(title)}" placeholder="${isEvent?'给这段日程起个名字':'写一个明天能看懂的动作'}" style="font-size:17px;font-weight:600;width:100%" aria-invalid="${titleError}">
      ${titleError?'<div class="form-error">标题不能为空。</div>':''}
      <div class="new-facts">${facts}</div>
      <div class="cp-fields new-fields">${fields}</div>
      <div class="new-from">${isEvent?'地点和备注可以创建后再加。':'子任务和附件可以创建后再加；标签也可以在这里先选，不属于捕获必填项。'}</div>
    </div></div>
    ${v==='dirty'?`<div class="confirm-scrim"><div class="confirm-modal" role="dialog" aria-modal="true" aria-label="未保存离开"><h3>离开这张表单？</h3><p>还没有创建；标题和已填内容会丢失。</p><div class="cf-actions"><button type="button" data-action="noop">留下</button><button type="button" class="cf-danger" data-action="noop">丢弃</button></div></div></div>`:''}
  </div>`;
}

function captureChoicePanel(title,sub,body,footer){
  return `<div class="capture-panel" style="width:430px;bottom:82px">
    <div class="cp-head"><div><div class="cp-title">${title}</div><div class="cp-sub">${sub}</div></div><button type="button" class="drawer-close" data-action="capture-compact" aria-label="收起">${ico('x',12)}</button></div>
    <div class="cp-fields">${body}</div>
    <div class="cp-foot"><div class="cp-hint">${footer||'只改这一项；其他事实保持不变。'}</div><div class="cp-actions"><button type="button" class="btn" data-action="capture-compact">取消</button><button type="button" class="btn primary" data-action="capture-expanded">应用</button></div></div>
  </div>`;
}

function captureBar(type,opts={}){
  const shift=opts.shift?' is-shifted':'';
  const isEvent=type==='event';
  const plan=opts.plan;
  return `<div class="capture${shift}">
    <span class="cap-type">${isEvent?ico('calendar',10)+' 日程':ico('check',10)+' 待办'}</span>
    <span class="cap-date ${isEvent?'':'is-empty'}">${isEvent?'11/21 10:00–11:00 · 工作':plan?'计划到 11/20 · 个人':'无日期 · 个人'}</span>
    <input class="cap-input" id="cap-input" value="${isEvent?'和设计团队评审方案':''}" placeholder="记一件事，回车记下" aria-label="快速捕获">
    <span class="cap-kbd">↵</span>
    <button type="button" class="cap-send" data-action="capture-expand" aria-label="展开捕获">${ico('plus',15)}</button>
  </div>`;
}
function captureExpand(){
  if(state.capture==='compact'){state.capture='expanded';render();}
}

  const editing=state.variant==='edit';
  const overlap=state.variant==='overlap';
  const focus=editing?'box-shadow:0 0 0 3px rgba(25,25,24,.10);border-color:var(--ink);':'';
  const d=state.planDate||TODAY,start=state.planStart||'15:15',end=state.planEnd||'16:00';
  return `<div class="scrim" data-action="close-plan"><div class="plan-card" role="dialog" aria-label="安排待办">

      ${target.repeat&&state.planOccurrence?`<div class="state-note" style="margin:0 0 8px">这一次实例 · ${md(state.planOccurrence)} · 只影响这一次</div>`:''}
      <div class="plan-time"><label class="box" style="${focus}"><small>${editing?'开始 · 编辑':'开始'}</small><input type="time" id="plan-start" value="${start}" aria-label="开始时间"></label><label class="box" style="${focus}"><small>${editing?'结束 · 编辑':'结束'}</small><input type="time" id="plan-end" value="${end}" aria-label="结束时间"></label><div class="box"><small>时长</small><span id="plan-duration">${planDuration(start,end)}</span></div></div>

  </div></div>`;

    body=`<div class="cmd-group">动作</div>

    if(state.variant==='importing')return `<h2 class="set-h">正在导入</h2><p class="set-desc">dayplan.ics → 工作；写入期间没有进度条，也不能取消。</p><div class="inline-alert"><div style="display:flex;align-items:center;gap:8px"><span class="ai-spin"></span>正在读取并导入…</div></div><div class="io-card"><h3>将写入</h3><p>18 个事件 · 4 个待办；1 行会被跳过。</p><div class="form-help">写入在一个事务里完成；结束后才显示结果。</div></div><div class="filter-actions"><button type="button" class="primary" disabled style="opacity:.45"><span class="ai-spin"></span> 导入中…</button></div>`;
    if(state.variant==='success')return `<h2 class="set-h">导入完成</h2><p class="set-desc">18 个事件、4 个待办已经进入「工作」。</p><div class="io-card"><h3>结果</h3><p>成功 21 项 · 跳过 1 项 · 重复 0 项</p><div class="mini-banner is-ink">跳过的 1 项可以在导入报告中查看。</div></div><div class="filter-actions"><button type="button" class="primary" data-action="settings" data-section="calendars">回到日历</button></div>`;
    if(state.variant==='error')return `<h2 class="set-h">导入失败</h2><p class="set-desc">没有写入任何内容；原文件仍在。</p><div class="inline-alert is-red"><b>第 14 行日期格式无法识别。</b><br>修正文件后重试，或跳过错误行继续。</div><div class="filter-actions"><button type="button" data-action="noop">查看报告</button><button type="button" class="primary" data-action="noop">跳过错误行并继续</button></div>`;
    return `<h2 class="set-h">导入 ICS</h2><p class="set-desc">选择文件、目标日历，预览后再写入。</p><div class="io-card"><h3>1 · 选择文件</h3><p>支持 .ics；不会覆盖同 UID 的事件。</p><button type="button" class="mini-btn primary" data-action="noop">选择文件</button></div><div class="io-card"><h3>2 · 目标日历</h3><p>工作 · 当前 28 项</p><button type="button" class="mini-btn" data-action="noop">选择日历</button></div><div class="io-card"><h3>3 · 预览与写入</h3><p>先看将新增 / 跳过 / 重复的条目。</p><button type="button" class="mini-btn" data-action="noop">下一步</button></div>`;
  }
  if(section==='backup'){
    if(state.variant==='progress')return `<h2 class="set-h">正在备份</h2><p class="set-desc">打包日历、待办、日程、标签与附件索引。</p><div class="io-card"><h3>62%</h3><p>正在写入 2026-11-20.dayspark.zip</p><div style="height:4px;background:#ecece6;border-radius:2px;overflow:hidden"><div style="width:62%;height:4px;background:var(--ink)"></div></div></div>`;
    if(state.variant==='success')return `<h2 class="set-h">备份完成</h2><p class="set-desc">2026-11-20.dayspark.zip · 4.8 MB</p><div class="io-card"><h3>包含</h3><p>${calIds().length} 个日历 · ${allTodos().length} 个待办 · ${EVENTS.filter(e=>!state.deletedEvents.includes(e.id)).length} 个日程 · 附件索引 3 个</p><div class="mini-banner is-ink">文件已保存到你选择的位置。</div></div>`;
    if(state.variant==='error')return `<h2 class="set-h">备份失败</h2><p class="set-desc">没有生成半成品文件。</p><div class="inline-alert is-red"><b>目标位置不可写。</b><br>换一个文件夹，或检查磁盘空间。</div><div class="filter-actions"><button type="button" class="primary" data-action="noop">重试</button></div>`;
    if(state.variant==='merging')return `<h2 class="set-h">正在恢复</h2><p class="set-desc">读取备份、扫描冲突；这一步没有进度条，也不能取消。</p><div class="inline-alert"><div style="display:flex;align-items:center;gap:8px"><span class="ai-spin"></span>正在读取备份…</div></div><div class="io-card"><h3>2026-11-20.dayspark.zip</h3><p>读完会先列出冲突项，再写入本机。</p><div class="form-help">没有冲突时不会出现额外确认，直接开始恢复。</div></div>`;
    if(state.variant==='merge-success')return `<h2 class="set-h">备份已合并</h2><p class="set-desc">恢复完成；页面只给一句结果，不提供新增/更新/跳过计数。</p><div class="inline-alert"><b>已合并备份。</b><br>本机数据已经按备份补齐；被跳过的条目不会列出来。</div><div class="filter-actions"><button type="button" class="primary" data-action="settings" data-section="calendars">回到日历</button></div>`;
    if(state.variant==='merge-error')return `<h2 class="set-h">合并失败</h2><p class="set-desc">没有写入任何内容；但界面不说明是文件损坏、版本不符还是空间不足。</p><div class="inline-alert is-red"><b>合并失败。</b><br>可以重新选择备份文件再试；没有单独的重试按钮。</div><div class="filter-actions"><button type="button" class="primary" data-action="noop">重新选择备份</button></div>`;
    return `<h2 class="set-h">备份</h2><p class="set-desc">完整备份用于搬回 DaySpark；合并备份用于合并两份数据。</p><div class="io-card"><h3>完整备份</h3><p>包含所有内容；恢复时替换当前数据。</p><button type="button" class="mini-btn primary" data-action="noop">导出完整备份</button></div><div class="io-card"><h3>合并备份</h3><p>按 UID 去重；冲突项逐项选择。</p><button type="button" class="mini-btn" data-action="noop">选择备份文件</button></div>`;
  }
  if(section==='notify-denied')return `<h2 class="set-h">通知被拒绝</h2><p class="set-desc">DaySpark 不能在系统层面弹出提醒。</p><div class="inline-alert is-red"><b>系统通知权限已关闭。</b><br>条目里的提醒仍然保存；打开系统设置后才能到点提醒。</div>${setRow('系统通知','去系统设置重新允许。','打开设置','noop')}${setRow('精确提醒','允许精确到分钟。','未生效','noop')}${setRow('应用内提醒','前台仍可显示。','可用','noop')}`;
  if(section==='sync-logged-out')return `<h2 class="set-h">同步未登录</h2><p class="set-desc">本地仍可用；登录后才会多设备同步。</p><div class="inline-alert"><b>还没有登录。</b><br>本地修改不会上传；不影响今天、待办和日历。</div>${setRow('服务器','自托管地址。','sync.dayspark.local','noop')}${setRow('账号','登录后启用同步。','登录','noop')}`;
  if(section==='sync-failed')return `<h2 class="set-h">同步失败</h2><p class="set-desc">本地修改没有丢；服务器当前不可达。</p><div class="inline-alert is-red"><b>今天 14:58 同步失败。</b><br>服务器超时；3 条本地修改等待重试。</div>${setRow('服务器','sync.dayspark.local','不可达','noop')}${setRow('本地状态','3 条待上传 · 0 条待下载','本地优先','noop')}${setRow('重试','立即重试同步。','重试','noop')}`;
  if(section==='sync-conflict')return `<h2 class="set-h">同步冲突</h2><p class="set-desc">同一个条目在本地和服务器都改过；逐项选择。</p><div class="io-card"><h3>提交周报给林总</h3><p>本地：截止 18:00 · 计划 15:15<br>服务器：截止 17:00 · 计划 16:00</p><div class="filter-chip-row"><span class="f-chip">保留本地</span><span class="f-chip is-on">保留服务器</span><span class="f-chip">合并</span></div></div><div class="io-card"><h3>牙医复诊</h3><p>本地：14:30 · 服务器：已删除</p><div class="filter-chip-row"><span class="f-chip is-on">保留本地</span><span class="f-chip">接受删除</span></div></div><div class="filter-actions"><button type="button" class="primary" data-action="noop">应用选择</button></div>`;
  return '';
}

        <li>重复只有一个入口：详情里的「重复」字段；结束条件（永不 / 日期 / 次数）也在同一处。</li>
        <li>详情是草稿：保存提交，取消丢弃；从详情打开计划选择器，取消或提交都回到原编辑状态，草稿不丢。</li>
        <li>有今天计划的逾期 / 已遗漏项在时间区保留红色截止文字或圆点，头部计数包含它。</li>
        <li>解析可以聪明，类型不能替用户决定；默认待办。</li>
        <li>创建入口可以多，Capture 表面只有一个。</li>
      </ul></section>
      <section class="spec-card"><h2>布局</h2><ul class="rule-list">
        <li>今天：左任务 380，右时间自适应。</li>
        <li>待办：列表 + 宽屏常驻 380 详情。</li>
        <li>日历：时间轴 56，周 7 列，日单列。</li>
        <li>详情抽屉 380；桌面覆盖或挤压，手机整页。</li>
      </ul></section>
      <section class="spec-card"><h2>状态</h2><ul class="rule-list">
        <li>默认 / hover / focus / selected / disabled。</li>
        <li>空：说明为什么空，下一步是什么。</li>
        <li>错误：贴字段，说明原因和补救。</li>
        <li>删除：先确认，再进回收站。</li>
        <li>拖动：只展示 ghost 与落点，不实现数据写入。</li>
      </ul></section>
      <section class="spec-card"><h2>实现边界</h2><ul class="rule-list">
        <li>本规格只定义视觉与交互结果；Flutter 负责真实状态与持久化。</li>
        <li>保存、同步、导入、拖拽和重复规则由实现阶段接后端。</li>
        <li>画板中的选择、勾选和编辑用于演示交互结果，不写入后端或持久化。</li>
      </ul></section>
    </div>
  </div>`;
}

function monthCells(month){
  const first=month+'-01';
  const [y,m]=month.split('-').map(Number);
  const startDow=new Date(Date.UTC(y,m-1,1)).getUTCDay();
  const back=(startDow+6)%7;
  const start=addDays(first,-back);
  return Array.from({length:42},(_,i)=>addDays(start,i));
}
function monthLabel(month){const [y,m]=month.split('-').map(Number);return `${y} 年 ${m} 月`;}
function datePickerCard(){

function wdRow(o){
  return `<div class="wd-row">${o.check?`<span class="ck ${o.done?'is-on':''}"></span>`:`<span class="bar" style="--bar:${o.color||CAL.work.color}"></span>`}<b>${esc(o.title)}</b>${o.time?`<span class="t" style="margin-left:auto">${o.time}</span>`:''}</div>`;
}
function wdActionWidget(size,empty){
  const sm=size==='sm';
  const lg=size==='lg';
  return `<div class="wd-ios ${size}">
    <div class="wd-top"><div><div class="wd-date">11/20</div><div class="wd-dow">周五 · 第 47 周</div></div>${sm?'':`<div class="wd-add">+ 待办</div>${lg?'<div class="wd-add">+ 日程</div>':''}`}</div>
    ${empty?`<div class="wd-empty">今天没有安排<br>打开 DaySpark 以更新</div>`:sm?wdRow({color:CAL.health.color,title:'牙医复诊',time:'14:30'}):`
      <div class="wd-sec">现在</div>${wdRow({color:CAL.health.color,title:'牙医复诊',time:'14:30'})}
      <div class="wd-sec">之后</div>${wdRow({color:CAL.work.color,title:'计划 · 提交周报',time:'15:15'})}${lg?wdRow({color:CAL.work.color,title:'整理周会纪要',time:'16:00'})+'<div class="wd-sec">截止</div>'+wdRow({check:true,title:'提交周报给林总',time:'18:00'}):''}
      <div class="wd-foot"><span>今日已完成 2</span><span style="color:var(--red)">逾期 1</span></div>`}
  </div>`;
}
function wdTodoWidget(size,empty){
  return `<div class="wd-ios ${size}">
    <div class="wd-top"><div><div class="wd-date">待办</div><div class="wd-dow">${empty?'今天没有待办':'4 项未完成 · 1 项今天截止'}</div></div><div class="wd-add">+ 待办</div></div>
    ${empty?`<div class="wd-empty">没有待办<br>打开 DaySpark 以更新</div>`:`
      ${wdRow({check:true,title:'提交周报给林总',time:'18:00'})}
      ${wdRow({check:true,title:'预约 11 月体检',time:'明天'})}
      ${size!=='sm'?wdRow({check:true,title:'给妈妈回电话'}):''}
      ${size==='lg'?wdRow({check:true,title:'买猫粮和清洁用品'})+wdRow({check:true,title:'整理书架，把读完的收起来'}):''}
      <div class="wd-foot"><span>全部</span><span>收件箱 · 6</span></div>`}
  </div>`;
}
function wdCalendarWidget(size,empty){
  const cells=monthCells('2026-11');
  return `<div class="wd-ios ${size}">
    <div class="wd-top"><div><div class="wd-date" style="font-size:${size==='md'?'13px':'17px'}">2026 年 11 月</div><div class="wd-dow">${empty?'这一天没有安排':'11/20 · 周五 · 3 项'}</div></div><div class="wd-add">+ 日程</div></div>
    ${size==='md'?`<div class="wd-month">${cells.map(d=>`<span class="${d.slice(0,7)!=='2026-11'?'out':''} ${d===TODAY?'on':''} ${['2026-11-20','2026-11-22','2026-11-25'].includes(d)?'dot':''}">${dayNum(d)}</span>`).join('')}</div>`:`
      <div class="wd-month">${cells.map(d=>`<span class="${d.slice(0,7)!=='2026-11'?'out':''} ${d===TODAY?'on':''} ${['2026-11-20','2026-11-22','2026-11-25'].includes(d)?'dot':''}">${dayNum(d)}</span>`).join('')}</div>
      ${empty?'':`<div class="wd-sec">11/20 · 周五</div>${wdRow({color:CAL.health.color,title:'牙医复诊',time:'14:30'})}${wdRow({color:CAL.work.color,title:'计划 · 提交周报',time:'15:15'})}`}`}
  </div>`;
}
function wdAndroid(kind,empty){
  const size=kind==='calendar'?'h4':kind==='todo'?'h2':'h2';
  return `<div class="wd-and ${size}">
    <div class="wd-top"><div><div class="wd-date">${kind==='calendar'?'11 月':kind==='todo'?'待办':'11/20'}</div><div class="wd-dow">${empty?'没有安排':'周五 · 3 项'}</div></div><div class="wd-add">+</div></div>
    ${empty?`<div class="wd-empty">打开 DaySpark 以更新</div>`:kind==='calendar'?`<div class="wd-month">${monthCells('2026-11').slice(0,35).map(d=>`<span class="${d.slice(0,7)!=='2026-11'?'out':''} ${d===TODAY?'on':''}">${dayNum(d)}</span>`).join('')}</div>`:kind==='todo'?`${wdRow({check:true,title:'提交周报给林总'})}${wdRow({check:true,title:'预约 11 月体检'})}`:`${wdRow({color:CAL.health.color,title:'牙医复诊',time:'14:30'})}${wdRow({color:CAL.work.color,title:'计划 · 提交周报',time:'15:15'})}`}
  </div>`;
}
function wdAndroidState(kind){
  const stale=kind==='stale', fallback=kind==='fallback';
  return `<div class="wd-and ${kind==='calendar'?'h4':'h2'}">
    <div class="wd-top"><div><div class="wd-date">${stale?'11/19':fallback?'DaySpark':'11/20'}</div><div class="wd-dow">${stale?'快照 · 昨天':fallback?'无法读取':'周五 · 3 项'}</div></div><div class="wd-add">+</div></div>
    ${fallback?`<div class="wd-empty">打开 DaySpark<br><span style="font-size:7.5px">小组件需要先打开一次应用</span></div>`:stale?`<div class="wd-empty">打开 DaySpark 以更新<br><span style="font-size:7.5px">不显示昨天的安排</span></div>`:`<div class="wd-empty">今天的安排都完成了<br><span style="font-size:7.5px">下一项 · 明天 09:00 晨会</span></div>`}
  </div>`;
}
function wdOverflowCard(){

function wdAndroidOverflow(){
  return `<div class="wd-and h4">
    <div class="wd-top"><div><div class="wd-date">11 月</div><div class="wd-dow">周五 · 3 项</div></div><div class="wd-add">+</div></div>

    ${wdRow({color:CAL.health.color,title:'牙医复诊',time:'14:30'})}

}
function widgetsSheet(){
  const v=state.variant;
  const empty=v==='empty';
  const stateV=v==='stale'||v==='done'?v:null;
  const androidStates=v==='android-states';
  const overflow=v==='overflow';
  const only=stateV||androidStates||overflow?null:v==='today'||v==='todo'||v==='calendar'||v==='android'?v:null;
  const show=k=>stateV||androidStates||overflow?false:(!only||only===k);
  const sec={
    today:`<section class="wd-card"><div class="wd-label">iOS / macOS · 今日行动<span>158 / 338 / 338</span></div><div class="wd-stack">
        <div style="width:158px">${wdActionWidget('sm',empty)}</div>
        <div style="width:338px">${wdActionWidget('md',empty)}</div>
        <div style="width:338px">${wdActionWidget('lg',empty)}</div>
      </div><div class="wd-note">小尺寸只放「现在」与下一条；中尺寸加「之后」；大尺寸再带今天已完成与逾期计数。</div></section>`,
    todo:`<section class="wd-card"><div class="wd-label">iOS / macOS · 待办<span>158 / 338 / 338</span></div><div class="wd-stack">
        <div style="width:158px">${wdTodoWidget('sm',empty)}</div>
        <div style="width:338px">${wdTodoWidget('md',empty)}</div>
        <div style="width:338px">${wdTodoWidget('lg',empty)}</div>
      </div><div class="wd-note">行语义与待办页一致：空心圆、标题、右侧截止；完成不在小组件里发生。</div></section>`,
    calendar:`<section class="wd-card"><div class="wd-label">iOS / macOS · 月历<span>338 · 无小尺寸</span></div><div class="wd-stack">
        <div style="width:338px">${wdCalendarWidget('md',empty)}</div>
        <div style="width:338px">${wdCalendarWidget('lg',empty)}</div>
      </div><div class="wd-note">今天用墨色实心格；有内容的日期下方是点，不是彩色块。</div></section>`,
    android:`<section class="wd-card"><div class="wd-label">Android · 三种小组件<span>2×2 / 4×2 / 4×4</span></div><div class="wd-stack">
        <div style="width:110px">${wdAndroid('today',empty)}</div>
        <div style="width:250px">${wdAndroid('todo',empty)}</div>
        <div style="width:250px">${wdAndroid('calendar',empty)}</div>
      </div><div class="wd-note">Android 选择器预览图与描述沿用同一份文案：今日行动 / 待办 / 月历。点击行打开对应条目；空白区域打开应用。</div></section>`
  };
  const note=only?`<div class="wd-focus-note">正在单独查看「${only==='android'?'Android':only==='today'?'今日行动':only==='todo'?'待办':'月历'}」；其余小组件在对应的状态里。</div>`:'';
  return `<div class="wd-sheet">
    <div class="wd-head"><div><h1>原生小组件</h1><p>内容模型跟随今天 / 待办 / 日历的行语义；颜色只取 SpecTokens，不再有第二套旧调色板。浅色锁定，不跟随系统变暗。</p></div><span class="badge-default">P12 · iOS / macOS / Android</span></div>
    ${stateV?`<section class="wd-card"><div class="wd-label">iOS / macOS · ${stateV==='stale'?'快照过期':'今天已完成'}<span>158 / 338</span></div><div class="wd-stack">
        <div style="width:158px">${stateV==='stale'?wdStaleCard('sm'):wdDoneCard('sm')}</div>
        <div style="width:338px">${stateV==='stale'?wdStaleCard('md'):wdDoneCard('md')}</div>
      </div><div class="wd-note">${stateV==='stale'?'过期时不展示旧数据，只说明上次同步时间与“打开 DaySpark 以更新”。':'完成后的收尾态：不显示空列表，而是“今天都完成了”和下一项的时间。'}</div></section>`:''}
    ${androidStates?`<section class="wd-card"><div class="wd-label">Android · 快照过期 / 无快照 / 今天完成<span>2×2 · 4×2</span></div><div class="wd-stack" style="flex-direction:row;flex-wrap:wrap;align-items:flex-start">
        <div style="width:250px">${wdAndroidState('stale')}</div>
        <div style="width:250px">${wdAndroidState('fallback')}</div>
        <div style="width:250px">${wdAndroidState('done')}</div>
      </div><div class="wd-note">Android 与 iOS 同一份快照语义：过期时保留旧日期但只写“打开以更新”；无快照落到“打开 DaySpark”；全完成时给收尾文案，不画空列表。</div></section>`:''}
    ${overflow?`<section class="wd-card"><div class="wd-label">条目溢出<span>Apple 大件 / Android 4×4</span></div><div class="wd-stack" style="flex-direction:row;flex-wrap:wrap;align-items:flex-start">
        <div style="width:338px">${wdOverflowCard()}</div>
        <div style="width:250px">${wdAndroidOverflow()}</div>
      </div><div class="wd-note">行预算放不下时折叠成“还有 N 项”，点击进入 app 的对应列表；不裁剪半行、不在组件里滚动。</div></section>`:''}
    ${note}
    <div class="wd-cols">
      ${show('today')?sec.today:''}
      ${show('todo')?sec.todo:''}
      ${show('calendar')?sec.calendar:''}
      ${show('android')?sec.android:''}
    </div>
    <div class="wd-note" style="margin-top:16px;max-width:900px">三种小组件共用的规则：只读快照，不在小组件里编辑；过期快照显示「打开 DaySpark 以更新」而不是旧数据；空态说明下一步；暗色系统下仍按浅色纸面绘制，与 App 一致。</div>
  </div>`;
}

/* ---------------- 服务端授权页 ---------------- */
function serverOAuthPage(){
  const v=state.variant;
  const denied=v==='denied';
  const badLogin=v==='error';
  const invalid=v==='invalid';
  const head=`<div class="oauth-head"><span class="p-mark" style="width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px">D</span>DaySpark</div>`;
  if(invalid)return `<div class="oauth-host"><div class="oauth-card">
    ${head}
    <div class="oauth-body">
      <h2>授权错误</h2>
      <p>这个授权链接已失效，或参数不完整。请回到 MCP 客户端重新发起连接。</p>
      <div class="oauth-error">invalid_request · 授权请求缺少必要参数</div>
      <div class="oauth-note">这个页面没有返回按钮；关闭标签页后从客户端重试。</div>
    </div>
  </div></div>`;
  const login=denied?'':`<div class="oauth-login">
      <label for="oa-email">邮箱</label><input id="oa-email" type="email" value="${badLogin?'chang@local':''}" placeholder="you@example.com" autocomplete="username" ${badLogin?'aria-invalid="true"':''}>
      <label for="oa-pass">密码</label><input id="oa-pass" type="password" value="${badLogin?'':''}" placeholder="输入密码" autocomplete="current-password" ${badLogin?'aria-invalid="true"':''}>
      <div class="oauth-login-note">${badLogin?'密码已清空；邮箱保留。':'登录以继续；这一步不会创建新账号。'}</div>
    </div>`;
  return `<div class="oauth-host"><div class="oauth-card">
    ${head}
    <div class="oauth-body">
      ${badLogin?`<div class="oauth-error">邮箱或密码错误。服务器可达；没有创建会话。</div>`:''}
      ${denied?`<h2>已拒绝授权</h2><p>MCP 客户端「Claude Desktop」没有获得访问权限。你可以关闭这个页面，或在客户端里重新发起连接。</p><div class="oauth-scope">${ico('alert',12)}<span>没有共享任何日历、待办或账号信息。</span></div>`:`
      <h2>允许「Claude Desktop」访问你的 DaySpark？</h2><p>这是一个 MCP 客户端，正在请求以你的账号读取和写入数据。授权后可以随时在设置里撤销。</p>
      <div class="oauth-scope">${ico('calendar',12)}<span>读取日历、待办和日程</span></div>
      <div class="oauth-scope">${ico('plus',12)}<span>创建和修改待办、日程</span></div>
      <div class="oauth-scope">${ico('user',12)}<span>读取账号邮箱（chang@local）</span></div>
      <div class="oauth-scope">${ico('shield',12)}<span>不会读取其他设备上的本地数据；不会访问附件内容</span></div>
      ${login}`}
    </div>
    <div class="oauth-foot">${denied?`<button type="button" class="primary" data-action="noop">返回客户端</button>`:`<button type="button" data-action="oauth-deny">拒绝</button><button type="button" class="primary" data-action="oauth-allow">允许访问</button>`}</div>
  </div></div>`;
}

/* ---------------- mobile ---------------- */
function mobileShell(title,body,opts={}){

    <div class="m-status"><span>15:00</span><span class="m-status-icons"><i></i><i></i><i></i></span></div>

function mobileAi(){
  const v=state.variant;
  const loading=v==='loading';
  const enabled=state.aiEnabled&&v!=='disabled';
  const configured=state.aiConfigured&&v!=='empty';
  const ready=enabled&&configured&&!loading;
  const busy=v==='sending';
  const thread=AI_THREAD.concat(v==='error'?[{role:'error',text:'没有连上模型服务：401 Unauthorized。回复没有保存。'}]:[]);
  const lastIdx=thread.length-1;
  let body='';
  if(loading)body=`<div class="ai-empty" style="padding:60px 24px"><span class="ai-spin"></span><b>正在读取 AI 设置…</b><p>读完之前不把未知状态画成“已关闭”或“未配置”。</p></div>`;
  else if(!enabled)body=`<div class="ai-empty" style="padding:60px 24px">${ico('chat',26)}<b>AI 助手已关闭</b><p>这是一个可选功能；打开开关并配置模型后才会出现对话入口。</p><button type="button" class="mini-btn primary" data-action="ai-open-settings">打开设置</button></div>`;
  else if(!configured)body=`<div class="ai-empty" style="padding:60px 24px">${ico('key',26)}<b>还没有配置模型</b><p>填一个 OpenAI 兼容的 Base URL 和 API Key；Key 只保存在本机。</p><button type="button" class="mini-btn primary" data-action="ai-open-config">配置模型</button></div>`;
  else if(v==='ready')body=`<div class="ai-empty" style="padding:60px 24px">${ico('sparkles',26)}<b>问点什么，或让它帮你整理</b><p>可以问「今天还剩什么」，也可以让它把一段话拆成待办。</p></div>`;
  else body=`<div style="display:flex;flex-direction:column;gap:8px">${thread.map((m,i)=>{
    if(m.role==='error')return `<div class="ai-msg is-error" style="max-width:100%"><div class="ai-msg-head">${ico('alert',9)} 出错</div>${esc(m.text)}${i===lastIdx?'<div><button type="button" class="ai-retry" data-action="ai-retry">重试上一条</button></div>':''}</div>`;
    const isUser=m.role==='user';
    return `<div class="ai-msg ${isUser?'is-user':''}" style="max-width:88%"><div class="ai-msg-head">${isUser?'你':'AI 助手'}</div>${esc(m.text)}${(!isUser&&m.actions&&i===lastIdx)?`<div class="ai-actions"><button type="button" class="ai-chip" data-action="ai-insert">${ico('plus',10)}新建待办</button><button type="button" class="ai-chip" data-action="ai-insert">${ico('calendar',10)}新建日程</button><button type="button" class="ai-chip" data-action="ai-insert">${ico('clock',10)}安排时间</button><button type="button" class="ai-chip" data-action="ai-insert">${ico('list',10)}拆成子任务</button></div>`:''}</div>`;
  }).join('')}${busy?`<div class="ai-msg" style="align-self:flex-start;display:flex;align-items:center;gap:8px;color:var(--muted)"><span class="ai-spin"></span>正在回复…</div>`:''}</div>`;
  const actions=`<button type="button" class="m-icon" data-action="ai-open-config" aria-label="模型">${ico('sliders',15)}</button>${ready&&v!=='ready'?`<button type="button" class="m-icon" data-action="ai-clear" aria-label="清空对话">${ico('trash',15)}</button>`:''}`;
  const composer=ready?`<div class="m-capture" style="height:auto;padding:6px 8px;gap:7px;bottom:10px"><input class="cap-input" id="ai-input" value="${esc(state.aiInput)}" placeholder="问点什么，回车发送" aria-label="输入消息"><button type="button" class="cap-send ${busy?'is-busy':''}" data-action="ai-send" aria-label="发送">${busy?'<span class="ai-spin"></span>':ico('send',14)}</button></div>`:'';
  return mobileShell('AI 助手',body,{back:true,actions,composer:false}).replace('<div class="m-home"></div>',composer+'<div class="m-home"></div>')+(v==='clear'?`<div class="pk-scrim" data-action="ai-clear-cancel"><div class="pk-card" role="dialog" aria-label="清空对话"><div class="set-modal-head"><b>清空这段对话？</b><button type="button" class="drawer-close" data-action="ai-clear-cancel">${ico('x',12)}</button></div><div class="set-modal-body" style="font-size:11px;line-height:1.6;color:var(--muted)">消息会从这台设备移除，不能撤销。</div><div class="pk-foot"><button type="button" data-action="ai-clear-cancel">取消</button><button type="button" class="primary" data-action="ai-clear-confirm">清空</button></div></div></div>`:'');
}

function renderNav(){

  nav.innerHTML=NAV.map(([group,items])=>`<div class="spec-group">${group}</div>${items.map(([key,label])=>`<button type="button" class="spec-link ${state.screen===key?'is-on':''}" data-screen="${key}"><span class="dot"></span>${label}</button>`).join('')}`).join('');
}
function renderVariants(){
  const meta=SCREENS[state.screen]||SCREENS.today;
  const box=document.getElementById('spec-variants');
  box.innerHTML=`<span class="v-label">状态</span>`+meta.variants.map(([key,label])=>`<button type="button" class="v-chip ${state.variant===key?'is-on':''}" data-variant="${key}">${label}</button>`).join('');
}
function render(){
  if(!state.drawer&&!state.screen.startsWith('detail-')&&state.variant!=='detail')state.drawerEdit=false;
  if(state.screen.startsWith('cal-'))state.calView=state.screen.split('-')[1];
  const meta=SCREENS[state.screen]||SCREENS.today;
  // The AI config dialog is a property of the variant, not of how the variant
  // was reached. Deriving it here keeps deep links and chip clicks identical.
  if(state.screen==='settings-ai')state.aiConfigOpen=['config','detecting','save-checking','config-error'].includes(state.variant);
  document.getElementById('spec-title').textContent=meta.title;
  document.getElementById('spec-desc').textContent=meta.desc;
  const navBox=document.getElementById('spec-nav');
  const navTop=navBox?navBox.scrollTop:0;
  renderNav();
  if(navBox)navBox.scrollTop=navTop;
  renderVariants();
  const frame=document.getElementById('frame');
  frame.className='product '+(state.device==='mobile'?'mobile':state.device==='narrow'?'narrow':'desktop');
  frame.innerHTML=state.device==='mobile'?mobileScreen():desktopScreen();
  if(state.device==='desktop'&&state.screen==='todo-all'&&state.variant==='completed'){
    requestAnimationFrame(()=>{
      const col=frame.querySelector('.todo-list-col'); const target=frame.querySelector('.todo-list-col .completed-group');
      if(col&&target){const top=target.getBoundingClientRect().top-col.getBoundingClientRect().top+col.scrollTop-8;col.scrollTop=Math.max(0,top);}
    });
  }
  if(state.device==='mobile'&&(state.screen==='today'||state.screen.startsWith('todo-'))&&(state.variant==='completed'||state.completedOpen)){
    requestAnimationFrame(()=>{
      const sc=frame.querySelector('.m-scroll'); const target=frame.querySelector('.m-completed-group');
      if(sc&&target){const top=target.getBoundingClientRect().top-sc.getBoundingClientRect().top+sc.scrollTop-8;sc.scrollTop=Math.max(0,top);}
    });
  }
  requestAnimationFrame(fitFrame);
}
function fitFrame(){
  const canvas=document.getElementById('spec-canvas');
  const frame=document.getElementById('frame');
  const wrap=document.getElementById('frame-wrap');
  if(!canvas||!frame||!wrap)return;
  const w=frame.offsetWidth,h=frame.offsetHeight;
  const pad=44;
  const scale=Math.min((canvas.clientWidth-pad*2)/w,(canvas.clientHeight-pad*2)/h,1);
  frame.style.transform='scale('+scale+')';
  wrap.style.width=(w*scale)+'px';
  wrap.style.height=(h*scale)+'px';
}

function activeDetailRef(){
  if(state.drawer)return state.drawer;
  if(state.variant==='detail'){
    if(state.screen==='today')return {type:'todo',id:pickTodoId('report')};
    if(state.screen.startsWith('todo-'))return {type:'todo',id:pickTodoId(state.screen==='todo-all'?'recurring':'report')};
    if(state.screen.startsWith('cal-'))return {type:'event',id:pickEventId('dentist')};
  }
  if(state.screen==='detail-todo')return {type:'todo',id:pickTodoId(state.variant==='recurring'?'recurring':state.variant==='long'?'long':'report')};
  if(state.screen==='detail-event')return {type:'event',id:pickEventId(state.variant==='allday'?'sprint':state.variant==='recurring'?'weekly':'dentist')};
  return null;
}
function go(screen){
  state.screen=screen;
  state.variant='normal';
  state.drawer=null;
  state.drawerEdit=false;
  clearDraft();
  state.capture='compact';
  state.completedOpen=false;
  state.earlyOpen=false;
  state.confirmDelete=false;
  state.deleteRef=null;
  state.inboxNoDate=false;
  state.filterApplied=false;
  state.filterCal='';
  state.filterTag='';
  state.filterPriority='';
  state.filterOverdue=false;
  state.toast=null;
  state.suggestionRemoved=false;
  state.aiConfigOpen=false;
  state.fbCopied=false;
  if(screen==='capture'){state.variant='compact';state.capture='compact';state.captureReturn='today';}
  if(screen==='command'){state.variant='result';state.cmdQuery='周报';state.cmdReturn='today';}
  if(screen==='picker-date'||screen==='picker-time'){state.cmdReturn='today';state.variant='normal';}
  if(screen==='settings-ai')state.variant='normal';
  if(screen==='ai-chat')state.variant='normal';
  if(screen==='plan-picker'){state.variant='normal';state.planReturn='today';state.planDate=TODAY;state.planStart='15:15';state.planEnd='16:00';}
  if(screen.startsWith('cal-'))state.calView=screen.split('-')[1];
  if(screen==='cal-day'||screen==='todo-date')state.selectedDate=TODAY;
  if((screen==='settings-calendar-edit'||screen==='settings-calendar-delete')&&state.deletedCals.includes(state.calendarId))state.calendarId=calIds()[0]||'personal';
  render();
}
document.addEventListener('click',(e)=>{
  const screenBtn=e.target.closest('[data-screen]');
  if(screenBtn){go(screenBtn.dataset.screen);return;}
  const dev=e.target.closest('[data-device]');
  if(dev){state.device=dev.dataset.device;state.drawerEdit=false;clearDraft();document.querySelectorAll('[data-device]').forEach(b=>b.classList.toggle('is-on',b===dev));render();return;}
  const variant=e.target.closest('[data-variant]');
  if(variant){
    state.variant=variant.dataset.variant;
    state.drawer=null;
    state.drawerEdit=false;
    clearDraft();
    state.confirmDelete=false;
    state.deleteRef=null;
    state.completedOpen=false;
    state.earlyOpen=false;
    state.toast=null;
    state.aiConfigOpen=state.screen==='settings-ai'&&['config','detecting','save-checking','config-error'].includes(variant.dataset.variant);
    state.fbCopied=variant.dataset.variant==='copied';
    if(state.screen!=='capture')state.capture='compact';
    if(state.screen.startsWith('cal-'))state.hiddenCals=state.variant==='calendars'?['work']:[];
    if(state.screen==='capture')state.capture=variant.dataset.variant;
    state.inboxNoDate=state.screen==='todo-inbox'&&state.variant==='nodate';
    state.filterApplied=state.screen.startsWith('todo-')&&state.variant==='filtered';
    if(state.filterApplied){state.filterCal='work';state.filterTag='周报';state.filterPriority='';state.filterOverdue=false;}
    if(state.screen==='command')state.cmdQuery=variant.dataset.variant==='empty'?'':variant.dataset.variant==='noresult'?'不存在的任务':'周报';
    render();return;
  }
  if(e.target.classList&&e.target.classList.contains('confirm-scrim')){state.confirmDelete=false;state.deleteRef=null;if(state.variant==='delete')state.variant='normal';render();return;}
  const a=e.target.closest('[data-action]');
  if(!a)return;
  const act=a.dataset.action;
  if(act==='nav'){go(a.dataset.route);return;}
  if(act==='cmd'){if(state.screen!=='command')state.cmdReturn=state.screen;state.screen='command';state.variant='result';state.cmdQuery='周报';render();return;}
  if(act==='close-cmd'){state.screen=state.cmdReturn||'today';state.variant='normal';state.drawer=null;render();return;}
  if(act==='capture-expand'||act==='capture-todo'||act==='capture-event'||act==='capture-parsed'||act==='capture-compact'||act==='capture-expanded'||act==='capture-submit'||act==='capture-later'||act==='remove-suggestion'||act==='restore-suggestion'){
    if(act==='remove-suggestion'){state.suggestionRemoved=true;render();return;}
    if(act==='restore-suggestion'){state.suggestionRemoved=false;render();return;}
    if(act==='capture-expand'||act==='capture-todo'||act==='capture-event'){
      if(state.screen==='today'||state.screen.startsWith('todo-')||state.screen.startsWith('cal-'))state.captureReturn=state.screen;
      else if(state.screen!=='capture')state.captureReturn='today';
    }
    if(act==='capture-later'){
      addLocalTodo({title:'交季度总结'});
      state.capture='compact';state.screen=state.captureReturn==='capture'?'today':(state.captureReturn||'today');state.variant='normal';
      state.toast='已存到未安排 · 等待同步';
      render();setTimeout(()=>{state.toast=null;render();},2200);
      return;
    }
    if(act==='capture-expand'&&state.device==='mobile'){state.screen='capture';state.variant='compact';state.capture='parsed';render();return;}
    if(act==='capture-todo'&&state.device==='mobile'){state.screen='capture';state.variant='compact';state.capture='parsed';render();return;}
    if(act==='capture-expand'||act==='capture-expanded')state.capture='expanded';
    if(act==='capture-event')state.capture='event';
    if(act==='capture-parsed')state.capture='parsed';
    if(act==='capture-compact'){state.capture='compact';state.screen=state.captureReturn==='capture'?'today':(state.captureReturn||'today');state.variant='normal';}
    if(act==='capture-submit'){
      if(state.capture==='save-error'){

      }
      const input=document.getElementById('cap-input');
      if(state.capture==='parsed'){
        addLocalTodo(state.suggestionRemoved?{title:'交报告'}:{title:'交报告',plan:{date:addDays(TODAY,1),start:'15:00',end:'16:00'}});
        state.capture='compact';state.screen=state.captureReturn==='capture'?'today':(state.captureReturn||'today');state.variant='normal';

        render();setTimeout(()=>{state.toast=null;render();},2200);
        return;

document.addEventListener('change',(e)=>{
  const t=e.target;
  if(!t)return;
  if(t.id==='plan-date'){state.planDate=t.value||TODAY;render();return;}
  if(t.id==='plan-start'||t.id==='plan-end'){
    if(t.id==='plan-start')state.planStart=t.value||state.planStart;else state.planEnd=t.value||state.planEnd;
    const dur=document.getElementById('plan-duration');if(dur)dur.textContent=planDuration(state.planStart,state.planEnd);
    return;
  }
  const field=t.dataset&&t.dataset.mfield;
  if(!field)return;
  const ref=activeEditRef();
  if(!ref)return;
  const item=draftFor(ref);
  if(!item)return;
  if(field==='allDay')item.allDay=(t.value==='1'||t.checked===true);
  else if(field==='cal')item.cal=t.value;
  else if(field==='repeat'){
    item.repeat=t.value;
    if(item.repeat&&!item.repeatEnd)item.repeatEnd='永不结束';
  }
  else if(field==='repeatEnd'){
    item.repeatEnd=t.value;
    if(t.value==='在日期'&&!item.repeatUntil)item.repeatUntil=TODAY;
    if(t.value==='在次数'&&!item.repeatCount)item.repeatCount=10;
  }
  else item[field]=t.value;
  render();
});

      state.toast='已创建日程 · 11/21 10:00–11:00';
      render();setTimeout(()=>{state.toast=null;render();},2200);
      return;
    }
    const title=e.target.value.trim()||'新待办';
    if(state.capture==='parsed'){
      addLocalTodo(state.suggestionRemoved?{title:'交报告'}:{title:'交报告',plan:{date:addDays(TODAY,1),start:'15:00',end:'16:00'}});
      state.toast=state.suggestionRemoved?'已记下待办 · 无日期':'已记下待办 · 明天 15:00 计划';
    }else if(state.capture==='expanded'){
      addLocalTodo({title:'交季度总结',due:'2026-11-21',dueTime:'18:00',plan:{date:'2026-11-21',start:'15:00',end:'16:00'}});
      state.toast='已记下待办 · 11/21 18:00 截止';
    }else{
      addLocalTodo({title});
      state.toast='已加入「未安排」· 继续输入';
    }
    const backScreen=state.screen==='capture'?'today':state.screen;
    state.capture='compact';state.screen=backScreen;state.variant='normal';
    render();setTimeout(()=>{state.toast=null;render();},2200);
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(state.screen!=='command')state.cmdReturn=state.screen;state.screen='command';state.variant='result';state.cmdQuery='周报';render();}
  if(e.key==='Escape'){
    if(document.querySelector('.confirm-modal')){state.confirmDelete=false;state.deleteRef=null;if(state.variant==='delete')state.variant='normal';render();return;}
    if(state.screen==='command'){state.screen=state.cmdReturn||'today';state.variant='normal';state.drawer=null;render();return;}
    if(state.screen==='plan-picker'){restorePlan();render();return;}
    if(['filter','filter-empty','date-picker','plan','calendars','slot'].includes(state.variant)){state.variant='normal';render();return;}
    if(state.drawer||state.screen.startsWith('detail-')||state.variant==='detail'){
      state.drawer=null;
      state.confirmDelete=false;
      if(state.screen==='detail-todo')state.screen='today';
      if(state.screen==='detail-event')state.screen='cal-day';
      state.variant='normal';
      render();
    }
  }
});

function sfScrim(inner,extra){return `<div class="sf-scrim ${extra||''}">${inner}</div>`;}
function sfModal(title,body,foot,width){
  return `<div class="set-modal" role="dialog" aria-label="${esc(title)}" style="width:min(${width||430}px,100%);margin:0">

}
function sfFoot(cancel,ok,primary){
  return `<button type="button" class="mini-btn" data-action="noop">${cancel||'取消'}</button><button type="button" class="mini-btn ${primary===false?'':'primary'}" data-action="noop">${ok||'应用'}</button>`;

function sfRow(label,o){

}
function sfWide(label,disabled){
  return `<button type="button" class="btn primary" ${disabled?'disabled style="width:100%;margin-top:12px;opacity:.45"':'style="width:100%;margin-top:12px"'}>${label}</button>`;
}
function sfMyGrid(month,selected){
  const cells=monthCells(month);

}

    'planReturnEdit', 'planReturnVariant', 'confirmDelete', 'deleteRef',
    'trashId', 'trashName', 'aiBusy', 'fbCopied', 'capture', 'captureReturn',
    'suggestionRemoved', 'aiConfigOpen', 'aiKeyVisible', 'overlayFocus',
    'widgetKind', 'widgetEmpty', 'pickerDate', 'pickerMonth', 'timeValue',
    'selectedDate', 'settings', 'tagId', 'calendarId', 'planTodoId',

      }
      if (Array.isArray(data.events)) {
        EVENTS.splice(0, EVENTS.length, ...data.events);
      }
      if (data.cal && typeof data.cal === 'object') {
        for (const k of Object.keys(CAL)) delete CAL[k];
        Object.assign(CAL, data.cal);
      }
      if (data.state) {
        Object.assign(state, data.state);
        state.done = new Set(Array.isArray(data.state.done) ? data.state.done : []);
      }
      if (data.data) {
        Object.assign(Proto.data, data.data);
        if (Array.isArray(data.data.tags)) Proto.data.tags = data.data.tags;
      }

    } catch (_) {

  Proto.reset = function reset() {

  Proto.toast = function (msg) {

  };

  Proto.modal = function modal(opts) {

    if (typeof opts.body === 'string') body.innerHTML = opts.body;
    else if (opts.body) body.appendChild(opts.body);
    const foot = $('.proto-modal-foot', scrim);
    (opts.actions || []).forEach((a) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'proto-btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : '');
      b.textContent = a.label;
      b.addEventListener('click', () => {
        const keep = a.onClick ? a.onClick(scrim) : false;
        if (!keep) scrim.remove();
      });
      foot.appendChild(b);

    scrim.addEventListener('click', (e) => { if (e.target === scrim && !opts.sticky) close(); });
    scrim._close = close;

  Proto.prompt = function prompt(opts) {
    const id = 'p-' + Math.random().toString(36).slice(2);
    const value = (opts.value || '').replace(/"/g, '&quot;');
    const scrim = Proto.modal({
      title: opts.title,
      body: `<div class="proto-field"><label for="${id}">${opts.label || ''}</label><input id="${id}" class="proto-input" value="${value}" placeholder="${(opts.placeholder || '').replace(/"/g, '&quot;')}"></div>${opts.note ? `<div class="proto-note">${opts.note}</div>` : ''}`,
      actions: [
        { label: '取消' },
        { label: opts.confirm || '确定', primary: true, onClick: (root) => {
          opts.onConfirm($('#' + id, root).value.trim());
        } },
      ],
    });
    return scrim;
  };

  /* ---------------- routing ---------------- */
  const screenRoutes = {
    'today': 'today',
    'todo-inbox': 'todos/inbox',
    'todo-all': 'todos/all',
    'todo-date': 'todos/date',
    'cal-week': 'calendar/week',
    'cal-month': 'calendar/month',
    'cal-day': 'calendar/day',
    'new-todo': 'new/todo',
    'new-event': 'new/event',
    'command': 'search',
    'ai-chat': 'ai',
    'trash-page': 'trash',
    'tags-page': 'tags',
    'feedback': 'feedback',
    'capture': 'capture',
    'settings-home': 'settings/home',
  };

  function routeForState() {
    if (state.protoError) return 'error/' + (state.protoError.kind || 'missing');
    if (state.drawer) {
      return (state.drawer.type === 'event' ? 'event/' : 'todo/') + state.drawer.id;
    }
    if (screenRoutes[state.screen]) return screenRoutes[state.screen];
    if (state.screen.startsWith('settings-')) {
      return 'settings/' + state.screen.replace('settings-', '');
    }
    return 'today';
  }

  Proto.route = routeForState;

  function applyRoute(hash) {
    const raw = String(hash || '').replace(/^#\/?/, '');
    const bits = raw.split('/').filter(Boolean);
    if (!bits.length || bits[0] === 'today') { baseGo('today'); return; }
    if (bits[0] === 'todo' && bits[1]) {
      baseGo('today');
      const t = todoById(bits[1]);
      if (t) { state.drawer = { type: 'todo', id: t.id }; render(); }
      else showError((state.deletedTodos || []).includes(bits[1]) ? 'trashed' : 'missing', raw);
      return;
    }
    if (bits[0] === 'event' && bits[1]) {
      baseGo('cal-day');
      const e = eventById(bits[1]);
      if (e) { state.drawer = { type: 'event', id: e.id }; render(); }
      else showError((state.deletedEvents || []).includes(bits[1]) ? 'trashed' : 'missing', raw);
      return;
    }
    if (bits[0] === 'todos') {
      baseGo(bits[1] === 'all' ? 'todo-all' : bits[1] === 'date' ? 'todo-date' : 'todo-inbox');
      return;
    }
    if (bits[0] === 'calendar') {
      baseGo(bits[1] === 'month' ? 'cal-month' : bits[1] === 'day' ? 'cal-day' : 'cal-week');
      return;
    }
    if (bits[0] === 'settings') {
      baseGo('settings-' + (bits[1] || 'home'));
      return;
    }
    if (bits[0] === 'new') { baseGo(bits[1] === 'event' ? 'new-event' : 'new-todo'); return; }
    if (bits[0] === 'search') { baseGo('command'); return; }
    if (bits[0] === 'ai') { baseGo('ai-chat'); return; }
    if (bits[0] === 'trash') { baseGo('trash-page'); return; }
    if (bits[0] === 'tags') { baseGo('tags-page'); return; }
    if (bits[0] === 'feedback') { baseGo('feedback'); return; }
    if (bits[0] === 'widgets') { baseGo('widgets'); return; }
    if (bits[0] === 'quick-add') { baseGo('today'); Proto.quickAdd && Proto.quickAdd(); return; }
    if (bits[0] === 'oauth') { baseGo('server-oauth'); return; }
    if (bits[0] === 'error') { showError(bits[1] || 'missing', raw); return; }
    showError('missing', raw);
  }

  let suppressHash = false;
  function syncHash(push) {
    const next = '#/' + routeForState();

    suppressHash = true;

  const baseGo = go;
  const baseRender = render;

  // Every screen render also records the URL and the local snapshot.

  };

  function showError(kind, detail) {
    state.protoError = { kind: kind || 'missing', detail: detail || '' };
    render();
  }
  Proto.showError = showError;

  function paintError() {
    const frame = document.getElementById('frame');
    if (!frame) return;
    const e = state.protoError || {};
    const trashed = e.kind === 'trashed';
    const startup = e.kind === 'startup';
    const title = trashed ? '这一项已在回收站' : startup ? 'DaySpark 没有启动' : '找不到这个页面';
    const sub = trashed
      ? '它被删除后还在回收站里。恢复后会回到原来的日历，不会新建一条重复项。'
      : startup
        ? '本地数据没有丢。可以重试；如果一直失败，复制诊断信息再反馈。'
        : '链接可能过期，或这个对象从来没有同步到本机。';
    const body = `<div class="page"><div class="page-state-wrap"><div class="page-state">
      <span class="page-state-ico">${typeof ico === 'function' ? ico('alert', 24) : '!'}</span>
      <b>${title}</b><p>${sub}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        ${trashed ? `<button type="button" class="page-state-btn" data-proto-action="error-trash">去回收站</button>` : ''}
        ${startup ? `<button type="button" class="page-state-btn" data-proto-action="error-retry">重试</button>` : ''}
        <button type="button" class="page-state-btn" data-proto-action="error-home">返回首页</button>
      </div>
      ${e.detail ? `<p style="font-size:9px;color:var(--faint);word-break:break-all">${String(e.detail).slice(0, 120)}</p>` : ''}
    </div></div></div>`;
    if (state.device === 'mobile') {
      frame.innerHTML = `<div class="m-app"><div class="m-status"><span>15:00</span><span class="m-status-icons"><i></i><i></i><i></i></span></div><header class="m-top"><div class="m-title">DaySpark</div></header><div class="m-scroll">${body}</div></div>`;
    } else {
      frame.innerHTML = pTop('') + `<div class="p-main">${body}</div>`;
    }
  }

  go = function (screen) {
    state.protoError = null;
    if ((screen === 'new-todo' || screen === 'new-event') && state.screen !== screen) {

  window.addEventListener('popstate', () => {
    if (suppressHash) return;

  /* ---------------- action capture ---------------- */
  document.addEventListener('click', (e) => {

      if (!el.dataset.protoAction) el.dataset.protoAction = 'settings-home-proto';
    });

    // The v2 layer classifies every remaining control as a real read-only
    // fact, an explicit disabled state, or a removed entry.
    $$('[data-action="noop"]:not([data-proto-action])', root).forEach((el) => {
      const row = el.closest('.set-row, .m-settings-row');
      if (row && row.dataset.protoAction && row.dataset.protoAction !== 'info-detail') {

    else document.body.classList.remove('proto-phone-preview');
