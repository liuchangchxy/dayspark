    }
    if (label === '优先级') {
      P.openPriorityPicker({ onPick: (v) => { d.priority = v === 0 ? '无' : v === 1 ? '低' : v === 9 ? '高' : '中'; render(); toast('优先级 · ' + d.priority); } });
      return;
    }
    if (label === '标签') {
      P.openTagPicker(d.tags || [], (tags) => { d.tags = tags; render(); toast(tags.length ? '标签已更新' : '已清除标签'); });
    }
  });

  registerAction('new-cancel', () => {
    const d = P.data.newDraft;
    const title = (q('#new-title') || q('.new-page .form-input') || {}).value || '';
    const dirty = !!title.trim() || !!(d && (d.due || d.plan || d.repeat || d.loc || d.allDay || (d.tags || []).length || d.cal !== (state.defaultCal || 'personal') || d.priority !== '中' || d.remind !== (state.screen === 'new-event' ? '15 分钟前' : '不提醒')));
    if (!dirty) { goBackFromNew(); return; }
    modal({
      title: '离开这张表单？',
      body: '<div class="proto-note">标题和已填的字段还没有保存；离开会丢弃这次输入。</div>',
      actions: [
        { label: '留下', primary: true },
        { label: '丢弃', danger: true, onClick: () => { P.data.newDraft = null; goBackFromNew(); } },
      ],
    });
  });
  function goBackFromNew() {
    const ev = state.screen === 'new-event';
    P.baseGo(ev ? 'cal-week' : 'today');
    P.syncHash(true);
  }

  registerAction('new-save', () => {
    if (P.demo.saveError) {
      state.variant = 'save-error';
      render();
      toast('保存失败 · 内容已保留');
      return;
    }
    const ev = state.screen === 'new-event';
    const titleEl = q('#new-title') || q('.new-page .form-input') || q('.m-detail-scroll .m-form-input');
    const d = draft();
    const title = ((titleEl && titleEl.value) || d.title || '').trim();
    if (!title) { state.variant = 'validation'; render(); toast('先写一个标题'); return; }
    if (ev) {
      const event = {
        id: 'local-event-' + (++state.localNo), title, cal: d.cal || state.defaultCal || 'personal',
        allDay: !!d.allDay, loc: d.loc, remind: d.remind === '不提醒' ? '' : d.remind,
        note: '', repeat: d.repeat || '', repeatEnd: d.repeatEnd || '',
        repeatUntil: d.repeatUntil || '', repeatCount: d.repeatCount || 0,
      };
      if (d.allDay) {
        event.date = d.date;
        if (d.endDate && d.endDate !== d.date) { event.startDate = d.date; event.endDate = d.endDate; delete event.date; }
      } else { event.date = d.date; event.start = d.start; event.end = d.end; }
      EVENTS.push(event);
      state.deletedEvents = state.deletedEvents.filter((x) => x !== event.id);
      P.data.newDraft = null;
      P.baseGo('cal-day');
      P.syncHash(true);
      toast('已创建日程 · ' + (d.allDay ? '全天' : d.start + '–' + d.end));
      return;
    }
    const todo = {
      id: 'local-' + (++state.localNo), title, cal: d.cal || state.defaultCal || 'personal',
      priority: d.priority === '高' ? 5 : d.priority === '低' ? 1 : 0,
      tags: (d.tags || []).slice(), note: '', subtasks: [], status: 'open',
      repeat: d.repeat || '', repeatEnd: d.repeatEnd || '',
      repeatUntil: d.repeatUntil || '', repeatCount: d.repeatCount || 0,
    };
    if (d.due) { todo.due = d.due; if (d.dueTime) todo.dueTime = d.dueTime; }
    if (d.plan) todo.plan = d.plan;
    if (d.remind && d.remind !== '不提醒') todo.remind = d.remind;
    TODOS.unshift(todo);
    P.data.newDraft = null;
    P.baseGo('todo-inbox');
    P.syncHash(true);
    toast('已记下待办');
  });

  /* expose date format helpers */
  P.dateShort = short;
  P.dateMD = md;
})();


/* DaySpark prototype v2 — real full-text search with keyboard navigation. */
(function () {
  const P = window.Proto;
  const { registerAction, registerEnhancer, toast } = P;
  const q = (s, r) => (r || document).querySelector(s);
  const qa = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = P.esc;
  let sel = 0;
  /* The old renderer cut each group at a hard limit and never showed the
     remainder. Keep the first screenful but expose the rest in place. */
  const PAGE = { todos: 6, events: 5 };
  const expanded = { todos: false, events: false };

  function hl(text, query) {
    const t = esc(text);
    const qq = String(query || '').trim();
    if (!qq) return t;
    try {
      return t.replace(new RegExp('(' + qq.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>');
    } catch (_) { return t; }
  }
  function hay(t) {
    return [t.title, t.note, (t.tags || []).join(' '), (t.subtasks || []).map((s) => s.title).join(' '), t.loc].filter(Boolean).join(' ').toLowerCase();
  }
  function matchCal(t) { return calOf(t.cal).name + ' ' + (t.cal || ''); }

  function body(query) {
    const raw = String(query || '').trim();
    const qtext = raw.toLowerCase();
    if (!qtext) {
      const recents = TODOS.filter((t) => !isDone(t)).slice(0, 3);
      return `<div class="cmd-group">最近</div>` + recents.map((t) => rowTodo(t, '')).join('') +
        `<div class="cmd-group">动作</div>` + actionRows('');
    }
    const todos = TODOS.concat(state.localTodos || []).filter((t) => !state.deletedTodos.includes(t.id) && (hay(t).includes(qtext) || matchCal(t).toLowerCase().includes(qtext)));
    const events = EVENTS.filter((e) => !state.deletedEvents.includes(e.id) && (hay(e).includes(qtext) || matchCal(e).toLowerCase().includes(qtext)));
    if (!todos.length && !events.length) {
      return `<div class="proto-search-empty"><div>没有找到「${esc(raw)}」</div><button type="button" class="proto-btn primary" style="margin-top:10px" data-proto-action="search-new-todo">用这句话新建待办</button></div>` + `<div class="cmd-group">动作</div>` + actionRows(raw);
    }
    const shownTodos = expanded.todos ? todos : todos.slice(0, PAGE.todos);
    const shownEvents = expanded.events ? events : events.slice(0, PAGE.events);
    let out = '';
    if (todos.length) {
      out += '<div class="cmd-group">待办 · ' + todos.length + '</div>' + shownTodos.map((t) => rowTodo(t, raw)).join('');
      if (todos.length > PAGE.todos) out += moreRow('todos', shownTodos.length, todos.length, expanded.todos);
    }
    if (events.length) {
      out += '<div class="cmd-group">日程 · ' + events.length + '</div>' + shownEvents.map((e) => rowEvent(e, raw)).join('');
      if (events.length > PAGE.events) out += moreRow('events', shownEvents.length, events.length, expanded.events);
    }
    out += '<div class="cmd-group">动作</div>' + actionRows(raw);
    return out;
  }
  function moreRow(group, shown, total, isOpen) {
    const label = group === 'todos' ? '待办' : '日程';
    if (isOpen) {
      return `<button type="button" class="cmd-more" data-proto-action="search-more" data-group="${group}">收起${label}，只看前 ${group === 'todos' ? PAGE.todos : PAGE.events} 项</button>`;
    }
    return `<button type="button" class="cmd-more" data-proto-action="search-more" data-group="${group}">显示其余 ${total - shown} 项${label}（共 ${total} 项）</button>`;
  }
  function rowTodo(t, query) {
    return `<button type="button" class="cmd-row proto-search" data-idx data-proto-action="search-open-todo" data-id="${t.id}">
      <span class="check ${isDone(t) ? 'is-on' : ''}" style="pointer-events:none">${isDone(t) ? ico('check', 7) : ''}</span>
      <span class="cmd-row-main"><span class="cmd-row-t">${hl(t.title, query)}</span><span class="cmd-row-m">${esc(calOf(t.cal).name)}${t.due ? ' · 截止 ' + dueText(t) : ''}${(t.tags || []).length ? ' · ' + esc(t.tags.join('、')) : ''}</span></span>
      <span class="cmd-row-side">待办</span></button>`;
  }
  function rowEvent(e, query) {
    return `<button type="button" class="cmd-row proto-search" data-idx data-proto-action="search-open-event" data-id="${e.id}">
      ${ico('calendar', 14)}<span class="cmd-row-main"><span class="cmd-row-t">${hl(e.title, query)}</span><span class="cmd-row-m">${esc(calOf(e.cal).name)} · ${mdShort(e.date || e.startDate || TODAY)}${e.loc ? ' · ' + esc(e.loc) : ''}</span></span>
      <span class="cmd-row-side">日程</span></button>`;
  }
  function actionRows(query) {
    return `<button type="button" class="cmd-row" data-idx data-proto-action="search-new-todo">${ico('plus', 14)}<span class="cmd-row-main"><span class="cmd-row-t">新建待办</span><span class="cmd-row-m">${query ? '标题“' + esc(query) + '”' : '进入整页创建'}</span></span><span class="cmd-row-side">动作</span></button>
      <button type="button" class="cmd-row" data-idx data-proto-action="search-new-event">${ico('calendar', 14)}<span class="cmd-row-main"><span class="cmd-row-t">新建日程</span><span class="cmd-row-m">进入整页创建</span></span><span class="cmd-row-side">动作</span></button>
      <button type="button" class="cmd-row" data-idx data-proto-action="search-ai">${ico('sparkles', 14)}<span class="cmd-row-main"><span class="cmd-row-t">问 AI</span><span class="cmd-row-m">${query ? '关于“' + esc(query) + '”' : '打开助手'}</span></span><span class="cmd-row-side">动作</span></button>
      <button type="button" class="cmd-row" data-idx data-proto-action="search-settings">${ico('settings', 14)}<span class="cmd-row-main"><span class="cmd-row-t">打开设置</span></span><span class="cmd-row-side">动作</span></button>`;
  }

  let lastQ = null;
  registerEnhancer((root) => {
    if (state.screen !== 'command') { lastQ = null; expanded.todos = false; expanded.events = false; return; }
    if (state.cmdQuery !== lastQ) {
      lastQ = state.cmdQuery;
      sel = 0;
      expanded.todos = false;
      expanded.events = false;
    }
    const el = q('.cmd-body, .m-cmd-body', root);
    if (!el) return;
    el.innerHTML = body(state.cmdQuery);
    el.dataset.v2 = '1';
    const rows = qa('.cmd-row[data-idx]', el);
    sel = Math.max(0, Math.min(sel, rows.length - 1));
    rows.forEach((r, i) => r.classList.toggle('is-sel', i === sel));
  });

  registerAction('search-more', (el) => {
    const group = el.dataset.group === 'events' ? 'events' : 'todos';
    expanded[group] = !expanded[group];
    render();
    // Keep the keyboard path usable after expanding: put focus back in the
    // search field so ArrowUp/Down/Enter still drive the result list.
    setTimeout(() => {
      const input = q('.cmd-input input, .m-cmd-input input');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }, 0);
  });

  document.addEventListener('keydown', (e) => {
    if (state.screen !== 'command') return;
    const rows = qa('.cmd-body .cmd-row[data-idx], .m-cmd-body .cmd-row[data-idx]');
    if (!rows.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
      rows.forEach((r, i) => r.classList.toggle('is-sel', i === sel));
      rows[sel].scrollIntoView({ block: 'nearest' });
      return;
    }
    if (e.key === 'Enter') {
      const active = document.activeElement;
      const typing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
      // Do not hijack Enter on the "显示更多" button itself; once focus is
      // back in the search input, Enter opens the highlighted row.
      if (typing || !active || active === document.body) {
        e.preventDefault();
        (rows[sel] || rows[0]).click();
      }
    }
  });

  registerAction('search-ai', () => {
    P.baseGo('ai-chat');
    const qtext = state.cmdQuery || '';
    state.aiInput = qtext ? '关于「' + qtext + '」，' : '';
    P.syncHash(true);
    setTimeout(() => { const i = q('#ai-input'); if (i) { i.value = state.aiInput; i.focus(); } }, 40);
  });
  registerAction('search-settings', () => {
    P.baseGo('settings-home'); P.syncHash(true);
  });
})();


/* DaySpark prototype v2 — calendars, tags, trash, devices, import and backup. */
(function () {
  const P = window.Proto;
  const { registerAction, registerEnhancer, modal, toast } = P;
  const q = (s, r) => (r || document).querySelector(s);
  const qa = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = P.esc;

  function tint(hex) {
    const h = String(hex).replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((x) => x + x).join('') : h, 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const mix = (c, t) => Math.round(c + (t - c) * 0.86);
    const dark = (c) => Math.round(c * 0.55);
    return {
      bg: '#' + [mix(r, 255), mix(g, 255), mix(b, 255)].map((x) => x.toString(16).padStart(2, '0')).join(''),
      ink: '#' + [dark(r), dark(g), dark(b)].map((x) => x.toString(16).padStart(2, '0')).join(''),
    };
  }

  /* ---------------- calendar colour ---------------- */
  registerEnhancer((root) => {
    if (!state.screen.startsWith('settings-')) return;
    const section = state.screen.replace('settings-', '');
    if (section !== 'calendar-new' && section !== 'calendar-edit') return;
    const swatches = qa('.filter-chip-row .swatch', root);
    swatches.forEach((s) => {
      if (s.dataset.v2) return;
      s.dataset.v2 = '1';
      s.style.cursor = 'pointer';
      s.dataset.color = (s.style.getPropertyValue('--bar') || '').trim();
      s.addEventListener('click', () => {
        swatches.forEach((x) => x.classList.remove('is-on'));
        s.classList.add('is-on');
        P.data.calColorDraft = s.dataset.color;
      });
    });
  });

  registerAction('cal-save', () => {
    const section = state.screen.replace('settings-', '');
    const input = q('.io-card .form-input') || q('.m-form .m-form-input');
    const name = (input && input.value || '').trim();
    if (!name) { toast('先写日历名称'); input && input.focus(); return; }
    const color = P.data.calColorDraft || '#4f7bbf';
    if (section === 'calendar-new') {
      let id = name.toLowerCase().replace(/[^a-z0-9一-龥]+/g, '-').replace(/^-|-$/g, '') || 'calendar';
      const base = id; let n = 2; while (CAL[id]) id = base + '-' + n++;
      const t = tint(color);
      CAL[id] = { name, color, bg: t.bg, ink: t.ink };
      P.data.calColorDraft = '';
      P.baseGo('settings-calendars'); P.syncHash(true);
      toast('已创建日历 · ' + name);
      return;
    }
    const id = state.calendarId;
    if (!id || !CAL[id]) return;
    CAL[id].name = name;
    if (P.data.calColorDraft) {
      const t = tint(P.data.calColorDraft);
      CAL[id].color = P.data.calColorDraft;
      CAL[id].bg = t.bg;
      CAL[id].ink = t.ink;
    }
    P.data.calColorDraft = '';
    P.baseGo('settings-calendars'); P.syncHash(true);
    toast('日历已保存');
  });

  /* ---------------- tag colour + save ---------------- */
  registerEnhancer((root) => {
    if (state.screen !== 'settings-tag-new' && state.screen !== 'settings-tag-edit') return;
    const swatches = qa('.filter-chip-row .swatch', root);
    swatches.forEach((s) => {
      if (s.dataset.v2) return;
      s.dataset.v2 = '1';
      s.style.cursor = 'pointer';
      s.dataset.color = (s.style.getPropertyValue('--bar') || '').trim();
      s.addEventListener('click', () => {
        swatches.forEach((x) => x.classList.remove('is-on'));
        s.classList.add('is-on');
        P.data.tagColorDraft = s.dataset.color;
      });
    });
  });

  registerAction('tag-save', () => {
    const section = state.screen.replace('settings-', '');
    const input = q('.io-card .form-input') || q('.m-form .m-form-input');
    const name = (input && input.value || '').trim();
    if (!name) { state.variant = 'validation'; render(); return; }
    const inUse = P.data.tags.some((t) => t.name === name) ||
      TODOS.concat(state.localTodos || []).some((t) => (t.tags || []).includes(name));
    if (section === 'tag-new') {
      if (inUse) { state.variant = 'duplicate'; render(); toast('标签名已存在'); return; }
      P.data.tags.push({ name, color: P.data.tagColorDraft || '#4f7bbf' });
      P.data.tagColorDraft = '';
      P.baseGo('settings-tags'); P.syncHash(true);
      toast('已创建标签 · ' + name);
      return;
    }
    const old = state.tagId || '周报';
    if (name !== old && inUse) { toast('标签名已存在'); return; }
    const tag = P.data.tags.find((t) => t.name === old);
    if (tag) { tag.name = name; if (P.data.tagColorDraft) tag.color = P.data.tagColorDraft; }
    TODOS.concat(state.localTodos || []).forEach((t) => {
      if (Array.isArray(t.tags)) t.tags = t.tags.map((x) => x === old ? name : x);
    });
    state.tagId = name;
    P.data.tagColorDraft = '';
    P.baseGo('settings-tags'); P.syncHash(true);
    toast('标签已保存');
  });

  /* ---------------- trash: confirm and real restore ---------------- */
  function snapFor(id) {
    const row = (state.trashExtra || []).find((x) => x.id === id);
    if (row && row.snap) return row.snap;
    const base = (typeof trashItems === 'function' ? trashItems() : []).find((x) => x.id === id);
    return base && base.snap;
  }
  registerEnhancer((root) => {
    if (state.screen !== 'settings-trash' && state.screen !== 'trash-page') return;
    qa('.trash-row', root).forEach((row) => {
      const id = (q('[data-action="trash-restore"]', row) || {}).dataset?.id;
      if (!id) return;
      qa('[data-action="trash-restore"]', row).forEach((b) => { b.dataset.protoAction = 'trash-restore-v2'; b.dataset.id = id; });
      qa('[data-action="trash-delete"]', row).forEach((b) => { b.dataset.protoAction = 'trash-delete-v2'; b.dataset.id = id; });
    });
    qa('[data-action="trash-clear"]', root).forEach((b) => { b.dataset.protoAction = 'trash-clear-v2'; });
  });

  registerAction('trash-restore-v2', (el) => {
    const id = el.dataset.id;
    const snap = snapFor(id);
    if (!snap) {
      // No snapshot: never rebuild from the title. Say what actually happens.
      modal({
        title: '这一项没有可恢复的原件',
        body: '<div class="proto-note">这条记录是在设计状态里预置的示例，没有保存原日历、标签和字段。恢复会创建一条只有标题的待办，并放进默认日历。</div>',
        actions: [
          { label: '取消' },
          { label: '仍然恢复为纯标题', onClick: () => {
            const row = el.closest('.trash-row, .m-settings-row');
            const title = (q('.trash-main > div', row) || q('span', row) || {}).textContent || '恢复的待办';
            const keep = state.trashExtra.filter((x) => x.id === id);
            state.deletedTodos = state.deletedTodos.filter((x) => x !== id);
            state.deletedEvents = state.deletedEvents.filter((x) => x !== id);
            state.trashExtra = state.trashExtra.filter((x) => x.id !== id);
            if (!keep.length && id.startsWith('trash-')) {
              state.trashRemoved = state.trashRemoved || [];
              if (!state.trashRemoved.includes(id)) state.trashRemoved.push(id);
            }
            TODOS.unshift({ id: 'restored-' + Date.now(), title: title.trim(), cal: state.defaultCal || 'personal', priority: 0, tags: [], status: 'open' });
            render(); toast('已恢复为纯标题 · ' + calOf(state.defaultCal || 'personal').name);
          } },
        ],
      });
      return;
    }
    state.deletedTodos = (state.deletedTodos || []).filter((x) => x !== id);
    state.deletedEvents = (state.deletedEvents || []).filter((x) => x !== id);
    state.trashExtra = (state.trashExtra || []).filter((x) => x.id !== id);
    const isEvent = !!(snap.start || snap.startDate || snap.allDay && snap.date && !snap.status);
    const list = isEvent ? EVENTS : TODOS;
    const copy = JSON.parse(JSON.stringify(snap));
    const existing = list.find((x) => x.id === copy.id);
    if (existing) {
      Object.keys(existing).forEach((k) => { delete existing[k]; });
      Object.assign(existing, copy);
    } else if (isEvent) {
      EVENTS.push(copy);
    } else {
      TODOS.unshift(copy);
    }
    state.skipped = (state.skipped || []).filter((k) => !k.startsWith(snap.id + '@'));
    const backTo = snap.cal ? calOf(snap.cal).name : '原日历';
    state.drawer = isEvent ? { type: 'event', id: snap.id } : { type: 'todo', id: snap.id };
    state.drawerEdit = false;
    render();
    toast('已恢复 · 回到「' + backTo + '」· 原字段保留');
  });

  registerAction('trash-delete-v2', (el) => {
    const id = el.dataset.id;
    modal({
      title: '永久删除？',
      body: '<div class="proto-note">不会进回收站，也不能撤销。</div>',
      actions: [
        { label: '取消' },
        { label: '永久删除', primary: true, danger: true, onClick: () => {
          state.trashExtra = (state.trashExtra || []).filter((x) => x.id !== id);
          state.trashRemoved = state.trashRemoved || [];
          if (!state.trashRemoved.includes(id)) state.trashRemoved.push(id);
          render(); toast('已永久删除');
        } },
      ],
    });
  });

  registerAction('trash-clear-v2', () => {
    modal({
      title: '清空回收站？',
      body: '<div class="proto-note">回收站里的所有项目会被永久删除，不能撤销。待办与日程本身也会从本地存储移除。</div>',
      actions: [
        { label: '取消' },
        { label: '清空', primary: true, danger: true, onClick: () => {
          state.deletedTodos = [];
          state.deletedEvents = [];
          state.trashExtra = [];
          state.trashRemoved = ['trash-books', 'trash-template', 'trash-review'];
          render(); toast('回收站已清空');
        } },
      ],
    });
  });

  /* ---------------- devices ---------------- */
  registerAction('devices-open', () => {

  /* ---------------- ICS import ---------------- */
  function parseICS(text) {
    const lines = text.replace(/\r\n/g, '\n').replace(/\n[ \t]/g, '').split('\n');
    const events = [], todos = [], skipped = [];
    let cur = null, kind = null, startLine = 0;
    const dateOf = (v) => {
      const m = /^(\d{4})(\d{2})(\d{2})/.exec(v || '');
      return m ? m[1] + '-' + m[2] + '-' + m[3] : '';
    };
    const timeOf = (v) => {
      const m = /T(\d{2})(\d{2})/.exec(v || '');
      return m ? m[1] + ':' + m[2] : '';
    };
    lines.forEach((raw, idx) => {
      const line = raw.trim();
      if (line === 'BEGIN:VEVENT') { kind = 'event'; cur = {}; startLine = idx + 1; return; }
      if (line === 'BEGIN:VTODO') { kind = 'todo'; cur = {}; startLine = idx + 1; return; }
      if (line === 'END:VEVENT' || line === 'END:VTODO') {
        if (cur) {
          const summary = (cur.SUMMARY || '').trim();
          const start = cur.DTSTART || cur.DUE || '';
          const day = dateOf(start);
          if (!summary || !day) skipped.push({ line: startLine, reason: !summary ? '缺少标题（SUMMARY 为空）' : '日期无法识别', raw: summary ? line.replace(/\s+/g, ' ').trim() : 'BEGIN:' + (kind === 'event' ? 'VEVENT' : 'VTODO') });
          else if (kind === 'event') events.push({ line: idx + 1, title: summary, date: day, endDate: dateOf(cur.DTEND), start: timeOf(start), end: timeOf(cur.DTEND), allDay: !timeOf(start), loc: cur.LOCATION || '', note: cur.DESCRIPTION || '', repeat: '', rrule: cur.RRULE || '' });
          else todos.push({ line: idx + 1, title: summary, due: day, dueTime: timeOf(start), note: cur.DESCRIPTION || '', rrule: cur.RRULE || '' });
        }
        cur = null; kind = null; return;
      }
      if (!cur) return;
      const m = /^([A-Z-]+)(;[^:]*)?:(.*)$/.exec(line);
      if (m) cur[m[1]] = m[3].replace(/\\n/gi, '\n').replace(/\\,/g, ',').replace(/\\;/g, ';').replace(/\\\\/g, '\\');

    return { events, todos, skipped };

  const WD_CODE = { MO: '一', TU: '二', WE: '三', TH: '四', FR: '五', SA: '六', SU: '日' };
  function parseRRule(v) {
    const out = { repeat: '', repeatUntil: '', repeatCount: 0, repeatEnd: '永不结束', warning: '' };
    if (!v) return out;
    const kv = {};
    String(v).split(';').forEach((p) => { const i = p.indexOf('='); if (i > 0) kv[p.slice(0, i).toUpperCase()] = p.slice(i + 1); });
    const freq = kv.FREQ || '';
    const interval = Number(kv.INTERVAL || 1);
    if (freq === 'DAILY' && interval === 1) out.repeat = '每天';
    else if (freq === 'WEEKLY' && interval <= 2) {
      const days = (kv.BYDAY || '').split(',').map((x) => WD_CODE[x.replace(/^\d+/, '')]).filter(Boolean);

    const um = /^(\d{4})(\d{2})(\d{2})/.exec(kv.UNTIL || '');
    if (um) out.repeatUntil = um[1] + '-' + um[2] + '-' + um[3];
    out.repeatCount = Number(kv.COUNT || 0);
    out.repeatEnd = out.repeatCount ? '在次数' : out.repeatUntil ? '在日期' : '永不结束';
    return out;
  }

    const a = String(t || '09:00').split(':').map(Number);

SUMMARY:每周站会
DTSTART:20261123T093000
DTEND:20261123T100000
RRULE:FREQ=WEEKLY;BYDAY=MO,WE,FR;COUNT=6
END:VEVENT
BEGIN:VEVENT
SUMMARY:设计冲刺
DTSTART;VALUE=DATE:20261124

END:VEVENT
BEGIN:VEVENT

  registerAction('import-next', () => {

        // keep the clock times so the projection can show it on both days.

        } else {
          ev.date = e.date;
          ev.start = e.start || '09:00';
          ev.end = e.end && e.end > ev.start ? e.end : plusMinutes(ev.start, 60);
          ev.allDay = false;

      });
      parsed.todos.forEach((t, i) => {
        const rr = parseRRule(t.rrule);
        if (rr.warning) warnings.push({ line: t.line, text: t.title + '：' + rr.warning });

          repeat: rr.repeat, repeatEnd: rr.repeatEnd, repeatUntil: rr.repeatUntil, repeatCount: rr.repeatCount });

      state.variant = 'success';
      render();
      toast('导入完成 · ' + (parsed.events.length + parsed.todos.length) + ' 项写入' + (parsed.skipped.length ? ' · ' + parsed.skipped.length + ' 行跳过' : ''));
    }, 800);
  });

  registerAction('import-skip', () => {

  });

  registerAction('import-report', () => {
    const p = P.data.importParsed || { name: 'dayplan.ics', events: [], todos: [], skipped: [{ line: 14, reason: '日期无法识别' }] };

    modal({
      title: '导入报告',
      body: `<div class="proto-list"><div class="proto-note">${esc(p.name)} · 目标「${esc(calOf(P.data.importCalendar || 'work').name)}」</div>

        ${p.skipped.length ? p.skipped.map((s) => `<div class="proto-list-row"><span class="grow">第 ${s.line} 行<small>${esc(s.reason)}${s.raw ? ' · ' + esc(s.raw.slice(0, 40)) : ''}</small></span><span class="proto-badge">跳过</span></div>`).join('') : '<div class="proto-list-row"><span class="grow">没有跳过行</span></div>'}
        ${warnings.length ? warnings.map((w) => `<div class="proto-list-row"><span class="grow">第 ${w.line || '—'} 行<small>${esc(w.text)}</small></span><span class="proto-badge">近似导入</span></div>`).join('') : ''}</div>`,
      actions: [{ label: '关闭', primary: true }],
    });
  });

  /* ---------------- backup merge from a real file ---------------- */
  registerAction('backup-merge', () => {
    if (state.screen !== 'settings-backup') { P.baseGo('settings-backup'); }
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json,application/json'; input.className = 'proto-hidden-input';
    document.body.appendChild(input);
    input.addEventListener('change', () => {
      const f = input.files && input.files[0]; if (!f) { input.remove(); return; }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result || '{}'));
          const todos = Array.isArray(data.todos) ? data.todos : [];
          const events = Array.isArray(data.events) ? data.events : [];
          let added = 0;
          todos.forEach((t) => { if (t && t.id && !TODOS.some((x) => x.id === t.id)) { TODOS.unshift(t); added++; } });
          events.forEach((e) => { if (e && e.id && !EVENTS.some((x) => x.id === e.id)) { EVENTS.push(e); added++; } });
          if (data.cal && typeof data.cal === 'object') Object.keys(data.cal).forEach((k) => { if (!CAL[k]) CAL[k] = data.cal[k]; });
          if (Array.isArray(data.data?.tags)) data.data.tags.forEach((t) => { if (!P.data.tags.some((x) => x.name === t.name)) P.data.tags.push(t); });

          render();
          toast('备份已合并 · ' + added + ' 项新增');
        } catch (err) {
          state.variant = 'merge-error'; render(); toast('备份文件无法解析');
        }
        input.remove();
      };
      reader.readAsText(f);
    });
    input.click();
  });
})();

    if (state.screen !== 'settings-ai') return;
    const dlg = q('.set-modal[aria-label="AI 模型配置"]', root);
    const open = !!dlg;
    if (open && !wasConfigOpen) {
      aiDraft = {
        base: P.data.ai.base || 'https://api.openai.com/v1',
        model: P.data.ai.model || 'gpt-4o-mini',
        key: P.data.ai.key || '',
      };
      keyClearRequested = false;
    }
    wasConfigOpen = open;
    // The settings row should show the stored mask, never a stale literal.
    qa('.set-key', root).forEach((el) => { el.textContent = P.data.ai.key || '未配置'; });
    if (!dlg) return;

    const inputs = qa('.form-input', dlg);
    const baseInput = inputs[0];
    const keyInput = inputs[1];
    const modelInput = inputs[2];
    if (baseInput && !baseInput.id) baseInput.id = 'ai-base';
    if (keyInput && !keyInput.id) keyInput.id = 'ai-key';
    if (modelInput && !modelInput.id) modelInput.id = 'ai-model';

    if (baseInput) baseInput.value = aiDraft ? aiDraft.base : (P.data.ai.base || 'https://api.openai.com/v1');
    if (modelInput) modelInput.value = aiDraft ? aiDraft.model : (P.data.ai.model || 'gpt-4o-mini');
    if (keyInput) keyInput.value = aiDraft ? aiDraft.key : (P.data.ai.key || '');

    if (keyInput && !keyInput.dataset.v3input) {
      keyInput.dataset.v3input = '1';
      keyInput.addEventListener('input', () => {
        aiDraft = aiDraft || {};
        aiDraft.key = keyInput.value;
        if (!isMasked(keyInput.value) && keyInput.value.trim()) {
          keyClearRequested = false;
          const clearBtn = q('[data-proto-action="ai-key-clear"]', dlg);
          if (clearBtn) clearBtn.classList.remove('is-on');
        }
      });
    }
    if (baseInput && !baseInput.dataset.v3input) {
      baseInput.dataset.v3input = '1';
      baseInput.addEventListener('input', () => { aiDraft = Object.assign({}, aiDraft, { base: baseInput.value }); });
    }
    if (modelInput && !modelInput.dataset.v3input) {
      modelInput.dataset.v3input = '1';
      modelInput.addEventListener('input', () => { aiDraft = Object.assign({}, aiDraft, { model: modelInput.value }); });
    }

    if (keyInput && !q('[data-proto-action="ai-key-clear"]', dlg)) {
      const clear = document.createElement('button');
      clear.type = 'button';
      clear.className = 'mini';
      clear.dataset.protoAction = 'ai-key-clear';
      clear.textContent = '清除已保存的 Key';
      clear.title = '只删除本机保存的 Key；Base URL 和模型名保留。';
      keyInput.insertAdjacentElement('afterend', clear);
      const note = document.createElement('div');
      note.className = 'form-help';
      note.textContent = '已保存的 Key 以掩码显示；不改动直接保存会保留原 Key。只有输入新的 Key，或显式清除，才会改变它。';
      clear.insertAdjacentElement('afterend', note);
    }
    const clearBtn = q('[data-proto-action="ai-key-clear"]', dlg);
    if (clearBtn) clearBtn.classList.toggle('is-on', keyClearRequested);

    qa('.ai-preset', dlg).forEach((b) => {
      if (b.dataset.action === 'noop') b.removeAttribute('data-action');
      b.dataset.protoAction = 'ai-preset';
      b.dataset.provider = b.textContent.trim();
    });

    // The master's own save handler never touched P.data.ai; route the
    // dialog's save/remove buttons through the key-safe implementation.
    qa('[data-action="ai-config-save"]', dlg).forEach((b) => { b.dataset.protoAction = 'ai-config-save'; });
    qa('[data-action="ai-config-remove"]', dlg).forEach((b) => { b.dataset.protoAction = 'ai-config-remove'; });
    qa('[data-action="ai-detect"]', dlg).forEach((b) => { if (!b.dataset.protoAction) b.dataset.protoAction = 'ai-detect'; });
  }

  registerAction('ai-preset', (el) => {
    const dlg = el.closest('.set-modal');
    const name = el.dataset.provider || el.textContent.trim();
    qa('.ai-preset', dlg).forEach((x) => x.classList.toggle('is-on', x === el));
    const map = PRESETS[name];
    if (!map) return; // 自定义: keep whatever Base URL/model the user typed.
    const base = q('#ai-base', dlg);
    const model = q('#ai-model', dlg);
    if (base) base.value = map[0];
    if (model) model.value = map[1];
    aiDraft = Object.assign({}, aiDraft, { base: map[0], model: map[1] });
    toast('已选择服务商 · ' + name);
  });

  registerAction('ai-key-clear', (el) => {
    keyClearRequested = !keyClearRequested;
    el.classList.toggle('is-on', keyClearRequested);
    const dlg = el.closest('.set-modal');
    const key = q('#ai-key', dlg);
    if (keyClearRequested && key) {
      key.value = '';
      aiDraft = Object.assign({}, aiDraft, { key: '' });
    } else if (aiDraft) {
      aiDraft.key = P.data.ai.key || '';
      if (key) key.value = aiDraft.key;
    }
    toast(keyClearRequested ? '保存后会清除已保存的 Key' : '已取消清除，保存时保留原 Key');
  });

  registerAction('ai-config-save', () => {
    const dlg = q('.set-modal[aria-label="AI 模型配置"]') || q('.set-modal');
    if (!dlg) return;
    const base = ((q('#ai-base', dlg) || {}).value || '').trim();
    const rawKey = ((q('#ai-key', dlg) || {}).value || '').trim();
    const model = ((q('#ai-model', dlg) || {}).value || '').trim();
    if (!base || !/^https?:\/\//.test(base)) { toast('Base URL 需要以 http(s):// 开头'); return; }
    if (!model) { toast('模型名不能为空'); return; }

    const existing = String(P.data.ai.secret || '').trim();
    const masked = isMasked(rawKey);
    let nextSecret = existing;
    let nextMask = P.data.ai.key || '';
    let cleared = false;

    if (keyClearRequested && (!rawKey || masked)) {
      nextSecret = '';
      nextMask = '';
      cleared = true;
    } else if (rawKey && !masked) {
      nextSecret = rawKey;
      nextMask = maskKey(rawKey);
    } else if (!existing) {
      // Nothing to keep and nothing typed: this is a real validation error,
      // not a request to delete a key that isn't there.
      keyClearRequested = false;
      state.variant = 'config-error';
      render();
      toast('API Key 不能为空；要移除已保存的 Key，请用「清除已保存的 Key」');
      return;
    }

    aiDraft = { base, model, key: cleared ? '' : (masked ? rawKey : nextMask) };
    keyClearRequested = false;
    state.variant = 'save-checking';
    state.aiConfigOpen = true;
    render();

    setTimeout(() => {
      P.data.ai.base = base;
      P.data.ai.model = model;
      P.data.ai.secret = nextSecret;
      P.data.ai.key = nextMask;
      state.aiConfigured = !cleared;
      if (!cleared) state.aiEnabled = true;
      state.aiConfigOpen = false;
      state.variant = cleared ? 'unconfigured' : 'normal';
      aiDraft = null;
      render();
      if (cleared) toast('已清除本机保存的 Key · Base URL 与模型名保留');
      else if (rawKey && !masked) toast('模型配置已保存 · 已更新 Key · ' + model);
      else toast('模型配置已保存 · 保留原有 Key · ' + model);
    }, 650);
  });

  registerAction('ai-config-remove', () => {
    modal({
      title: '移除模型配置？',
      body: '<div class="proto-note">会删除本机保存的 Key；已创建的待办和对话不受影响，但无法继续发送。</div>',
      actions: [{ label: '取消' }, {
        label: '移除', primary: true, danger: true, onClick: () => {
          P.data.ai.secret = '';
          P.data.ai.key = '';
          aiDraft = null;
          keyClearRequested = false;
          state.aiConfigured = false;
          state.aiConfigOpen = false;
          state.variant = 'unconfigured';
          render();
          toast('已移除模型配置');
        },
      }],
    });
  });

  /* ------------------------------------------------------------------ */
  /* Real simulated sync conflict                                        */
  /* ------------------------------------------------------------------ */
  const CONFLICT_SEEDS = [
    {
      id: 'report',
      local: { title: '提交周报给林总', note: '把本周的三个阻塞点写进周报，附上数据。', priority: 5 },
      server: { title: '提交周报 · 服务器修订版', note: '服务器：补充上周遗留的两个阻塞点。', priority: 9 },
    },
    {
      id: 'proposal',
      local: { title: '写 Q4 提案初稿', note: '先列框架，再补数据。', priority: 5 },
      server: { title: '写 Q4 提案初稿 · 补充数据', note: '服务器：先补数据，再列框架。', priority: 1 },
    },
  ];

  function todoFields(id) {
    const t = todoById(id);
    if (!t) return null;
    return {
      title: t.title || '',
      note: t.note || '',
      priority: t.priority == null ? 0 : t.priority,
    };
  }

  function conflictBatch() {
    P.data.sync = P.data.sync || {};
    if (!P.data.sync.conflictBatch || !Array.isArray(P.data.sync.conflictBatch.items)) {
      P.data.sync.conflictBatch = {
        createdAt: Date.now(),
        items: CONFLICT_SEEDS.map((seed) => ({
          id: seed.id,
          local: todoFields(seed.id) || Object.assign({}, seed.local),
          server: Object.assign({}, seed.server),
        })),
      };
    }
    return P.data.sync.conflictBatch;
  }

  // Field-level merge: notes are concatenated; a server title only replaces
  // an empty local title; the server wins on priority when it has one.
  function mergeConflict(local, server) {
    const l = local || {};
    const s = server || {};
    const notes = [];
    if (l.note != null && String(l.note).trim()) notes.push(String(l.note).trim());
    if (s.note != null && String(s.note).trim()) notes.push(String(s.note).trim());
    return {
      title: l.title != null && String(l.title).trim() ? l.title : (s.title || ''),
      note: notes.join('\n'),
      priority: s.priority != null ? s.priority : l.priority,
    };
  }
  P.syncMerge = mergeConflict;

  function applyOne(item, choice) {
    const t = todoById(item.id);
    if (!t) return null;
    let next;
    if (choice === 'local') next = Object.assign({}, item.local);
    else if (choice === 'server') next = Object.assign({}, item.server);
    else next = mergeConflict(item.local, item.server);
    t.title = next.title != null ? next.title : t.title;
    t.note = next.note;
    t.priority = next.priority;
    t.conflictResolvedAt = Date.now();
    return {
      id: item.id,
      choice,
      after: { title: t.title, note: t.note, priority: t.priority },
    };
  }

  function applyConflictSelection(picks) {
    const batch = conflictBatch();
    const missing = batch.items.filter((it) => !picks || !picks[it.id]);
    if (missing.length) {
      toast('还有 ' + missing.length + ' 项冲突没有选择');
      return false;
    }
    const applied = [];
    batch.items.forEach((it) => {
      const row = applyOne(it, picks[it.id]);
      if (row) applied.push(row);
    });
    const choices = {};
    applied.forEach((r) => { choices[r.id] = r.choice; });
    const stamp = new Date();
    const hh = String(stamp.getHours()).padStart(2, '0');
    const mm = String(stamp.getMinutes()).padStart(2, '0');
    P.demo = P.demo || {};
    P.demo.conflict = false;
    P.data.sync.conflicts = 0;
    P.data.account.lastSync = '刚刚 · 冲突已解决（' + hh + ':' + mm + '）';
    batch.resolvedAt = Date.now();
    batch.resolved = applied;
    P.data.sync.lastResolution = { at: Date.now(), picks: choices, applied };
    render();
    toast('已应用 ' + applied.length + ' 项冲突：' + applied.map((r) => r.id + '=' + r.choice).join('、'));
    return applied;
  }
  P.applySyncConflict = applyConflictSelection;

  function conflictCard(item, picked) {
    const local = item.local;
    const server = item.server;
    return `<div class="io-card sync-conflict-card" data-cid="${esc(item.id)}">
      <h3>${esc(item.local.title || item.server.title || item.id)}</h3>
      <div class="sync-version"><b>本地</b><span>标题：${esc(local.title || '（空）')}<br>备注：${esc(local.note || '（空）')}<br>优先级：${esc(local.priority)}</span></div>
      <div class="sync-version"><b>服务器</b><span>标题：${esc(server.title || '（空）')}<br>备注：${esc(server.note || '（空）')}<br>优先级：${esc(server.priority)}</span></div>
      <div class="proto-seg" data-conflict="${esc(item.id)}">
        <button type="button" data-v="local" class="${picked === 'local' ? 'is-on' : ''}">保留本地</button>
        <button type="button" data-v="server" class="${picked === 'server' ? 'is-on' : ''}">用服务器</button>
        <button type="button" data-v="merge" class="${picked === 'merge' ? 'is-on' : ''}">合并</button>
      </div>
    </div>`;
  }

  registerAction('sync-conflict-open', () => {
    const batch = conflictBatch();
    const body = document.createElement('div');
    const picks = {};
    body.innerHTML = `<div class="proto-note">每条单独选择。应用后会把结果写入本机待办并保存；“应用选择”会一次处理全部行。</div>` +
      batch.items.map((it) => conflictCard(it, null)).join('');
    body.addEventListener('click', (e) => {
      const b = e.target.closest('[data-v]');
      if (!b) return;
      const seg = b.closest('.proto-seg');
      if (!seg) return;
      qa('button', seg).forEach((x) => x.classList.remove('is-on'));
      b.classList.add('is-on');
      picks[seg.dataset.conflict] = b.dataset.v;
    });
    modal({
      title: '处理同步冲突', wide: true, body,
      actions: [
        { label: '稍后' },
        {
          label: '应用选择', primary: true, onClick: () => {
            if (!applyConflictSelection(picks)) return true;
            return false;
          },
        },
      ],
    });
  });

  registerAction('sync-pick', (el) => {
    const seg = el.closest('.proto-seg');
    if (!seg) return;
    state.syncPicks = state.syncPicks || {};
    state.syncPicks[seg.dataset.conflict] = el.dataset.v;
    qa('button', seg).forEach((x) => x.classList.toggle('is-on', x === el));
  });

  registerAction('sync-apply', () => {
    const picks = state.syncPicks || {};
    const ok = applyConflictSelection(picks);
    if (ok) state.syncPicks = {};
    return ok;
  });

  function paintConflictPage(root) {
    if (state.screen !== 'settings-sync-conflict') return;
    // Desktop uses .set-content; the phone shell keeps the page body in
    // .m-scroll. Replace either so the same selectable conflict UI is used.
    const content = q('.set-content', root) || q('.m-scroll', root);
    if (!content) return;
    const batch = conflictBatch();
    const picks = state.syncPicks || {};
    const resolved = !!batch.resolvedAt && (!P.data.sync || !P.data.sync.conflicts);
    const current = batch.items.map((it) => {
      const f = todoFields(it.id);
      return f ? `<div class="sync-version"><b>${esc(f.title || it.id)}</b><span>标题：${esc(f.title)}<br>备注：${esc(f.note || '（空）')}<br>优先级：${esc(f.priority)}</span></div>` : '';
    }).join('');
    const cards = batch.items.map((it) => conflictCard(it, picks[it.id])).join('')
      // The modal card uses its own delegated picker; the full page needs
      // each option to be a real proto action so it can update state.syncPicks.
      .replace(/<button type="button" data-v=/g, '<button type="button" data-proto-action="sync-pick" data-v=');
    content.innerHTML = `<h2 class="set-h">同步冲突</h2>
      <p class="set-desc">同一个条目在本地和服务器都改过；逐项选择。应用后写入本机并保存。</p>
      ${resolved ? `<div class="inline-alert"><b>这组冲突已经应用。</b><br>最近一次结果：${esc((batch.resolved || []).map((r) => r.id + '=' + r.choice).join('、'))}。下面显示当前保存的值。</div>` : ''}
      ${cards}
      <div class="io-card"><h3>当前保存的值</h3>${current}</div>
      <div class="filter-actions"><button type="button" class="primary" data-proto-action="sync-apply">应用选择</button></div>`;
  }

  /* ------------------------------------------------------------------ */
  /* Honest fallback: product screens never become a tidy read-only card */
  /* ------------------------------------------------------------------ */
  const SURFACE_KEYS = (typeof SURFACES !== 'undefined' && SURFACES) ? Object.keys(SURFACES) : [];
  const NON_PRODUCT = new Set(['spec', 'states', 'overlays', 'widgets'].concat(SURFACE_KEYS));
  const warned = new Set();

  function controlLabel(el) {
    const row = el.closest && el.closest('.set-row, .m-settings-row, .field-row');
    if (row) {
      const l = q('.set-label, .m-settings-label, span', row);
      const t = (l ? l.textContent : row.textContent) || '';
      return t.replace(/\s+/g, ' ').trim().slice(0, 40);
    }
    return (el.getAttribute('aria-label') || el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40) || '这一项';
  }

  function markDisabledReason(el, reason) {
    el.classList.add('proto-disabled');
    el.dataset.protoAction = 'disabled-info';
    el.dataset.reason = reason;
    el.setAttribute('aria-disabled', 'true');
    el.title = reason;
  }

  P.fallback = function fallback(el, root) {
    // A real disabled control keeps its disabled state, but now says why.
    if (el.disabled || el.getAttribute('aria-disabled') === 'true') {
      markDisabledReason(el, el.dataset.reason || '这一项在当前状态下不可用。');
      return;
    }
    // Design-sample surfaces from the master keep their explicit
    // "这是设计样张" behaviour instead of pretending to be product writes.
    if (typeof SURFACES !== 'undefined' && state.screen in SURFACES) {
      el.dataset.protoAction = 'demo-surface-info';
      el.dataset.demoLabel = controlLabel(el);
      return;
    }
    if (NON_PRODUCT.has(state.screen)) {
      el.dataset.protoAction = 'demo-surface-info';
      el.dataset.demoLabel = controlLabel(el);
      return;
    }
    // Product route: do not cover an unwired control with a read-only dialog.
    const label = controlLabel(el);
    const reason = '这个控件还没有接入真实写入；已停用并标记为“未实现”。';
    if (!warned.has(state.screen + '/' + label)) {
      warned.add(state.screen + '/' + label);
      console.warn('[DaySpark 原型] 未实现的产品控件：' + state.screen + ' · ' + label, el);
    }
    el.dataset.protoAction = 'unimplemented-info';
    el.dataset.unimplementedLabel = label;
    el.classList.add('proto-unimplemented');
    el.setAttribute('aria-disabled', 'true');
    el.title = reason;
    if (el.tagName === 'BUTTON' || el.tagName === 'INPUT' || el.tagName === 'SELECT') el.disabled = true;
    if (!el.dataset.unimplementedMarked) {
      el.dataset.unimplementedMarked = '1';
      const tag = document.createElement('span');
      tag.className = 'proto-unimplemented-tag';
      tag.textContent = '未实现';
      if (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') el.insertAdjacentElement('afterend', tag);
      else el.appendChild(tag);
    }
  };

  registerAction('unimplemented-info', (el) => {
    toast('未实现：' + (el.dataset.unimplementedLabel || '这个控件') + '（控制台有警告）');
  });

  registerAction('account-detail', () => {
    const a = P.data.account || {};
    modal({
      title: '账号与服务器',
      body: `<div class="proto-list">
        <div class="proto-list-row"><span class="grow">账号<small>${a.signedIn ? '已登录' : '未登录'}</small></span><span>${esc(a.email || '—')}</span></div>
        <div class="proto-list-row"><span class="grow">服务器<small>自托管同步地址</small></span><span>${esc(a.server || '—')}</span></div>
        <div class="proto-list-row"><span class="grow">最后同步<small>最近一次成功</small></span><span>${esc(a.lastSync || '—')}</span></div>
        <div class="proto-list-row"><span class="grow">已连接设备</span><span>${(a.devices || []).length} 台</span></div>
      </div><div class="proto-note">这是当前会话的只读事实；需要修改地址请用「服务器」那一行。</div>`,
      actions: [
        { label: '关闭' },
        { label: '复制账号', onClick: () => { if (navigator.clipboard) navigator.clipboard.writeText(a.email || '').catch(() => {}); toast('已复制账号'); } },
      ],
    });
  });

  /* ------------------------------------------------------------------ */
  /* Per-render wiring                                                   */
  /* ------------------------------------------------------------------ */
  registerEnhancer((root) => {
    // Any control that already has a real proto action is no longer a noop;
    // remove the old attribute so the fallback cannot see it.
    qa('[data-action="noop"][data-proto-action]', root).forEach((el) => el.removeAttribute('data-action'));

    paintAiChips(root);
    if (state.screen === 'ai-chat') {
      qa('.ai-send, .cap-send', root).forEach((b) => { if (!b.dataset.protoAction) b.dataset.protoAction = 'ai-send-proto'; });
    }
    aiConfigEnhance(root);
    paintConflictPage(root);

    // The sync/account page has one genuine read-only fact: the account row.
    if (state.screen.startsWith('settings-sync') || state.screen === 'settings-account') {
      qa('.set-row', root).forEach((row) => {
        if (row.dataset.protoAction) return;
        const label = (q('.set-label', row) || {}).textContent || '';
        if (label.includes('账号') && !label.includes('已连接')) {
          row.dataset.protoAction = 'account-detail';
          row.removeAttribute('data-action');
          const v = q('.set-value', row);
          if (v && !v.dataset.protoAction) v.dataset.protoAction = 'account-detail';
        }
      });
    }
  });
})();


/* DaySpark prototype v3 — capture, composer and priority consistency.
   One canonical priority scale for create / edit / save / filter / store:
     无 = 0 · 高 = 1 · 中 = 5 · 低 = 9
   This is the scale the frozen master already uses in priorityChips(),
   filterPriorityValue(), set-priority and the demo TODOS (rent/internet = 1
   are the urgent ones; car/mom/groceries/books = 9 are the someday ones).
   Older prototype layers had two different, partially inverted maps. */
(function () {
  const P = window.Proto;
  const { registerAction, registerEnhancer, toast, modal } = P;
  const q = (s, r) => (r || document).querySelector(s);
  const qa = (s, r) => Array.from((r || document).querySelectorAll(s));

  const PRIORITY_VALUE = { 无: 0, 高: 1, 中: 5, 低: 9 };
  function priorityValue(label) {
    if (typeof label === 'number') return label;
    return PRIORITY_VALUE[label] == null ? 5 : PRIORITY_VALUE[label];
  }
  function priorityLabel(value) {
    const v = Number(value);
    if (v === 0) return '无';
    if (v === 1) return '高';
    if (v === 5) return '中';
    if (v === 9) return '低';
    if (!Number.isFinite(v)) return '中';
    return v <= 3 ? '高' : v >= 7 ? '低' : '中';
  }
  P.priorityValue = priorityValue;
  P.priorityLabel = priorityLabel;

  function draft() {
    if (!P.data.newDraft) {
      P.data.newDraft = {
        cal: state.defaultCal || 'personal', date: TODAY, start: '11:00', end: '12:00',
        allDay: false, endDate: '', loc: '', repeat: '', repeatEnd: '永不结束',

  }

  function snap(obj, keys) {
    const out = {};
    keys.forEach((k) => { out[k] = obj[k]; });
    return out;
  }
  function restore(obj, saved) {
    Object.keys(saved).forEach((k) => {
      if (saved[k] === undefined) delete obj[k];
      else obj[k] = saved[k];

  }
  // Clicking the scrim is the same as Cancel: nothing opened inside it may leak.
  function guardScrim(scrim, onDismiss) {
    scrim.addEventListener('click', (e) => { if (e.target === scrim) onDismiss(); });
    return scrim;
  }

  /* ---------------- composer: due / time with nested-picker rollback ---------------- */
  const baseNewField = P.actions['new-field'];

  function openDue(d) {
    const body = document.createElement('div');

      <div class="proto-field" data-time-wrap style="${mode === 'time' ? '' : 'display:none'}"><label>时间</label><input type="time" class="proto-input" id="nf-due-time" value="${P.esc(d.dueTime || '18:00')}"></div>
      <div class="proto-note">截止不是时间占用；它只表示这件事什么时候必须完成。只写日期时不会写入任何时刻。</div>`;
    const saved = snap(d, ['due', 'dueTime']);
    const scrim = modal({ title: '截止', body, actions: [
      { label: '取消', onClick: () => { restore(d, saved); render(); } },
      { label: '清除', onClick: () => { d.due = ''; d.dueTime = ''; render(); toast('已清除截止'); } },
      { label: '应用', primary: true, onClick: () => {

  }

  function openEventTime(d) {
    const body = document.createElement('div');
    body.innerHTML = `<div class="proto-check"><input type="checkbox" id="nf-allday" ${d.allDay ? 'checked' : ''}><label for="nf-allday">全天（可跨日）</label></div>
      <div class="proto-field"><label>开始日期</label><button type="button" class="proto-input" data-proto-action="composer-start-date" style="text-align:left">${P.esc(d.date)}</button></div>
      <div class="proto-field" data-end-date style="${d.allDay && d.endDate ? '' : 'display:none'}"><label>结束日期</label><button type="button" class="proto-input" data-proto-action="composer-end-date" style="text-align:left">${P.esc(d.endDate || d.date)}</button></div>
      <div class="proto-inline-row" data-time-row style="${d.allDay ? 'display:none' : ''}"><div class="proto-field" style="flex:1"><label>开始</label><input type="time" class="proto-input" id="nf-start" value="${P.esc(d.start)}"></div><div class="proto-field" style="flex:1"><label>结束</label><input type="time" class="proto-input" id="nf-end" value="${P.esc(d.end)}"></div></div>
      <div class="proto-note">全天条目不写具体时刻；跨日时结束日期必须晚于开始日期。</div>`;
    const saved = snap(d, ['allDay', 'date', 'endDate', 'start', 'end']);
    const scrim = modal({ title: '时间', body, actions: [

      { label: '应用', primary: true, onClick: () => {

        d.start = q('#nf-start', body).value || '11:00';

        if (d.allDay && d.endDate && d.endDate < d.date) { toast('结束日期不能早于开始'); return true; }
        render(); toast('时间已更新');
      } },
    ] });
    guardScrim(scrim, () => { restore(d, saved); render(); });
    body.addEventListener('click', (e) => {
      if (e.target.id === 'nf-allday') {

        q('[data-time-row]', body).style.display = on ? 'none' : '';
        q('[data-end-date]', body).style.display = on ? '' : 'none';
      }
      if (e.target.closest('[data-proto-action="composer-start-date"]')) {

  registerAction('new-field', (el) => {

  /* ---------------- composer save: one priority scale, no phantom dueTime ---------------- */
  registerAction('new-save', () => {

      } else { event.date = d.date; event.start = d.start; event.end = d.end; }
      EVENTS.push(event);
      state.deletedEvents = state.deletedEvents.filter((x) => x !== event.id);
      P.data.newDraft = null;
      P.baseGo('cal-day');

    }
    const todo = {
      id: 'local-' + (++state.localNo), title, cal: d.cal || state.defaultCal || 'personal',
      priority: priorityValue(d.priority),
      tags: (d.tags || []).slice(), note: '', subtasks: [], status: 'open',
      repeat: d.repeat || '', repeatEnd: d.repeatEnd || '',
      repeatUntil: d.repeatUntil || '', repeatCount: d.repeatCount || 0,
    };
