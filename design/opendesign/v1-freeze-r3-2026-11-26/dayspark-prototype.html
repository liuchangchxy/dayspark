    if (d.plan) todo.plan = d.plan;
    if (d.remind && d.remind !== '不提醒') todo.remind = d.remind;
    TODOS.unshift(todo);
    P.data.newDraft = null;
    P.baseGo('todo-inbox');
    P.syncHash(true);
    toast('已记下待办');
  });

  /* ---------------- priority markers + "high floats up" in todo lists ---------------- */
  function rank(v) { return { 1: 0, 5: 1, 9: 2, 0: 3 }[Number(v)] == null ? 2 : ({ 1: 0, 5: 1, 9: 2, 0: 3 }[Number(v)]); }
  function runsAfter(head) {
    const rows = [];
    let n = head.nextElementSibling;
    while (n && n.classList && n.classList.contains('todo-row')) { rows.push(n); n = n.nextElementSibling; }
    return rows;
  }
  registerEnhancer((root) => {
    if (!/^todo-(inbox|all|date)$/.test(state.screen)) return;
    qa('.todo-row', root).forEach((row) => {
      const t = todoById(row.dataset.id);
      if (!t) return;
      const v = Number(t.priority) || 0;
      row.dataset.priority = String(v);
      const side = q('.todo-side', row);
      if (!side) return;
      let badge = q('.prio-badge', side);
      const lab = priorityLabel(v);
      const show = lab === '高' || lab === '低';
      if (!show) { if (badge) badge.remove(); return; }
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'prio-badge';
        side.insertBefore(badge, side.firstChild);
      }
      badge.textContent = lab;
      badge.title = '优先级 ' + lab;
      badge.style.cssText = lab === '高'
        ? 'font-size:9px;line-height:1;padding:3px 5px;border-radius:4px;background:var(--ink);color:#fff;margin-right:2px;flex:none'
        : 'font-size:9px;line-height:1;padding:3px 5px;border-radius:4px;border:1px solid var(--hair-2);color:var(--muted);margin-right:2px;flex:none';
    });
    qa('.group-head', root).forEach((head) => {
      const rows = runsAfter(head);
      if (rows.length < 2) return;
      const sorted = rows.slice().sort((a, b) => rank(a.dataset.priority) - rank(b.dataset.priority));
      if (sorted.every((r, i) => r === rows[i])) return;
      rows.forEach((r) => r.remove());
      let at = head;
      sorted.forEach((r) => { at.parentNode.insertBefore(r, at.nextSibling); at = r; });
    });
  });

  /* ---------------- quick add: real sentence parsing ---------------- */
  const CN = { 零: 0, 〇: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
  function cnNum(s) {
    s = String(s || '').trim();
    if (/^\d+$/.test(s)) return Number(s);
    if (s === '十') return 10;
    let m = /^十([一二两三四五六七八九])$/.exec(s);
    if (m) return 10 + CN[m[1]];
    m = /^([一二两三四五六七八九])十([一二两三四五六七八九])?$/.exec(s);
    if (m) return CN[m[1]] * 10 + (m[2] ? CN[m[2]] : 0);
    if (s.length === 1 && CN[s] != null) return CN[s];
    return NaN;
  }
  function dowOf(day) { return new Date(day + 'T00:00:00Z').getUTCDay(); } // 0 Sun … 6 Sat
  const WD_MAP = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 日: 0, 天: 0 };

  function parseQuickDate(text) {
    if (/大后天/.test(text)) return addDays(TODAY, 3);
    if (/后天/.test(text)) return addDays(TODAY, 2);
    if (/明天|明日/.test(text)) return addDays(TODAY, 1);
    if (/今天|今日/.test(text)) return TODAY;
    let m = /(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/.exec(text);
    if (m) {
      const y = Number(TODAY.slice(0, 4));
      return y + '-' + String(Number(m[1])).padStart(2, '0') + '-' + String(Number(m[2])).padStart(2, '0');
    }
    m = /(\d{4})\s*[\/\-]\s*(\d{1,2})\s*[\/\-]\s*(\d{1,2})/.exec(text);
    if (m) return m[1] + '-' + String(Number(m[2])).padStart(2, '0') + '-' + String(Number(m[3])).padStart(2, '0');
    m = /(?:^|[^\d])(\d{1,2})\s*[\/\-]\s*(\d{1,2})(?!\d)/.exec(text);
    if (m) {
      const y = Number(TODAY.slice(0, 4));
      return y + '-' + String(Number(m[1])).padStart(2, '0') + '-' + String(Number(m[2])).padStart(2, '0');
    }
    m = /下周([一二三四五六日天])?/.exec(text);
    if (m) {
      const dow = dowOf(TODAY);
      const nextMon = addDays(TODAY, ((8 - dow) % 7) || 7);
      if (!m[1]) return nextMon;
      return addDays(nextMon, WD_MAP[m[1]] === 0 ? 6 : WD_MAP[m[1]] - 1);
    }
    m = /(?:周|星期|礼拜)([一二三四五六日天])/.exec(text);
    if (m) {
      const target = WD_MAP[m[1]];
      const dow = dowOf(TODAY);
      const delta = (target - dow + 7) % 7;
      return addDays(TODAY, delta);
    }
    return '';
  }

  function applyPeriod(hour, period) {
    if (!period) return hour;
    if (period === '凌晨' || period === '早上' || period === '早晨' || period === '上午') return hour === 12 ? 0 : hour;
    if (period === '中午') return hour < 11 ? hour + 12 : hour;
    if (period === '下午' || period === '傍晚' || period === '晚上' || period === '夜里' || period === '夜晚') return hour < 12 ? hour + 12 : hour;
    return hour;
  }

  function parseQuickTime(text) {
    const periodRe = '(凌晨|早上|早晨|上午|中午|下午|傍晚|晚上|夜里|夜晚)';
    let m = new RegExp(periodRe + '?\\s*(\\d{1,2})\\s*[:：]\\s*(\\d{2})').exec(text);
    if (m) {
      let h = Number(m[2]); const mi = Number(m[3]);
      h = applyPeriod(h, m[1]);
      if (h >= 0 && h <= 23 && mi >= 0 && mi <= 59) return { hour: h, minute: mi };
    }
    m = new RegExp(periodRe + '?\\s*(\\d{1,2}|[零〇一二两三四五六七八九十]{1,3})\\s*[点时](?:(半|一刻|三刻)|(\\d{1,2})\\s*分?|([零〇一二两三四五六七八九十]{1,3})\\s*分?)?').exec(text);
    if (!m) return null;
    let h = cnNum(m[2]);
    if (!Number.isFinite(h)) return null;
    let mi = 0;
    if (m[3] === '半') mi = 30;
    else if (m[3] === '一刻') mi = 15;
    else if (m[3] === '三刻') mi = 45;
    else if (m[4]) mi = Number(m[4]);
    else if (m[5]) mi = cnNum(m[5]);
    if (!Number.isFinite(mi)) mi = 0;
    h = applyPeriod(h, m[1]);
    if (h < 0 || h > 23 || mi < 0 || mi > 59) return null;
    return { hour: h, minute: mi };
  }

  function quickDuration(text) {
    if (/半小时|30\s*分钟/.test(text)) return 30;
    const m = /(\d{1,2}|[一二两三四五六七八九十])\s*个?\s*小时/.exec(text);
    if (m) { const n = cnNum(m[1]); if (n > 0 && n <= 8) return n * 60; }
    return 60;
  }

  function parseQuickSentence(text) {
    const raw = String(text || '');
    const date = parseQuickDate(raw) || '';
    const time = parseQuickTime(raw);
    if (!time) return { date, time: null, start: '', end: '', plan: null };
    const start = String(time.hour).padStart(2, '0') + ':' + String(time.minute).padStart(2, '0');
    const total = time.hour * 60 + time.minute + quickDuration(raw);
    const eh = Math.min(23, Math.floor(total / 60)); const em = total % 60;
    const end = String(eh).padStart(2, '0') + ':' + String(em).padStart(2, '0');
    return { date: date || TODAY, time, start, end, plan: { date: date || TODAY, start, end } };
  }
  P.parseQuickSentence = parseQuickSentence;

  P.quickAdd = function quickAdd() {
    const body = document.createElement('div');
    body.innerHTML = `<div class="proto-field"><label>一句话</label><input class="proto-input" id="qa-title" placeholder="明天下午三点交报告"></div>
      <div class="qa-suggest-wrap" id="qa-suggest"></div>
      <div class="proto-field"><label>保存为</label><select class="proto-input" id="qa-type"><option value="todo">待办 · 默认</option><option value="event">日程</option></select></div>
      <div class="proto-note">识别到的时间只是建议：待办写为“计划执行”，日程写为开始/结束；没有识别到时间就只记标题，不写日期、计划或截止。</div>`;
    let removed = false;
    let lastParsed = null;
    const input = q('#qa-title', body);
    const sugg = q('#qa-suggest', body);

    function paintSuggestion() {
      const parsed = parseQuickSentence(input.value);
      lastParsed = parsed;
      const dayLabel = parsed.time ? (parsed.date === TODAY ? '今天' : P.dateMD ? P.dateMD(parsed.date) : parsed.date) : '';
      if (!parsed.time) {
        removed = false;
        sugg.innerHTML = input.value.trim()
          ? `<div class="proto-note" style="margin-top:-2px">没有识别到时间；保存后只记标题，无日期、无计划、无截止。</div>`
          : '';
        return;
      }
      if (removed) {
        sugg.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin:4px 0 8px;padding:8px 10px;border:1px dashed var(--hair-2);border-radius:8px;background:#fbfaf6"><span>⏱</span><div style="flex:1;min-width:0"><b style="display:block;font-size:11px">时间建议已移除</b><small style="color:var(--faint);font-size:10px">保存后只记标题；无日期、无计划、无截止。</small></div><button type="button" class="proto-btn" data-qa-restore>恢复</button></div>`;
        return;
      }
      const isEvent = q('#qa-type', body).value === 'event';
      sugg.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin:4px 0 8px;padding:8px 10px;border:1px solid var(--hair-2);border-radius:8px;background:#fbfaf6"><span>⏱</span><div style="flex:1;min-width:0"><b style="display:block;font-size:11px">${dayLabel} ${parsed.start}–${parsed.end} · ${isEvent ? '日程安排' : '建议安排'}</b><small style="color:var(--faint);font-size:10px">${isEvent ? '保存后直接写入日历。' : '保存后写为“计划执行”。'}可以移除。</small></div><button type="button" class="proto-btn" data-qa-remove>移除</button></div>`;
    }

    input.addEventListener('input', () => { removed = false; paintSuggestion(); });
    q('#qa-type', body).addEventListener('change', paintSuggestion);
    sugg.addEventListener('click', (e) => {
      if (e.target.closest('[data-qa-remove]')) { removed = true; paintSuggestion(); }
      if (e.target.closest('[data-qa-restore]')) { removed = false; paintSuggestion(); }
    });
    paintSuggestion();

    modal({
      title: '快速添加',
      body,
      actions: [
        { label: '取消' },
        { label: '保存', primary: true, onClick: (root) => {
          const raw = (q('#qa-title', root).value || '').trim();
          if (!raw) { q('#qa-title', root).focus(); return true; }
          const isEvent = q('#qa-type', root).value === 'event';
          const parsed = parseQuickSentence(raw);
          const useTime = !removed && !!parsed.time;
          const cal = state.defaultCal || 'personal';
          if (isEvent) {
            const id = 'quick-' + Date.now();
            if (useTime) {
              EVENTS.push({ id, title: raw, cal, date: parsed.date, start: parsed.start, end: parsed.end, remind: '15 分钟前' });
            } else {
              EVENTS.push({ id, title: raw, cal, date: parsed.date || TODAY, allDay: true, remind: '' });
            }
            P.baseGo('cal-day');
            P.syncHash(true);
            toast(useTime ? '已创建日程 · ' + parsed.start + '–' + parsed.end : '已创建日程 · 全天');
          } else {
            const todo = { id: 'quick-' + Date.now(), title: raw, cal, priority: priorityValue('中'), tags: [], status: 'open' };
            if (useTime) todo.plan = { date: parsed.date, start: parsed.start, end: parsed.end };
            TODOS.unshift(todo);
            P.baseGo('todo-inbox');
            P.syncHash(true);
            toast(useTime ? '已记下待办 · ' + parsed.start + ' 计划' : '已记下待办 · 未安排');
          }
        } },
      ],
    });
  };
})();


/* DaySpark prototype v3 — data integrity layer.
   Round 3: trash is really permanent, restore keeps skipped instances, ICS
   round-trips full fields (time / end / cross-midnight / recurrence), and
   localStorage failures become a visible, retryable banner. */
(function () {
  'use strict';
  const P = window.Proto;
  const registerAction = P.registerAction;
  const registerEnhancer = P.registerEnhancer;
  const modal = P.modal;
  const toast = P.toast;
  const q = (s, r) => (r || document).querySelector(s);
  const qa = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = P.esc || ((s) => String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])));
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const TODAY_ISO = () => (typeof TODAY !== 'undefined' ? TODAY : '2026-11-20');

  /* ------------------------------------------------------------------ *
   * 1. Persistence guard: every host render asks Proto.save(), which is
   *    debounced here. We write + read back a probe key, and on failure
   *    show a real banner with a retry that saves again. This replaces the
   *    silent catch in host.js without editing it.
   * ------------------------------------------------------------------ */
  const KEY = 'dayspark.prototype.v1';
  const PROBE = 'dayspark.prototype.probe';
  let persistTimer = 0;
  let persistBanner = null;

  function emitPersistError(err) {
    const hook = P.onPersistError;
    if (typeof hook === 'function') { try { hook(err); } catch (_) {} }
    else if (Array.isArray(hook)) hook.forEach((fn) => { try { fn(err); } catch (_) {} });
  }

  function hidePersistBanner() {
    if (persistBanner && persistBanner.parentNode) persistBanner.parentNode.removeChild(persistBanner);
    persistBanner = null;
  }

  function showPersistBanner() {
    if (persistBanner && document.body.contains(persistBanner)) return;
    persistBanner = document.createElement('div');
    persistBanner.id = 'proto-persist-banner';
    persistBanner.setAttribute('role', 'alert');
    persistBanner.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;' +
      'display:flex;align-items:center;gap:12px;max-width:92vw;padding:10px 14px;border-radius:10px;' +
      'background:#3a1d1d;color:#fff;border:1px solid #b35050;box-shadow:0 8px 30px rgba(0,0,0,.28);font-size:13px;line-height:1.4';
    persistBanner.innerHTML = '<span>本地保存失败 · 改动只在这个标签页，刷新会丢</span>' +
      '<button type="button" id="proto-persist-retry" style="flex:none;padding:5px 12px;border-radius:6px;border:1px solid #f0b4b4;background:transparent;color:#fff;font-size:12px;cursor:pointer">重试</button>';
    document.body.appendChild(persistBanner);
    const btn = q('#proto-persist-retry', persistBanner);
    if (btn) btn.addEventListener('click', () => {
      const ok = saveNow();
      if (ok) toast('已重新保存到本机');
      else toast('仍然保存失败 · 本地存储不可写');
    });
  }

  function saveNow() {
    let ok = false, err = null;
    try {
      localStorage.setItem(KEY, JSON.stringify(P.snapshot()));
      const token = String(Date.now()) + '.' + Math.random().toString(36).slice(2);
      localStorage.setItem(PROBE, token);
      if (localStorage.getItem(PROBE) !== token) throw new Error('probe read-back mismatch');
      ok = true;
    } catch (e) {
      err = e;
    }
    if (ok) { hidePersistBanner(); }
    else { showPersistBanner(); emitPersistError(err); }
    return ok;
  }

  P.save = function save() {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(saveNow, 40);
  };
  P.persistNow = saveNow;
  P.onPersistError = null;

  /* ------------------------------------------------------------------ *
   * 2. Trash helpers — snapshots and permanent ids.
   * ------------------------------------------------------------------ */
  function allTrashItems() {
    return (typeof trashItems === 'function' ? trashItems() : []).slice();
  }

  function snapFor(id) {
    const extra = (state.trashExtra || []).find((x) => x.id === id);
    if (extra && extra.snap) return extra.snap;
    const base = allTrashItems().find((x) => x.id === id);
    return base && base.snap;
  }

  function markTrashRemoved(ids) {
    state.trashRemoved = state.trashRemoved || [];
    ids.forEach((id) => {
      if (String(id).indexOf('trash-') === 0 && !state.trashRemoved.includes(id)) state.trashRemoved.push(id);
    });
  }

  function rememberPurged(ids) {
    state.purgedIds = state.purgedIds || [];
    ids.forEach((id) => { if (id && !state.purgedIds.includes(id)) state.purgedIds.push(id); });
  }

  function dropRows(list, ids) {
    for (let i = list.length - 1; i >= 0; i--) {
      if (ids.has(list[i].id)) list.splice(i, 1);
    }
  }

  // Permanently remove the records behind every trash row. Pre-seeded rows are
  // static design data: marking them in trashRemoved is their permanent delete.
  function clearTrashForReal() {
    const items = allTrashItems();
    const ids = new Set();
    items.forEach((x) => ids.add(x.id));
    (state.deletedTodos || []).forEach((id) => ids.add(id));
    (state.deletedEvents || []).forEach((id) => ids.add(id));

    const baseIds = new Set(items.filter((x) => String(x.id).indexOf('trash-') === 0).map((x) => x.id));
    markTrashRemoved(baseIds);
    // Also clear any static ids that were already hidden one by one.
    markTrashRemoved(ids);

    const realIds = new Set();
    ids.forEach((id) => { if (String(id).indexOf('trash-') !== 0) realIds.add(id); });
    rememberPurged(ids);

    dropRows(TODOS, realIds);
    if (Array.isArray(state.localTodos)) dropRows(state.localTodos, realIds);
    dropRows(EVENTS, realIds);

    state.deletedTodos = [];
    state.deletedEvents = [];
    state.trashExtra = [];
    // The standalone design-only trash page uses titles as its hide list.
    P.data.hiddenTrash = items.map((x) => (x.title || '').trim()).filter(Boolean);
  }

  function confirmClearTrash(where) {
    modal({
      title: '清空回收站？',
      body: '<div class="proto-note">回收站里的所有项目会被永久删除，不能撤销。待办与日程本身也会从本地存储移除。</div>',
      actions: [
        { label: '取消' },
        { label: '清空', primary: true, danger: true, onClick: () => {
          clearTrashForReal();
          state.variant = where === 'standalone' ? 'empty' : 'cleared';
          render();
          toast('回收站已清空 · 底层记录已移除');
        } },
      ],
    });
  }

  // Both the settings page and the standalone trash page funnel here.
  registerAction('trash-clear-v2', () => confirmClearTrash('settings'));
  registerAction('trash-clear-proto', () => confirmClearTrash('standalone'));

  // Permanent delete of a single trash row drops the underlying record too,
  // so it cannot survive in localStorage and come back.
  registerAction('trash-delete-v2', (el) => {
    const id = el && el.dataset ? el.dataset.id : '';
    if (!id) return;
    const item = allTrashItems().find((x) => x.id === id) || { title: '这一项' };
    modal({
      title: '永久删除？',
      body: '<div class="proto-note">不会进回收站，也不能撤销。</div>',
      actions: [
        { label: '取消' },
        { label: '永久删除', primary: true, danger: true, onClick: () => {
          state.trashExtra = (state.trashExtra || []).filter((x) => x.id !== id);
          state.deletedTodos = (state.deletedTodos || []).filter((x) => x !== id);
          state.deletedEvents = (state.deletedEvents || []).filter((x) => x !== id);
          if (String(id).indexOf('trash-') === 0) markTrashRemoved([id]);
          rememberPurged([id]);
          const hit = new Set([id]);
          dropRows(TODOS, hit);
          if (Array.isArray(state.localTodos)) dropRows(state.localTodos, hit);
          dropRows(EVENTS, hit);
          render();
          toast('已永久删除 · ' + item.title);
        } },
      ],
    });
  });

  // Mobile settings rows use data-action only; wire them to the same handlers.
  registerEnhancer((root) => {
    if (state.screen !== 'settings-trash' && state.screen !== 'trash-page') return;
    qa('[data-action="trash-restore"]', root).forEach((b) => {
      if (b.dataset.protoAction === 'trash-restore-v2') return;
      b.dataset.protoAction = 'trash-restore-v2';
    });
    qa('[data-action="trash-delete"]', root).forEach((b) => { b.dataset.protoAction = 'trash-delete-v2'; });
    qa('[data-action="trash-clear"]', root).forEach((b) => { b.dataset.protoAction = 'trash-clear-v2'; });
  });

  /* ------------------------------------------------------------------ *
   * 2b. Deleting from the detail drawer must leave a real snapshot so
   *     "restore" brings the whole object back (the master path only
   *     pushed id + title). We listen in the capture phase before the
   *     master's own confirm-delete handler runs.
   * ------------------------------------------------------------------ */
  document.addEventListener('click', (e) => {
    const el = e.target.closest && e.target.closest('[data-action="confirm-delete"]');
    if (!el) return;
    const ref = state.deleteRef || state.drawer ||
      (typeof activeDetailRef === 'function' ? activeDetailRef() : null);
    if (!ref || !ref.id) return;
    const list = ref.type === 'event' ? EVENTS : TODOS.concat(state.localTodos || []);
    const src = list.find((x) => x.id === ref.id);
    if (!src) return;
    // Defer so the master handler records deletedTodos/deletedEvents first,
    // then patch the row it just pushed with the full pre-delete snapshot.
    setTimeout(() => {
      const row = (state.trashExtra || []).find((x) => x.id === ref.id);
      if (!row) return;
      if (!row.snap) row.snap = clone(src);
    }, 0);
  }, true);

  /* ------------------------------------------------------------------ *
   * 3. Real restore: full snapshot, no skipped keys touched, pre-seeded
   *    rows removed from the list for good.
   * ------------------------------------------------------------------ */
  registerAction('trash-restore-v2', (el) => {
    const id = el && el.dataset ? el.dataset.id : '';
    if (!id) return;
    const snap = snapFor(id);
    if (!snap) {
      modal({
        title: '这一项没有可恢复的原件',
        body: '<div class="proto-note">这条记录是在设计状态里预置的示例，没有保存原日历、标签和字段。恢复会创建一条只有标题的待办，并放进默认日历。</div>',
        actions: [
          { label: '取消' },
          { label: '仍然恢复为纯标题', onClick: () => {
            const row = el.closest('.trash-row, .m-settings-row');
            const title = ((q('.trash-main > div', row) || q('span', row) || {}).textContent || '恢复的待办').trim();
            state.trashExtra = (state.trashExtra || []).filter((x) => x.id !== id);
            if (String(id).indexOf('trash-') === 0) markTrashRemoved([id]);
            TODOS.unshift({ id: 'restored-' + Date.now(), title, cal: state.defaultCal || 'personal', priority: 0, tags: [], status: 'open' });
            render();
            toast('已恢复为纯标题 · ' + calOf(state.defaultCal || 'personal').name);
          } },
        ],
      });
      return;
    }
    state.deletedTodos = (state.deletedTodos || []).filter((x) => x !== id);
    state.deletedEvents = (state.deletedEvents || []).filter((x) => x !== id);
    state.trashExtra = (state.trashExtra || []).filter((x) => x.id !== id);
    // Pre-seeded rows are served from the static trash list; remember that the
    // row is gone so it cannot reappear after this render or a reload.
    if (String(id).indexOf('trash-') === 0) markTrashRemoved([id]);

    // NOTE: state.skipped is deliberately left untouched. Deleting one
    // occurrence (仅这一次) must stay hidden when the series is restored.
    const isEvent = !!(snap.start || snap.startDate || (snap.allDay && snap.date && !snap.status));
    const list = isEvent ? EVENTS : TODOS;
    const copy = clone(snap);
    const existing = list.find((x) => x.id === copy.id);
    if (existing) {
      Object.keys(existing).forEach((k) => { delete existing[k]; });
      Object.assign(existing, copy);
    } else if (isEvent) {
      EVENTS.push(copy);
    } else {
      TODOS.unshift(copy);
    }
    const backTo = snap.cal && typeof calOf === 'function' ? calOf(snap.cal).name : '原日历';
    state.drawer = isEvent ? { type: 'event', id: snap.id } : { type: 'todo', id: snap.id };
    state.drawerEdit = false;
    render();
    toast('已恢复 · 回到「' + backTo + '」· 原字段保留');
  });

  /* ------------------------------------------------------------------ *
   * 4. ICS export: full VEVENT / VTODO, CRLF folding, re-importable.
   * ------------------------------------------------------------------ */
  function pad2(n) { return String(n).padStart(2, '0'); }
  function compactDate(iso) { return String(iso || '').replace(/-/g, ''); }
  function stamp(iso, time) { return compactDate(iso) + 'T' + String(time || '09:00').replace(/:/g, '') + '00'; }
  function unescapeIcs(v) {
    return String(v == null ? '' : v)
      .replace(/\\n/gi, '\n')
      .replace(/\\,/g, ',')
      .replace(/\\;/g, ';')
      .replace(/\\\\/g, '\\');
  }
  function escapeIcs(v) {
    return String(v == null ? '' : v)
      .replace(/\\/g, '\\\\')
      .replace(/\r?\n/g, '\\n')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,');
  }
  function utf8Len(ch) {
    const cp = ch.codePointAt(0);
    if (cp <= 0x7f) return 1;
    if (cp <= 0x7ff) return 2;
    if (cp <= 0xffff) return 3;
    return 4;
  }
  // RFC 5545 §3.1: fold logical lines at 75 octets, continuation starts with space.
  function foldLine(line) {
    const out = [];
    let cur = '';
    let bytes = 0;
    for (const ch of String(line)) {
      const b = utf8Len(ch);
      const limit = out.length ? 74 : 75;
      if (bytes + b > limit) { out.push(cur); cur = ''; bytes = 0; }
      cur += ch; bytes += b;
    }
    out.push(cur);
    return out.join('\r\n ');
  }
  const BYDAY = { 日: 'SU', 一: 'MO', 二: 'TU', 三: 'WE', 四: 'TH', 五: 'FR', 六: 'SA' };
  function rruleFor(item) {
    const repeat = String(item.repeat || '');
    if (!repeat) return '';
    let rule = '';
    const prefix = /^(每\s?2\s?周|每周)/.exec(repeat);
    const dayCodes = () => {
      if (!prefix) return '';
      return repeat.slice(prefix[0].length).split(/[、,，]/).map((t) => BYDAY[t.trim().slice(-1)]).filter(Boolean).join(',');
    };
    if (/^每天/.test(repeat)) rule = 'FREQ=DAILY';
    else if (/^每\s?2\s?周/.test(repeat)) rule = 'FREQ=WEEKLY;INTERVAL=2' + (dayCodes() ? ';BYDAY=' + dayCodes() : '');
    else if (/^每周/.test(repeat)) rule = 'FREQ=WEEKLY' + (dayCodes() ? ';BYDAY=' + dayCodes() : '');
    else if (/^每月/.test(repeat)) rule = 'FREQ=MONTHLY';
    else if (/^每年/.test(repeat)) rule = 'FREQ=YEARLY';
    if (!rule) return '';
    if (item.repeatUntil) rule += ';UNTIL=' + compactDate(item.repeatUntil);
    else if (item.repeatCount) rule += ';COUNT=' + Number(item.repeatCount);
    return 'RRULE:' + rule;
  }

  function eventLines(e) {
    const lines = ['BEGIN:VEVENT', 'UID:' + String(e.id || 'event'), 'SUMMARY:' + escapeIcs(e.title)];
    const timedCross = !!e.crossMidnight || !!(e.startDate && e.endDate && e.start && e.end && !e.allDay);
    const allDayish = !timedCross && (e.allDay || (!e.start && !e.end));
    const startDay = e.startDate || e.date || TODAY_ISO();
    const endDay = e.endDate || e.date || startDay;
    if (timedCross) {
      lines.push('DTSTART:' + stamp(startDay, e.start || '09:00'));
      lines.push('DTEND:' + stamp(endDay, e.end || '10:00'));
    } else if (allDayish) {
      lines.push('DTSTART;VALUE=DATE:' + compactDate(startDay));
      // ICS DTEND for all-day is exclusive; internal endDate is inclusive.
      lines.push('DTEND;VALUE=DATE:' + compactDate(addDays(endDay, 1)));
    } else {
      lines.push('DTSTART:' + stamp(startDay, e.start || '09:00'));
      lines.push('DTEND:' + stamp(startDay, e.end || '10:00'));
    }
    if (e.loc) lines.push('LOCATION:' + escapeIcs(e.loc));
    if (e.note) lines.push('DESCRIPTION:' + escapeIcs(e.note));
    const rr = rruleFor(e);
    if (rr) lines.push(rr);
    lines.push('END:VEVENT');
    return lines;
  }

  function todoLines(t) {
    const lines = ['BEGIN:VTODO', 'UID:' + String(t.id || 'todo'), 'SUMMARY:' + escapeIcs(t.title)];
    if (t.due) {
      if (t.dueTime) lines.push('DUE:' + stamp(t.due, t.dueTime));
      else lines.push('DUE;VALUE=DATE:' + compactDate(t.due));
    }
    if (t.note) lines.push('DESCRIPTION:' + escapeIcs(t.note));
    const rr = rruleFor(t);
    if (rr) lines.push(rr);
    lines.push('END:VTODO');
    return lines;
  }

  function buildICS() {
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//DaySpark//Prototype//CN', 'CALSCALE:GREGORIAN'];
    const events = EVENTS.filter((e) => !state.deletedEvents.includes(e.id));
    events.forEach((e) => { eventLines(e).forEach((l) => lines.push(l)); });
    const todos = (typeof allTodos === 'function' ? allTodos() : TODOS).filter((t) => !state.deletedTodos.includes(t.id));
    todos.forEach((t) => { todoLines(t).forEach((l) => lines.push(l)); });
    lines.push('END:VCALENDAR');
    return lines.map(foldLine).join('\r\n') + '\r\n';
  }
  P.buildICS = buildICS;

  function downloadText(name, text, type) {
    try {
      const blob = new Blob([text], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (_) { /* download is a side effect; the file content is already built */ }
  }

  registerAction('export-ics', () => {
    const text = buildICS();
    const events = EVENTS.filter((e) => !state.deletedEvents.includes(e.id)).length;
    const todos = (typeof allTodos === 'function' ? allTodos() : TODOS).filter((t) => !state.deletedTodos.includes(t.id)).length;
    downloadText('dayspark-' + TODAY_ISO() + '.ics', text, 'text/calendar;charset=utf-8');
    toast('已导出 .ics · ' + (events + todos) + ' 项 · 含时间与重复');
  });

  /* ------------------------------------------------------------------ *
   * 5. Composer (new-event page): let "时间" express a next-day end and
   *    post-process the saved event into the two-day cross-midnight span.
   * ------------------------------------------------------------------ */
  function ensureDraft() {
    if (!P.data.newDraft) {
      P.data.newDraft = {
        cal: state.defaultCal || 'personal', date: TODAY_ISO(), start: '11:00', end: '12:00',
        allDay: false, endDate: '', loc: '', repeat: '', repeatEnd: '永不结束',
        remind: state.screen === 'new-event' ? '15 分钟前' : '不提醒',
        priority: '中', due: '', dueTime: '', plan: null, tags: [],
      };
    }
    return P.data.newDraft;
  }

  const prevNewField = P.actions['new-field'];
  registerAction('new-field', (el) => {
    const label = el && el.dataset ? (el.dataset.field || '') : '';
    if (label !== '时间') {
      if (typeof prevNewField === 'function') return prevNewField(el);
      return;
    }
    const d = ensureDraft();
    if (!d.date) d.date = TODAY_ISO();
    const body = document.createElement('div');
    body.innerHTML = `<div class="proto-check"><input type="checkbox" id="v3-allday" ${d.allDay ? 'checked' : ''}><label for="v3-allday">全天（可跨日）</label></div>
      <div class="proto-field"><label>开始日期</label><button type="button" class="proto-input" id="v3-sdate" style="text-align:left">${esc(d.date)}</button></div>
      <div class="proto-field" id="v3-edate-wrap" style="${d.allDay ? '' : 'display:none'}"><label>结束日期</label><button type="button" class="proto-input" id="v3-edate" style="text-align:left">${esc(d.endDate || d.date)}</button></div>
      <div class="proto-inline-row" id="v3-times" style="${d.allDay ? 'display:none' : ''}"><div class="proto-field" style="flex:1"><label>开始</label><input type="time" class="proto-input" id="v3-start" value="${esc(d.start || '11:00')}"></div><div class="proto-field" style="flex:1"><label>结束</label><input type="time" class="proto-input" id="v3-end" value="${esc(d.end || '12:00')}"></div></div>
      <div class="proto-note">结束早于开始 = 次日结束（跨午夜，例如 23:30 → 01:30）。全天条目不写具体时刻。</div>`;
    modal({
      title: '时间', body,
      actions: [
        { label: '取消' },
        { label: '应用', primary: true, onClick: () => {
          d.allDay = q('#v3-allday', body).checked;
          d.start = q('#v3-start', body).value || '11:00';
          d.end = q('#v3-end', body).value || '12:00';
          if (!d.allDay && d.end === d.start) { toast('开始和结束不能相同'); return true; }
          if (d.allDay && d.endDate && d.endDate < d.date) { toast('结束日期不能早于开始'); return true; }
          render();
          toast(!d.allDay && d.end < d.start ? '时间已更新 · 次日结束' : '时间已更新');
        } },
      ],
    });
    body.addEventListener('click', (e) => {
      if (e.target.id === 'v3-allday') {
        const on = e.target.checked;
        q('#v3-times', body).style.display = on ? 'none' : '';
        q('#v3-edate-wrap', body).style.display = on ? '' : 'none';
      }
      const sd = e.target.closest('#v3-sdate');
      if (sd) {
        P.openDatePicker({ value: d.date, onPick: (v) => { d.date = v || TODAY_ISO(); sd.textContent = d.date; } });
      }
      const ed = e.target.closest('#v3-edate');
      if (ed) {
        P.openDatePicker({ value: d.endDate || d.date, onPick: (v) => { d.endDate = v || d.date; ed.textContent = d.endDate; } });
      }
    });
  });

  const prevNewSave = P.actions['new-save'];
  registerAction('new-save', () => {
    const d = P.data.newDraft;
    const isEvent = state.screen === 'new-event';
    const cross = !!(isEvent && d && !d.allDay && d.start && d.end && d.end < d.start);
    if (!cross) {
      if (typeof prevNewSave === 'function') return prevNewSave();
      return;
    }
    const before = EVENTS.length;
    const beforeIds = EVENTS.map((e) => e.id).join('|');
    const titleInput = q('#new-title') || q('.new-page .form-input') || q('.m-detail-scroll .m-form-input');
    if (titleInput && !(titleInput.value || '').trim()) {
      // Let the base handler show the real validation state.
      return prevNewSave ? prevNewSave() : undefined;
    }
    if (typeof prevNewSave === 'function') prevNewSave();
    if (EVENTS.length <= before && EVENTS.map((e) => e.id).join('|') === beforeIds) return;
    const ev = EVENTS[EVENTS.length - 1];
    const day = ev.date || d.date || TODAY_ISO();
    ev.startDate = day;
    ev.endDate = addDays(day, 1);
    ev.crossMidnight = true;
    ev.allDay = false;

    const absCur = /^绝对/.test(cur) ? cur : '';
    body.innerHTML = `<div class="proto-list">${rows}</div>
      <div class="proto-field" style="margin-top:8px"><label>具体时间</label><button type="button" class="proto-input" data-remind-abs style="text-align:left">${absCur ? P.esc(absCur) : '选择一个具体时间…'}</button></div>
      <div class="proto-note">${hasAnchor ? '提醒锚定计划开始或截止；没有计划时相对截止。' : '还没有可锚定的时间：相对提醒需要先设置计划执行或带时刻的截止，现在只能选“不提醒”或一个具体时间。'}</div>`;
    const scrim = modal({ title: '提醒', body, actions: [{ label: '取消' }] });
    body.addEventListener('click', (e) => {
      const b = e.target.closest('[data-remind]');
      if (b && !b.disabled) {
        scrim.remove();
        opts.onPick(b.dataset.remind === '不提醒' ? '' : b.dataset.remind);
        return;
      }
      if (e.target.closest('[data-remind-abs]')) {
        P.openTimeOfDay({
          title: '指定提醒时间', value: absCur ? absCur.replace(/^绝对\s*·\s*/, '') : '09:00',
          onPick: (v) => {
            if (!v) return;
            scrim.remove();
            opts.onPick('绝对 · ' + v);
          },
        });
      }
    });
    return scrim;
  };

  registerAction('detail-remind-custom', () => {
    const d = contextDraft(); if (!d) return;
    const kind = contextKind();
    P.openReminderPicker({
      value: d.remind, hasAnchor: !!anchorOf(d, kind),
      onPick: (r) => { d.remind = r; render(); toast(r ? '提醒 · ' + r : '已关闭提醒'); },
    });
  });

  /* Detail native <select> must not offer relative reminders without an anchor. */
  registerEnhancer((root) => {
    const sel = q('select[data-mfield="remind"]', root);
    if (!sel) return;
    const d = contextDraft();
    if (!d) return;
    const kind = contextKind();
    const hasAnchor = !!anchorOf(d, kind);
    if (d.remind && /^绝对/.test(d.remind) && !Array.from(sel.options).some((o) => o.value === d.remind)) {
      const o = document.createElement('option');
      o.value = d.remind; o.textContent = d.remind;
      sel.appendChild(o);
    }
    Array.from(sel.options).forEach((o) => {
      const absolute = o.value === '不提醒' || /^绝对/.test(o.value);
      o.disabled = !absolute && !hasAnchor;
      if (o.disabled) o.title = '先设置计划执行或带时刻的截止';
      else o.removeAttribute('title');
    });
    const wrap = sel.closest('.v2-select-row') || sel.parentNode;
    let note = wrap.parentNode.querySelector('.v2-remind-note');
    if (!hasAnchor) {
      if (!note) {
        note = document.createElement('div');
        note.className = 'v2-remind-note proto-note';
        note.style.cssText = 'margin-top:4px;font-size:9px;color:var(--amber)';
        wrap.parentNode.insertBefore(note, wrap.nextSibling);
      }
      note.textContent = '还没有可锚定的时间；相对提醒已禁用。先设置计划执行或带时刻的截止，或选一个具体时间。';
    } else if (note) {
      note.remove();
    }
  });

  /* ---------------- plan selector opened from an editor: draft only ---------------- */
  document.addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('[data-action="plan-submit"]');
    if (!btn) return;
    // Only intercept when the plan picker was opened from an unsaved editor draft.
    if (!state.draftKey || !state.planReturnEdit || !state.draft) return;
    const ref = typeof draftRef === 'function' ? draftRef() : null;
    if (!ref || ref.type !== 'todo') return;
    const dateEl = document.getElementById('plan-date');
    const startEl = document.getElementById('plan-start');
    const endEl = document.getElementById('plan-end');
    const date = (dateEl && dateEl.value) || state.planDate || TODAY;
    const start = (startEl && startEl.value) || state.planStart || '15:15';
    const end = (endEl && endEl.value) || state.planEnd || '16:00';
    if (mins(end) <= mins(start)) { toast('结束时间必须晚于开始时间'); e.preventDefault(); e.stopPropagation(); return; }
    const d = state.draft;
    d.plan = { date, start, end };
    // Keep the draft's allocation list in the same projection without touching
    // the persisted todo. commitDraft() is what later writes it for real.
    if (Array.isArray(d.plans) && d.plans.length) {
      const p = d.plans.find((x) => x && x.state === 'active');
      if (p) { p.date = date; p.start = start; p.end = end; }
    }
    state.planAllocId = null;
    state.planOccurrence = null;
    if (typeof restorePlan === 'function') restorePlan();
    render();
    toast('已更新计划草稿 · ' + (P.dateShort ? P.dateShort(date) : date) + ' ' + start + '–' + end);
    e.preventDefault();
    e.stopPropagation();
  }, true);
})();


/* DaySpark prototype v3 — missed instances, instance entry points, and the
   second calendar-slot action (arrange an existing todo instead of creating
   an event). Semantics live in flows-v3-model.js (DS3); this file only adds
   entry points and the arrange flow. */
(function () {
  const P = window.Proto;
  const { registerAction, registerEnhancer, modal, toast } = P;
  const q = (s, r) => (r || document).querySelector(s);
  const qa = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const DS3 = window.DS3;

  /* ---------------- real missed counts ---------------- */
  // `t.missed` used to be a hand-written demo number. Now it is derived from
  // the series anchor + recorded completions/skips, so completing a missed
  // instance lowers the count and restoring it raises it again.
  const baseAllTodos = window.allTodos;
  window.allTodos = function () {
    const list = baseAllTodos();
    if (!DS3) return list;
    list.forEach((t) => {
      if (!t || !t.repeat || t.legacyRrule) return;
      t.missed = DS3.missedCount(t, 30);
    });
    return list;
  };

  function missedEntry(t) {
    const list = DS3.missedInstances(t, 30);
    if (!list.length) { toast('最近 30 天没有遗漏的实例'); return; }
    modal({
      title: '遗漏的实例 · ' + t.title,
      body: `<div class="proto-note" style="margin-top:0">${esc(t.repeat)} · 最近 30 天有 ${list.length} 次没有完成。它们仍然可以补完成，不会自动跳过。</div>`
        + `<div class="proto-list">${list.map((d) => `<div class="proto-list-row"><span class="grow">${d}<small>${weekday(d)} · 仍然待完成</small></span><button type="button" class="proto-btn" data-miss="${d}">完成这一次</button></div>`).join('')}</div>`,
      actions: [{ label: '关闭' }, { label: '查看全部实例', onClick: () => { P.showInstances && P.showInstances(t); } }],
    }).addEventListener('click', (e) => {
      const done = e.target.closest('[data-miss]');
      if (done) {
        DS3.toggleDone(t.id, done.dataset.miss);
        render(); toast('已完成 ' + done.dataset.miss + ' 这一次');
      }
    });
  }

  registerEnhancer((root) => {
    if (!root) return;
    // Any "已遗漏 N" in a row or drawer opens the missed-instance list.
    qa('.missed', root).forEach((el) => {
      if (el.dataset.protoAction) return;
      const row = el.closest('[data-id]');
      const id = (row && row.dataset.id) || (state.drawer && state.drawer.id);
      if (!id) return;
      el.dataset.protoAction = 'missed-open';
      el.dataset.id = id;
      el.style.cursor = 'pointer';
      el.title = '查看遗漏的实例';
    });
    // The demo "已遗漏" card completes the *latest missed* instance, never today.
    qa('.missed-card', root).forEach((card) => {
      const btn = q('[data-action="toggle-done"]', card);
      if (btn && !btn.dataset.v3miss) {
        const t = todoById(btn.dataset.id);
        const list = t ? DS3.missedInstances(t, 30) : [];
        btn.dataset.v3miss = '1';
        if (list.length) {
          btn.dataset.date = list[list.length - 1];
          btn.title = '只完成 ' + list[list.length - 1] + ' 这一次';
          btn.textContent = '完成这一次';
        }
      }
      if (!q('[data-missed-more]', card)) {
        const acts = q('.missed-card-actions', card);
        if (acts) {
          const b = document.createElement('button');
          b.type = 'button'; b.textContent = '更早遗漏';
          b.dataset.missedMore = '1';
          b.dataset.protoAction = 'missed-open';
          b.dataset.id = btn ? btn.dataset.id : '';
          acts.appendChild(b);
        }
      }
    });
  });

  registerAction('missed-open', (el) => {
    const t = todoById(el.dataset.id || (state.drawer && state.drawer.id) || '');
    if (!t) return;
    if (t.repeat) missedEntry(t);
    else toast('这项没有遗漏实例');
  });

  /* ---------------- calendar slot: create event OR arrange a todo ---------------- */
  // The slot click already opens the "新建日程" modal (flows-v2-calendar.js).
  // We add the second explicit action next to it, as the domain contract
  // requires (CalendarSlotSheet onCreateEvent + onScheduleTodo).
  new MutationObserver((muts) => {
    muts.forEach((m) => Array.from(m.addedNodes || []).forEach((n) => {
      if (!n || n.nodeType !== 1) return;
      const scrim = n.classList && n.classList.contains('proto-modal-scrim') ? n : q('.proto-modal-scrim', n);
      if (!scrim || q('[data-arrange]', scrim)) return;
      const head = q('.proto-modal-head span', scrim);
      if (!head || head.textContent.trim() !== '新建日程') return;
      const foot = q('.proto-modal-foot', scrim);
      if (!foot) return;
      const note = q('.proto-note', scrim);
      const day = ((note && note.textContent.match(/\d{4}-\d{2}-\d{2}/)) || [])[0] || state.selectedDate || TODAY;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'proto-btn'; b.textContent = '安排已有待办'; b.dataset.arrange = '1';
      b.addEventListener('click', () => {
        const start = (q('#qe-start', scrim) || {}).value || '09:00';
        const end = (q('#qe-end', scrim) || {}).value || '10:00';
        if (scrim._close) scrim._close(); else scrim.remove();
        openArrange(day, start, end);
      });
      const primary = q('.proto-btn.primary', foot);
      foot.insertBefore(b, primary || null);
    }));
  }).observe(document.body, { childList: true });

  function openArrange(day, start, end) {
    const todos = allTodos().filter((t) => !isDone(t) && !state.deletedTodos.includes(t.id));
    if (!todos.length) { toast('没有可安排的待办'); return; }
    const body = document.createElement('div');
    body.innerHTML = `<div class="proto-note" style="margin-top:0">${day} ${start}–${end} · 只写计划执行，不新建日程，也不改截止。</div>`
      + `<div class="proto-list">${todos.map((t) => `<button type="button" class="proto-list-row" data-arr="${esc(t.id)}"><span class="grow">${esc(t.title)}<small>${esc(calOf(t.cal).name)}${t.repeat ? ' · ' + esc(t.repeat) + ' · 需先选实例' : ''}</small></span></button>`).join('')}</div>`;
    const scrim = modal({ title: '安排待办 · ' + start + '–' + end, body, actions: [{ label: '取消' }] });
    body.addEventListener('click', (e) => {
      const b = e.target.closest('[data-arr]'); if (!b) return;
      const t = todoById(b.dataset.arr); if (!t) return;
      scrim.remove();
      if (!t.repeat) { toPlanPicker(t, null, day, start, end); return; }
      pickInstance(t, day, start, end);
    });
  }

  function pickInstance(t, day, start, end) {
    const list = DS3.instanceList(t, -30, 90).filter((x) => !x.done && !x.skipped);
    if (!list.length) {
      modal({ title: '没有可安排的实例', body: `<div class="proto-note">「${esc(t.title)}」在未来 90 天没有待完成的实例。</div>`, actions: [{ label: '关闭', primary: true }] });
      return;
    }
    // Prefer the occurrence that owns this slot day, then the nearest pending one.
    const exact = list.find((x) => x.date === day);
    const body = document.createElement('div');
    body.innerHTML = `<div class="proto-note" style="margin-top:0">重复待办的计划执行必须绑定这一次实例；只影响选中的这一次。</div>`
      + `<div class="proto-list">${list.map((x) => `<button type="button" class="proto-list-row" data-occ="${x.date}"><span class="grow">${x.date}<small>${weekday(x.date)}${x.date === day ? ' · 就是这个时间槽' : ''}</small></span></button>`).join('')}</div>`;
    const scrim = modal({ title: '选择哪一次 · ' + t.title, body, actions: [{ label: '取消' }] });
    body.addEventListener('click', (e) => {
      const b = e.target.closest('[data-occ]'); if (!b) return;
      scrim.remove();
      toPlanPicker(t, b.dataset.occ, day, start, end);
    });
    if (exact) { /* the list shows it first with a hint; nothing auto-selected */ }
  }

  // Scheduling a repeating todo must name the occurrence. The master's
  // plan-todo would silently default to today; ask instead of guessing.
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action="plan-todo"]');
    if (!b || state.screen === 'plan-picker') return;
    const t = todoById(b.dataset.id); if (!t || !t.repeat || !DS3) return;
    e.preventDefault(); e.stopPropagation();
    const day = state.planDateHint || state.selectedDate || TODAY;
    const start = (t.plan && t.plan.start) || '15:15';
    const end = (t.plan && t.plan.end) || '16:00';
    pickInstance(t, occurrenceDate || day, start, end);
  }, true);

  function toPlanPicker(t, occurrenceDate, day, start, end) {    const back = { screen: state.screen || 'cal-day', variant: state.variant || 'normal' };
    // The master's go('plan-picker') resets plan defaults and planReturn, so
    // the slot day/time and the return screen are applied after it.
    P.baseGo('plan-picker');
    state.planTodoId = t.id;
    state.planAllocId = null;
    state.planOccurrence = occurrenceDate;
    state.planReturn = back.screen;
    state.planReturnVariant = back.variant;
    state.planReturnDrawer = null;
    state.planReturnEdit = false;
    state.planDate = occurrenceDate || day;
    state.planStart = start;
    state.planEnd = end;
    render();
  }

  /* ---------------- drawer / detail instance scope ---------------- */
  // Rows carry the occurrence that was clicked; the drawer keeps it so the
  // completion button and history entry talk about the same instance.
  document.addEventListener('click', (e) => {
    const row = e.target.closest('.task-row[data-id], .todo-row[data-id], .m-block[data-id]');
    if (row && row.dataset.id) {
      state.occurId = row.dataset.id;
      state.occurDate = (row.closest('.day-col') && row.closest('.day-col').dataset.date) || state.selectedDate || TODAY;
    }
  }, true);

  /* ---------------- multiple reminders (one item, many reminders) ---------------- */
  function hasAnchor(t) {
    if (!t) return false;
    if (t.plan && t.plan.start) return true;
    if (Array.isArray(t.plans) && t.plans.some((p) => p && p.state === 'active' && p.start)) return true;
    return !!(t.due && t.dueTime);
  }
  function remindersOf(t) {
    if (!t) return [];
    const list = [];
    if (t.remind) list.push(t.remind);
    (t.reminders || []).forEach((r) => { if (r && !list.includes(r)) list.push(r); });
    return list;
  }
  function addReminder(t) {
    P.openReminderPicker({
      value: '',
      hasAnchor: hasAnchor(t),
      onPick: (r) => {
        if (!r) return;
        if (remindersOf(t).includes(r)) { toast('这个提醒已经有了'); return; }
        if (!t.remind) t.remind = r;
        else { t.reminders = t.reminders || []; t.reminders.push(r); }
        render(); toast('已添加提醒 · ' + r);
      },
    });
  }
  function removeReminder(t, r) {
    if (t.remind === r) {
      const next = (t.reminders || [])[0];
      t.remind = next || '';
      if (next) t.reminders = (t.reminders || []).filter((x) => x !== next);
    } else {
      t.reminders = (t.reminders || []).filter((x) => x !== r);
    }
    render(); toast('已移除提醒 · ' + r);
  }

  registerEnhancer((root) => {
    const ref = state.drawer;
    if (!ref || ref.type !== 'todo' || state.drawerEdit) return;
    const t = todoById(ref.id);
    if (!t) return;
    const remindRow = qa('.field-row', root).find((r) => (q('.f-label', r) || {}).textContent === '提醒');
    if (!remindRow) return;
    if (!q('[data-remind-add]', remindRow)) {
      const v = q('.f-value', remindRow);
      if (v) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'mini'; b.textContent = '＋ 再加一个';
        b.dataset.remindAdd = '1'; b.dataset.protoAction = 'remind-add'; b.dataset.id = t.id;
        v.appendChild(document.createTextNode(' '));
        v.appendChild(b);
      }
    }
    // Extra reminders render as their own rows (each removable) so the
    // primary reminder stays where the master put it.
    qa('[data-remind-extra]', root).forEach((n) => n.remove());
    const extras = (t.reminders || []).filter((r) => r && r !== t.remind);
    const list = q('.field-list', root);
    if (extras.length && list) {
      extras.forEach((r) => {
        const row = document.createElement('div');
        row.className = 'field-row';
        row.dataset.remindExtra = '1';
        row.innerHTML = '<span class="f-label">提醒</span><span class="f-value">' + esc(r) + ' <button type="button" class="mini" data-proto-action="remind-remove" data-id="' + esc(t.id) + '" data-remind="' + esc(r) + '">移除</button></span>';
        list.insertBefore(row, remindRow.nextSibling);
      });
    }
  });

  registerAction('remind-add', (el) => {
    const t = todoById(el.dataset.id || (state.drawer && state.drawer.id) || '');
    if (t) addReminder(t);
  });
  registerAction('remind-remove', (el) => {
    const t = todoById(el.dataset.id || (state.drawer && state.drawer.id) || '');
    if (t) removeReminder(t, el.dataset.remind);
  });

  // The boot render ran before this file loaded, so derived missed counts were
  // not in the first DOM. Re-render once so the initial screen tells the truth.
  setTimeout(() => { try { render(); } catch (_) { /* master not ready */ } }, 0);
})();

</script>
</body>
