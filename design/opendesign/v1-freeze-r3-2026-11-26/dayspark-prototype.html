  }

  function wireNoop(el, root) {
    const text = (el.textContent || '').trim();
    const page = el.closest('.new-page');
    const settings = el.closest('.settings-page, .page.settings-page');
    const section = state.screen.startsWith('settings-') ? state.screen.replace('settings-', '') : '';

    if (state.screen === 'new-todo' || state.screen === 'new-event') {
      if (el.closest('.m-actions')) return protoAction(el, 'new-save');
      if (el.closest('.m-back')) return protoAction(el, 'new-cancel');
      if (el.classList.contains('new-type-btn')) {
        return protoAction(el, text.includes('日程') ? 'new-type-event' : 'new-type-todo');
      }
    }

    if (page) {
      if (el.closest('.ph-right')) {
        if (text.includes('取消')) return protoAction(el, 'new-cancel');
        if (text.includes('记下') || text.includes('创建') || text.includes('保存') || text.includes('重试')) {
          return protoAction(el, 'new-save');
        }
      }
      if (el.closest('.m-actions')) return protoAction(el, 'new-save');
      if (el.classList.contains('new-type-btn')) {
        return protoAction(el, text.includes('日程') ? 'new-type-event' : 'new-type-todo');
      }
      if (el.closest('.confirm-modal')) {
        return protoAction(el, text.includes('丢弃') ? 'new-discard' : 'new-stay');
      }
    }

    if (settings && section === 'account') {
      if (text === '登录' || text.includes('登录') || text === '重新登录') return protoAction(el, 'account-login');
      if (text === '注册') return protoAction(el, 'account-register');
      if (text.includes('退出')) return protoAction(el, 'account-logout');
      if (text === '同步' || text.includes('立即同步')) return protoAction(el, 'sync-now');
      if (text.includes('重试')) return protoAction(el, 'account-retry');
      if (text === '取消') return protoAction(el, 'account-cancel');
    }
    if (settings && (section === 'sync' || section.startsWith('sync-'))) {
      if (text.includes('重试')) return protoAction(el, 'sync-now');
      if (text.includes('退出')) return protoAction(el, 'account-logout');
      if (text.includes('登录')) return protoAction(el, 'account-login');
      if (text.includes('应用选择')) return protoAction(el, 'sync-apply');
    }
    if (settings && section.startsWith('notify')) {
      if (text.includes('打开设置')) return protoAction(el, 'notify-open-settings');
      if (text.includes('已允许') || text.includes('未生效') || text.includes('可用')) {
        return protoAction(el, 'notify-toggle');
      }
    }
    if (settings && section === 'io') {
      if (text.includes('选择文件')) return protoAction(el, 'import-pick');
      if (text.includes('选择日历')) return protoAction(el, 'import-calendar');
      if (text.includes('导出全部')) return protoAction(el, 'export-ics');
      if (text.includes('导出备份')) return protoAction(el, 'backup-export');
      if (text.includes('合并备份')) return protoAction(el, 'backup-merge');
    }
    if (settings && section === 'import') {
      if (text.includes('选择文件')) return protoAction(el, 'import-pick');
      if (text.includes('选择日历')) return protoAction(el, 'import-calendar');
      if (text.includes('下一步') || text.includes('开始导入')) return protoAction(el, 'import-next');
      if (text === '取消') return protoAction(el, 'import-cancel');
      if (text.includes('跳过') || text.includes('重试')) return protoAction(el, 'import-skip');
      if (text.includes('报告')) return protoAction(el, 'import-report');
    }
    if (settings && section === 'backup') {
      if (text.includes('选择备份文件') || text.includes('合并备份')) return protoAction(el, 'backup-merge');
      if (text.includes('导出完整备份')) return protoAction(el, 'backup-export');
      if (text.includes('重试') || text.includes('重新选择')) return protoAction(el, 'backup-export');
    }
    if (settings && (section === 'tags' || section === 'tag-new' || section === 'tag-edit')) {
      if (text.includes('新建标签')) return protoAction(el, 'tag-new');
      if (text.includes('创建标签') || text === '保存' || text.includes('重试创建')) return protoAction(el, 'tag-save');
      if (text.includes('删除标签')) return protoAction(el, 'tag-delete');
    }
    if (settings && (section === 'calendars' || section === 'calendar-new' || section === 'calendar-edit')) {
      if (text.includes('创建日历')) return protoAction(el, 'cal-save');
      if (text === '保存') return protoAction(el, 'cal-save');
    }
    if (settings && section === 'about') {
      if (text.includes('许可') || text === '查看') return protoAction(el, 'about-license');
      if (text.includes('版本')) return protoAction(el, 'about-version');
    }
    if (settings && section === 'general') {
      if (text.includes('启动时')) return protoAction(el, 'startup-pick');
    }
    if (settings && section === 'account' && text.includes('已连接设备')) {
      return protoAction(el, 'devices-open');
    }
    if (settings && section === 'data') {
      if (text.includes('导出')) return protoAction(el, 'export-ics');
    }

    if (el.closest('.d-sec-head') && text === '添加') {
      const isEvent = !!el.closest('.drawer') && ($('.drawer-kind', el.closest('.drawer')) || {}).textContent?.includes('日程');
      if (!isEvent) return protoAction(el, 'detail-add-tag');
    }
    if (el.closest('.d-sec-head') && text === '上传') return protoAction(el, 'detail-attach');
    if (el.closest('.dropzone') || text.includes('选择文件')) return protoAction(el, 'import-pick');

    if (text.includes('重试') || text.includes('重试读取')) return protoAction(el, 'generic-retry');
    if (text.includes('返回首页')) return protoAction(el, 'generic-home');
  }

  /* ---------------- generic handlers ---------------- */
  Proto.registerAction('generic-retry', () => {
    const section = state.screen.startsWith('settings-') ? state.screen.replace('settings-', '') : '';
    if (section) { state.variant = 'normal'; render(); Proto.toast('已重新读取'); }
    else if (state.screen === 'command') { state.variant = 'result'; render(); }
    else { state.variant = 'normal'; render(); }
  });
  Proto.registerAction('generic-home', () => go('today'));
  Proto.registerAction('settings-home-proto', () => { baseGo('settings-home'); syncHash(true); });
  Proto.registerAction('info-open', (el) => {
    const row = el.closest('.set-row, .m-settings-row');
    const labelEl = row ? $('.set-label, span', row) : null;
    const label = (labelEl ? labelEl.textContent : el.textContent || '').trim().slice(0, 40);
    const value = (el.dataset.infoValue || (row ? (row.textContent || '') : (el.textContent || ''))).replace(/\s+/g, ' ').trim();
    Proto.modal({
      title: label || '这一项',
      body: `<div class="proto-list"><div class="proto-list-row"><span class="grow">${value || '—'}<small>只读事实</small></span></div></div><div class="proto-note">这是当前保存的值；需要修改时使用同一页面里的编辑入口。</div>`,
      actions: [{ label: '关闭', primary: true }],
    });
  });
  Proto.registerAction('error-home', () => go('today'));
  Proto.registerAction('error-trash', () => go('settings-trash'));
  Proto.registerAction('error-retry', () => { state.protoError = null; baseGo('today'); });

  Proto.registerAction('about-license', () => {
    state.variant = state.variant === 'license' ? 'normal' : 'license';
    render();
  });
  Proto.registerAction('about-version', () => {
    Proto.modal({
      title: 'DaySpark 0.35.0',
      body: `<div class="proto-note">本地优先的日历与待办。当前原型的演示日期是 2026 年 11 月 20 日；所有写入只保存在这台设备的浏览器里。</div>`,
      actions: [{ label: '知道了', primary: true }],
    });
  });

  /* ---------------- toolbar ---------------- */
  let toolbar;
  function buildToolbar() {
    toolbar = document.createElement('div');
    toolbar.className = 'proto-bar';
    toolbar.innerHTML = `
      <span class="proto-label">原型</span>
      <button type="button" data-proto-tool="desktop">桌面</button>
      <button type="button" data-proto-tool="mobile">手机</button>
      <span class="proto-sep"></span>
      <button type="button" data-proto-tool="widgets">小组件</button>
      <span class="proto-sep"></span>
      <button type="button" data-proto-tool="demo">演示</button>
      <button type="button" data-proto-tool="shortcuts">快捷键</button>
      <span class="proto-sep"></span>
      <button type="button" data-proto-tool="reset">重置数据</button>
      <span class="proto-status">演示时间 11/20</span>`;
    document.body.appendChild(toolbar);
    toolbar.addEventListener('click', (e) => {
      const b = e.target.closest('[data-proto-tool]');
      if (!b) return;
      const tool = b.dataset.protoTool;
      if (tool === 'reset') {
        Proto.modal({
          title: '重置演示数据？',
          body: '<div class="proto-note">会清空你在原型里创建、修改和删除的全部内容，恢复到初始演示数据。</div>',
          actions: [
            { label: '取消' },
            { label: '重置', primary: true, danger: true, onClick: () => Proto.reset() },
          ],
        });
        return;
      }
      if (tool === 'widgets') {
        baseGo('widgets');
        syncHash(true);
        return;
      }
      if (tool === 'demo') {
        if (Proto.openDemo) Proto.openDemo();
        return;
      }
      if (tool === 'shortcuts') {
        if (Proto.openShortcuts) Proto.openShortcuts();
        return;
      }
      if (tool === 'desktop' || tool === 'mobile') {
        Proto.forcedDevice = tool;
        state.device = tool;
        baseRender();
        syncHash(false);
        enhance();
      }
    });
  }

  function updateToolbar() {
    if (!toolbar) return;
    $$('[data-proto-tool]', toolbar).forEach((b) => {
      if (b.dataset.protoTool === 'reset') return;
      b.classList.toggle('is-on', b.dataset.protoTool === state.device);
    });
  }

  /* ---------------- boot ---------------- */
  document.body.classList.add('proto-running');
  const had = restore();
  state.device = window.innerWidth <= 720 ? 'mobile' : 'desktop';
  Proto.forcedDevice = null;
  buildToolbar();
  const initialHash = location.hash || ('#/' + (Proto.data.startup || 'today'));
  suppressHash = true;
  applyRoute(initialHash);
  suppressHash = false;
  enhance();
  if (!had) Proto.save();

  window.addEventListener('resize', () => {
    if (Proto.forcedDevice) return;
    const next = window.innerWidth <= 720 ? 'mobile' : 'desktop';
    if (state.device !== next) {
      state.device = next;
      baseRender();
      enhance();
    }
  });

  // Expose a few helpers for the domain files and for diagnosis.
  Proto.baseGo = baseGo;
  Proto.baseRender = baseRender;
  Proto.syncHash = syncHash;
  Proto.enhance = enhance;
  Proto.snapshot = snapshot;
  Proto.settingsSection = () => state.screen.startsWith('settings-') ? state.screen.replace('settings-', '') : '';
  Proto.openTodo = (id) => {
    const t = typeof todoById === 'function' ? todoById(id) : null;
    state.selectedDate = (t && t.due) || TODAY;
    baseGo('today');
    state.drawer = { type: 'todo', id };
    render();
  };
  Proto.openEvent = (id) => {
    baseGo('cal-day');
    state.drawer = { type: 'event', id };
    render();
  };
  Proto.goSection = (section, variant) => {
    baseGo('settings-' + section);
    if (variant) { state.variant = variant; render(); }
    syncHash(true);
  };
})();


/* Editing flows: create, detail associations, tags, calendars. */
(function () {
  const { registerAction, registerEnhancer, toast, modal, protoAction } = window.Proto;
  const q = (s, r) => (r || document).querySelector(s);
  const qa = (s, r) => Array.from((r || document).querySelectorAll(s));

  function isEventScreen() { return state.screen === 'new-event'; }
  function firstInput(root) { return q('.form-input', root) || q('.proto-input', root); }

  /* ---------------- new item ---------------- */
  registerAction('new-save', () => {
    const ev = isEventScreen();
    const titleEl = q('#new-title') || q('.new-page .form-input') || q('.m-detail-scroll .m-form-input');
    const title = (titleEl && titleEl.value || '').trim();
    if (!title) {
      state.variant = 'validation';
      render();
      toast('先写一个标题');
      return;
    }
    const cal = state.defaultCal || 'personal';
    if (ev) {
      const id = 'local-event-' + (++state.localNo);
      EVENTS.push({
        id, title, cal, date: TODAY, start: '11:00', end: '12:00',
        loc: '', remind: '15 分钟前', note: '',
      });
      state.deletedEvents = state.deletedEvents.filter((x) => x !== id);
      window.Proto.baseGo('cal-day');
      setToast('已创建日程 · 今天 11:00–12:00');
    } else {
      const id = 'local-' + (++state.localNo);
      TODOS.unshift({
        id, title, cal, priority: 0, tags: [], note: '',
        subtasks: [], status: 'open',
      });
      window.Proto.baseGo('todo-inbox');
      setToast('已记下待办 · 未安排');
    }
    window.Proto.syncHash(true);
  });

  registerAction('new-cancel', () => {
    window.Proto.data.newDraft = null;
    window.Proto.baseGo(isEventScreen() ? 'cal-week' : 'today');
    window.Proto.syncHash(true);
  });
  registerAction('cal-new-proto', () => {
    window.Proto.data.newDraft = null;
    window.Proto.baseGo('new-event');
    window.Proto.syncHash(true);
  });
  registerAction('new-type-event', () => { window.Proto.baseGo('new-event'); window.Proto.syncHash(true); });
  registerAction('new-type-todo', () => { window.Proto.baseGo('new-todo'); window.Proto.syncHash(true); });
  registerAction('new-stay', () => { state.variant = 'normal'; render(); });
  registerAction('new-discard', () => { window.Proto.baseGo(isEventScreen() ? 'cal-week' : 'today'); window.Proto.syncHash(true); });

  /* ---------------- detail associations ---------------- */
  function currentDraft() {
    return state.draft && state.draftKey ? state.draft : null;
  }

  registerAction('detail-add-tag', () => {
    const draft = currentDraft();
    if (!draft) return;
    const tags = window.Proto.data.tags.slice();
    const body = document.createElement('div');
    body.className = 'proto-list';
    tags.forEach((t) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'proto-list-row';
      const on = (draft.tags || []).includes(t.name);
      b.innerHTML = `<span class="tag-dot" style="background:${t.color}"></span><span class="grow">${t.name}</span>${on ? '<span class="proto-badge">已添加</span>' : '<span class="proto-badge">添加</span>'}`;
      b.addEventListener('click', () => {
        draft.tags = draft.tags || [];
        if (on) draft.tags = draft.tags.filter((x) => x !== t.name);
        else draft.tags.push(t.name);
        b.querySelector('.proto-badge').textContent = on ? '添加' : '已添加';
        b.dataset.on = on ? '' : '1';
      });
      body.appendChild(b);
    });
    const inputRow = document.createElement('div');
    inputRow.className = 'proto-field';
    inputRow.innerHTML = '<label>新标签</label><input class="proto-input" placeholder="输入名称后点添加">';
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'proto-btn';
    add.textContent = '添加新标签';
    add.addEventListener('click', () => {
      const name = q('.proto-input', inputRow).value.trim();
      if (!name) return;
      if (!window.Proto.data.tags.some((t) => t.name === name)) {
        window.Proto.data.tags.push({ name, color: '#8a8a82' });
      }
      draft.tags = draft.tags || [];
      if (!draft.tags.includes(name)) draft.tags.push(name);
      toast('已添加标签 · ' + name);
      q('.proto-input', inputRow).value = '';
    });
    inputRow.appendChild(add);
    body.appendChild(inputRow);
    modal({ title: '标签', body, actions: [{ label: '完成', primary: true, onClick: () => render() }] });
  });

  registerAction('detail-subtask-add', () => {
    const draft = currentDraft();
    if (!draft) return;
    window.Proto.prompt({
      title: '添加子任务',
      label: '子任务',
      placeholder: '例如：整理阻塞点',
      onConfirm: (value) => {
        if (!value) return;
        draft.subtasks = draft.subtasks || [];
        draft.subtasks.push({ title: value, done: false });
        render();
        toast('已添加子任务');
      },
    });
  });

  registerAction('detail-attach', () => {
    const draft = currentDraft();
    if (!draft) return;
    const files = ['本周数据.xlsx', '会议纪要.pdf', '设计稿-v4.fig'];
    const body = document.createElement('div');
    body.className = 'proto-list';
    files.forEach((name) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'proto-list-row';
      b.innerHTML = `<span class="grow">${name}<small>本地文件 · 模拟上传</small></span><span class="proto-badge">选择</span>`;
      b.addEventListener('click', () => {
        draft.attach = name;
        render();
        toast('已添加附件 · ' + name);
      });
      body.appendChild(b);
    });
    modal({
      title: '添加附件',
      body,
      actions: [{ label: '取消' }],
    });
  });

  /* ---------------- tags ---------------- */
  function tagNamesInUse() {
    const names = new Set(window.Proto.data.tags.map((t) => t.name));
    TODOS.concat(state.localTodos || []).forEach((t) => (t.tags || []).forEach((n) => names.add(n)));
    return names;
  }

  registerAction('tag-new', () => {
    window.Proto.baseGo('settings-tag-new');
    window.Proto.syncHash(true);
  });

  registerAction('tag-save', () => {
    const section = state.screen.replace('settings-', '');
    if (section === 'tag-new') {
      const input = q('.io-card .form-input') || q('.m-form .m-form-input');
      const name = (input && input.value || '').trim();
      if (!name) { state.variant = 'validation'; render(); return; }
      if (tagNamesInUse().has(name)) { state.variant = 'duplicate'; render(); toast('标签名已存在'); return; }
      window.Proto.data.tags.push({ name, color: '#4f7bbf' });
      window.Proto.baseGo('settings-tags');
      toast('已创建标签 · ' + name);
      window.Proto.syncHash(true);
      return;
    }
    const old = state.tagId || '周报';
    const input = q('.io-card .form-input') || q('.m-form .m-form-input');
    const name = (input && input.value || '').trim();
    if (!name) { state.variant = 'validation'; render(); return; }
    const tag = window.Proto.data.tags.find((t) => t.name === old);
    if (tag) tag.name = name;
    TODOS.concat(state.localTodos || []).forEach((t) => {
      if (Array.isArray(t.tags)) t.tags = t.tags.map((x) => x === old ? name : x);
    });
    state.tagId = name;
    window.Proto.baseGo('settings-tags');
    toast('标签已改名 · ' + name);
    window.Proto.syncHash(true);
  });

  registerAction('tag-delete', () => {
    const old = state.tagId || '周报';
    modal({
      title: '删除标签',
      body: `<div class="proto-note">「${old}」会从所有待办上移除，但不会删除待办本身。</div>`,
      actions: [
        { label: '取消' },
        { label: '删除', primary: true, danger: true, onClick: () => {
          window.Proto.data.tags = window.Proto.data.tags.filter((t) => t.name !== old);
          TODOS.concat(state.localTodos || []).forEach((t) => {
            if (Array.isArray(t.tags)) t.tags = t.tags.filter((x) => x !== old);
          });
          window.Proto.baseGo('settings-tags');
          toast('已删除标签 · ' + old);
          window.Proto.syncHash(true);
        } },
      ],
    });
  });

  /* ---------------- calendars ---------------- */
  function slug(name) {
    const base = name.toLowerCase().replace(/[^a-z0-9一-龥]+/g, '-').replace(/^-|-$/g, '');
    let id = base || 'calendar';
    let i = 2;
    while (CAL[id]) id = base + '-' + i++;
    return id;
  }

  registerAction('cal-save', () => {
    const section = state.screen.replace('settings-', '');
    if (section === 'calendar-new') {
      const input = q('.io-card .form-input') || q('.m-form .m-form-input');
      const name = (input && input.value || '').trim();
      if (!name) { toast('先写日历名称'); input && input.focus(); return; }
      const id = slug(name);
      CAL[id] = { name, color: '#4f7bbf', bg: '#dce7f7', ink: '#1e3557' };
      window.Proto.baseGo('settings-calendars');
      toast('已创建日历 · ' + name);
      window.Proto.syncHash(true);
      return;
    }
    const id = state.calendarId;
    const input = q('.io-card .form-input') || q('.m-form .m-form-input');
    const name = (input && input.value || '').trim();
    if (!id || !CAL[id]) return;
    if (!name) { toast('先写日历名称'); return; }
    CAL[id].name = name;
    window.Proto.baseGo('settings-calendars');
    toast('日历已保存');
    window.Proto.syncHash(true);
  });

  /* ---------------- enhancer ---------------- */
  registerEnhancer((root) => {
    const section = state.screen.startsWith('settings-') ? state.screen.replace('settings-', '') : '';

    // Desktop calendar needs a discoverable create entry, matching the phone FAB.
    if (state.screen.startsWith('cal-') && state.device !== 'mobile') {
      const right = q('.cal-page .ph-right', root);
      if (right && !q('[data-proto-action="cal-new-proto"]', right)) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tool';
        b.dataset.protoAction = 'cal-new-proto';
        b.innerHTML = (typeof ico === 'function' ? ico('plus', 12) : '+') + ' 新建日程';
        right.insertBefore(b, right.querySelector('[data-action="open-cal-filter"]'));
      }
    }

    // Detail section headers: each "添加" belongs to its own section.
    qa('.d-sec', root).forEach((sec) => {
      const head = q('.d-sec-head', sec);
      const add = q('[data-action="noop"]', head);
      if (!head || !add) return;
      const label = (head.textContent || '').trim();
      if (label.startsWith('标签')) protoAction(add, 'detail-add-tag');
      else if (label.startsWith('子任务')) protoAction(add, 'detail-subtask-add');
    });

    // Extra / renamed tags in both settings and the standalone tag page.
    if (section === 'tags' || state.screen === 'tags-page') {
      const container = q('.set-content', root) || q('.simple-wrap', root);
      if (!container) return;
      const addRow = q('.add-row, .simple-add', container);
      const existing = qa('.tag-row', container);
      existing.forEach((row, i) => {
        const tag = window.Proto.data.tags[i];
        if (!tag) return;
        const textNodes = Array.from(row.childNodes).filter((n) => n.nodeType === 3);
        if (textNodes.length) {
          textNodes[0].nodeValue = tag.name;
        } else {
          const span = document.createElement('span');
          span.textContent = tag.name;
          span.style.marginRight = 'auto';
          const count = q('.tag-count', row);
          row.insertBefore(span, count || null);
        }
      });
      const shown = new Set(existing.map((r) => (r.textContent || '').trim()));
      window.Proto.data.tags.forEach((t) => {
        if (shown.has(t.name)) return;
        if (qa('.tag-row', container).some((r) => (r.textContent || '').includes(t.name))) return;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tag-row';
        b.style.cssText = 'width:100%;text-align:left';
        b.dataset.protoAction = 'tag-open';
        b.dataset.tag = t.name;
        const count = TODOS.concat(state.localTodos || []).filter((x) => (x.tags || []).includes(t.name)).length;
        b.innerHTML = `<span class="tag-dot" style="background:${t.color}"></span>${t.name}<span class="tag-count">${count} 项</span>`;
        if (addRow && addRow.parentNode) addRow.parentNode.insertBefore(b, addRow);
        else container.appendChild(b);
      });
      qa('.tag-row', container).forEach((row) => {
        if (row.dataset.protoAction) return;
        const name = (row.textContent || '').replace(/\s*\d+\s*项\s*$/, '').trim();
        if (!name) return;
        row.dataset.protoAction = 'tag-open';
        row.dataset.tag = name;
      });
      if (addRow) protoAction(addRow, 'tag-new');
    }
  });

  registerAction('tag-open', (el) => {
    state.tagId = el.dataset.tag;
    window.Proto.baseGo('settings-tag-edit');
    state.tagId = el.dataset.tag;
    render();
    window.Proto.syncHash(true);
  });
})();

/* Recurring edits are series-level: confirm before writing the anchor. */

      actions: [
        { label: '取消' },
        { label: '保存到整个系列', primary: true, onClick: () => {
          if (typeof commitDraft === 'function') commitDraft();
          if (typeof clearDraft === 'function') clearDraft();
          if (state.variant !== 'detail') state.variant = 'normal';
          render();
          toast('已保存到整个系列');
        } },
      ],
    });
  }, true);
})();

/* New-item fields: keep the master's rows, make them actually editable. */
(function () {
  const P = window.Proto;
  const { registerAction, registerEnhancer, modal, toast, protoAction } = P;
  const q = (s, r) => (r || document).querySelector(s);
  const qa = (s, r) => Array.from((r || document).querySelectorAll(s));

  function draft() {
    if (!P.data.newDraft) {
      P.data.newDraft = {
        cal: state.defaultCal || 'personal', date: TODAY, start: '11:00', end: '12:00',
        allDay: false, endDate: '', loc: '', repeat: '', remind: state.screen === 'new-event' ? '15 分钟前' : '不提醒', priority: '中',
        due: '', dueTime: '', plan: null,
      };
    }
    return P.data.newDraft;
  }

  function fieldRow(label) {
    return qa('.new-page .cp-field, .m-detail-scroll .cp-field').find((row) => {
      const k = q('.k', row);
      return k && (k.textContent || '').trim() === label;
    });
  }

  function paint(label, value) {
    const row = fieldRow(label);
    const v = row && q('.v', row);
    if (v) v.textContent = value;
  }

  registerEnhancer((root) => {
    if (state.screen !== 'new-todo' && state.screen !== 'new-event') return;
    qa('.new-page .cp-field, .m-detail-scroll .cp-field', root).forEach((row) => {
      const k = q('.k', row);
      if (!k) return;
      const label = (k.textContent || '').trim();
      row.style.cursor = 'pointer';
      row.dataset.protoAction = 'new-field';
      row.dataset.field = label;
    });
    const d = draft();
    const timeText = d.allDay
      ? (d.endDate && d.endDate !== d.date ? '全天 · ' + d.date + '–' + d.endDate : '全天 · ' + d.date)
      : d.date + ' ' + d.start + '–' + d.end;
    const set = (label, value) => {
      const row = qa('.new-page .cp-field, .m-detail-scroll .cp-field', root).find((x) => {
        const k = q('.k', x);
        return k && (k.textContent || '').trim() === label;
      });
      const v = row && q('.v', row);
      if (v) v.textContent = value;
    };
    set('时间', timeText);
    set('全天', d.allDay ? '是' : '否');
    set('日历', calOf(d.cal).name + (d.cal === (state.defaultCal || 'personal') ? ' · 默认' : ''));
    set('地点', d.loc || '未填写');
    set('重复', d.repeat || '不重复');
    set('提醒', d.remind || '不提醒');
    set('截止', d.due ? d.due + (d.dueTime ? ' ' + d.dueTime : '') : '无截止');
    set('计划执行', d.plan ? d.plan.date + ' ' + d.plan.start + '–' + d.plan.end : '未安排');
    set('优先级', d.priority || '中');
  });

  registerAction('new-field', (el) => {
    const label = el.dataset.field || '';
    const d = draft();
    if (label === '时间' || label === '截止' || label === '计划执行') {
      const isDue = label === '截止';
      const isPlan = label === '计划执行';
      const body = document.createElement('div');
      body.innerHTML = `<div class="proto-field"><label>日期</label><input class="proto-input" type="date" id="nf-date" value="${isPlan ? (d.plan?.date || d.date) : d.date}"></div>
        ${isDue ? '' : `<div class="proto-check"><input type="checkbox" id="nf-allday" ${d.allDay ? 'checked' : ''}><label for="nf-allday">全天（可跨日）</label></div>
        <div class="proto-field"><label>结束日期（全天跨日时填写）</label><input class="proto-input" type="date" id="nf-enddate" value="${d.endDate || ''}"></div>`}
        <div class="proto-field"><label>${isDue ? '截止时间' : '开始'}</label><input class="proto-input" type="time" id="nf-start" value="${isDue ? (d.dueTime || '') : (isPlan ? (d.plan?.start || d.start) : d.start)}"></div>
        ${isDue ? '' : `<div class="proto-field"><label>结束</label><input class="proto-input" type="time" id="nf-end" value="${isPlan ? (d.plan?.end || d.end) : d.end}"></div>`}`;
      modal({
        title: label,
        body,
        actions: [
          { label: '取消' },
          { label: '应用', primary: true, onClick: (root) => {
            const date = q('#nf-date', root).value || TODAY;
            if (isDue) {
              d.due = date;
              d.dueTime = q('#nf-start', root).value;
              paint('截止', date === TODAY ? '今天' + (d.dueTime ? ' ' + d.dueTime : '') : date + (d.dueTime ? ' ' + d.dueTime : ''));
            } else if (isPlan) {
              d.plan = { date, start: q('#nf-start', root).value || '15:00', end: q('#nf-end', root).value || '16:00' };
              paint('计划执行', d.plan.date + ' ' + d.plan.start + '–' + d.plan.end);
            } else {
              d.date = date;
              d.start = q('#nf-start', root).value || '11:00';
              d.end = q('#nf-end', root).value || '12:00';
              d.allDay = q('#nf-allday', root).checked;
              d.endDate = q('#nf-enddate', root).value;
              paint('时间', d.allDay ? (d.endDate && d.endDate !== d.date ? '全天 · ' + d.date + '–' + d.endDate : '全天 · ' + d.date) : d.date + ' ' + d.start + '–' + d.end);
              paint('全天', d.allDay ? '是' : '否');
            }
            toast(label + '已更新');
          } },
        ],
      });
      return;
    }

    if (label === '全天') {
      d.allDay = !d.allDay;
      paint('全天', d.allDay ? '是' : '否');
      toast(d.allDay ? '已设为全天' : '已取消全天');
      return;
    }

    if (label === '地点') {
      P.prompt({
        title: '地点', label: '地点', value: d.loc, placeholder: '例如：会议室 B',
        onConfirm: (value) => { d.loc = value; paint('地点', value || '未填写'); toast('地点已更新'); },
      });
      return;
    }

    if (label === '日历') {
      const body = document.createElement('div');
      body.className = 'proto-list';
      calIds().forEach((id) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'proto-list-row';
        b.innerHTML = `<span class="cal-dot" style="background:${calOf(id).color}"></span><span class="grow">${calOf(id).name}</span>${d.cal === id ? '<span class="proto-badge">当前</span>' : ''}`;
        b.addEventListener('click', () => { d.cal = id; paint('日历', calOf(id).name); toast('日历 · ' + calOf(id).name); b.closest('.proto-modal-scrim').remove(); });
        body.appendChild(b);
      });
      modal({ title: '日历', body, actions: [{ label: '取消' }] });
      return;
    }

    if (label === '重复') {
      const options = ['不重复', '每天', '每周', '每月'];
      const body = document.createElement('div');
      body.className = 'proto-list';
      options.forEach((o) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'proto-list-row';
        b.innerHTML = `<span class="grow">${o}</span>${(d.repeat || '不重复') === o ? '<span class="proto-badge">当前</span>' : ''}`;
        b.addEventListener('click', () => { d.repeat = o === '不重复' ? '' : o; paint('重复', o); toast('重复 · ' + o); b.closest('.proto-modal-scrim').remove(); });
        body.appendChild(b);
      });
      modal({ title: '重复', body, actions: [{ label: '取消' }] });
      return;
    }

    if (label === '提醒') {
      const options = ['不提醒', '5 分钟前', '15 分钟前', '1 小时前', '1 天前'];
      const body = document.createElement('div');
      body.className = 'proto-list';
      options.forEach((o) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'proto-list-row';
        b.innerHTML = `<span class="grow">${o}</span>${d.remind === o ? '<span class="proto-badge">当前</span>' : ''}`;
        b.addEventListener('click', () => { d.remind = o; paint('提醒', o); toast('提醒 · ' + o); b.closest('.proto-modal-scrim').remove(); });
        body.appendChild(b);
      });
      modal({ title: '提醒', body, actions: [{ label: '取消' }] });
      return;
    }

    if (label === '优先级') {
      const options = ['低', '中', '高'];
      const body = document.createElement('div');
      body.className = 'proto-list';
      options.forEach((o) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'proto-list-row';
        b.innerHTML = `<span class="grow">${o}</span>${d.priority === o ? '<span class="proto-badge">当前</span>' : ''}`;
        b.addEventListener('click', () => { d.priority = o; paint('优先级', o); toast('优先级 · ' + o); b.closest('.proto-modal-scrim').remove(); });
        body.appendChild(b);
      });
      modal({ title: '优先级', body, actions: [{ label: '取消' }] });
    }
  });

  // Replace the simple new-save with one that reads the edited facts.
  registerAction('new-save', () => {
    const ev = state.screen === 'new-event';
    const titleEl = q('#new-title') || q('.new-page .form-input') || q('.m-detail-scroll .m-form-input');
    const title = (titleEl && titleEl.value || '').trim();
    if (!title) {
      state.variant = 'validation';
      render();
      toast('先写一个标题');
      return;
    }
    const d = draft();
    if (ev) {
      const event = {
        id: 'local-event-' + (++state.localNo), title, cal: d.cal || state.defaultCal || 'personal',
        allDay: !!d.allDay, loc: d.loc, remind: d.remind, note: '', repeat: d.repeat,
      };
      if (d.allDay) {
        event.date = d.date;
        if (d.endDate && d.endDate !== d.date) {
          event.startDate = d.date;
          event.endDate = d.endDate;
          delete event.date;
        }
      } else {
        event.date = d.date;
        event.start = d.start;
        event.end = d.end;
      }
      EVENTS.push(event);
      state.deletedEvents = state.deletedEvents.filter((x) => x !== event.id);
      P.data.newDraft = null;
      P.baseGo('cal-day');
      toast('已创建日程 · ' + (d.allDay ? '全天' : d.start + '–' + d.end));
    } else {
      const todo = {
        id: 'local-' + (++state.localNo), title, cal: d.cal || state.defaultCal || 'personal',
        priority: d.priority === '高' ? 5 : d.priority === '低' ? 1 : 0,
        tags: [], note: '', subtasks: [], status: 'open',
      };
      if (d.due) { todo.due = d.due; if (d.dueTime) todo.dueTime = d.dueTime; }
      if (d.plan) todo.plan = d.plan;
      if (d.remind && d.remind !== '不提醒') todo.remind = d.remind;
      if (d.repeat) todo.repeat = d.repeat;
      TODOS.unshift(todo);
      P.data.newDraft = null;
      P.baseGo('todo-inbox');
      toast('已记下待办');
    }
    P.syncHash(true);
  });
})();


/* System flows: account, sync, notification permission, import/export/backup,
   AI conversation, command search and the widget entry. */
(function () {
  const P = window.Proto;
  const { registerAction, registerEnhancer, toast, modal, protoAction } = P;
  const q = (s, r) => (r || document).querySelector(s);
  const qa = (s, r) => Array.from((r || document).querySelectorAll(s));
  const go = (s) => { P.baseGo(s); P.syncHash(true); };

  /* ---------------- account ---------------- */
  registerAction('account-login', () => {
    if (state.variant === 'logged-out' || state.variant === 'failed' || state.variant === 'load-error') {
      const pw = qa('.settings-page .io-card input[type=password], .m-form input[type=password]').pop();
      if (pw && pw.value && pw.value.length < 8) {
        state.variant = 'failed';
        render();
        toast('邮箱或密码不正确 · 没有创建会话');
        return;
      }
      state.variant = 'submitting';
      render();
      setTimeout(() => {
        P.data.account.signedIn = true;
        P.data.account.email = 'chang@local';
        state.variant = 'normal';
        render();
        toast('已登录 · 同步已开启');
      }, 900);
      return;
    }
    state.variant = 'logged-out';
    render();
  });

  registerAction('account-register', () => {
    if (state.variant !== 'register' && state.variant !== 'register-error' && state.variant !== 'register-conflict') {
      state.variant = 'register';
      render();
      return;
    }
    const pw = qa('.settings-page .io-card input[type=password], .m-form input[type=password]').pop();
    if (pw && pw.value && pw.value.length < 8) {
      state.variant = 'register-error';
      render();
      toast('密码太短 · 至少 8 位');
      return;
    }
    state.variant = 'submitting';
    render();
    setTimeout(() => {
      P.data.account.signedIn = true;
      state.variant = 'normal';
      render();
      toast('账号已创建 · 已登录');
    }, 900);
  });

  registerAction('account-logout', () => {
    modal({
      title: '退出登录？',
      body: '<div class="proto-note">本地待办、日程和设置都会保留；只是停止上传与下载。</div>',
      actions: [
        { label: '取消' },
        { label: '退出', primary: true, danger: true, onClick: () => {
          P.data.account.signedIn = false;
          state.variant = 'logged-out';
          render();
          toast('已退出登录 · 本地数据保留');
        } },
      ],
    });
  });

  registerAction('account-retry', () => {
    state.variant = 'loading';
    render();
    setTimeout(() => { state.variant = 'normal'; render(); }, 700);
  });

  registerAction('account-cancel', () => { state.variant = 'normal'; render(); });

  registerAction('sync-now', () => {
    if (!P.data.account.signedIn) { go('settings-sync-logged-out'); return; }
    if (P.data.sync.offline) {
      state.variant = 'error';
      render();
      toast('服务器不可达 · 本地修改没有丢');
      return;
    }
    state.variant = 'loading';
    render();
    setTimeout(() => {
      P.data.account.lastSync = '刚刚 · 成功';
      P.data.account.pending = 0;
      state.variant = 'normal';
      render();
      toast('同步完成 · 本地与服务器一致');
    }, 900);
  });

  registerAction('sync-apply', () => {
    state.variant = 'normal';
    P.data.sync.conflicts = 0;
    render();
    toast('冲突已按选择处理');
  });

  /* ---------------- notification permission ---------------- */
  registerAction('notify-open-settings', () => {
    if (P.data.notify.permission === 'denied') {
      P.data.notify.permission = 'granted';
      P.data.notify.exact = true;
      go('settings-notify');
      toast('系统通知已重新允许');
    } else {
      P.data.notify.permission = 'denied';
      P.data.notify.exact = false;
      go('settings-notify-denied');
    }
  });

  registerAction('notify-toggle', () => {
    if (P.data.notify.permission === 'granted') {
      P.data.notify.permission = 'denied';
      P.data.notify.exact = false;
      go('settings-notify-denied');
    } else {
      P.data.notify.permission = 'granted';
      P.data.notify.exact = true;
      go('settings-notify');
    }
  });

  /* ---------------- import / export / backup ---------------- */
  registerAction('import-pick', () => {
    const files = [
      { name: 'dayplan.ics', meta: '18 个事件 · 4 个待办 · 1 行日期无效', bad: false },
      { name: 'dayplan-broken.ics', meta: '第 14 行日期无法识别，导入会失败', bad: true },
    ];
    const body = document.createElement('div');
    body.className = 'proto-list';
    files.forEach((f) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'proto-list-row';
      b.innerHTML = `<span class="grow">${f.name}<small>${f.meta}</small></span><span class="proto-badge">选择</span>`;
      b.addEventListener('click', () => {
        P.data.importFile = f.name;
        P.data.importBad = f.bad;
        state.variant = 'preview';
        if (state.screen !== 'settings-import') { P.baseGo('settings-import'); state.variant = 'preview'; }
        render();
        toast('已选择 ' + f.name);
      });
      body.appendChild(b);
    });
    modal({ title: '选择要导入的 ICS 文件', body, actions: [{ label: '取消' }] });
  });

  registerAction('import-calendar', () => {
    const body = document.createElement('div');
    body.className = 'proto-list';
    Object.keys(CAL).filter((id) => !state.deletedCals.includes(id)).forEach((id) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'proto-list-row';
      b.innerHTML = `<span class="cal-dot" style="background:${CAL[id].color}"></span><span class="grow">${CAL[id].name}<small>${CAL[id].name} · 当前 ${EVENTS.filter((e) => e.cal === id).length} 个日程</small></span>`;
      b.addEventListener('click', () => {

        render();
        toast('导入目标 · ' + CAL[id].name);
      });
      body.appendChild(b);
    });
    modal({ title: '导入到哪个日历', body, actions: [{ label: '取消' }] });
  });

  registerAction('import-next', () => {
    simulateImport(false);
  });
  registerAction('import-skip', () => {
    simulateImport(true);
  });
  registerAction('import-cancel', () => { go('settings-io'); });
  registerAction('import-report', () => {
    modal({
      title: '导入报告',
      body: `<div class="proto-list"><div class="proto-note">dayplan.ics · 目标「工作」</div>
        <div class="proto-list-row"><span class="grow">成功写入<small>18 个日程 · 4 个待办</small></span><span class="proto-badge">22</span></div>
        <div class="proto-list-row"><span class="grow">跳过<small>第 14 行：日期格式无法识别</small></span><span class="proto-badge">1</span></div>
        <div class="proto-list-row"><span class="grow">重复<small>按 UID 去重，没有覆盖已有条目</small></span><span class="proto-badge">0</span></div></div>`,
      actions: [{ label: '关闭', primary: true }],
    });
  });

  function simulateImport(skipBad) {
    if (P.data.importBad && !skipBad) {
      state.variant = 'importing';
      render();
      setTimeout(() => {
        state.variant = 'error';
        render();
        toast('导入失败 · 没有写入任何内容');
      }, 800);
      return;
    }
    state.variant = 'importing';
    render();
    setTimeout(() => {
      const cal = P.data.importCalendar || 'work';
      const today = TODAY;
      EVENTS.push(
        { id: 'import-' + Date.now() + '-a', title: '设计评审（导入）', cal, date: today, start: '10:00', end: '11:00' },
        { id: 'import-' + Date.now() + '-b', title: '牙医复诊（导入）', cal: 'health', date: today, start: '14:30', end: '15:15' },
      );
      TODOS.unshift({ id: 'import-todo-' + Date.now(), title: '整理导入后的重复项', cal, priority: 0, tags: [], note: '从 dayplan.ics 导入', status: 'open' });
      state.variant = 'success';
      render();
      toast('导入完成 · 21 项写入');
    }, 900);
  }

  registerAction('export-ics', () => {
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//DaySpark//Prototype//CN'];
    EVENTS.filter((e) => !state.deletedEvents.includes(e.id)).forEach((e) => {
      lines.push('BEGIN:VEVENT', 'UID:' + e.id, 'SUMMARY:' + (e.title || ''));
      const date = (e.date || e.startDate || TODAY).replace(/-/g, '');
      lines.push('DTSTART;VALUE=DATE:' + date, 'END:VEVENT');
    });
    TODOS.forEach((t) => {
      lines.push('BEGIN:VTODO', 'UID:' + t.id, 'SUMMARY:' + (t.title || ''), 'END:VTODO');
    });
    lines.push('END:VCALENDAR');
    download('dayspark-2026-11-20.ics', lines.join('\r\n'), 'text/calendar');

    if (state.screen !== 'settings-backup') P.baseGo('settings-backup');

      render();
      setTimeout(() => { state.variant = 'success'; render(); }, 900);
      return;
    }
    state.variant = 'progress';
    render();
    setTimeout(() => {
      download('2026-11-20.dayspark.json', JSON.stringify(P.snapshot ? P.snapshot() : { todos: TODOS, events: EVENTS }, null, 2), 'application/json');
      state.variant = 'success';
      render();
      toast('备份已导出');

      render();
      toast('备份已合并');

  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;

    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ---------------- AI ---------------- */
  const AI_REPLY = (text) => {
    if (/周报|总结|纪要/.test(text)) {
      return '可以。先把这周的进展压成三条：\n1. 11 月版本的三处交互已经收敛。\n2. ICS 第 14 行的日期容错还需要补。\n3. Q4 提案框架周三前给林总。\n\n要我把第三条记成周三 18:00 截止的待办吗？';
    }
    if (/今天|还剩|剩下/.test(text)) {
      const open = TODOS.filter((t) => t.status !== 'done' && t.due === TODAY);
      return open.length
        ? '今天还有 ' + open.length + ' 项：' + open.slice(0, 4).map((t) => t.title).join('、') + '。要我按优先级重排吗？'
        : '今天的待办都完成了。日历里还有牙医复诊和钢琴课。';
    }
    if (/安排|排一下|计划/.test(text)) {
      return '建议把「提交周报给林总」放在 15:15–16:00，避开 14:30 的牙医复诊。要打开安排选择器吗？';
    }
    return '我可以帮你整理待办、拆子任务或安排时间。说说你现在想先处理哪一件。';
  };

  registerAction('ai-send-proto', () => {

    state.aiInput = '';
    state.variant = 'sending';
    render();
    setTimeout(() => {
      AI_THREAD.push({ role: 'ai', text: AI_REPLY(text), actions: true });
      state.variant = 'normal';
      render();

  registerAction('ai-insert-proto', (el) => {
    const label = (el.textContent || '').trim();

      P.baseGo('new-event');
      P.syncHash(true);
      setTimeout(() => { const i = q('#new-title'); if (i) i.value = '周报评审'; }, 30);
    } else if (label.includes('安排')) {
      P.baseGo('plan-picker');
      state.planTodoId = 'report';
      state.planReturn = 'ai-chat';
      render();
      P.syncHash(true);
    } else if (label.includes('子任务')) {
      const t = TODOS.find((x) => x.id === 'report');
      if (t) {
        t.subtasks = t.subtasks || [];
        ['整理阻塞点', '附上数据', '发给林总'].forEach((s) => t.subtasks.push({ title: s, done: false }));
      }
      toast('已拆成 3 个子任务 · 打开详情查看');

  /* ---------------- widgets entry ---------------- */
  registerAction('widget-open', (el) => {
    const target = el.dataset.widgetTarget || 'today';
    if (target === 'todo') { go('todos/inbox'); return; }
    if (target === 'calendar') { go('calendar/month'); return; }
    go('today');

  registerEnhancer((root) => {

    if (section === 'general') {

          el.dataset.protoAction = 'startup-pick';
        }
      });
    }

    qa('.m-settings-row', root).forEach((el) => {
      if (el.dataset.protoAction || el.dataset.action) return;
      const t = (el.textContent || '');
      if (section === 'about' && t.includes('许可')) el.dataset.protoAction = 'about-license';
      else if (section === 'about' && t.includes('版本')) el.dataset.protoAction = 'about-version';
      else if (section === 'about' && t.includes('数据')) el.dataset.protoAction = 'storage-info';
      else if (section === 'general' && t.includes('启动时')) el.dataset.protoAction = 'startup-pick';
      else if (section === 'account' && t.includes('已连接设备')) el.dataset.protoAction = 'devices-open';
      else if ((section === 'import' || section === 'io') && t.includes('选择文件')) el.dataset.protoAction = 'import-pick';
      else if ((section === 'import' || section === 'io') && t.includes('目标日历')) el.dataset.protoAction = 'import-calendar';
      else if ((section === 'import' || section === 'io') && t.includes('预览与写入')) el.dataset.protoAction = 'import-next';
      else if (section === 'backup' && t.includes('完整备份')) el.dataset.protoAction = 'backup-export';
      else if (section === 'backup' && t.includes('合并备份')) el.dataset.protoAction = 'backup-merge';
      else if (section === 'notify' && (t.includes('系统闹钟') || t.includes('通知权限') || t.includes('精确提醒'))) el.dataset.protoAction = 'notify-detail';
      else if (section === 'sync-failed' && t.includes('本地状态')) el.dataset.protoAction = 'sync-pending';
    });

    if (section === 'account') {
      qa('.m-settings-row', root).forEach((el) => {
        if ((el.textContent || '').includes('已连接设备') && !el.dataset.protoAction) {
          el.dataset.protoAction = 'devices-open';
        }
      });
    }

    if (section === 'account' || section === 'sync') {
      const who = P.data.account.signedIn ? P.data.account.email : '未登录';
      qa('.set-account-main b', root).forEach((b) => {
        if (!P.data.account.signedIn && state.variant !== 'logged-out') b.textContent = '未登录';
      });
      qa('.set-value, .set-account-main small', root).forEach((el) => {

        if ((el.textContent || '').includes('14:58')) el.textContent = P.data.account.lastSync;
        if ((el.textContent || '').trim().endsWith('台')) el.textContent = (P.data.account.devices || []).length + ' 台';
      });
    }

    if (section === 'notify') {
      qa('.m-settings-row', root).forEach((el) => {
        if (!el.dataset.protoAction) el.dataset.protoAction = 'notify-toggle';
      });
      qa('.set-value', root).forEach((el) => {
        const t = el.textContent || '';
        if (t.includes('已允许') && P.data.notify.permission !== 'granted') el.textContent = '已拒绝';
      });

    // Command palette: search the real store instead of the spec sample.
    if (state.screen === 'command') {
      if (!state._cmdTouched && state.cmdQuery === '周报') state.cmdQuery = '';
      const input = q('.cmd-input input, .m-cmd-input input', root);
      if (input) {
        input.value = state.cmdQuery;
        if (!input.dataset.bound) {
          input.dataset.bound = '1';
          input.addEventListener('input', () => {
            state._cmdTouched = true;
            state.cmdQuery = input.value;
            state.variant = 'result';
            render();
            const again = q('.cmd-input input, .m-cmd-input input');
            if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
          });

    // AI composer and chips.
    qa('.ai-send', root).forEach((b) => protoAction(b, 'ai-send-proto'));
    qa('.ai-chip', root).forEach((b) => protoAction(b, 'ai-insert-proto'));

    // Widget page is a preview surface: make each widget clickable into the app.
    if (state.screen === 'widgets') {
      qa('.wd-ios, .wd-and', root).forEach((w) => {

  function searchBody(query) {
    const qtext = (query || '').trim();
    if (!qtext) {

        `<button type="button" class="cmd-row" data-proto-action="search-open-todo" data-id="${t.id}">${ico('check', 14)}<span class="cmd-row-main"><span class="cmd-row-t">${esc(t.title)}</span><span class="cmd-row-m">${calOf(t.cal).name} · 待办</span></span><span class="cmd-row-side">待办</span></button>`).join('');

        <button type="button" class="cmd-row" data-proto-action="search-new-event">${ico('calendar', 14)}<span class="cmd-row-main"><span class="cmd-row-t">新建日程</span><span class="cmd-row-m">进入整页创建</span></span><span class="cmd-row-side">动作</span></button>`;
    }
    const lower = qtext.toLowerCase();
    const todos = TODOS.concat(state.localTodos || []).filter((t) => (t.title || '').toLowerCase().includes(lower)).slice(0, 4);
    const events = EVENTS.filter((e) => !state.deletedEvents.includes(e.id) && (e.title || '').toLowerCase().includes(lower)).slice(0, 4);
    if (!todos.length && !events.length) {
      return `<div class="cmd-empty">${ico('search', 23)}<p>没有找到「${esc(qtext)}」</p><button type="button" class="mini-btn" style="margin-top:10px" data-proto-action="search-new-todo">用这句话新建待办</button></div>`;
    }
    let out = '';
    if (todos.length) {
      out += '<div class="cmd-group">待办</div>' + todos.map((t) =>
        `<button type="button" class="cmd-row" data-proto-action="search-open-todo" data-id="${t.id}">${ico('check', 14)}<span class="cmd-row-main"><span class="cmd-row-t">${esc(t.title)}</span><span class="cmd-row-m">${calOf(t.cal).name}${t.due ? ' · 截止 ' + dueText(t) : ''}</span></span><span class="cmd-row-side">待办</span></button>`).join('');
    }
    if (events.length) {
      out += '<div class="cmd-group">日程</div>' + events.map((e) =>
        `<button type="button" class="cmd-row" data-proto-action="search-open-event" data-id="${e.id}">${ico('calendar', 14)}<span class="cmd-row-main"><span class="cmd-row-t">${esc(e.title)}</span><span class="cmd-row-m">${calOf(e.cal).name} · ${mdShort(e.date || e.startDate || TODAY)}</span></span><span class="cmd-row-side">日程</span></button>`).join('');
    }
    out += `<div class="cmd-group">动作</div>
      <button type="button" class="cmd-row" data-proto-action="search-new-todo">${ico('plus', 14)}<span class="cmd-row-main"><span class="cmd-row-t">新建待办</span><span class="cmd-row-m">标题“${esc(qtext)}”</span></span><span class="cmd-row-side">动作</span></button>`;
    return out;
  }

  registerAction('search-open-todo', (el) => P.openTodo(el.dataset.id));
  registerAction('search-open-event', (el) => P.openEvent(el.dataset.id));
  registerAction('search-new-todo', () => {
    P.baseGo('new-todo');

    setTimeout(() => { const i = q('#new-title'); if (i && state.cmdQuery) i.value = state.cmdQuery; }, 30);

  registerAction('search-new-event', () => {
    P.baseGo('new-event');

    setTimeout(() => { const i = q('#new-title'); if (i && state.cmdQuery) i.value = state.cmdQuery; }, 30);

    const rows = qa('.simple-wrap .trash-row, .edit-body .trash-row', root);

  registerAction('trash-restore-proto', (el) => {
    const title = el.dataset.trashTitle || '这一项';
    if (!TODOS.some((t) => t.title === title)) {
      TODOS.unshift({ id: 'restored-' + Date.now(), title, cal: 'personal', priority: 0, tags: [], status: 'open' });
    }
    P.data.hiddenTrash = P.data.hiddenTrash || [];
    P.data.hiddenTrash.push(title);
    render();
    toast('已恢复 · ' + title);
  });

  registerAction('trash-delete-proto', (el) => {
    const title = el.dataset.trashTitle || '这一项';
    P.data.hiddenTrash = P.data.hiddenTrash || [];
    if (!P.data.hiddenTrash.includes(title)) P.data.hiddenTrash.push(title);
    render();
    toast('已永久删除 · ' + title);
  });

  registerAction('trash-clear-proto', () => {
    P.data.hiddenTrash = qa('.trash-row .trash-main > div').map((x) => (x.textContent || '').trim());
    render();
    toast('回收站已清空');
  });

  registerAction('fb-copy-proto', () => {
    const text = (q('#fb-text') && q('#fb-text').value) || (q('.form-textarea') && q('.form-textarea').value) || 'DaySpark 反馈';
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => {});
    state.fbCopied = true;
    state.variant = 'copied';
    render();
    toast('已复制反馈内容');
  });
})();

/* DaySpark prototype v2 — AI conversation that can actually write, with confirmation. */
(function () {
  const P = window.Proto;
  const { registerAction, registerEnhancer, modal, toast } = P;
  const q = (s, r) => (r || document).querySelector(s);
  const qa = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

  // Restore a local transcript if one was saved.
  if (Array.isArray(P.data.aiMessages) && P.data.aiMessages.length && typeof AI_THREAD !== 'undefined') {
    AI_THREAD.splice(0, AI_THREAD.length, ...P.data.aiMessages);
  }
  function saveThread() {
    if (typeof AI_THREAD !== 'undefined') P.data.aiMessages = AI_THREAD.map((m) => ({ role: m.role, text: m.text, actions: !!m.actions, act: m.act || null }));
  }
  function fmtM(n) { const x = Math.max(0, Math.min(1439, Math.round(n))); return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0'); }
  function minsM(t) { const a = String(t || '0:0').split(':').map(Number); return a[0] * 60 + a[1]; }
  function openTodos() {
    return allTodos().filter((t) => t.status !== 'done' && !isDone(t) && !state.deletedTodos.includes(t.id));
  }
  function titleScore(title, text) {
    if (!title) return 0;
    if (text.includes(title)) return 1000;
    let hits = 0;
    for (let i = 0; i < title.length - 1; i++) {
      const pair = title.slice(i, i + 2);
      if (/[\s，,。：:、]/.test(pair)) continue;
      if (text.includes(pair)) hits++;
    }
    return hits;
  }
  function findTarget(text) {
    const list = openTodos();
    const scored = list.map((t) => [t, titleScore(t.title, text)]).sort((a, b) => b[1] - a[1]);
    if (scored.length && scored[0][1] >= 2) return scored[0][0];
    if (state.drawer && state.drawer.type === 'todo') {
      const t = todoById(state.drawer.id);
      if (t && !isDone(t)) return t;
    }
    return null;
  }
  function busyOn(day) {
    const arr = [];
    (window.eventsOn ? window.eventsOn(day) : []).forEach((e) => { if (!e.allDay && e.start) arr.push([minsM(e.start), minsM(e.end)]); });
    (window.plansOn ? window.plansOn(day) : []).forEach((p) => arr.push([p.start, p.end]));
    return arr.sort((a, b) => a[0] - b[0]);
  }
  function nextFreeSlot(day, dur) {
    const busy = busyOn(day);
    let t = 9 * 60;
    busy.forEach(([s, e]) => { if (s < t + dur) t = Math.max(t, e); });
    if (t > 20 * 60 - dur) t = 9 * 60;
    return { start: fmtM(t), end: fmtM(t + dur), busy: busy.length };
  }
  function lastUser() {
    const arr = (typeof AI_THREAD !== 'undefined' ? AI_THREAD : []).filter((m) => m.role === 'user');
    return arr.length ? arr[arr.length - 1].text : '';
  }
  function lastAct() {
    const arr = (typeof AI_THREAD !== 'undefined' ? AI_THREAD : []).filter((m) => m.role === 'ai' && m.act);
    return arr.length ? arr[arr.length - 1].act : null;
  }
  function deriveSubtasks(text, t) {
    const m = /拆成[：:]?(.+)$/.exec(text);
    if (m) {
      const parts = m[1].split(/[、,，]/).map((s) => s.trim()).filter(Boolean);
      if (parts.length) return parts;
    }
    return ['梳理「' + t.title + '」需要的材料', '完成初稿', '检查并提交'];
  }
  function reply(text) {
    const target = findTarget(text);
    // "安排一下提交周报" is a scheduling request first; do not let the
    // 周报 keyword turn it into a summary reply with no writable act payload.
    if (/周报|总结|纪要/.test(text) && !/安排|排一下|计划/.test(text)) {
      return { text: target
        ? '可以。我会围绕「' + target.title + '」整理要点；需要的话可以在下一步拆成子任务。'
        : '可以。告诉我具体是哪一条待办，我会围绕它整理要点。' };
    }
    if (/今天|还剩|剩下/.test(text)) {
      const open = openTodos().filter((t) => t.due === TODAY);
      return { text: open.length

  /* ---------------- task context menu ---------------- */
  function closeMenus() { qa('.proto-menu').forEach((m) => m.remove()); }
  document.addEventListener('click', (e) => { if (!e.target.closest('.proto-menu')) closeMenus(); }, true);
  window.addEventListener('scroll', closeMenus, true);

  function taskMenu(row, x, y) {
    const id = row.dataset.id || (row.closest('[data-id]') || {}).dataset?.id;
    const t = id && todoById(id);
    if (!t) return;
    closeMenus();
    const m = document.createElement('div');
    m.className = 'proto-menu';
    const done = isDone(t);
    m.innerHTML = `
      <button type="button" data-m="open">打开详情</button>
      <button type="button" data-m="done">${done ? '取消完成' : '标记完成'}</button>
      <button type="button" data-m="plan">安排时间…</button>
      <button type="button" data-m="tomorrow">顺延到明天</button>
      <button type="button" data-m="cal">移到日历…</button>
      <button type="button" data-m="tag">加标签…</button>
      <div class="sep"></div>
      <button type="button" data-m="copy">复制标题</button>
      <button type="button" data-m="delete" class="danger">删除到回收站</button>`;
    document.body.appendChild(m);
    const rect = m.getBoundingClientRect();
    m.style.left = Math.min(x, innerWidth - rect.width - 8) + 'px';
    m.style.top = Math.min(y, innerHeight - rect.height - 8) + 'px';
    m.addEventListener('click', (e) => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      const act = b.dataset.m;
      closeMenus();
      if (act === 'open') { P.openTodo(t.id); return; }
      if (act === 'done') { if (!state.done) state.done = new Set(); state.done.has(t.id) ? state.done.delete(t.id) : state.done.add(t.id); state.undoId = t.id; render(); return; }
      if (act === 'plan') { state.planTodoId = t.id; state.planReturn = state.screen; P.baseGo('plan-picker'); render(); return; }
      if (act === 'tomorrow') {
        if (t.repeat) { P.openTodo(t.id); toast('重复待办请在详情里改期，避免改动整个系列的锚点'); return; }
        const tomorrow = addDays(TODAY, 1);
        if (t.due) t.due = tomorrow; else t.plan = { date: tomorrow, start: '09:00', end: '09:30' };
        render(); toast('已顺延到明天');
        return;
      }
      if (act === 'cal') {
        choose({
          title: '移到日历', options: calIds().map((id2) => ({ value: id2, label: calOf(id2).name, on: t.cal === id2 })),
          onPick: (v) => { t.cal = v; render(); toast('已移到「' + calOf(v).name + '」'); },
        });
        return;
      }
      if (act === 'tag') {
        if (P.openTagPicker) P.openTagPicker(t.tags || [], (tags) => { t.tags = tags; render(); toast('标签已更新'); });
        return;
      }
      if (act === 'copy') {
        const text = t.title;
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
        toast('已复制标题');
        return;
      }
      if (act === 'delete') {
        if (t.repeat) {
          modal({
            title: '这是「' + t.repeat + '」的重复待办',
            body: '<div class="proto-note">要删除一个实例，还是整个系列？打开详情后可以选择范围。</div>',
            actions: [
              { label: '取消' },
              { label: '打开详情选择范围', primary: true, onClick: () => { P.openTodo(t.id); } },
            ],
          });
          return;
        }
        modal({
          title: '删除「' + t.title + '」？',
          body: '<div class="proto-note">会进回收站，可以恢复，原日历和标签都保留。</div>',
          actions: [
            { label: '取消' },
            { label: '删除', primary: true, danger: true, onClick: () => {
              if (!state.deletedTodos.includes(t.id)) state.deletedTodos.push(t.id);
              state.trashExtra.push({ id: t.id, title: t.title, sub: '待办 · ' + calOf(t.cal).name + ' · 刚刚删除', snap: JSON.parse(JSON.stringify(t)) });
              render(); toast('已删除到回收站');
            } },
          ],
        });
      }
    });
  }

  document.addEventListener('contextmenu', (e) => {

  // Phone: long-press a task row opens the same menu (a visible secondary
  // entry, not a hidden gesture that replaces the row's tap action).
  let longPress = null;
  let suppressLongPressClick = 0;
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' || e.button !== 0) return;
    const row = e.target.closest('.task-row');
    if (!row) return;
    const x = e.clientX, y = e.clientY;
    longPress = { row, x, y, fired: false, timer: setTimeout(() => {
      if (!longPress) return;
      longPress.fired = true;
      suppressLongPressClick = Date.now() + 500;
      taskMenu(row, x, y);
    }, 500) };
  }, true);
  document.addEventListener('pointermove', (e) => {
    if (!longPress || longPress.fired) return;
    if (Math.abs(e.clientX - longPress.x) > 8 || Math.abs(e.clientY - longPress.y) > 8) {
      clearTimeout(longPress.timer); longPress = null;
    }
  }, true);
  ['pointerup', 'pointercancel'].forEach((name) => document.addEventListener(name, () => {
    if (!longPress) return;
    if (!longPress.fired) clearTimeout(longPress.timer);
    longPress = null;
  }, true));
  document.addEventListener('click', (e) => {
    if (Date.now() < suppressLongPressClick && e.target.closest('.task-row')) {
      e.preventDefault(); e.stopPropagation();

  /* ---------------- keyboard ---------------- */
  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable);
    if (e.key === 'Escape') {
      const scrim = qa('.proto-modal-scrim').pop();
      if (scrim) { scrim.remove(); e.preventDefault(); return; }
      closeMenus();
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '?') { e.preventDefault(); P.openShortcuts(); return; }
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); P.baseGo('new-todo'); P.syncHash(true); return; }
    if (e.key === 'e' || e.key === 'E') { e.preventDefault(); P.baseGo('new-event'); P.syncHash(true); return; }
    if (e.key === 't' || e.key === 'T') { e.preventDefault(); state.selectedDate = TODAY; P.baseGo('today'); P.syncHash(true); return; }

  /* ---------------- real fallback: read-only facts ---------------- */
  P.fallback = function (el, root) {
    // Explicitly disabled controls stay disabled and say why.
    if (el.disabled || el.getAttribute('aria-disabled') === 'true') {
      el.classList.add('proto-disabled');
      el.dataset.protoAction = 'disabled-info';
      el.dataset.reason = el.dataset.reason || '这一项在当前状态下不可用。';
      return;
    }
    // Design-sample surfaces from the master are not product pages; say so
    // instead of dressing their sample buttons up as real interactions.
    if (typeof SURFACES !== 'undefined' && state.screen in SURFACES) {
      el.dataset.protoAction = 'demo-surface-info';
      el.dataset.demoLabel = (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40);
      return;
    }
    // Read-only facts: show the actual value and let the user copy it.
    el.dataset.protoAction = 'info-detail';
    const row = el.closest('.set-row, .m-settings-row, .field-row');
    const label = row ? rowLabel(row) : '';
    const value = row ? rowValue(row) : (el.textContent || '').replace(/\s+/g, ' ').trim();
    el.dataset.infoLabel = label || (el.getAttribute('aria-label') || '这一项');
    el.dataset.infoValue = value;

      actions: [{ label: '知道了', primary: true }],
    });
  });
  registerAction('info-detail', (el) => {
    const label = el.dataset.infoLabel || '这一项';

      title: label,
      body: `<div class="proto-list"><div class="proto-list-row"><span class="grow">${esc(value || '—')}<small>只读事实</small></span></div></div><div class="proto-note">这是当前保存的值。需要修改时，使用同一页面里的编辑入口。</div>`,
      actions: [
        { label: '关闭' },

  registerAction('info-open', (el) => {

    const anchor = isEvent ? (item.date || item.startDate || TODAY) : ((item.plan && item.plan.date) || item.due || TODAY);
    const occDay = (state.occurId === item.id && state.occurDate) ? state.occurDate : anchor;
    const calName = calOf(item.cal).name;
    const original = JSON.parse(JSON.stringify(item));
    function trash(extra) {
      state.trashExtra.push({
        id: item.id, title: item.title,
        sub: (isEvent ? '日程' : '待办') + ' · ' + calName + ' · ' + extra,
        snap: original,
      });
    }
    function removeWhole(scopeLabel) {
      if (!isEvent) {
        if (!state.deletedTodos.includes(item.id)) state.deletedTodos.push(item.id);
      } else {
        if (!state.deletedEvents.includes(item.id)) state.deletedEvents.push(item.id);

      title: '删除重复' + (isEvent ? '日程' : '待办'),
      day: occDay,
      onPick: (scope) => {
        if (scope === 'one') {
          state.skipped = state.skipped || [];
          const key = item.id + '@' + occDay;
          if (!state.skipped.includes(key)) state.skipped.push(key);
          state.drawer = null; state.drawerEdit = false; render();
          toast('已删除 ' + occDay + ' 这一次 · 系列保留');
          return;
        }
        if (scope === 'future') {
          const cut = addDays(occDay, -1);
          if (cut < anchor) { removeWhole('整个系列（从第一次起）'); return; }
          // Keep earlier instances: stop the rule the day before this occurrence.
          item.repeatUntil = cut;
          item.repeatEnd = '在日期';
          item.repeatCount = 0;
          trash('已删除 ' + occDay + ' 及以后');
