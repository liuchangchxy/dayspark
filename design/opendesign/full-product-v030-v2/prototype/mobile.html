<!doctype html>
<!--
  Open Design · OD Next handheld shell — Android (centered punch-hole camera, right-side volume and power keys).
  Presentation shell for a phone-app prototype: keep the handset markup and
  CSS, put the product inside the APP CONTENT slot (`.phone-content`). The
  shell sets no typography, palette, spacing, or navigation for the app.
  Derived from the Open Design mobile-app template (Apache-2.0).
-->
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DaySpark · 移动端原型</title>
  <style>
    /* Native hidden remains authoritative over component flex/grid styles. */
    [hidden]:not([hidden="until-found" i]) { display: none !important; }

    :root {
      --phone-screen-width: 412px;
      --phone-screen-height: 915px;
      --phone-bezel: 10px;
      --phone-outer-radius: 46px;
      --phone-screen-radius: 38px;
      --phone-safe-top: 52px;
      --phone-safe-bottom: 28px;
      --phone-system-fg: #17181a;
      --phone-screen-bg: #f3f3ef;
      --phone-stage-bg: #e7e7e2;
    }

    [data-theme="dark"] {
      --phone-system-fg: #f1f3f7;
      --phone-screen-bg: #121310;
      --phone-stage-bg: #0a0b09;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--phone-stage-bg, #e7e7e2);
      color: var(--ink);
      font-family: var(--font-ui);
    }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width, 412px) + var(--phone-bezel, 10px) * 2);
      height: calc(var(--phone-screen-height, 915px) + var(--phone-bezel, 10px) * 2);
      padding: var(--phone-bezel, 10px);
      border-radius: var(--phone-outer-radius, 46px);
      background:
        linear-gradient(145deg, rgba(255,255,255,.2), transparent 18%),
        linear-gradient(155deg, #414348 0%, #23252a 44%, #0c0d10 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.84),
        0 34px 72px -22px rgba(8,10,14,.56),
        0 11px 25px -10px rgba(8,10,14,.34);
      isolation: isolate;
    }

    .phone-frame::before,
    .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 92px;
      bottom: 92px;
      width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.14) 18%, transparent 32%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; }
    .phone-frame::after { right: 0; }

    .hardware-button {
      position: absolute;
      right: -3px;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #08090b, #2d3036 62%, #08090b);
      box-shadow: inset 0 1px rgba(255,255,255,.1);
    }
    .hardware-button.volume { top: 205px; height: 92px; }
    .hardware-button.power { top: 322px; height: 70px; background: linear-gradient(90deg, #08090b, #3c424c 62%, #08090b); }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width, 412px);
      height: var(--phone-screen-height, 915px);
      overflow: hidden;
      border-radius: var(--phone-screen-radius, 38px);
      background: var(--phone-screen-bg, #f6f7f9);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top, 52px);
      padding-bottom: var(--phone-safe-bottom, 28px);
      background: var(--phone-screen-bg, #f6f7f9);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .punch-hole {
      position: absolute;
      z-index: 60;
      top: 14px;
      left: 50%;
      width: 14px;
      height: 14px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #283343 0 10%, #090b0f 30%, #000 72%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), inset 0 0 3px #000;
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      z-index: 50;
      inset: 0 0 auto;
      height: var(--phone-safe-top, 52px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr);
      align-items: start;
      padding: 14px 19px 0;
      color: var(--phone-system-fg, #17181a);
      pointer-events: none;
    }
    .status-time {
      justify-self: start;
      display: flex;
      align-items: center;
      height: 16px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: .01em;
    }
    .status-cutout-zone { width: 64px; }
    .status-icons {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      height: 16px;
      gap: 5px;
    }
    .status-icons svg { display: block; flex: none; fill: currentColor; }
    .status-icons .wifi { width: 15px; height: 12px; }
    .status-icons .cellular { width: 14px; height: 12px; }
    .status-icons .battery { width: 9px; height: 14px; }

    .gesture-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 108px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: var(--phone-system-fg, #17181a);
      opacity: .86;
      pointer-events: none;
    }

    @media (max-height: 998px) { .phone-frame { zoom: 0.9; } }
    @media (max-height: 904px) { .phone-frame { zoom: 0.82; } }
    @media (max-height: 829px) { .phone-frame { zoom: 0.74; } }
    @media (max-height: 754px) { .phone-frame { zoom: 0.66; } }
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }
  </style>
  <link rel="stylesheet" href="../assets/tokens.css" />
  <style>
    /* ---------- DaySpark mobile shell ---------- */
    #overlay { position: absolute; inset: 0; z-index: 40; }
    .sheet.full {
      top: 0; max-height: 100%; border-radius: 0;
      padding-top: var(--phone-safe-top);
    }
    .sheet.full .sheet-body { padding-bottom: 8px; }
    .phone-content { padding-top: var(--phone-safe-top); padding-bottom: var(--phone-safe-bottom); }
    .app { position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--bg); }
    .app > .topbar { flex: none; }
    .app > .screen { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 8px; }
    .app > .screen::-webkit-scrollbar { display: none; }

    .tabbar {
      flex: none; display: grid; grid-template-columns: repeat(3, 1fr);
      background: var(--nav-bg); border-top: 1px solid var(--line-soft);
      padding: 6px 8px 8px;
    }
    .tabbar button {
      border: 0; background: transparent; display: flex; flex-direction: column; align-items: center;
      gap: 3px; padding: 6px 0 4px; border-radius: 12px; color: var(--ink-2);
      font-size: 11px; font-weight: 600; min-height: 56px;
    }
    .tabbar button .ic { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 999px; }
    .tabbar button[aria-current="page"] { color: var(--primary); }
    .tabbar button[aria-current="page"] .ic { background: var(--nav-active); }

    .icon-btn { min-width: 48px; min-height: 48px; }
    .app .btn, #overlay .btn { min-height: 48px; }
    .toast {
      position: absolute; left: 50%; bottom: 74px; transform: translate(-50%, 8px);
      max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px;
      background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600; line-height: 1.4;
      opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .16s ease; z-index: 6;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
    .subtask .check { min-width: 48px; min-height: 48px; }
    .app .check, #overlay .check { width: 48px; height: 48px; margin-top: -8px; margin-bottom: -8px; }
    .topbar .grow { flex: 1 1 auto; min-width: 0; }
    .topbar .primary-action {
      display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px;
      border: 0; border-radius: 10px; background: var(--primary); color: var(--on-primary);
      font-size: 14px; font-weight: 600;
    }
    .topbar .primary-action:hover { background: var(--primary-hover); }

    /* date header */
    .dayhead { padding: 4px 16px 10px; }
    .dayhead h1 { margin: 0; font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; }
    .dayhead .line { margin-top: 2px; font-size: 13px; color: var(--ink-2); }
    .monthbar { display: flex; align-items: baseline; gap: 8px; padding: 2px 16px 8px; }
    .monthbar .m { font-size: 17px; font-weight: 600; }
    .monthbar .y { font-size: 13px; color: var(--ink-3); }

    /* today rows */
    .nowcard {
      margin: 4px 16px 8px; padding: 12px 14px; border-radius: 14px;
      background: var(--surface); border: 1px solid var(--line);
      border-left: 3px solid var(--warm);
    }
    .nowcard { cursor: pointer; }
    .nowcard .nowtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .nowcard .k { font-size: 12px; font-weight: 600; color: var(--warm); letter-spacing: .02em; }
    .nowcard .check { width: 48px; height: 48px; margin: -14px -12px -12px 0; }
    .nowcard .t { margin-top: 2px; font-size: 17px; font-weight: 600; }
    .nowcard .m { margin-top: 2px; font-size: 12px; color: var(--ink-2); }
    .nowcard .bar { margin-top: 10px; height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
    .nowcard .bar > i { display: block; height: 100%; background: var(--warm); }

    .unplanned-shortcut {
      display: flex; align-items: center; gap: 10px; margin: 8px 16px 16px; padding: 12px 14px;
      border: 1px dashed var(--line); border-radius: 12px; background: transparent; width: calc(100% - 32px); min-height: 48px;
      color: var(--ink-2); font-size: 14px; text-align: left;
    }
    .unplanned-shortcut:hover { border-color: var(--ink-3); color: var(--ink); }
    .unplanned-shortcut .n { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink-3); }

    .disclosure {
      display: flex; align-items: center; gap: 8px; width: calc(100% - 32px); margin: 4px 16px 16px;
      min-height: 48px; padding: 10px 0; border: 0; background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 600;
    }
    .disclosure .count { color: var(--ink-3); font-weight: 500; }

    /* segmented + filters */
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 0 16px 8px; }
    .toolbar .grow { flex: 1 1 auto; }
    .toolbar .seg { flex: none; }
    .filter-count { position: absolute; top: 7px; right: 7px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-size: 10px; font-weight: 600; display: grid; place-items: center; padding: 0 4px; }
    .toolbar .icon-btn { position: relative; }
    @media (max-width: 360px) {
      .toolbar { flex-wrap: wrap; }
      .toolbar .seg { flex: 1 1 100%; }
      .toolbar .seg button { flex: 1 1 0; }
      .toolbar > span[style] { display: none; }
      .toolbar [data-act="cal-prev"] { margin-left: auto; }
    }
    .app .seg button { min-height: 48px; min-width: 48px; }
    .app .chip, .phone-content .chip, #overlay .chip { min-width: 48px; min-height: 48px; padding: 0 14px; justify-content: center; }
    #overlay .chip[aria-pressed="true"] { background: var(--primary-soft); border-color: transparent; color: var(--primary); font-weight: 600; }

    /* date strip */
    .strip { display: flex; gap: 4px; padding: 2px 12px 10px; overflow-x: auto; scrollbar-width: none; }
    .strip::-webkit-scrollbar { display: none; }
    .strip button {
      flex: 1 0 48px; min-width: 48px; border: 0; background: transparent; border-radius: 12px;
      padding: 6px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: var(--ink-2); font-size: 11px;
    }
    .strip button .d { font-size: 16px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
    .strip button .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--primary); opacity: 0; }
    .strip button.has .dot { opacity: 1; }
    .strip button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
    .strip button[aria-pressed="true"] .d { color: var(--on-primary); }
    .strip button[aria-pressed="true"] .dot { background: var(--on-primary); }
    @media (max-width: 360px) {
      .strip { gap: 2px; padding-left: 8px; padding-right: 8px; }
      .strip.week button { flex: 1 1 0; min-width: 0; }
    }

    /* calendar month grid */
    .monthgrid { padding: 0 12px 8px; }
    .monthgrid .week { display: grid; grid-template-columns: repeat(7, 1fr); }
    .monthgrid .wd { text-align: center; font-size: 11px; color: var(--ink-3); padding: 6px 0; }
    .monthgrid .cell {
      position: relative; height: 48px; border: 0; background: transparent; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums;
    }
    .monthgrid .cell.out { color: var(--ink-3); opacity: .55; }
    .monthgrid .cell.today { color: var(--primary); font-weight: 600; }
    .monthgrid .cell[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
    .monthgrid .cell .dots { display: flex; gap: 2px; height: 4px; }
    .monthgrid .cell .dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .8; }

    /* time grid */
    .timegrid { position: relative; margin: 0 12px 24px; padding-left: 44px; }
    .timegrid .hour { position: relative; height: 56px; }
    .timegrid .hour span {
      position: absolute; left: -44px; top: -7px; width: 38px; text-align: right;
      font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums;
    }
    .timegrid .hour::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--line-soft); }
    .timegrid .slot { position: absolute; left: 0; right: 0; height: 56px; }
    .timegrid .slot:hover { background: var(--surface-2); }
    .timegrid .nowline { position: absolute; left: 44px; right: 0; height: 2px; background: var(--warm); z-index: 1; pointer-events: none; }
    .timegrid .nowline::before {
      content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--warm);
    }
    .ev {
      position: absolute; left: 46px; right: 8px; border-radius: 8px; padding: 6px 8px;
      z-index: 2;
      background: var(--primary-soft); border-left: 3px solid var(--primary);
      color: var(--ink); overflow: hidden; text-align: left; border-top: 0; border-right: 0; border-bottom: 0;
      font-size: 12px; line-height: 1.3;
    }
    .evtime {
      flex: none; width: 52px; padding-top: 2px; text-align: left;
      font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums;
    }
    .evtime.plan { color: var(--ink-3); }
    .evtime.due { color: var(--warn); }
    .ev .et { font-weight: 600; font-size: 12px; }
    .ev .em { color: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
    .ev.plan { background: var(--surface); border: 1px dashed var(--ink-3); border-left: 3px solid var(--ink-3); }
    .ev.compact { padding: 3px 7px; }
    .ev.compact .em { display: none; }
    .ev.compact .et { font-size: 11px; line-height: 1.1; }
    .hollow { display: inline-block; width: 7px; height: 7px; border: 1.4px solid currentColor; border-radius: 1px; margin-right: 6px; vertical-align: 0.5px; opacity: .75; }
    .deadlane .dh .hollow { margin-right: 0; width: 8px; height: 8px; }
    .deadlane { margin: 0 16px 10px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .deadlane .dh { display: flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 11px; color: var(--warn); background: var(--warn-soft); font-weight: 600; }
    .deadlane .dlrows { display: flex; gap: 6px; padding: 8px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
    .deadlane .dlrows::-webkit-scrollbar { display: none; }
    .deadlane button { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; max-width: 200px; scroll-snap-align: start; min-height: 48px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 6px 10px; text-align: left; font-size: 12.5px; color: var(--ink); }
    .deadlane .tm { flex: none; color: var(--warn); font-variant-numeric: tabular-nums; font-weight: 600; }

    /* week agenda */
    .wkday { margin: 0 16px; }
    .wkday + .wkday { border-top: 1px solid var(--line-soft); }
    .wkday-head { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px; padding: 4px 0; border: 0; background: transparent; text-align: left; color: var(--ink); }
    .wkday-head .d { font-size: 13.5px; font-weight: 600; }
    .wkday-head .today-pill { font-size: 10px; color: var(--primary); background: var(--primary-soft); border-radius: 999px; padding: 1px 7px; font-weight: 600; }
    .wkday-head .n { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .wkday-body { margin: 0 0 8px 7px; padding-left: 14px; border-left: 1px solid var(--line); }
    .agrow { display: flex; align-items: flex-start; gap: 10px; width: 100%; min-height: 48px; padding: 7px 0; border: 0; background: transparent; text-align: left; color: var(--ink); }
    .agrow .tm { flex: none; width: 42px; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-top: 1px; }
    html[data-clock="12"] .agrow .tm { width: 54px; }
    .agrow .bar { flex: none; width: 3px; align-self: stretch; border-radius: 2px; background: var(--primary); }
    .agrow.plan .bar { background: var(--ink-3); }
    .agrow.due .bar { background: var(--warn); }
    .agrow .tt { display: block; font-size: 14px; line-height: 1.35; }
    .agrow .mt { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
    .agrow.due .mt { color: var(--warn); }
    .wkempty { font-size: 12.5px; color: var(--ink-3); padding: 4px 0 10px; }

    /* settings */
    .settings-head { padding: 4px 16px 12px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
    .group-label { padding: 16px 20px 6px; font-size: 12px; color: var(--ink-3); font-weight: 600; }
    .swatches { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 12px 12px; }
    .swatches button {
      width: 48px; height: 48px; border: 0; background: transparent; display: grid; place-items: center;
    }
    .swatches i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
    .swatches button[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
    .theme-seg { display: flex; gap: 4px; padding: 8px 16px 12px; }
    .theme-seg button {
      flex: 1 1 0; min-width: 0; border: 1px solid var(--line); background: var(--surface);
      border-radius: 10px; min-height: 48px; font-size: 13px; color: var(--ink-2);
    }
    .theme-seg button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 600; }

    /* todo detail */
    .detail-title { font-size: 22px; line-height: 1.3; font-weight: 600; margin: 0; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .kv { display: grid; grid-template-columns: 88px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line-soft); font-size: 14px; }
    .kv .k { color: var(--ink-3); font-size: 13px; }
    .subtask { display: flex; align-items: center; gap: 8px; padding: 6px 0; }

    /* search */
    .searchbar { display: flex; align-items: center; gap: 8px; margin: 4px 16px 12px; padding: 0 12px; background: var(--surface-2); border-radius: 12px; }
    .searchbar input { flex: 1 1 auto; border: 0; background: transparent; min-height: 48px; outline: none; font-size: 15px; }
    .searchbar input::-webkit-search-cancel-button, .searchbar input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
    .result-kind { padding: 12px 16px 4px; font-size: 12px; color: var(--ink-3); font-weight: 600; }

    /* widget-free desktop-only helpers stay unused here */
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- visual polish: paper, ink, one accent ---------- */
    .app { background: var(--bg); }
    .app > .topbar { min-height: 54px; padding: 2px 8px 0 16px; background: var(--bg); }
    .topbar .title { font-size: 26px; font-weight: 600; letter-spacing: 0; }
    .topbar .primary-action {
      background: transparent; color: var(--primary); min-height: 44px; padding: 0 10px;
      border-radius: 8px; font-size: 14px; font-weight: 600;
    }
    .topbar .primary-action:hover { background: var(--primary-soft); }
    .icon-btn { color: var(--ink-2); border-radius: 8px; }
    .icon-btn:hover { background: var(--surface-2); }

    .dayhead { padding: 2px 16px 12px; }
    .dayhead h1 { font-size: 26px; font-weight: 600; letter-spacing: 0; line-height: 1.3; }
    .dayhead .line { margin-top: 4px; font-size: 13px; color: var(--ink-3); }
    .monthbar { padding: 2px 16px 10px; }
    .monthbar .m { font-size: 17px; font-weight: 600; }
    .monthbar .y { color: var(--ink-3); }

    .nowcard {
      margin: 0 16px 4px; padding: 14px 0 16px; cursor: pointer;
      border: 0; border-top: 1px solid var(--line); border-radius: 0;
      background: transparent;
    }
    .nowcard:hover { background: transparent; }
    .nowcard .k { font-size: 11px; letter-spacing: .06em; font-weight: 600; color: var(--warm); }
    .nowcard .t { margin-top: 4px; font-size: 20px; font-weight: 600; letter-spacing: 0; line-height: 1.35; }
    .nowcard .m { margin-top: 3px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .nowcard .bar { margin-top: 12px; height: 2px; background: var(--line); }
    .nowcard .bar > i { background: var(--warm); }

    .unplanned-shortcut {
      margin: 2px 16px 10px; padding: 14px 0; border: 0; border-top: 1px solid var(--line-soft);
      border-radius: 0; background: transparent; color: var(--ink-2); font-size: 13px;
    }
    .unplanned-shortcut:hover { border-color: var(--line-soft); color: var(--ink); }
    .unplanned-shortcut .n { color: var(--ink-3); }
    .disclosure { color: var(--ink-2); font-weight: 500; }
    .disclosure .count { color: var(--ink-3); }

    .section-label { padding: 22px 16px 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--ink-3); }
    .row { min-height: 52px; padding: 10px 16px; }
    .row .name { font-size: 15px; font-weight: 400; line-height: 1.45; }
    .row .meta { font-size: 12px; color: var(--ink-3); gap: 0 6px; }
    .row .meta > span + span::before { margin-right: 6px; }
    .row .trail .dot { width: 6px; height: 6px; opacity: .8; }
    .check span { width: 20px; height: 20px; border-width: 1.5px; }

    .toolbar { padding: 0 16px 10px; gap: 6px; }
    .seg { background: var(--surface-2); border-radius: 8px; }
    .seg button { font-weight: 500; }
    .seg button[aria-selected="true"] { box-shadow: 0 1px 2px rgba(20,20,16,.07); }

    .strip { padding: 2px 16px 12px; gap: 2px; }
    .strip button { border-radius: 8px; padding: 6px 0 8px; color: var(--ink-3); gap: 3px; }
    .strip button .d {
      width: 30px; height: 30px; display: grid; place-items: center;
      border-radius: 50%; font-size: 15px; font-weight: 500; color: var(--ink);
    }
    .strip button[aria-pressed="true"] { background: transparent; color: var(--primary); }
    .strip button[aria-pressed="true"] .d { background: var(--primary); color: var(--on-primary); font-weight: 600; }
    .strip button[aria-pressed="true"] .dot { background: var(--primary); }
    .strip button .dot { width: 3px; height: 3px; opacity: 0; }
    .strip button.has .dot { opacity: .55; }

    .monthgrid { padding: 0 16px 12px; }
    .monthgrid .wd { font-size: 11px; font-weight: 500; color: var(--ink-3); padding: 8px 0; }
    .monthgrid .cell { height: 48px; gap: 2px; border-radius: 0; font-size: 14px; }
    .monthgrid .cell > span:first-child { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; }
    .monthgrid .cell.today { color: var(--primary); font-weight: 500; }
    .monthgrid .cell[aria-pressed="true"] { background: transparent; color: var(--ink); }
    .monthgrid .cell[aria-pressed="true"] > span:first-child { background: var(--primary); color: var(--on-primary); font-weight: 600; }
    .monthgrid .cell .dots i { width: 3px; height: 3px; opacity: .5; }

    .timegrid { margin: 0 16px 24px; padding-left: 46px; }
    .timegrid .hour span { left: -46px; width: 40px; font-size: 10.5px; color: var(--ink-3); }
    .timegrid .hour::after { background: var(--line-soft); }
    .ev {
      left: 48px; right: 0; padding: 6px 8px; border-radius: 6px;
      background: color-mix(in srgb, var(--ev-color, var(--primary)) 11%, var(--surface));
      border: 0;
      border-left: 2px solid var(--ev-color, var(--primary));
    }
    .ev.plan { background: transparent; border: 1px dashed var(--line); border-left: 2px solid var(--ink-3); }
    .ev .et { font-weight: 600; }
    .ev .em { color: var(--ink-2); }

    .deadlane { margin: 0 16px 14px; border: 0; border-radius: 0; overflow: visible; }
    .deadlane .dh { padding: 0 0 7px; background: transparent; font-size: 11px; font-weight: 600; letter-spacing: .03em; color: var(--warn); }
    .deadlane .dlrows { padding: 0 0 2px; gap: 8px; }
    .deadlane button {
      min-height: 48px; max-width: 210px; padding: 6px 10px; border: 0; border-radius: 6px;
      background: var(--surface-2); font-size: 12px;
    }
    .deadlane .tm { font-weight: 600; }

    .wkday { margin: 0 16px; }
    .wkday + .wkday { border-top: 1px solid var(--line); }
    .wkday-head .d { font-size: 13px; font-weight: 600; }
    .wkday-head .today-pill { background: transparent; color: var(--primary); padding: 0; font-size: 10.5px; font-weight: 600; }
    .wkday-body { margin-left: 0; padding-left: 14px; border-left: 1px solid var(--line-soft); }
    .agrow .tm { width: 44px; font-size: 11.5px; }
    html[data-clock="12"] .agrow .tm { width: 56px; }
    .agrow .bar { width: 2px; opacity: .9; }
    .agrow .tt { font-size: 14px; line-height: 1.4; }
    .agrow .mt { font-size: 11.5px; }

    .settings-head { padding: 2px 16px 12px; font-size: 26px; font-weight: 600; letter-spacing: 0; }
    .group-label { padding: 22px 20px 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--ink-3); }
    .group { margin: 0 16px 20px; border: 1px solid var(--line-soft); border-radius: 10px; }
    .setting-row { min-height: 50px; padding: 6px 16px; }
    .setting-row .label { font-size: 15px; font-weight: 400; }
    .setting-row .value { font-size: 13px; color: var(--ink-3); }
    .theme-seg { padding: 10px 16px 14px; }
    .theme-seg button { background: transparent; border: 1px solid var(--line); border-radius: 8px; font-weight: 500; color: var(--ink-2); }
    .theme-seg button[aria-pressed="true"] { background: var(--surface-2); border-color: var(--line); color: var(--ink); font-weight: 600; }
    .swatches i { width: 24px; height: 24px; }

    .detail-title { font-size: 24px; font-weight: 600; letter-spacing: 0; line-height: 1.4; }
    #overlay .detail-meta .chip { border-radius: 6px; }
    .kv { grid-template-columns: 76px 1fr; padding: 12px 0; font-size: 14px; }
    .kv .k { font-size: 12.5px; color: var(--ink-3); }

    .searchbar { margin: 2px 16px 12px; padding: 0 12px; background: var(--surface-2); border-radius: 8px; }
    .searchbar input { font-size: 15px; }
    .result-kind { font-size: 11px; font-weight: 600; letter-spacing: .04em; }

    .tabbar { padding: 4px 8px 6px; border-top: 1px solid var(--line); background: var(--nav-bg); }
    .tabbar button { min-height: 52px; gap: 2px; border-radius: 8px; color: var(--ink-3); font-size: 11px; font-weight: 500; }
    .tabbar button .ic { width: 48px; height: 28px; border-radius: 0; background: transparent; }
    .tabbar button[aria-current="page"] { color: var(--primary); }
    .tabbar button[aria-current="page"] .ic { background: transparent; }

    .sheet { border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; }
    .sheet-head { padding: 16px 16px 10px; }
    .sheet-title { font-size: 17px; font-weight: 600; letter-spacing: 0; }
    .sheet-grip { background: var(--surface-3); }
    .btn { border-radius: 8px; font-weight: 600; }
    .btn.secondary { background: transparent; border-color: var(--line); }
    .btn.sm { border-radius: 6px; }
    .input { border-radius: 8px; }

    /* second-pass polish: quiet metadata, sheet actions at thumb, no ornamental dots */
    .row .trail { display: none; }
    .sheet.full .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .sheet.full .sheet-foot { flex: none; }
    .detail-meta { gap: 8px 16px; margin-top: 12px; align-items: center; }
    #overlay .detail-meta .chip {
      min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent;
      color: var(--ink-2); font-size: 13px; gap: 6px;
    }
    #overlay .detail-meta .chip.warm { background: transparent; color: var(--warn); }
    #overlay .detail-meta .chip.danger { background: transparent; color: var(--danger); }
    #overlay .detail-meta .chip.on { background: transparent; color: var(--success); }
    #overlay .kv .chip {
      min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent;
      color: var(--ink-2); font-size: 13.5px; gap: 6px;
    }
    #overlay .kv .chip .dot { width: 6px; height: 6px; }
    .empty .empty-sub { max-width: 300px; }
    #overlay .detail-meta .chip, #overlay .kv .chip {
      min-width: 0; min-height: 0; padding: 0; border: 0; background: transparent;
    }
    [data-theme="dark"] .ev {
      background: color-mix(in srgb, var(--ev-color, var(--primary)) 17%, var(--surface));
      border-left-color: color-mix(in srgb, var(--ev-color, var(--primary)) 60%, #fff);
    }
    [data-theme="dark"] .agrow .bar { filter: brightness(1.45) saturate(1.05); }
  </style>
</head>
<body>
  <div class="phone-frame" data-phone-shell data-platform="android">
    <span class="hardware-button volume" aria-hidden="true"></span>
    <span class="hardware-button power" aria-hidden="true"></span>

    <section class="phone-screen" data-phone-screen>
      <main class="phone-content" data-phone-content>
        <!-- APP CONTENT START -->
        <div class="app" id="app">
          <header class="topbar" id="topbar"></header>
          <div class="screen" id="screen"></div>
          <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
        <!-- APP CONTENT END -->
      </main>
      <div id="overlay" hidden></div>

      <div class="status-bar" aria-hidden="true">
        <span class="status-time">14:30</span>
        <span class="status-cutout-zone"></span>
        <span class="status-icons">
          <svg class="wifi" viewBox="0 0 16 12"><path d="M8 11.4 6.55 9.95a2.05 2.05 0 0 1 2.9 0L8 11.4Zm3.58-3.55-1.16 1.16a3.43 3.43 0 0 0-4.84 0L4.42 7.85a5.08 5.08 0 0 1 7.16 0Zm3-2.95-1.16 1.16a7.67 7.67 0 0 0-10.84 0L1.42 4.9a9.31 9.31 0 0 1 13.16 0Z"/></svg>
          <svg class="cellular" viewBox="0 0 14 12"><path d="M1 11h2V8.5H1V11Zm3.35 0h2V6H4.35v5Zm3.35 0h2V3.5h-2V11Zm3.35 0h2V1h-2v10Z"/></svg>
          <svg class="battery" viewBox="0 0 9 14"><path d="M3 0h3v1H3V0ZM2 1.5h5a1.25 1.25 0 0 1 1.25 1.25v9.75A1.5 1.5 0 0 1 6.75 14h-4.5a1.5 1.5 0 0 1-1.5-1.5V2.75A1.25 1.25 0 0 1 2 1.5Z"/></svg>
        </span>
      </div>
      <div class="punch-hole" aria-hidden="true"></div>
      <div class="gesture-indicator" aria-hidden="true"></div>
    </section>
  </div>

  <script src="../assets/icons.js"></script>
  <script src="../assets/store.js"></script>
  <script>
  (function () {
    'use strict';
    var DS = window.DS, ic = window.icon;
    var app = document.getElementById('app');
    var screenEl = document.getElementById('screen');
    var topbar = document.getElementById('topbar');
    var tabbar = document.getElementById('tabbar');
    var overlay = document.getElementById('overlay');

    var START_TAB = { '今天': 'today', '日历': 'calendar', '待办': 'todos' };
    var route = { name: START_TAB[DS.state.settings.defaultTab] || 'today' };
    function applyClock() { document.documentElement.dataset.clock = DS.state.settings.timeFormat === '12 小时' ? '12' : '24'; }
    applyClock();
    var ui = { todoView: DS.state.ui.todoView, calendarView: 'week', selectedDay: DS.NOW, monthCursor: new Date(DS.NOW.getFullYear(), DS.NOW.getMonth(), 1) };

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
    function calDot(id) { var c = DS.calendar(id); return '<i class="dot" style="background:' + c.color + '"></i>'; }

    /* ---------------- navigation ---------------- */
    var mainReturn = route.name;
    var aiBusy = false, aiError = '', aiPrompt = '', syncBusy = false, syncMsg = '';
    function go(name) {
      if (['settings', 'search'].indexOf(name) >= 0 && ['today', 'calendar', 'todos'].indexOf(route.name) >= 0) mainReturn = route.name;
      route = { name: name };
      if (name === 'todos') route.todoView = ui.todoView;
      closeOverlay(true);
      render();
      screenEl.scrollTop = 0;
    }

    var toastTimer = null;
    function toast(msg) {
      var el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
    }

    function renderTabs() {
      var items = [
        { id: 'today', label: '今天', icon: 'today' },
        { id: 'calendar', label: '日历', icon: 'calendar' },
        { id: 'todos', label: '待办', icon: 'todo' }
      ];
      tabbar.innerHTML = items.map(function (it) {
        var cur = (route.name === it.id) || (route.name === 'search' && it.id === 'todos');
        return '<button data-act="tab" data-id="' + it.id + '"' + (cur ? ' aria-current="page"' : '') + '>' +
          '<span class="ic">' + ic(it.icon, 22) + '</span><span>' + it.label + '</span></button>';
      }).join('');
    }

    /* ---------------- top bar ---------------- */
    function topbarFor() {
      var titles = {
        today: ['今天', DS.fmt.weekday(DS.NOW) + ' · ' + DS.fmt.md(DS.NOW)],
        calendar: ['日历', DS.fmt.md(ui.selectedDay) + ' · ' + DS.fmt.weekday(ui.selectedDay)],
        todos: [ui.todoView === 'unplanned' ? '未安排' : (ui.todoView === 'all' ? '全部待办' : '待办'), ''],
        search: ['搜索', ''],
        settings: ['设置', ''],
        calendars: ['日历管理', ''],
        tags: ['标签', ''],
        trash: ['回收站', ''],
        ai: ['AI 助手', ''],
        sync: ['同步', '']
      };
      var t = titles[route.name] || ['DaySpark', ''];
      var backable = ['settings', 'calendars', 'tags', 'trash', 'ai', 'sync', 'search'].indexOf(route.name) >= 0;
      var left = backable
        ? '<button class="icon-btn" data-act="back" aria-label="返回">' + ic('back', 22) + '</button>'
        : '';
      if (route.name === 'today') t = ['', ''];
      var right = '';
      if (['today', 'calendar', 'todos'].indexOf(route.name) >= 0) {
        right = '<button class="icon-btn" data-act="open-search" aria-label="搜索">' + ic('search', 22) + '</button>' +
          '<button class="icon-btn" data-act="go" data-id="settings" aria-label="设置">' + ic('settings', 21) + '</button>' +
          (route.name === 'today'
            ? '<button class="primary-action" data-act="create-chooser">' + ic('plus', 18) + '新建</button>'
            : route.name === 'calendar'
              ? '<button class="primary-action" data-act="new-event">' + ic('plus', 18) + '日程</button>'
              : '<button class="primary-action" data-act="new-todo">' + ic('plus', 18) + '待办</button>');
      }
      topbar.innerHTML = left +
        '<div class="grow"><div class="title">' + esc(t[0]) + '</div>' + (t[1] ? '<div class="sub">' + esc(t[1]) + '</div>' : '') + '</div>' +
        right;
    }

    /* ---------------- rows ---------------- */
    function todoRow(t, opts) {
      opts = opts || {};
      var meta = [];
      if (t.allocation) meta.push('<span>计划 ' + DS.fmt.time(t.allocation.start) + '–' + DS.fmt.time(t.allocation.end) + '</span>');
      if (t.due) {
        var overdue = !t.done && new Date(t.due) < DS.NOW && !DS.sameDay(t.due, DS.NOW);
        var label = (overdue ? '逾期 ' : '截止 ') + DS.fmt.due(t);
        meta.push('<span class="' + (overdue ? 'danger' : '') + '">' + esc(label) + '</span>');
      }
      if (t.repeat) meta.push('<span>' + esc({ daily: '每天', weekly: '每周', monthly: '每月' }[t.repeat]) + '</span>');
      if (t.reminders && t.reminders.length) meta.push('<span>提醒</span>');
      if (t.subtasks && t.subtasks.length) {
        var done = t.subtasks.filter(function (s) { return s.done; }).length;
        meta.push('<span>' + done + '/' + t.subtasks.length + ' 子任务</span>');
      }
      return '<div class="row" data-act="open-todo" data-id="' + t.id + '" role="button" tabindex="0">' +
        '<button class="check" data-act="toggle-todo" data-id="' + t.id + '" role="checkbox" aria-checked="' + (t.done ? 'true' : 'false') + '" aria-label="完成 ' + esc(t.title) + '"><span>' + ic('check', 14) + '</span></button>' +
        '<div class="main"><div class="name' + (t.done ? ' done' : '') + '">' + esc(t.title) + '</div>' +
        (meta.length ? '<div class="meta">' + meta.join('') + '</div>' : '') + '</div>' +
        '<div class="trail">' + calDot(t.calendarId) + '</div></div>';
    }

    function eventRow(e) {
      var allDay = e.allDay;
      return '<button class="row" data-act="open-event" data-id="' + e.id + '">' +
        '<span class="evtime">' + (allDay ? '全天' : DS.fmt.time(e.start)) + '</span>' +
        '<div class="main"><div class="name">' + esc(e.title) + '</div>' +
        '<div class="meta">' + (e.location ? '<span>' + esc(e.location) + '</span>' : '') +
        (allDay ? '' : '<span>' + DS.fmt.range(e.start, e.end) + '</span>') + '</div></div>' +
        '<div class="trail">' + calDot(e.calendarId) + '</div></button>';
    }

    function allocationRow(t, opts) {
      opts = opts || {};
      var check = opts.check
        ? '<button class="check" data-act="toggle-todo" data-id="' + t.id + '" role="checkbox" aria-checked="false" aria-label="完成 ' + esc(t.title) + '"><span>' + ic('check', 14) + '</span></button>'
        : '';
      return '<div class="row" data-act="open-todo" data-id="' + t.id + '" role="button" tabindex="0">' + check +
        (opts.check ? '' : '<span class="evtime plan">' + DS.fmt.time(t.allocation.start) + '</span>') +
        '<div class="main"><div class="name">' + esc(t.title) + '</div>' +
        '<div class="meta"><span>计划执行 ' + DS.fmt.range(t.allocation.start, t.allocation.end) + '</span>' +
        (t.due ? '<span class="warn">截止 ' + esc(DS.fmt.due(t)) + '</span>' : '') + '</div></div>' +
        '<div class="trail">' + calDot(t.calendarId) + '</div></div>';
    }

    /* ---------------- today ---------------- */
    function renderToday() {
      var m = DS.todayModel();
      var html = '<div class="dayhead"><h1>今天</h1><div class="line">' +
        esc(DS.fmt.weekday(DS.NOW) + '，' + DS.fmt.md(DS.NOW)) + ' · ' +
        (m.unplanned.length ? '未安排 ' + m.unplanned.length + ' 项' : '全部已安排') + '</div></div>';

      if (m.current.length) {
        html += m.current.map(function (item) {
          var start = item.start, end = item.end;
          var pct = Math.max(4, Math.min(100, Math.round((DS.NOW - start) / (end - start) * 100)));
          var isPlan = item.kind === 'allocation';
          var ref = isPlan ? item.todo : item.ref;
          var check = isPlan
            ? '<button class="check" data-act="toggle-todo" data-id="' + ref.id + '" role="checkbox" aria-checked="' + (ref.done ? 'true' : 'false') + '" aria-label="完成 ' + esc(ref.title) + '"><span>' + ic('check', 14) + '</span></button>'
            : '';
          return '<div class="nowcard" data-act="' + (isPlan ? 'open-todo' : 'open-event') + '" data-id="' + ref.id + '" role="button" tabindex="0">' +
            '<div class="nowtop"><div class="k">' + (isPlan ? '正在执行' : '正在进行') + '</div>' + check + '</div>' +
            '<div class="t">' + esc(ref.title) + '</div>' +
            '<div class="m">' + DS.fmt.range(start, end) + (isPlan ? ' · 计划执行' : '') + '</div>' +
            '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
        }).join('');
      }

      if (m.later.length) {
        html += '<div class="section-label">接下来</div>' + m.later.map(function (item) {
          return item.kind === 'event' ? eventRow(item.ref) : allocationRow(item.todo, { check: true });
        }).join('');
      }
      if (m.dueToday.length) {
        html += '<div class="section-label">今天截止</div>' + m.dueToday.map(function (t) { return todoRow(t); }).join('');
      }
      if (m.overdue.length) {
        html += '<div class="section-label danger">已逾期</div>' + m.overdue.map(function (t) { return todoRow(t); }).join('');
      }
      if (m.unplanned.length) {
        html += '<button class="unplanned-shortcut" data-act="tab" data-id="todos">' + ic('inbox', 18) +
          '<span>未安排</span><span class="n">' + m.unplanned.length + ' 项</span>' + ic('chevronRight', 16) + '</button>';
      }
      if (!m.current.length && !m.later.length && !m.dueToday.length && !m.overdue.length) {
        html += '<div class="empty"><div style="color:var(--ink-3)">' + ic('today', 28) + '</div>' +
          '<div class="empty-title">今天没有固定安排</div>' +
          '<div class="empty-sub">从待办里挑一件，安排到今天的时间轴，它就会出现在这里。</div>' +
          '<button class="btn secondary sm" data-act="tab" data-id="todos" style="margin-top:8px">去待办挑选</button></div>';
      }

      var doneAll = m.completed.concat(m.earlier.map(function (x) { return { title: x.kind === 'event' ? x.ref.title : x.todo.title }; }));
      if (doneAll.length) {
        html += '<button class="disclosure" data-act="toggle-done"><span>已完成</span><span class="count">' + doneAll.length + '</span><span style="flex:1"></span>' + ic('chevronDown', 16) + '</button>';
        if (doneOpen) {
          html += m.earlier.map(function (item) {
            return item.kind === 'event' ? eventRow(item.ref) : allocationRow(item.todo);
          }).join('');
          html += m.completed.map(function (t) { return todoRow(t); }).join('');
        }
      }
      html += '<div style="height:24px"></div>';
      return html;
    }
    var doneOpen = false;

    /* ---------------- todos ---------------- */
    var todoFilters = { cal: null, tag: null, prio: null };
    function applyTodoFilters(list) {
      return list.filter(function (t) {
        if (todoFilters.cal && t.calendarId !== todoFilters.cal) return false;
        if (todoFilters.tag && t.tags.indexOf(todoFilters.tag) < 0) return false;
        if (todoFilters.prio != null && t.priority !== todoFilters.prio) return false;
        return true;
      });
    }
    function todosForView() {
      var list;
      if (ui.todoView === 'unplanned') list = DS.unplanned();
      else if (ui.todoView === 'all') list = DS.activeTodos();
      else list = DS.dueOn(ui.selectedDay);
      return applyTodoFilters(list);
    }

    function openFilterSheet() {
      var temp = { cal: todoFilters.cal, tag: todoFilters.tag, prio: todoFilters.prio, hide: DS.state.settings.hideCompleted };
      function chip(act, id, label, on) {
        return '<button class="chip' + (on ? ' on' : '') + '" data-act="' + act + '" data-id="' + (id == null ? '' : id) + '">' + label + '</button>';
      }
      var body = '<div class="section-label" style="padding-left:0">日历</div><div style="display:flex;flex-wrap:wrap;gap:6px">' +
        chip('flt-cal', '', '全部', !temp.cal) + DS.state.calendars.map(function (c) { return chip('flt-cal', c.id, esc(c.name), temp.cal === c.id); }).join('') + '</div>' +
        '<div class="section-label" style="padding-left:0">标签</div><div style="display:flex;flex-wrap:wrap;gap:6px">' +
        chip('flt-tag', '', '全部', !temp.tag) + DS.state.tags.map(function (t) { return chip('flt-tag', t.id, esc(t.name), temp.tag === t.id); }).join('') + '</div>' +
        '<div class="section-label" style="padding-left:0">优先级</div><div style="display:flex;flex-wrap:wrap;gap:6px">' +
        chip('flt-prio', '', '全部', temp.prio == null) + ['低', '中', '高'].map(function (n, i) { return chip('flt-prio', i + 1, n, temp.prio === i + 1); }).join('') + '</div>' +
        '<div class="group" style="margin:16px 0 4px"><button class="setting-row" data-act="flt-hide"><span class="label">隐藏已完成</span><span class="value">' + (temp.hide ? '已开启' : '已关闭') + '</span></button></div>';
      openPanel(sheet('筛选与显示', body,
        '<button class="btn ghost" data-act="flt-clear">清除</button><span style="flex:1"></span><button class="btn" data-act="flt-apply">应用</button>'), { focus: false });
      overlay.__flt = { temp: temp };
    }

    function renderTodos() {
      var hides = DS.state.settings.hideCompleted;
      var html = '<div class="toolbar"><div class="seg" role="tablist">' +
        [['unplanned', '未安排'], ['all', '全部待办'], ['date', '按日期']].map(function (v) {
          return '<button role="tab" aria-selected="' + (ui.todoView === v[0]) + '" data-act="todo-view" data-id="' + v[0] + '">' + v[1] + '</button>';
        }).join('') + '</div><span style="flex:1"></span>' +
        '<button class="icon-btn" data-act="todo-filter" aria-label="筛选与显示">' + ic('filter', 20) +
        ((todoFilters.cal ? 1 : 0) + (todoFilters.tag ? 1 : 0) + (todoFilters.prio != null ? 1 : 0) ? '<span class="filter-count">' + ((todoFilters.cal ? 1 : 0) + (todoFilters.tag ? 1 : 0) + (todoFilters.prio != null ? 1 : 0)) + '</span>' : '') + '</button></div>';

      if (ui.todoView === 'date') {
        html += dateStrip(ui.selectedDay);
      }

      var list = todosForView();
      if (!list.length) {
        html += '<div class="empty">' + ic('todo', 30) +
          '<div class="empty-title">' + (ui.todoView === 'unplanned' ? '没有未安排的待办' : '这里还没有待办') + '</div>' +
          '<div class="empty-sub">' + (ui.todoView === 'unplanned'
            ? '每个待办都已经有执行时间。想找没排期的，切到“全部待办”。'
            : '把要做的事写下来，先不用决定什么时候做。') + '</div>' +
          '<button class="btn sm" data-act="new-todo" style="margin-top:8px">' + ic('plus', 16) + '新建待办</button></div>';
      } else {
        html += '<div class="section-label">' + (ui.todoView === 'unplanned' ? '没有计划执行时间' : (ui.todoView === 'all' ? '全部待办' : DS.fmt.dayLabel(ui.selectedDay) + '截止')) + ' · ' + list.length + '</div>';
        html += list.map(function (t) { return todoRow(t); }).join('');
      }

      if (!hides) {
        var done = DS.doneTodos();
        if (done.length) {
          html += '<div class="section-label">已完成 · ' + done.length + '</div>' + done.map(function (t) { return todoRow(t); }).join('');
        }
      }
      html += '<div style="height:24px"></div>';
      return html;
    }

    function weekStrip(selected) {
      var base = DS.startOfDay(selected);
      var offset = DS.weekIndex(base);
      var start = DS.addDays(base, -offset);
      var out = '<div class="strip week">';
      for (var i = 0; i < 7; i++) {
        var d = DS.addDays(start, i);
        var has = DS.dueOn(d).length > 0 || DS.eventsOn(d).length > 0 || DS.allocationsOn(d).length > 0;
        out += '<button data-act="pick-day" data-id="' + d.toISOString() + '" aria-pressed="' + DS.sameDay(d, selected) + '" class="' + (has ? 'has' : '') + '">' +
          '<span>' + DS.fmt.weekday(d).replace('周', '') + '</span><span class="d">' + d.getDate() + '</span><span class="dot"></span></button>';
      }
      return out + '</div>';
    }

    function dateStrip(selected) {
      var base = DS.startOfDay(selected);
      var start = DS.addDays(base, -3);
      var out = '<div class="strip days">';
      for (var i = 0; i < 10; i++) {
        var d = DS.addDays(start, i);
        var has = DS.dueOn(d).length > 0;
        out += '<button data-act="pick-day" data-id="' + d.toISOString() + '" aria-pressed="' + DS.sameDay(d, selected) + '" class="' + (has ? 'has' : '') + '">' +
          '<span>' + DS.fmt.weekday(d).replace('周', '') + '</span><span class="d">' + d.getDate() + '</span><span class="dot"></span></button>';
      }
      return out + '</div>';
    }

    /* ---------------- calendar ---------------- */
    function renderCalendar() {
      var v = ui.calendarView;
      var html = '<div class="toolbar"><div class="seg">' +
        [['day', '日'], ['week', '周'], ['month', '月']].map(function (x) {
          return '<button aria-selected="' + (v === x[0]) + '" data-act="cal-view" data-id="' + x[0] + '">' + x[1] + '</button>';
        }).join('') + '</div><span style="flex:1"></span>' +
        '<button class="btn sm secondary" data-act="cal-today">今天</button>' +
        '<button class="icon-btn" data-act="cal-prev" aria-label="上一段">' + ic('chevronLeft', 20) + '</button>' +
        '<button class="icon-btn" data-act="cal-next" aria-label="下一段">' + ic('chevronRight', 20) + '</button></div>';

      if (v === 'month') {
        html += renderMonth();
        html += '<div class="section-label">' + esc(DS.fmt.dayLabel(ui.selectedDay)) + ' · ' + esc(DS.fmt.weekday(ui.selectedDay)) + '</div>';
        html += renderAgenda(ui.selectedDay);
      } else if (v === 'week') {
        html += weekStrip(ui.selectedDay);
        html += renderWeekAgenda(ui.selectedDay);
      } else {
        html += dateStrip(ui.selectedDay);
        html += renderDeadlines(ui.selectedDay);
        html += renderTimeGrid(ui.selectedDay, true);
      }
      return html;
    }

    function renderWeekAgenda(day) {
      var base = DS.startOfDay(day);
      var offset = DS.weekIndex(base);
      var start = DS.addDays(base, -offset);
      var out = '';
      for (var i = 0; i < 7; i++) {
        var d = DS.addDays(start, i);
        var rows = [];
        var planned = {};
        DS.eventsOn(d).forEach(function (e) {
          rows.push({ s: new Date(e.start), html: '<button class="agrow" data-act="open-event" data-id="' + e.id + '"><span class="tm">' + DS.fmt.time(e.start) + '</span><span class="bar" style="background:' + DS.calendar(e.calendarId).color + '"></span><span><span class="tt">' + esc(e.title) + '</span><span class="mt">' + DS.fmt.range(e.start, e.end) + (e.location ? ' · ' + esc(e.location) : '') + '</span></span></button>' });
        });
        DS.allocationsOn(d).forEach(function (t) {
          planned[t.id] = true;
          var dl = t.due && DS.sameDay(new Date(t.due), d) ? ' · 截止 ' + (t.dueHasTime ? DS.fmt.time(t.due) : DS.fmt.md(t.due)) : '';
          rows.push({ s: new Date(t.allocation.start), html: '<button class="agrow plan" data-act="open-todo" data-id="' + t.id + '"><span class="tm">' + DS.fmt.time(t.allocation.start) + '</span><span class="bar"></span><span><span class="tt">' + esc(t.title) + '</span><span class="mt">计划执行 · ' + DS.fmt.range(t.allocation.start, t.allocation.end) + dl + '</span></span></button>' });
        });
        DS.dueOn(d).forEach(function (t) {
          if (t.done || planned[t.id]) return;
          rows.push({ s: t.due ? new Date(t.due) : d, html: '<button class="agrow due" data-act="open-todo" data-id="' + t.id + '"><span class="tm">' + (t.dueHasTime ? DS.fmt.time(t.due) : '截止') + '</span><span class="bar"></span><span><span class="tt">' + esc(t.title) + '</span><span class="mt">截止' + (t.dueHasTime ? '' : ' · ' + DS.fmt.md(t.due)) + '</span></span></button>' });
        });
        rows.sort(function (a, b) { return a.s - b.s; });
        out += '<div class="wkday"><button class="wkday-head" data-act="week-open-day" data-id="' + d.toISOString() + '">' +
          '<span class="d">' + DS.fmt.weekday(d) + ' · ' + DS.fmt.md(d) + '</span>' +
          (DS.sameDay(d, DS.NOW) ? '<span class="today-pill">今天</span>' : '') +
          '<span class="n">' + (rows.length ? rows.length + ' 项' : '') + '</span></button>' +
          '<div class="wkday-body">' + (rows.length ? rows.map(function (r) { return r.html; }).join('') : '<div class="wkempty">没有安排</div>') + '</div></div>';
      }
      return out + '<div style="height:24px"></div>';
    }

    function renderMonth() {
      var cur = ui.monthCursor;
      var first = new Date(cur.getFullYear(), cur.getMonth(), 1);
      var startOffset = DS.weekIndex(first);
      var gridStart = DS.addDays(first, -startOffset);
      var heads = DS.state.settings.weekStart === '周日' ? ['日', '一', '二', '三', '四', '五', '六'] : ['一', '二', '三', '四', '五', '六', '日'];
      var out = '<div class="monthbar"><span class="m">' + (cur.getMonth() + 1) + '月</span><span class="y">' + cur.getFullYear() + '</span></div>' +
        '<div class="monthgrid"><div class="week">' + heads.map(function (h) { return '<div class="wd">' + h + '</div>'; }).join('') + '</div>';
      for (var w = 0; w < 6; w++) {
        out += '<div class="week">';
        for (var d = 0; d < 7; d++) {
          var day = DS.addDays(gridStart, w * 7 + d);
          var inMonth = day.getMonth() === cur.getMonth();
          var items = DS.eventsOn(day).length + DS.allocationsOn(day).length;
          var dots = '';
          for (var k = 0; k < Math.min(items, 3); k++) dots += '<i></i>';
          out += '<button class="cell' + (inMonth ? '' : ' out') + (DS.sameDay(day, DS.NOW) ? ' today' : '') + '" data-act="pick-month-day" data-id="' + day.toISOString() + '" aria-pressed="' + DS.sameDay(day, ui.selectedDay) + '">' +
            '<span>' + day.getDate() + '</span><span class="dots">' + dots + '</span></button>';
        }
        out += '</div>';
      }
      return out + '</div>';
    }

    function renderDeadlines(day) {
      var due = DS.dueOn(day).slice().sort(function (a, b) {
        var ka = a.dueHasTime ? new Date(a.due).getTime() : new Date(day + 'T23:59').getTime();
        var kb = b.dueHasTime ? new Date(b.due).getTime() : new Date(day + 'T23:59').getTime();
        return ka - kb;
      });
      if (!due.length) return '';
      return '<div class="deadlane"><div class="dh"><i class="hollow"></i>截止（不占用时间） · ' + due.length + '</div>' +
        '<div class="dlrows">' + due.map(function (t) {
          return '<button data-act="open-todo" data-id="' + t.id + '"><span class="tm">' + (t.dueHasTime ? DS.fmt.time(t.due) : '全天') + '</span><span class="od-truncate">' + esc(t.title) + '</span></button>';
        }).join('') + '</div></div>';
    }

    function renderAgenda(day) {
      var evs = DS.eventsOn(day), plans = DS.allocationsOn(day);
      var planned = {};
      plans.forEach(function (t) { planned[t.id] = true; });
      var due = DS.dueOn(day).filter(function (t) { return !t.done && !planned[t.id]; });
      if (!evs.length && !plans.length && !due.length) {
        return '<div class="empty"><div class="empty-title">这一天还是空的</div><div class="empty-sub">点下面的“日程”新建一个，或从待办里安排执行时间。</div></div>';
      }
      var rows = evs.map(function (e) { return { s: new Date(e.start), html: eventRow(e) }; })
        .concat(plans.map(function (t) { return { s: new Date(t.allocation.start), html: allocationRow(t) }; }))
        .concat(due.map(function (t) {
          var endOfDay = new Date(day); endOfDay.setHours(23, 59, 0, 0);
          return { s: t.due ? new Date(t.due) : endOfDay, html: dueRow(t) };
        }))
        .sort(function (a, b) { return a.s - b.s; });
      return '<div>' + rows.map(function (r) { return r.html; }).join('') + '</div>';
    }

    function dueRow(t) {
      return '<div class="row" data-act="open-todo" data-id="' + t.id + '" role="button" tabindex="0">' +
        '<button class="check" data-act="toggle-todo" data-id="' + t.id + '" role="checkbox" aria-checked="false" aria-label="完成 ' + esc(t.title) + '"><span>' + ic('check', 14) + '</span></button>' +
        '<span class="evtime due">' + (t.dueHasTime ? DS.fmt.time(t.due) : '全天') + '</span>' +
        '<div class="main"><div class="name">' + esc(t.title) + '</div>' +
        '<div class="meta"><span class="warn">截止 ' + esc(DS.fmt.due(t)) + '</span></div></div>' +
        '<div class="trail">' + calDot(t.calendarId) + '</div></div>';
    }

    function renderTimeGrid(day, withNow) {
      var START = 8, END = 22, H = 56;
      var out = '<div class="timegrid" style="height:' + ((END - START) * H) + 'px">';
      for (var h = START; h < END; h++) {
        out += '<div class="hour"><span>' + DS.fmt.hour(h) + '</span>' +
          '<button class="slot" data-act="slot" data-id="' + day.toISOString() + '" data-hour="' + h + '" aria-label="在 ' + DS.fmt.hour(h) + ' 新建"></button></div>';
      }
      DS.eventsOn(day).forEach(function (e) {
        var s = new Date(e.start), en = new Date(e.end);
        var top = ((s.getHours() + s.getMinutes() / 60) - START) * H;
        var height = Math.max(26, ((en - s) / 3600000) * H);
        if (top + height < 0 || top > (END - START) * H) return;
        out += '<button class="ev' + (height < 44 ? ' compact' : '') + '" data-act="open-event" data-id="' + e.id + '" style="top:' + top + 'px;height:' + height + 'px;--ev-color:' + DS.calendar(e.calendarId).color + '">' +
          '<div class="et">' + esc(e.title) + '</div><div class="em">' + DS.fmt.range(s, en) + '</div></button>';
      });
      DS.allocationsOn(day).forEach(function (t) {
        var s = new Date(t.allocation.start), en = new Date(t.allocation.end);
        var top = ((s.getHours() + s.getMinutes() / 60) - START) * H;
        var height = Math.max(26, ((en - s) / 3600000) * H);
        out += '<button class="ev plan' + (height < 44 ? ' compact' : '') + '" data-act="open-todo" data-id="' + t.id + '" style="top:' + top + 'px;height:' + height + 'px">' +
          '<div class="et"><i class="hollow"></i>' + esc(t.title) + '</div><div class="em">计划 · ' + DS.fmt.range(s, en) + '</div></button>';
      });
      if (withNow && DS.sameDay(day, DS.NOW)) {
        var mins = (DS.NOW.getHours() + DS.NOW.getMinutes() / 60 - START) * H;
        if (mins > 0 && mins < (END - START) * H) out += '<div class="nowline" style="top:' + mins + 'px"></div>';
      }
      return out + '</div>';
    }

    /* ---------------- search ---------------- */
    function renderSearch() {
      return '<div class="searchbar">' + ic('search', 18) +
        '<input id="search-input" type="search" placeholder="搜索待办、日程、备注" autocomplete="off" />' +
        '<button class="icon-btn" data-act="close-search" aria-label="取消">' + ic('close', 18) + '</button></div>' +
        '<div id="search-results"><div class="empty"><div class="empty-sub">输入关键词开始搜索。结果会按待办与日程分组。</div></div></div>';
    }

    function runSearch(q) {
      var box = document.getElementById('search-results');
      if (!box) return;
      if (!q.trim()) {
        box.innerHTML = '<div class="empty"><div class="empty-sub">输入关键词开始搜索。结果会按待办与日程分组。</div></div>';
        return;
      }
      var r = DS.search(q);
      if (!r.todos.length && !r.events.length) {
        box.innerHTML = '<div class="empty">' + ic('search', 26) + '<div class="empty-title">没有找到“' + esc(q) + '”</div>' +
          '<div class="empty-sub">试试更短的关键词，或检查是否在回收站里。</div></div>';
        return;
      }
      var html = '';
      if (r.todos.length) html += '<div class="result-kind">待办 · ' + r.todos.length + '</div>' + r.todos.map(function (t) { return todoRow(t); }).join('');
      if (r.events.length) html += '<div class="result-kind">日程 · ' + r.events.length + '</div>' + r.events.map(eventRow).join('');
      box.innerHTML = html;
    }

    /* ---------------- settings ---------------- */
    function renderSettings() {
      var s = DS.state.settings;
      var accents = [
        ['蓝', '#2D4F7C'], ['青', '#3F6B68'], ['绿', '#4C6B55'], ['橙', '#8A5237'], ['紫', '#63556F'], ['玫红', '#85525F']
      ];
      var html = '';

      html += '<div class="group-label">通用</div><div class="group">' +
        '<div style="padding:10px 16px 4px"><div style="font-size:14px;font-weight: 600">主题</div></div>' +
        '<div class="theme-seg">' +
        [['system', '跟随系统'], ['light', '浅色'], ['dark', '深色']].map(function (x) {
          return '<button data-act="set-theme" data-id="' + x[0] + '" aria-pressed="' + (s.theme === x[0]) + '">' + x[1] + '</button>';
        }).join('') + '</div>' +
        '<div style="padding:4px 16px 0;font-size:14px;font-weight: 600">主题色</div>' +
        '<div class="swatches">' + accents.map(function (a) {
          return '<button data-act="set-accent" data-id="' + a[1] + '" aria-pressed="' + (s.accent === a[0]) + '" aria-label="' + a[0] + '"><i style="background:' + a[1] + '">' + (s.accent === a[0] ? ic('check', 14) : '') + '</i></button>';
        }).join('') + '</div></div>';

      html += '<div class="group"><button class="setting-row" data-act="pick-language"><span class="label">语言</span><span class="value">' + esc(s.language) + '</span>' + ic('chevronRight', 16) + '</button>' +
        '<button class="setting-row" data-act="pick-default-tab"><span class="label">启动时打开</span><span class="value">' + esc(s.defaultTab) + '</span>' + ic('chevronRight', 16) + '</button>' +
        '<button class="setting-row" data-act="pick-week-start"><span class="label">周起始日</span><span class="value">' + esc(s.weekStart) + '</span>' + ic('chevronRight', 16) + '</button>' +
        '<button class="setting-row" data-act="pick-time-format"><span class="label">时间格式</span><span class="value">' + esc(s.timeFormat) + '</span>' + ic('chevronRight', 16) + '</button></div>';

      html += '<div class="group-label">日历</div><div class="group">' +
        '<button class="setting-row" data-act="go" data-id="calendars"><span style="color:var(--ink-2)">' + ic('calendar', 20) + '</span><span class="label">日历管理</span><span class="value">' + DS.state.calendars.length + ' 个</span>' + ic('chevronRight', 16) + '</button>' +
        '<button class="setting-row" data-act="go" data-id="tags"><span style="color:var(--ink-2)">' + ic('tag', 20) + '</span><span class="label">标签</span><span class="value">' + DS.state.tags.length + ' 个</span>' + ic('chevronRight', 16) + '</button></div>';

      html += '<div class="group-label">通知与提醒</div><div class="group">' +
        '<div class="setting-row"><span class="label">通知权限</span><span class="value">已允许</span></div>' +
        '<div class="setting-row"><span class="label">提醒声音</span><span class="value">系统默认</span></div></div>';

      html += '<div class="group-label">数据</div><div class="group">' +
        '<button class="setting-row" data-act="data-sheet" data-id="ics-in"><span style="color:var(--ink-2)">' + ic('download', 20) + '</span><span class="label">导入 .ics</span></button>' +
        '<button class="setting-row" data-act="data-sheet" data-id="ics-out"><span style="color:var(--ink-2)">' + ic('upload', 20) + '</span><span class="label">导出 .ics</span><span class="value">全部日历</span></button>' +
        '<button class="setting-row" data-act="data-sheet" data-id="backup-out"><span style="color:var(--ink-2)">' + ic('file', 20) + '</span><span class="label">导出完整备份</span></button>' +
        '<button class="setting-row" data-act="data-sheet" data-id="backup-in"><span style="color:var(--ink-2)">' + ic('restore', 20) + '</span><span class="label">合并备份</span></button></div>';

      html += '<div class="group-label">同步</div><div class="group">' +
        '<button class="setting-row" data-act="go" data-id="sync"><span style="color:var(--ink-2)">' + ic('sync', 20) + '</span><span class="label">同步</span><span class="value">' + (s.syncAuthed ? '已登录' : (s.syncServer ? '已配置' : '未登录')) + '</span>' + ic('chevronRight', 16) + '</button></div>';

      html += '<div class="group-label">AI 助手</div><div class="group">' +

    function openCategoryEditor(kind, id) {
      var isCal = kind === 'calendar';
      var colors = ['#4F6D8C', '#6F5D7E', '#4F7368', '#9A6248', '#8F5A68', '#6B7048'];
      var isNew = !id;
      var item = isNew
        ? { id: null, name: '', color: colors[(isCal ? DS.state.calendars.length : DS.state.tags.length) % colors.length] }
        : DS.byId(isCal ? DS.state.calendars : DS.state.tags, id);
      if (!item) return;
      function paint(mode, name, color) {
        name = name == null ? item.name : name;
        color = color || item.color;
        var body;
        if (mode === 'confirm') {
          body = '<div class="help" style="padding:4px 0 14px;font-size:13.5px">删除“' + esc(name) + '”？' +
            (isCal ? '其中的待办和日程会移到另一个日历。' : '待办上的这个标签会被移除。') + '</div>';
        } else {
          body = '<div class="field"><label for="ce-name">名称</label><input class="input" id="ce-name" value="' + esc(name) + '"></div>' +
            '<div class="section-label" style="padding-left:0">颜色</div>' +
            '<div style="display:flex;gap:10px;padding:4px 0 8px">' + colors.map(function (c) {
              return '<button data-act="ce-color" data-id="' + c + '" aria-pressed="' + (color === c) + '" aria-label="颜色 ' + c + '" style="width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center">' +
                '<i style="width:28px;height:28px;border-radius:50%;background:' + c + ';display:grid;place-items:center;color:#fff;box-shadow:' + (color === c ? '0 0 0 2px var(--surface),0 0 0 4px var(--ink)' : 'none') + '">' + (color === c ? ic('check', 14) : '') + '</i></button>';
            }).join('') + '</div>';
        }
        var canDelete = !isNew && (!isCal || DS.state.calendars.length > 1);
        var foot = mode === 'confirm'
          ? '<button class="btn ghost" data-act="ce-back">返回</button><span style="flex:1"></span><button class="btn danger" data-act="ce-confirm">删除</button>'
          : (canDelete ? '<button class="btn ghost" data-act="ce-delete" style="color:var(--danger)">删除</button>' : '') + '<span style="flex:1"></span><button class="btn" data-act="ce-save">保存</button>';
        var title = isNew ? (isCal ? '新建日历' : '新建标签') : (isCal ? '编辑日历' : '编辑标签');
        openPanel(sheet(mode === 'confirm' ? '确认删除' : title, body, foot), { focus: mode !== 'confirm' });
        overlay.__ce = { kind: kind, id: id, name: name, color: color, mode: mode, paint: paint, isNew: isNew };
        var inp = document.getElementById('ce-name');
        if (inp) {
          inp.addEventListener('input', function () { overlay.__ce.name = inp.value; });
          setTimeout(function () { inp.focus(); inp.select(); }, 120);
        }
      }
      paint('edit');
    }

    function openDataSheet(kind) {

        'backup-in': { title: '合并备份', intro: '合并备份中的内容，不删除现有数据。同一项以较新的修改为准。', file: 'dayspark-backup.json', run: '选择文件并合并', done: '备份已合并', doneSub: '现有数据保留；重复项按较新的修改合并。', pick: true }
      };

        body += '<div class="group" style="margin:0 0 12px"><button class="setting-row" data-act="data-pick"><span class="label">文件</span><span class="value" id="data-file">未选择</span>' + ic('file', 18) + '</button></div>';
      }

        body += '<div class="section-label" style="padding-left:0">日历</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' +
          [['全部', 'all'], ['个人', 'c1'], ['工作', 'c2'], ['学习', 'c3']].map(function (x, i) {
            return '<button class="chip" data-act="data-opt" aria-pressed="' + (i === 0) + '">' + x[0] + '</button>';
          }).join('') + '</div>';
      }
      if (kind === 'ics-out') {
        body += '<div class="section-label" style="padding-left:0">范围</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' +
          ['全部', '今年', '本月'].map(function (x, i) {
            return '<button class="chip" data-act="data-opt" aria-pressed="' + (i === 0) + '">' + x[0] + '</button>';
          }).join('') + '</div>';
      }
      if (kind === 'backup-out') {
        body += '<div class="section-label" style="padding-left:0">包含</div><div style="display:flex;gap:6px;flex-wrap:wrap">' +
          ['待办与日程', '标签与日历', '设置', '回收站'].map(function (x, i) {
            return '<button class="chip" data-act="data-opt" aria-pressed="' + (i < 3) + '">' + x + '</button>';
          }).join('') + '</div>';
      }
      if (kind === 'backup-in') {
        body += '<div class="section-label" style="padding-left:0">处理方式</div><div style="display:flex;gap:6px;flex-wrap:wrap">' +
          ['合并（推荐）', '用备份替换'].map(function (x, i) {
            return '<button class="chip" data-act="data-opt" aria-pressed="' + (i === 0) + '">' + x + '</button>';
          }).join('') + '</div>';
      }
      openPanel(sheet(cf.title, body, '<span style="flex:1"></span><button class="btn" data-act="data-run">' + cf.run + '</button>'), { focus: false });
      overlay.__data = { kind: kind, file: null };

    function dataSuccess() {
      var d = overlay.__data; if (!d) return;
      var text = {
        'ics-in': ['日程已导入', '这些日程已加入所选日历。'],
        'ics-out': ['已生成 .ics', '文件包含所选日历中的日程。'],
        'backup-out': ['备份已生成', '请把文件保存在安全的位置。'],

      }[d.kind];

        '<span style="flex:1"></span><button class="btn" data-act="close-overlay">完成</button>'), { focus: false });

    function renderTrash() {      var list = DS.trashedTodos();
      if (!list.length) return '<div class="empty">' + ic('trash', 28) + '<div class="empty-title">回收站是空的</div><div class="empty-sub">删除的待办会先放在这里，30 天后清空。</div></div>';
      return '<div class="section-label">已删除 · ' + list.length + '</div>' + list.map(function (t) {
        return '<div class="row"><div class="main"><div class="name">' + esc(t.title) + '</div><div class="meta">删除于 ' + DS.fmt.dayLabel(t.deletedAt) + '</div></div>' +
          '<button class="btn sm secondary" data-act="restore-todo" data-id="' + t.id + '">恢复</button>' +
          '<button class="icon-btn" data-act="purge-todo" data-id="' + t.id + '" aria-label="永久删除">' + ic('trash', 18) + '</button></div>';
      }).join('');
    }

    function renderAI() {
      var s = DS.state.settings;
      var on = !!s.aiEnabled, model = s.aiModel || '', keySet = !!s.aiKeySet;
      var ready = on && model && keySet;
      var chev = ic('chevronRight', 16);
      var html = '<div class="group-label">AI 助手</div>' +
        '<div class="group"><div class="setting-row"><span class="label">启用 AI 助手</span>' +
        '<button class="chip' + (on ? ' on' : '') + '" data-act="toggle-ai" aria-pressed="' + on + '">' + (on ? '已启用' : '已关闭') + '</button></div>' +
        '<button class="setting-row" data-act="ai-provider"><span class="label">服务商</span><span class="value">' + esc(s.aiProvider || 'OpenAI 兼容') + '</span>' + chev + '</button>' +
        '<button class="setting-row" data-act="ai-model"><span class="label">模型</span><span class="value">' + (model ? esc(model) : '未配置') + '</span>' + chev + '</button>' +
        '<button class="setting-row" data-act="ai-key"><span class="label">API 密钥</span><span class="value">' + (keySet ? '已保存' : '未配置') + '</span>' + chev + '</button></div>';
      html += '<div class="help" style="padding:0 20px 16px">' +
        (!on ? '启用后可以在新建待办时用一句话生成标题、截止和提醒。'
          : !ready ? '还需要填写模型与 API 密钥才能使用。'
            : '已配置 ' + esc(s.aiProvider || 'OpenAI 兼容') + ' · ' + esc(model) + '。') + '</div>';
      if (ready) {
        html += '<div class="section-label" style="padding-left:20px">试用</div>' +
          '<div style="padding:0 20px"><input class="input" id="ai-prompt" value="' + esc(aiPrompt) + '" placeholder="例如：周五前交设计稿，提前一天提醒" aria-label="AI 试用输入">' +
          '<button class="btn secondary" data-act="ai-try" style="width:100%;margin-top:10px"' + (aiBusy ? ' disabled' : '') + '>' + (aiBusy ? '生成中…' : '生成待办') + '</button>' +
          (aiBusy ? '<div class="help">正在请求模型…</div>' : '') +
          (aiError ? '<div class="help" style="color:var(--danger)">' + esc(aiError) + '</div>' : '') +
          '<div class="help">原型不会把输入或密钥发送到任何服务。</div></div>';
      }
      return html;
    }

    function renderSync() {
      var s = DS.state.settings;
      var authed = !!s.syncAuthed;
      var chev = ic('chevronRight', 16);
      var html = '<div class="group-label">DaySpark 同步</div>' +
        '<div class="help" style="padding:0 20px 12px">用自己的同步服务器在设备之间同步待办与日程，不经过第三方云。</div>' +
        '<div class="group">' +
        '<button class="setting-row" data-act="sync-edit" data-id="server"><span class="label">同步服务器</span><span class="value">' + (s.syncServer ? esc(s.syncServer) : '未设置') + '</span>' + chev + '</button>' +
        '<button class="setting-row" data-act="sync-edit" data-id="email"><span class="label">邮箱</span><span class="value">' + (s.syncEmail ? esc(s.syncEmail) : '—') + '</span>' + chev + '</button>' +
        '<button class="setting-row" data-act="sync-edit" data-id="password"><span class="label">密码</span><span class="value">' + (s.syncPassSet ? '已保存' : '—') + '</span>' + chev + '</button>' +
        '<div class="setting-row"><span class="label">账号状态</span><span class="value">' + (authed ? '已登录' : '未登录') + '</span></div>' +
        (authed ? '<div class="setting-row"><span class="label">上次同步</span><span class="value">' + esc(s.syncLast || '尚未同步') + '</span></div>' : '') +
        '</div>';
      html += '<div style="padding:0 16px">' + (authed
        ? '<button class="btn" data-act="sync-now" style="width:100%"' + (syncBusy ? ' disabled' : '') + '>' + (syncBusy ? '同步中…' : '立即同步') + '</button>' +
          '<button class="btn ghost" data-act="sync-logout" style="width:100%;margin-top:8px">退出登录</button>'
        : '<div style="display:flex;gap:8px"><button class="btn" data-act="sync-login" style="flex:1">登录</button>' +
          '<button class="btn secondary" data-act="sync-register" style="flex:1">注册</button></div>') + '</div>';
      if (syncMsg) html += '<div class="help" style="padding:10px 20px 0;color:var(--danger)">' + esc(syncMsg) + '</div>';
      html += '<div class="help" style="padding:14px 20px 16px">原型只演示界面状态，不发起网络请求；密码不会以明文保存。</div>';
