    /* ---------------- render ---------------- */
    function render() {
      renderTabs();
      topbarFor();
      var html = '';
      switch (route.name) {
        case 'today': html = renderToday(); break;
        case 'calendar': html = renderCalendar(); break;
        case 'todos': html = renderTodos(); break;
        case 'search': html = renderSearch(); break;
        case 'settings': html = renderSettings(); break;
        case 'calendars': html = renderCalendars(); break;
        case 'tags': html = renderTags(); break;
        case 'trash': html = renderTrash(); break;
        case 'ai': html = renderAI(); break;
        case 'sync': html = renderSync(); break;
      }
      screenEl.innerHTML = html;
      if (route.name === 'search') {
        var input = document.getElementById('search-input');
        if (input) {
          input.addEventListener('input', function () { runSearch(input.value); });
          setTimeout(function () { input.focus(); }, 60);
        }
      }
    }

    /* ---------------- overlay + sheets ---------------- */
    var overlayOpen = false;

    function closeOverlay(immediate) {
      if (!overlayOpen) return;
      overlayOpen = false;
      var scrim = overlay.querySelector('.scrim');
      var sheet = overlay.querySelector('.sheet');
      if (scrim) scrim.classList.remove('show');
      if (sheet) sheet.classList.remove('show');
      var done = function () { overlay.hidden = true; overlay.innerHTML = ''; };
      if (immediate) done(); else setTimeout(done, 180);
    }

    function openPanel(inner, opts) {
      opts = opts || {};
      overlay.hidden = false;
      overlay.innerHTML = '<div class="scrim" data-act="close-overlay"></div>' + inner;
      overlayOpen = true;
      requestAnimationFrame(function () {
        var scrim = overlay.querySelector('.scrim');
        if (scrim) scrim.classList.add('show');
        var sheet = overlay.querySelector('.sheet');
        if (sheet) sheet.classList.add('show');
      });
      var first = overlay.querySelector('input, textarea, button');
      if (first && opts.focus !== false) setTimeout(function () {
        if (first.tagName === 'INPUT' || first.tagName === 'TEXTAREA') first.focus();
      }, 200);
    }

    function sheet(titleText, body, foot) {
      return '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(titleText) + '">' +
        '<div class="sheet-grip"></div>' +
        '<div class="sheet-head"><div class="sheet-title od-fill od-truncate">' + esc(titleText) + '</div>' +
        '<button class="icon-btn" data-act="close-overlay" aria-label="关闭">' + ic('close', 20) + '</button></div>' +
        '<div class="sheet-body">' + body + '</div>' +
        (foot ? '<div class="sheet-foot">' + foot + '</div>' : '') + '</div>';
    }

    function openTextSheet(titleText, label, value, onSave, type) {
      openPanel(sheet(titleText,
        '<div class="field"><label for="text-sheet-input">' + esc(label) + '</label>' +
        '<input class="input" id="text-sheet-input" type="' + (type || 'text') + '" value="' + esc(value || '') + '" placeholder="' + esc(label) + '"></div>',
        '<button class="btn ghost" data-act="close-overlay">取消</button><span style="flex:1"></span><button class="btn" data-act="text-save">保存</button>'), { focus: false });
      overlay.__text = { onSave: onSave };
      var inp = document.getElementById('text-sheet-input');
      if (inp) {
        setTimeout(function () { inp.focus(); inp.select(); }, 120);
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); var sv = document.querySelector('[data-act="text-save"]'); if (sv) sv.click(); }
        });
      }
    }

    function field(label, control, help) {
      return '<div class="field"><label>' + esc(label) + '</label>' + control + (help ? '<div class="help">' + esc(help) + '</div>' : '') + '</div>';
    }

    /* quick create */
    function openQuickCreate(prefill) {
      var d = prefill || {};
      var from = (route.name === 'today' || route.name === 'todos') ? route.name : 'todos';
      var draft = {
        title: d.title || '', due: d.due || null, dueHasTime: !!d.dueHasTime, calendarId: d.calendarId || DS.state.calendars[0].id,
        priority: 0, tags: [], reminders: [], notes: '', subtasks: [], allocation: d.allocation || null, repeat: null
      };
      var more = false;
      function body() {
        var b = '<div class="field"><label for="qc-title">标题</label><input class="input" id="qc-title" placeholder="要做什么？" value="' + esc(draft.title) + '"></div>';
        b += '<div style="display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px">' +
          '<button class="chip ' + (draft.due ? 'warm' : '') + '" data-act="qc-due">' + ic('flag', 14) + (draft.due ? '截止 ' + esc(DS.fmt.due(draft)) : '设置截止') + '</button>' +
          '<button class="chip ' + (draft.allocation ? 'on' : '') + '" data-act="qc-plan">' + ic('clock', 14) + (draft.allocation ? DS.fmt.range(draft.allocation.start, draft.allocation.end) : '计划执行') + '</button>' +
          '<button class="chip ' + (draft.reminders.length ? 'on' : '') + '" data-act="qc-remind">' + ic('bell', 14) + (draft.reminders.length ? '已设提醒' : '提醒') + '</button>' +
          '</div>';
        if (more) {
          b += field('所属日历', calendarSelectHtml(draft.calendarId, 'qc-cal'));
          b += field('优先级', priorityHtml(draft.priority, 'qc-prio'));
          b += field('标签', tagsHtml(draft.tags, 'qc-tag'));
          b += field('备注', '<textarea class="input" id="qc-notes" placeholder="补充说明">' + esc(draft.notes) + '</textarea>');
          b += '<div class="field"><label>子任务</label>' +
            (draft.subtasks.length ? '<div style="margin-bottom:4px">' + draft.subtasks.map(function (s) {
              return '<div class="subtask"><button class="check" data-act="qc-sub-toggle" data-id="' + s.id + '" aria-label="完成子任务"><span>' + ic('check', 13) + '</span></button>' +
                '<span class="od-fill" style="font-size:14px;' + (s.done ? 'color:var(--ink-3);text-decoration:line-through' : '') + '">' + esc(s.title) + '</span>' +
                '<button class="icon-btn" data-act="qc-sub-del" data-id="' + s.id + '" aria-label="删除子任务">' + ic('close', 16) + '</button></div>';
            }).join('') + '</div>' : '') +
            '<div style="display:flex;gap:6px"><input class="input" id="qc-sub" placeholder="添加子任务" style="flex:1"><button class="btn secondary" data-act="qc-sub-add" aria-label="添加子任务">' + ic('plus', 18) + '</button></div></div>';
          b += '<button class="setting-row" data-act="qc-full" style="padding-left:0;padding-right:0"><span class="label" style="color:var(--primary)">打开完整表单</span>' + ic('chevronRight', 16) + '</button>';
        }
        return b;
      }
      function paint() {
        openPanel('<div class="sheet" role="dialog" aria-modal="true" aria-label="新建待办">' +
          '<div class="sheet-grip"></div>' +
          '<div class="sheet-head"><div class="sheet-title od-fill">新建待办</div><button class="icon-btn" data-act="close-overlay" aria-label="关闭">' + ic('close', 20) + '</button></div>' +
          '<div class="sheet-body">' + body() + '</div>' +
          '<div class="sheet-foot"><button class="btn ghost" data-act="qc-more">' + (more ? '收起' : '更多') + '</button><span style="flex:1"></span><button class="btn" data-act="qc-save">保存</button></div></div>', { focus: false });
        var t = document.getElementById('qc-title');
        if (t) {
          t.addEventListener('input', function () { draft.title = t.value; });
          setTimeout(function () { t.focus(); }, 120);
        }
        var notes = document.getElementById('qc-notes');
        if (notes) notes.addEventListener('input', function () { draft.notes = notes.value; });
        var sub = document.getElementById('qc-sub');
        if (sub) sub.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); var add = document.querySelector('[data-act="qc-sub-add"]'); if (add) add.click(); }
        });
      }
      paint();
      overlay.__qc = { draft: draft, paint: paint, toggleMore: function () { more = !more; paint(); }, from: from };
    }

    function calendarSelectHtml(selected, actPrefix) {
      return '<div style="display:flex;flex-wrap:wrap;gap:6px">' + DS.state.calendars.map(function (c) {
        return '<button class="chip ' + (selected === c.id ? 'on' : '') + '" data-act="' + actPrefix + '" data-id="' + c.id + '"><span class="dot" style="background:' + c.color + '"></span>' + esc(c.name) + '</button>';
      }).join('') + '</div>';
    }
    function priorityHtml(selected, actPrefix) {
      var names = ['无', '低', '中', '高'];
      return '<div style="display:flex;gap:6px">' + names.map(function (n, i) {
        return '<button class="chip ' + (selected === i ? 'on' : '') + '" data-act="' + actPrefix + '" data-id="' + i + '">' + n + '</button>';
      }).join('') + '</div>';
    }
    function tagsHtml(selected, actPrefix) {
      return '<div style="display:flex;flex-wrap:wrap;gap:6px">' + DS.state.tags.map(function (t) {
        return '<button class="chip ' + (selected.indexOf(t.id) >= 0 ? 'on' : '') + '" data-act="' + actPrefix + '" data-id="' + t.id + '"><span class="dot" style="background:' + t.color + '"></span>' + esc(t.name) + '</button>';
      }).join('') + '</div>';
    }

    /* full todo form */
    function openTodoForm(id, prefill) {
      var src = id ? DS.byId(DS.state.todos, id) : null;
      var p = prefill || {};
      var draft = src ? JSON.parse(JSON.stringify(src)) : {
        title: p.title || '', notes: p.notes || '', due: p.due || null, dueHasTime: !!p.dueHasTime,
        calendarId: p.calendarId || DS.state.calendars[0].id, priority: p.priority || 0,
        tags: p.tags || [], reminders: p.reminders || [], repeat: p.repeat || null,
        subtasks: p.subtasks || [], allocation: p.allocation || null, done: false
      };
      function paint() {
        var b = '<div class="field"><label for="tf-title">标题</label><input class="input" id="tf-title" value="' + esc(draft.title) + '" placeholder="要做什么？"></div>';
        b += '<div class="section-label" style="padding-left:0">时间</div>';
        b += '<button class="setting-row" data-act="tf-due" style="padding-left:0;padding-right:0"><span class="label">截止</span><span class="value">' + (draft.due ? esc(DS.fmt.due(draft)) : '无') + '</span>' + ic('chevronRight', 16) + '</button>';
        b += '<button class="setting-row" data-act="tf-repeat" style="padding-left:0;padding-right:0"><span class="label">重复</span><span class="value">' + (draft.repeat ? { daily: '每天', weekly: '每周', monthly: '每月' }[draft.repeat] : '不重复') + '</span>' + ic('chevronRight', 16) + '</button>';
        b += '<button class="setting-row" data-act="tf-plan" style="padding-left:0;padding-right:0"><span class="label">计划执行</span><span class="value">' + (draft.allocation ? DS.fmt.md(draft.allocation.start) + ' ' + DS.fmt.range(draft.allocation.start, draft.allocation.end) : '未安排') + '</span>' + ic('chevronRight', 16) + '</button>';
        b += '<div class="section-label" style="padding-left:0">提醒</div>';
        b += '<button class="setting-row" data-act="tf-remind" style="padding-left:0;padding-right:0"><span class="label">提醒</span><span class="value">' + (draft.reminders.length ? '提前 ' + draft.reminders[0].offset + ' 分钟' : '无') + '</span>' + ic('chevronRight', 16) + '</button>';
        b += '<div class="section-label" style="padding-left:0">整理</div>';
        b += field('所属日历', calendarSelectHtml(draft.calendarId, 'tf-cal'));
        b += field('优先级', priorityHtml(draft.priority, 'tf-prio'));
        b += field('标签', tagsHtml(draft.tags, 'tf-tag'));
        b += '<div class="section-label" style="padding-left:0">内容</div>';
        b += field('备注', '<textarea class="input" id="tf-notes">' + esc(draft.notes) + '</textarea>');
        if (draft.subtasks.length) {
          b += '<div class="field"><label>子任务</label>' + draft.subtasks.map(function (s, i) {
            return '<div class="subtask"><button class="check" data-act="tf-sub-toggle" data-id="' + s.id + '"><span>' + ic('check', 13) + '</span></button><span class="od-fill" style="font-size:14px;' + (s.done ? 'color:var(--ink-3);text-decoration:line-through' : '') + '">' + esc(s.title) + '</span>' +
              '<button class="icon-btn" data-act="tf-sub-del" data-id="' + s.id + '" aria-label="删除子任务">' + ic('close', 16) + '</button></div>';
          }).join('') + '</div>';
        }
        b += '<button class="chip" data-act="tf-sub-add">' + ic('plus', 14) + '添加子任务</button>';
        b += '<div style="height:16px"></div>';

        openPanel('<div class="sheet" role="dialog" aria-modal="true" aria-label="' + (id ? '编辑待办' : '新建待办') + '">' +
          '<div class="sheet-grip"></div>' +
          '<div class="sheet-head"><div class="sheet-title od-fill">' + (id ? '编辑待办' : '新建待办') + '</div>' +
          (id ? '<button class="icon-btn" data-act="tf-delete" aria-label="删除">' + ic('trash', 20) + '</button>' : '') +
          '<button class="icon-btn" data-act="close-overlay" aria-label="关闭">' + ic('close', 20) + '</button></div>' +
          '<div class="sheet-body">' + b + '</div>' +
          '<div class="sheet-foot"><button class="btn ghost" data-act="close-overlay">取消</button><span style="flex:1"></span><button class="btn" data-act="tf-save">保存</button></div></div>', { focus: false });
        var t = document.getElementById('tf-title');
        if (t) {
          t.addEventListener('input', function () { draft.title = t.value; });
          if (!id) setTimeout(function () { t.focus(); }, 120);
        }
        var n = document.getElementById('tf-notes');
        if (n) n.addEventListener('input', function () { draft.notes = n.value; });
      }
      paint();
      overlay.__tf = { draft: draft, paint: paint };
    }

    /* todo detail */
    function openTodoDetail(id) {
      var t = DS.byId(DS.state.todos, id);
      if (!t) return;
      var cal = DS.calendar(t.calendarId);
      var b = '<div style="padding:4px 0 12px"><h2 class="detail-title">' + esc(t.title) + '</h2>' +
        '<div class="detail-meta">' +
        '<span class="chip solid"><span class="dot" style="background:' + cal.color + '"></span>' + esc(cal.name) + '</span>' +
        (t.priority ? '<span class="chip ' + (t.priority === 3 ? 'danger' : 'warm') + '">' + ['', '低优先', '中优先', '高优先'][t.priority] + '</span>' : '') +
        (t.done ? '<span class="chip on">已完成</span>' : '') +
        '</div></div>';
      b += '<div class="kv"><div class="k">截止</div><div>' + (t.due ? esc(t.dueHasTime ? DS.fmt.dateTime(t.due) : DS.fmt.md(t.due) + ' ' + DS.fmt.weekday(t.due)) : '<span style="color:var(--ink-3)">无</span>') + '</div></div>';
      b += '<div class="kv"><div class="k">计划执行</div><div>' + (t.allocation ? esc(DS.fmt.md(t.allocation.start) + ' ' + DS.fmt.range(t.allocation.start, t.allocation.end)) : '<span style="color:var(--ink-3)">未安排</span>') + '</div></div>';
      if (t.reminders.length) b += '<div class="kv"><div class="k">提醒</div><div>提前 ' + t.reminders[0].offset + ' 分钟</div></div>';
      if (t.repeat) b += '<div class="kv"><div class="k">重复</div><div>' + { daily: '每天', weekly: '每周', monthly: '每月' }[t.repeat] + '</div></div>';
      if (t.tags.length) b += '<div class="kv"><div class="k">标签</div><div style="display:flex;gap:6px;flex-wrap:wrap">' + t.tags.map(function (id) { var tg = DS.tag(id); return tg ? '<span class="chip solid"><span class="dot" style="background:' + tg.color + '"></span>' + esc(tg.name) + '</span>' : ''; }).join('') + '</div></div>';
      if (t.notes) b += '<div class="kv"><div class="k">备注</div><div style="white-space:pre-wrap">' + esc(t.notes) + '</div></div>';
      if (t.subtasks.length) {
        b += '<div class="kv"><div class="k">子任务</div><div>' + t.subtasks.map(function (s) {
          return '<div class="subtask"><button class="check" data-act="detail-sub" data-todo="' + t.id + '" data-sub="' + s.id + '" role="checkbox" aria-checked="' + (s.done ? 'true' : 'false') + '"><span>' + ic('check', 13) + '</span></button>' +
            '<span style="font-size:14px;' + (s.done ? 'color:var(--ink-3);text-decoration:line-through' : '') + '">' + esc(s.title) + '</span></div>';
        }).join('') + '</div></div>';
      }
      openPanel('<div class="sheet full" role="dialog" aria-modal="true" aria-label="待办详情">' +
        '<div class="sheet-grip"></div>' +
        '<div class="sheet-head"><div class="sheet-title od-fill">待办详情</div>' +
        '<button class="icon-btn" data-act="detail-edit" data-id="' + t.id + '" aria-label="编辑">' + ic('edit', 20) + '</button>' +
        '<button class="icon-btn" data-act="close-overlay" aria-label="关闭">' + ic('close', 20) + '</button></div>' +
        '<div class="sheet-body">' + b + '</div>' +
        '<div class="sheet-foot"><button class="btn ' + (t.done ? 'secondary' : '') + '" data-act="detail-toggle" data-id="' + t.id + '">' + (t.done ? '标记为未完成' : '完成') + '</button>' +
        '<button class="btn secondary" data-act="detail-plan" data-id="' + t.id + '">安排时间</button><span style="flex:1"></span>' +
        '<button class="btn danger" data-act="detail-delete" data-id="' + t.id + '">删除</button></div></div>', { focus: false });
    }

    /* event detail */
    function openEventDetail(id) {
      var e = DS.byId(DS.state.events, id);
      if (!e) return;
      var cal = DS.calendar(e.calendarId);
      var b = '<div style="padding:4px 0 12px"><h2 class="detail-title">' + esc(e.title) + '</h2>' +
        '<div class="detail-meta"><span class="chip solid"><span class="dot" style="background:' + cal.color + '"></span>' + esc(cal.name) + '</span></div></div>';
      b += '<div class="kv"><div class="k">时间</div><div>' + (e.allDay ? '全天 · ' : '') + esc(DS.fmt.md(e.start) + ' ' + DS.fmt.weekday(e.start)) + '<br>' + esc(DS.fmt.range(e.start, e.end)) + '</div></div>';
      if (e.location) b += '<div class="kv"><div class="k">地点</div><div>' + esc(e.location) + '</div></div>';
      if (e.notes) b += '<div class="kv"><div class="k">备注</div><div style="white-space:pre-wrap">' + esc(e.notes) + '</div></div>';
      if (e.reminders && e.reminders.length) b += '<div class="kv"><div class="k">提醒</div><div>提前 ' + e.reminders[0].offset + ' 分钟</div></div>';
      if (e.repeat) b += '<div class="kv"><div class="k">重复</div><div>' + { daily: '每天', weekly: '每周', monthly: '每月' }[e.repeat] + '</div></div>';
      openPanel('<div class="sheet full" role="dialog" aria-modal="true" aria-label="日程详情">' +
        '<div class="sheet-grip"></div>' +
        '<div class="sheet-head"><div class="sheet-title od-fill">日程详情</div>' +
        '<button class="icon-btn" data-act="event-edit" data-id="' + e.id + '" aria-label="编辑">' + ic('edit', 20) + '</button>' +
        '<button class="icon-btn" data-act="close-overlay" aria-label="关闭">' + ic('close', 20) + '</button></div>' +
        '<div class="sheet-body">' + b + '</div>' +
        '<div class="sheet-foot"><button class="btn danger" data-act="event-delete" data-id="' + e.id + '">删除</button><span style="flex:1"></span><button class="btn secondary" data-act="close-overlay">完成</button></div></div>', { focus: false });
    }

    /* event form */
    function openEventForm(id, prefill) {
      var src = id ? DS.byId(DS.state.events, id) : null;
      var start = (prefill && prefill.start) || (function () {
        var d = new Date(ui.selectedDay); d.setHours(15, 0, 0, 0); return d;
      })();
      var end = (prefill && prefill.end) || new Date(start.getTime() + 3600000);
      var draft = src ? JSON.parse(JSON.stringify(src)) : {
        title: '', start: start.toISOString(), end: end.toISOString(), allDay: false,
        calendarId: (prefill && prefill.calendarId) || DS.state.calendars[0].id, location: '', notes: '', reminders: [], repeat: null
      };
      function paint() {
        var b = '<div class="field"><label for="ef-title">标题</label><input class="input" id="ef-title" value="' + esc(draft.title) + '" placeholder="日程名称"></div>';
        b += '<div class="field"><label>时间</label><div style="display:flex;gap:8px">' +
          '<input class="input" type="date" id="ef-date" value="' + new Date(draft.start).toISOString().slice(0, 10) + '">' +
          '<input class="input" type="time" id="ef-start" value="' + DS.fmt.inputTime(draft.start) + '">' +
          '</div><div style="display:flex;gap:8px;margin-top:8px">' +
          '<input class="input" type="time" id="ef-end" value="' + DS.fmt.inputTime(draft.end) + '">' +
          '<button class="chip ' + (draft.allDay ? 'on' : '') + '" data-act="ef-allday">全天</button></div></div>';
        b += field('所属日历', calendarSelectHtml(draft.calendarId, 'ef-cal'));
        b += '<div class="field"><label for="ef-loc">地点</label><input class="input" id="ef-loc" value="' + esc(draft.location) + '" placeholder="可选"></div>';
        b += '<button class="setting-row" data-act="ef-remind" style="padding-left:0;padding-right:0"><span class="label">提醒</span><span class="value">' + (draft.reminders.length ? '提前 ' + draft.reminders[0].offset + ' 分钟' : '无') + '</span>' + ic('chevronRight', 16) + '</button>';
        b += '<button class="setting-row" data-act="ef-repeat" style="padding-left:0;padding-right:0"><span class="label">重复</span><span class="value">' + (draft.repeat ? { daily: '每天', weekly: '每周', monthly: '每月' }[draft.repeat] : '不重复') + '</span>' + ic('chevronRight', 16) + '</button>';
        b += field('备注', '<textarea class="input" id="ef-notes">' + esc(draft.notes) + '</textarea>');

        openPanel('<div class="sheet" role="dialog" aria-modal="true" aria-label="' + (id ? '编辑日程' : '新建日程') + '">' +
          '<div class="sheet-grip"></div>' +
          '<div class="sheet-head"><div class="sheet-title od-fill">' + (id ? '编辑日程' : '新建日程') + '</div>' +
          (id ? '<button class="icon-btn" data-act="ef-delete" aria-label="删除">' + ic('trash', 20) + '</button>' : '') +
          '<button class="icon-btn" data-act="close-overlay" aria-label="关闭">' + ic('close', 20) + '</button></div>' +
          '<div class="sheet-body">' + b + '</div>' +
          '<div class="sheet-foot"><button class="btn ghost" data-act="close-overlay">取消</button><span style="flex:1"></span><button class="btn" data-act="ef-save">保存</button></div></div>', { focus: false });
        var t = document.getElementById('ef-title');
        if (t) { t.addEventListener('input', function () { draft.title = t.value; }); if (!id) setTimeout(function () { t.focus(); }, 120); }
        var loc = document.getElementById('ef-loc');
        if (loc) loc.addEventListener('input', function () { draft.location = loc.value; });
        var notes = document.getElementById('ef-notes');
        if (notes) notes.addEventListener('input', function () { draft.notes = notes.value; });
        var date = document.getElementById('ef-date');
        if (date) date.addEventListener('change', function () {
          var s = new Date(draft.start), e2 = new Date(draft.end), dur = e2 - s;
          var parts = date.value.split('-');
          s.setFullYear(+parts[0], +parts[1] - 1, +parts[2]);
          draft.start = s.toISOString(); draft.end = new Date(s.getTime() + dur).toISOString();
        });
        var st = document.getElementById('ef-start');
        if (st) st.addEventListener('change', function () {
          var d = new Date(draft.start); var p = st.value.split(':');
          d.setHours(+p[0], +p[1], 0, 0); draft.start = d.toISOString();
          if (new Date(draft.end) <= d) draft.end = new Date(d.getTime() + 3600000).toISOString();
        });
        var en = document.getElementById('ef-end');
        if (en) en.addEventListener('change', function () {
          var d = new Date(draft.end); var p = en.value.split(':');
          d.setHours(+p[0], +p[1], 0, 0); draft.end = d.toISOString();
        });
      }
      paint();
      overlay.__ef = { draft: draft, paint: paint };
    }

    /* pickers */
    function openDuePicker(current, hasTime, onPick) {
      var tmp = current ? new Date(current) : new Date(DS.NOW);
      var body = '<div style="display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px">' +
        [['今天', 0], ['明天', 1], ['下周', 7]].map(function (x) {
          return '<button class="chip" data-act="due-quick" data-id="' + x[1] + '">' + x[0] + '</button>';
        }).join('') + '</div>' +
        '<div class="field"><label>日期</label><input class="input" type="date" id="due-date" value="' + tmp.toISOString().slice(0, 10) + '"></div>' +
        '<div class="field"><label>时间（可选）</label><input class="input" type="time" id="due-time" value="' + (hasTime ? DS.fmt.inputTime(tmp) : '') + '"></div>' +
        '<button class="btn danger sm" data-act="due-clear" style="margin-top:8px">清除截止</button>';
      openPanel(sheet('设置截止', body, '<button class="btn ghost" data-act="close-overlay">取消</button><span style="flex:1"></span><button class="btn" data-act="due-save">确定</button>'));
      overlay.__due = { onPick: onPick };
    }

    function openReminderPicker(current, onPick) {
      var opts = [0, 5, 10, 30, 60, 1440];
      var body = '<div class="od-stack" style="gap:6px">' + opts.map(function (m) {
        var label = m === 0 ? '准时' : (m === 1440 ? '提前 1 天' : '提前 ' + m + ' 分钟');
        var on = current && current.offset === m;
        return '<button class="setting-row" data-act="rem-pick" data-id="' + m + '" style="border-radius:10px;background:' + (on ? 'var(--primary-soft)' : 'transparent') + '"><span class="label">' + label + '</span>' + (on ? ic('check', 18) : '') + '</button>';
      }).join('') + '<button class="setting-row" data-act="rem-pick" data-id="-1"><span class="label" style="color:var(--danger)">不提醒</span></button></div>';
      openPanel(sheet('提醒', body));
      overlay.__rem = { onPick: onPick };
    }

    function openRepeatPicker(current, onPick) {
      var opts = [['', '不重复'], ['daily', '每天'], ['weekly', '每周'], ['monthly', '每月']];
      var body = '<div class="od-stack" style="gap:6px">' + opts.map(function (o) {
        return '<button class="setting-row" data-act="rep-pick" data-id="' + o[0] + '"><span class="label">' + o[1] + '</span>' + (current === (o[0] || null) ? ic('check', 18) : '') + '</button>';
      }).join('') + '</div>';
      openPanel(sheet('重复', body));
      overlay.__rep = { onPick: onPick };
    }

    function openAllocationPicker(current, onPick) {
      var d = current ? new Date(current.start) : new Date(DS.NOW);
      if (!DS.sameDay(d, ui.selectedDay)) d = new Date(ui.selectedDay);
      d.setHours(15, 0, 0, 0);
      var body = '<div class="field"><label>日期</label><input class="input" type="date" id="plan-date" value="' + d.toISOString().slice(0, 10) + '"></div>' +
        '<div style="display:flex;gap:8px"><div class="field od-fill"><label>开始</label><input class="input" type="time" id="plan-start" value="' + DS.fmt.inputTime(d) + '"></div>' +
        '<div class="field od-fill"><label>结束</label><input class="input" type="time" id="plan-end" value="' + DS.fmt.inputTime(new Date(d.getTime() + 3600000)) + '"></div></div>' +
        '<div class="help">计划执行会占用日历时间，和截止日期互不影响。</div>' +
        (current ? '<button class="btn danger sm" data-act="plan-clear" style="margin-top:8px">取消安排</button>' : '');
      openPanel(sheet('计划执行', body, '<button class="btn ghost" data-act="close-overlay">取消</button><span style="flex:1"></span><button class="btn" data-act="plan-save">确定</button>'), { focus: false });
      overlay.__plan = { onPick: onPick };
    }

    function openChoice(title, items) {
      var body = '<div class="od-stack" style="gap:6px">' + items.map(function (it) {
        return '<button class="setting-row" data-act="choice" data-id="' + it.id + '" style="border-radius:10px"><span style="color:var(--ink-2)">' + ic(it.icon || 'chevronRight', 20) + '</span><span class="label">' + esc(it.label) + '</span>' + (it.on ? ic('check', 16) : '') + '</button>';
      }).join('') + '</div>';
      openPanel(sheet(title, body));
    }

    /* ---------------- actions ---------------- */
    document.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-act]');
      if (!el) return;
      var act = el.getAttribute('data-act');
      var id = el.getAttribute('data-id');

      switch (act) {
        case 'tab': go(id); return;
        case 'back':
          if (['calendars', 'tags', 'trash', 'ai', 'sync'].indexOf(route.name) >= 0) go('settings');
          else go(mainReturn);
          return;
        case 'open-search': if (['today', 'calendar', 'todos'].indexOf(route.name) >= 0) mainReturn = route.name; route = { name: 'search' }; render(); return;
        case 'close-search': go(mainReturn); return;

        case 'toggle-todo':
          ev.stopPropagation();
          DS.toggleTodo(id);
          return;
        case 'open-todo': openTodoDetail(id); return;
        case 'open-event': openEventDetail(id); return;

        case 'todo-view':
          ui.todoView = id; DS.setUi('todoView', id); render(); return;
        case 'pick-day':
          ui.selectedDay = new Date(id); render(); return;
        case 'week-open-day':
          ui.selectedDay = new Date(id); ui.calendarView = 'day'; render(); return;
        case 'cal-view':
          ui.calendarView = id; render(); return;

        }
        case 'data-run': {
          var dr = overlay.__data; if (!dr) return;
          var needsFile = dr.kind === 'ics-in' || dr.kind === 'backup-in';
          if (needsFile && !dr.file) {
            dr.file = dr.kind === 'ics-in' ? '家人共享.ics' : 'dayspark-backup-2026-11-10.json';
            var fl2 = document.getElementById('data-file'); if (fl2) fl2.textContent = dr.file;
            return;
          }
          dataSuccess(); return;
        }
        case 'info':
          var msgs = {
            'ics-in': '从其他日历应用导入 .ics 文件。',
            'ics-out': '把全部日历导出为 .ics。',
            'backup-out': '导出包含所有待办、日程和设置的完整备份。',
            'backup-in': '合并一份备份；同 ID 的记录会被覆盖，不会清空现有数据。',
            'about': 'DaySpark 0.30.0 · 本次为 UI/UX 设计原型'
          };
          alert(msgs[id] || '');
          return;
        default: return;
      }
    });

    // handle pickers opened from the chooser
    document.addEventListener('click', function (ev) {
      if (ev.target.closest('[data-act="choice"]')) {
        var el = ev.target.closest('[data-act="choice"]');
        if (overlay.__chooser) {
          overlay.__chooser = null;
          var id = el.getAttribute('data-id');
          closeOverlay(true);
          if (id === 'todo') openQuickCreate(); else openEventForm();
        }
      }
    });

    function openTodoPickerForSlot(slot) {
      var items = DS.activeTodos().slice(0, 20).map(function (t) {
        return { id: t.id, label: t.title, icon: 'todo' };
      });
      openPanel(sheet('安排哪条待办？', '<div class="od-stack" style="gap:4px">' + items.map(function (it) {
        return '<button class="setting-row" data-act="slot-todo" data-id="' + it.id + '"><span class="label od-truncate">' + esc(it.label) + '</span></button>';
      }).join('') + '</div>'));
      overlay.__slotTodo = slot;
    }

    overlay.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-act="slot-todo"]');
      if (!el) return;
      var slot = overlay.__slotTodo;
      var t = DS.byId(DS.state.todos, el.getAttribute('data-id'));
      if (t && slot) {
        t.allocation = { start: slot.start.toISOString(), end: slot.end.toISOString() };
        DS.emit(); closeOverlay(true); render();
      }
    });

    function hexToSoft(hex) {
      var map = { '#2D4F7C': '#e8edf4', '#3F6B68': '#e6efed', '#4C6B55': '#e8efe9', '#8A5237': '#f3e9e3', '#63556F': '#ece9f0', '#85525F': '#f2e8eb' };
      if (document.documentElement.dataset.theme === 'dark') {
        return { '#2D4F7C': '#1e2a38', '#3F6B68': '#1b2c2a', '#4C6B55': '#1e2b22', '#8A5237': '#30211a', '#63556F': '#26222e', '#85525F': '#2d2025' }[hex] || '#22231f';
      }
      return map[hex] || '#e9edf5';
    }

    // keyboard: Esc closes overlay
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && overlayOpen) closeOverlay();
      if (ev.key === 'Enter' && overlayOpen && overlay.__qc && ev.target && ev.target.id === 'qc-title') {
        var btn = overlay.querySelector('[data-act="qc-save"]');
        if (btn) btn.click();
      }
    });

    DS.subscribe(function () { render(); });

    // initial theme + accent
    (function () {
      var mode = DS.state.settings.theme;
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      var ACCENT = { '蓝': '#2D4F7C', '青': '#3F6B68', '绿': '#4C6B55', '橙': '#8A5237', '紫': '#63556F', '玫红': '#85525F' };
      var ac = ACCENT[DS.state.settings.accent];
      if (ac) {
        document.documentElement.style.setProperty('--primary', ac);
        document.documentElement.style.setProperty('--primary-soft', hexToSoft(ac));
      }
    })();

    render();
  })();
  </script>
</body>
</html>
