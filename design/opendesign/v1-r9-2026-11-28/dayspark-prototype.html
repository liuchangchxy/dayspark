<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DaySpark R9 · 交互原型</title>
<style>
/* ============================================================
   DaySpark R9 — tokens are the shipped Direction C palette
   (lib/core/theme/app_colors.dart). Light is paper; dark is
   its own palette, not a tint.
   ============================================================ */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  --bg:#FCFCFA; --surface:#FFFFFF; --surf2:#F7F7F2; --surf3:#F0EFE9; --free:#F5F4EE;
  --ink:#191A17; --ink2:#3F413A; --muted:#5E6158; --faint:#6E7167;
  --line:#E8E7E1; --line2:#F0EFE9;
  --accent:#C2410C; --accent-h:#9A330A; --accent-soft:#FBEEE7; --accent-ink:#FFFFFF;
  --warn:#7D5416; --warn-soft:#F4ECDD; --err:#A8481E; --err-soft:#FBF1EB;
  --ok:#5E7A64; --ok-soft:#F1F5F1; --work:#5F7183; --work-soft:#F3F5F6;
  --scrim:rgba(25,26,23,.42); --shadow:0 14px 40px rgba(25,26,23,.13); --shadow-sm:0 2px 8px rgba(25,26,23,.06);
  --r:6px; --r-lg:10px;
  --dock-h:64px;
}
html[data-theme="dark"]{
  --bg:#131311; --surface:#1A1B18; --surf2:#1D1E1A; --surf3:#232420; --free:#20211C;
  --ink:#ECECE6; --ink2:#C3C5BB; --muted:#ABADA4; --faint:#8E9086;
  --line:#2C2D28; --line2:#232420;
  --accent:#E0703C; --accent-h:#F08A55; --accent-soft:#33211A; --accent-ink:#1A120D;
  --warn:#D6AD6A; --warn-soft:#322817; --err:#D97B52; --err-soft:#33201A;
  --ok:#8FAE96; --ok-soft:#1B221C; --work:#8FA2B5; --work-soft:#1C2024;
  --scrim:rgba(0,0,0,.62); --shadow:0 18px 48px rgba(0,0,0,.5); --shadow-sm:0 2px 8px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 13px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit}
input[type=time],input[type=date]{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft);color:var(--ink)}
svg.i{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;width:var(--s,14px);height:var(--s,14px);flex:none;vertical-align:-2px}
.num{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* ---------- shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;min-height:0;height:auto}
.top{flex:none;height:52px;display:flex;align-items:center;gap:26px;padding:0 26px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;letter-spacing:.01em;flex:none}
.mark{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.nav{display:flex;align-items:center;gap:22px;height:100%}
.nav button{position:relative;height:52px;font-size:13px;color:var(--muted);padding:0 1px}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-1px;height:2px;background:var(--ink)}
.top-act{margin-left:auto;display:flex;align-items:center;gap:12px}
.searchbtn{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:7px;font-size:11.5px;color:var(--muted);background:var(--surface)}
.searchbtn:hover{border-color:var(--line);background:var(--surf2);color:var(--ink2)}
.kbd{font-size:9.5px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:0 4px;line-height:1.55;background:var(--bg)}
.clock{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.avatar{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:10.5px;color:var(--muted);background:var(--surface)}
.avatar:hover{color:var(--ink);border-color:var(--faint)}
.syncdot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.syncdot.off{background:var(--warn)}
.pager{flex:1;min-height:0;display:flex;flex-direction:row;position:relative}

/* ---------- primitives ---------- */
.btn{height:32px;padding:0 11px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--ink2);background:var(--surface);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{background:var(--surf2);color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn.primary:hover{background:var(--ink2);border-color:var(--ink2);color:var(--bg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.accent:hover{background:var(--accent-h);border-color:var(--accent-h);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surf2);color:var(--ink)}
.btn.danger{color:var(--err);border-color:var(--err-soft);background:var(--err-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--surf2);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border:1px solid var(--line);border-radius:5px;font-size:11px;color:var(--ink2);background:var(--surface);white-space:nowrap}
.chip:hover{background:var(--surf2);border-color:var(--faint)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.soft{background:var(--surf2);border-color:var(--surf2)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.err{background:var(--err-soft);border-color:transparent;color:var(--err)}
.chip .x{display:inline-grid;place-items:center;width:16px;height:16px;margin-right:-4px;color:var(--faint)}
.chip .x:hover{color:var(--ink)}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--surf3);border-radius:7px}
.seg button{height:26px;padding:0 10px;border-radius:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.seg.seg-lg button{height:30px;padding:0 12px;font-size:12px}
.badge{display:inline-flex;align-items:center;height:17px;padding:0 5px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.02em;background:var(--surf3);color:var(--ink2)}
.badge.plan{background:var(--surf3);color:var(--ink2);border:1px solid var(--line)}
.badge.due{background:var(--warn-soft);color:var(--warn)}
.badge.series{background:transparent;color:var(--faint);border:1px solid var(--line)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--faint)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;width:100%;padding:0 2px;border-bottom:1px solid var(--line2);font-size:13px;color:var(--ink)}
.field:hover .fv{color:var(--ink)}
.field .fk{color:var(--muted);font-size:12px;flex:none}
.field .fv{color:var(--ink2);display:flex;align-items:center;gap:4px;min-width:0;font-variant-numeric:tabular-nums}
.field .fv .i{color:var(--faint);--s:11px}
.section{padding:16px 0 4px}
.section:first-child{padding-top:4px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.section-h b{font-size:11px;font-weight:650;letter-spacing:.10em;text-transform:uppercase;color:var(--muted)}
.section-h button{font-size:11.5px;color:var(--muted)}
.section-h button:hover{color:var(--ink)}
.note{font-size:11.5px;color:var(--muted);line-height:1.6}

.page{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.todo-page{flex:1;min-height:0;display:flex;flex-direction:column}
.cal-body{flex:1;min-height:0}
/* ---------- today ---------- */
.today{flex:1;min-height:0;display:grid;grid-template-columns:clamp(340px,28vw,420px) minmax(0,1fr)}
.today-main{min-height:0;display:flex;flex-direction:column}
.page-head{padding:22px 30px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex:none}
.date-head{display:flex;align-items:baseline;gap:12px;min-width:0}
.date-head h1{margin:0;font-size:30px;font-weight:650;letter-spacing:-.01em;line-height:1.18;white-space:nowrap}
.date-head .wd{font-size:13px;color:var(--muted);white-space:nowrap}
.head-side{font-size:11.5px;color:var(--muted);padding-bottom:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.taskcol{min-height:0;overflow-y:auto;border-right:1px solid var(--line);padding:6px 24px 24px;scrollbar-width:thin}
.timecol{min-height:0;overflow-y:auto;padding:16px 32px 24px;scrollbar-width:thin}
.taskcol::-webkit-scrollbar,.timecol::-webkit-scrollbar{width:10px}
.taskcol::-webkit-scrollbar-thumb,.timecol::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:3px solid transparent;background-clip:content-box}
.zone{display:flex;align-items:center;gap:8px;min-height:32px;font-size:10px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.zone::after{content:"";height:1px;flex:1;background:var(--line)}
.zone.err{color:var(--err)}
.zone .ct{font-weight:400;letter-spacing:0;color:var(--muted);font-variant-numeric:tabular-nums;text-transform:none;font-size:11px}
.zone .sp{flex:1;height:1px;background:var(--line)}
.grp{display:flex;align-items:center;gap:6px;width:100%;min-height:34px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.grp .ct{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.grp .cv{--s:11px;color:var(--faint);transition:transform .14s ease}
.grp[aria-expanded="true"] .cv{transform:rotate(90deg)}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:11px;width:100%;min-height:62px;padding:7px 4px;border-bottom:1px solid var(--line2);border-radius:6px;position:relative;text-align:left}
.row .row-side{position:relative;justify-self:end}
.row:hover .row-side > .due,.row:focus-within .row-side > .due{position:absolute;right:0;top:-4px;opacity:0;pointer-events:none}
.row .acts{min-width:0}
.row:hover{background:var(--free)}
.row .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--surface);flex:none;position:relative}
.row .ck:hover{border-color:var(--faint)}
.row .ck.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.row .ck .i{--s:9px;stroke-width:2.6}
.row-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.row-t{font-size:14.5px;font-weight:520;line-height:1.4;color:var(--ink);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-m{display:flex;align-items:center;gap:6px;min-width:0;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.row-m .sep{color:var(--faint)}
.row-m .hiv{color:var(--ink2);font-weight:600}
.row-m .miss{color:var(--err);font-weight:600}
.row-side{display:flex;align-items:center;gap:6px;flex:none}
.due{font-size:11px;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.due.red{color:var(--err);background:transparent;padding-right:0}
.acts{display:flex;gap:2px;align-items:center;opacity:0;pointer-events:none;transition:opacity .12s ease}
.row:hover .acts,.row:focus-within .acts{opacity:1;pointer-events:auto}
.acts button{height:26px;padding:0 7px;border-radius:5px;font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.acts button:hover{background:var(--surf3);color:var(--ink)}
.acts .i{--s:12px}
.done-row{color:var(--faint)}
.done-row .row-t{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.weak{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin-top:14px;padding:0 10px;border:1px dashed var(--line);border-radius:7px;font-size:12px;color:var(--muted);background:transparent}
.weak:hover{border-color:var(--faint);color:var(--ink);background:var(--surf2)}
.weak .i{--s:13px;color:var(--faint)}
.weak b{color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.weak .go{margin-left:auto;color:var(--ink2);display:flex;align-items:center;gap:4px}
.empty{padding:28px 4px;display:flex;flex-direction:column;gap:8px}
.empty b{font-size:14px;font-weight:600}
.empty p{margin:0;font-size:12px;color:var(--muted);line-height:1.6;max-width:34em}
.empty .btn{align-self:flex-start;margin-top:4px}

/* timeline (today / day agenda) */
.tl{display:flex;flex-direction:column;max-width:960px}
.allday{display:flex;align-items:center;gap:10px;padding:2px 0 12px}
.allday-label{width:58px;flex:none;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.allday-chip{height:26px;padding:0 9px;border-radius:5px;font-size:11.5px;background:var(--cat-bg);color:var(--cat-ink);display:inline-flex;align-items:center;gap:6px}
.allday-chip:hover{filter:brightness(.98)}
.tl-row{display:grid;grid-template-columns:58px 14px minmax(0,1fr);align-items:start;gap:12px;padding:3px 0}
.tl-time{font-size:11.5px;color:var(--muted);padding-top:10px;font-variant-numeric:tabular-nums}
.tl-rail{position:relative;height:100%;display:flex;justify-content:center;padding-top:15px}
.tl-rail .dot{width:6px;height:6px;background:var(--cat);border-radius:50%}
.tl-block{width:100%;border-radius:8px;padding:9px 12px;min-height:48px;border:1px solid transparent}
.tl-block.event{background:var(--cat-bg);color:var(--cat-ink);border-left:3px solid var(--cat);border-radius:0 8px 8px 0;padding-left:11px}
.tl-block.event .bt{font-size:14px;font-weight:600;line-height:1.32}
.tl-block.event .bm{font-size:11.5px;opacity:.85;margin-top:3px}
.tl-block.alloc{background:var(--surface);border:1px dashed var(--line);border-left:3px solid var(--cat);box-shadow:none}
.tl-block.alloc:hover{border-color:var(--faint)}
.tl-block.alloc .bt{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.tl-block.alloc .bt .sq{width:12px;height:12px;border:1.4px solid var(--cat);border-radius:2px;flex:none}
.tl-block.alloc .bm{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.tl-block .plan{font-size:10px;letter-spacing:.04em;color:var(--ink2);background:var(--surf3);border-radius:3px;padding:1px 4px}
.tl-due{display:grid;grid-template-columns:58px 14px minmax(0,1fr);align-items:center;gap:12px;padding:9px 0;width:100%;border:0;background:none;text-align:left}
.tl-due .tl-rail{padding-top:0;height:auto;position:relative;display:block}
.tl-due .tl-rail .line{position:absolute;left:50%;top:50%;width:14px;height:1px;background:currentColor;opacity:.4}
.tl-due .tl-label{font-size:12px;color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.tl-due .tl-label b{font-weight:600}
.tl-due .tl-label .note{color:var(--faint);font-weight:400;font-size:10.5px;margin-left:6px}
.tl-due .tl-time{color:var(--warn);padding-top:0;font-weight:600;white-space:nowrap}
.tl-due .tl-rail{padding-top:0;height:auto}
.tl-due .tl-rail .line{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--warn);opacity:.45}
.tl-due .tl-rail .dot{display:none}
.tl-due.red .tl-label{color:var(--err)}
.tl-due.red .tl-rail .line{background:var(--err)}
.tl-due.red .line{background:var(--err)}
.tl-due.red .dot{background:var(--err)}
.due-line{height:22px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--warn)}
.due-line b{font-weight:600}
.due-line.red{color:var(--err)}
.now-row{display:grid;grid-template-columns:58px 14px minmax(0,1fr);gap:12px;align-items:center;padding:2px 0;margin:8px 0}
.now-row .t{font-size:11.5px;font-weight:650;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.now-row .line{height:2px;background:var(--accent);opacity:.85;border-radius:1px}
.time-empty{padding:36px 8px;font-size:12.5px;color:var(--muted);line-height:1.7}
.time-empty b{display:block;color:var(--ink);font-size:14px;font-weight:600;margin-bottom:4px}

/* ---------- todo ---------- */
.todo-page{flex:1;min-height:0;display:flex;flex-direction:column}
.todo-head{padding:18px 30px 0;display:flex;align-items:center;gap:14px;flex:none}
.todo-tabs{display:flex;gap:2px;padding:3px;background:var(--surf3);border-radius:7px}
.todo-tabs button{height:28px;padding:0 12px;border-radius:5px;font-size:12px;color:var(--muted)}
.todo-tabs button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.todo-count{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.todo-head .ml{margin-left:auto;display:flex;align-items:center;gap:8px}
.todo-head .btn[aria-pressed="true"]{background:var(--surf2);border-color:var(--line)}
.todo-body{flex:1;min-height:0;display:flex;min-width:0}
.todo-list{flex:1;min-height:0;overflow-y:auto;padding:8px 30px 24px;scrollbar-width:thin}
.todo-inner{max-width:980px}
.todo-inner .row{min-height:62px}
.todo-inner .row-t{font-size:14.5px}
.todo-inner .row-m{font-size:12px}
.todo-list::-webkit-scrollbar{width:10px}
.todo-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:3px solid transparent;background-clip:content-box}
.rail{flex:none;padding:10px 30px 0;max-width:1028px;width:100%;margin:0 auto;box-sizing:border-box}
.rail-top{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.rail-title{display:flex;align-items:center;gap:8px;height:30px;font-size:15px;font-weight:600;color:var(--ink);border-radius:6px;padding:0 6px 0 2px}
.rail-title:hover{background:var(--surf2)}
.rail-title .i{--s:12px;color:var(--faint)}
.rail-title .t{font-variant-numeric:tabular-nums}
.rail-title .w{font-size:12px;color:var(--muted);font-weight:400;margin-left:-2px}
.rail .btn{margin-left:auto}
.rail-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.rd{height:56px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid transparent;color:var(--ink2)}
.rd:hover{background:var(--surf2)}
.rd .n{font-size:10.5px;color:var(--muted)}
.rd .d{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.rd .m{height:3px;width:14px;border-radius:2px;background:transparent;margin-top:3px}
.rd.is-today .d{color:var(--accent)}
.rd.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow-sm);color:var(--ink)}
.rd.on .m{background:var(--ink)}
.rd.has{color:var(--ink)}
.rd.has .m{background:var(--line)}
.rd.on.has .m{background:var(--accent)}
.rail-note{display:flex;align-items:center;gap:8px;padding:8px 0 0;font-size:11px;color:var(--muted)}
.todo-datehead{display:flex;align-items:baseline;gap:8px;padding:16px 0 4px;font-size:13px;font-weight:600}
.todo-datehead .ct{font-size:11px;font-weight:400;color:var(--muted)}
.todo-datehead .vl{margin-left:auto;font-size:11px;font-weight:400;color:var(--muted)}
.filter-line{display:flex;align-items:center;gap:8px;padding:8px 0 0;font-size:11.5px;color:var(--muted)}
.filter-line .btn{height:26px;font-size:11px}

/* ---------- calendar ---------- */
.cal-page{flex:1;min-height:0;display:flex;flex-direction:column}
.cal-head{flex:none;height:56px;display:flex;align-items:center;gap:10px;padding:0 26px;border-bottom:1px solid var(--line);background:var(--bg);z-index:4}
.cal-title{display:flex;align-items:center;gap:8px;height:32px;font-size:15px;font-weight:600;border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums}
.cal-title:hover{background:var(--surf2)}
.cal-title .i{--s:11px;color:var(--faint)}
.cal-nav{display:flex;align-items:center;gap:2px}
.cal-nav button{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.cal-nav button:hover{background:var(--surf2);color:var(--ink)}
.cal-nav .i{--s:12px}
.cal-head .ml{margin-left:auto;display:flex;align-items:center;gap:8px}
.cal-body{flex:1;min-height:0;display:flex;min-width:0;position:relative}
.cal-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.plan-side{width:252px;flex:none;min-width:252px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.plan-side.hide{display:none}
.plan-head{flex:none;padding:14px 16px 10px;display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line);min-width:0}
.plan-head b{font-size:12px;font-weight:600}
.plan-head span{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plan-head .hint{margin-left:auto;font-size:9.5px;color:var(--faint);white-space:nowrap;flex:none}
.plan-list{flex:1;min-height:0;overflow-y:auto;padding:8px 10px 20px}
.plan-item{display:flex;align-items:center;gap:8px;width:100%;min-height:42px;padding:6px 6px;border-radius:6px;cursor:grab;touch-action:none}
.plan-item:hover{background:var(--surf2)}
.plan-item .dot{background:var(--cat)}
.plan-item .t{font-size:12px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-item .i{--s:12px;color:var(--faint);margin-left:auto;opacity:0}
.plan-item:hover .i{opacity:1}
.plan-empty{padding:18px 8px;font-size:11.5px;color:var(--muted);line-height:1.6}
.plan-foot{flex:none;padding:8px 14px 12px;border-top:1px solid var(--line2);font-size:10px;color:var(--faint);line-height:1.55}

/* time grid */
.tg{flex:1;min-height:0;overflow:auto;position:relative;scrollbar-width:thin;background:var(--bg);min-width:0}
.tg::-webkit-scrollbar{width:10px}
.tg::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:3px solid transparent;background-clip:content-box}
.tg-head{display:grid;position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.tg-head .gh{height:48px}
.tg-day{height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border-left:1px solid var(--line2);font-variant-numeric:tabular-nums;padding:0 4px;min-width:0}
.tg-day .d{font-size:13px;font-weight:600;white-space:nowrap}
.tg-day .w{font-size:10.5px;color:var(--muted);white-space:nowrap}
.tg-day.today .d{color:var(--accent)}
.tg-day.today .w{color:var(--accent)}
.tg-day.sel{background:var(--surf2)}
.tg-body{display:grid;height:900px}
.tg-gutter{position:relative;border-right:1px solid var(--line2)}
.tg-hour{position:absolute;left:0;right:0;height:60px;display:flex;align-items:flex-start;justify-content:flex-end;padding:2px 7px 0 0;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;box-sizing:border-box}
.tg-col{position:relative;border-left:1px solid var(--line2);min-width:0;background-image:linear-gradient(to bottom,var(--line2) 1px,transparent 1px);background-size:100% 60px}
.tg-col.today{background-color:var(--free)}
.tg-col.sel{background-color:var(--surf2)}
.tg-col.allfirst{border-left:0}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--accent);opacity:.75;z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-3px;top:-2px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.blk{position:absolute;border-radius:6px;overflow:hidden;text-align:left;z-index:2;padding:2px 0;display:block;cursor:pointer}
.blk:active{cursor:grabbing}
.blk .bin{padding:5px 8px;height:100%;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.blk.event .bin{background:var(--cat-bg);border-left:3px solid var(--cat);color:var(--cat-ink);border-radius:0 6px 6px 0;padding-left:7px}
.blk.event .bin:hover{filter:brightness(.97)}
.blk.alloc .bin{background:var(--surface);border:1px dashed var(--line);border-left:3px solid var(--cat);border-radius:2px 6px 6px 2px;padding-left:7px}
.blk.alloc .bin:hover{border-color:var(--faint)}
.blk .bt{font-size:12.5px;font-weight:600;line-height:1.32;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.blk .bm{font-size:10.5px;opacity:.82;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .sq{display:inline-block;width:8px;height:8px;border:1.3px solid var(--cat);border-radius:1.5px;margin-right:4px;vertical-align:-1px}
.blk.alloc .bm .plan{font-size:9.5px;background:var(--surf3);color:var(--ink2);border-radius:2px;padding:0 3px;margin-left:4px}
.blk.small .bt{font-size:11px;-webkit-line-clamp:1}
.blk.small .bm{display:none}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.blk:hover .rz{background:var(--line)}
.due-mark{position:absolute;left:0;right:0;height:1px;background:var(--warn);opacity:.5;z-index:3;pointer-events:none}
.due-mark.red{background:var(--err)}
.due-dot{position:absolute;width:6px;height:6px;border-radius:2px;background:var(--warn);left:4px;top:-2.5px;z-index:4}
.due-dot.red{background:var(--err)}
.due-tag{position:absolute;z-index:4;left:12px;font-size:9.5px;line-height:1.4;padding:1px 4px;border-radius:3px;background:var(--surface);border:1px solid var(--warn-soft);color:var(--warn);white-space:nowrap;max-width:calc(100% - 14px);overflow:hidden;text-overflow:ellipsis;transform:translateY(-50%)}
.due-tag.red{border-color:var(--err-soft);color:var(--err)}
.ghost{position:fixed;z-index:90;pointer-events:none;border-radius:6px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);padding:5px 8px;font-size:11.5px;box-shadow:var(--shadow-sm)}
.slot-pick{position:absolute;z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:168px}
.slot-pick .h{font-size:10.5px;color:var(--muted);padding:4px 8px 6px;font-variant-numeric:tabular-nums}
.slot-pick button{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 8px;border-radius:5px;font-size:12px;color:var(--ink)}
.slot-pick button:hover{background:var(--surf2)}
.slot-pick .i{--s:13px;color:var(--muted)}

/* month */
.mo-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,23vw,352px);min-width:0}
.mo-scroll{min-height:0;overflow:auto;padding:14px 22px 22px;scrollbar-width:thin}
.mo-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line2);min-width:640px}
.mo-wd{height:30px;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.1em;color:var(--muted);border-right:1px solid var(--line2);border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:3}
.mo-cell{min-height:104px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px 7px;display:flex;flex-direction:column;gap:3px;text-align:left;position:relative;background:var(--surface)}
.mo-cell:hover{background:var(--free)}
.mo-cell.out{background:var(--bg);color:var(--faint)}
.mo-cell.sel{background:var(--surf2);box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:2px}
.mo-cell .dn{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2);line-height:1.2;display:flex;align-items:center;gap:4px}
.mo-cell.out .dn{color:var(--faint);font-weight:400}
.mo-cell.today .dn{color:var(--accent)}
.mo-cell.today .dn::after{content:"";width:14px;height:2px;background:var(--accent);border-radius:1px;position:absolute;top:21px;left:7px}
.mo-cell .ev{font-size:10.5px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);display:flex;gap:4px;align-items:baseline;min-width:0}
.mo-cell .ev i{width:5px;height:5px;border-radius:50%;background:var(--faint);flex:none;transform:translateY(-1px)}
.mo-cell .ev.alloc i{border-radius:1px;background:transparent;border:1.2px solid var(--faint);width:6px;height:6px}
.mo-cell .ev.due{color:var(--warn)}
.mo-cell .ev.due i{background:var(--warn);width:8px;height:2px;border-radius:0;border:0}
.mo-cell .ev .tm{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;font-size:10px}
.mo-cell .more{font-size:10px;color:var(--muted);padding-left:9px}
.agenda{border-left:1px solid var(--line);min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.agenda-head{flex:none;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.agenda-head .r1{display:flex;align-items:baseline;gap:8px}
.agenda-head b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.agenda-head span{font-size:11.5px;color:var(--muted)}
.agenda-head .r2{display:flex;align-items:center;gap:8px;margin-top:8px}
.agenda-head .btn{height:28px;font-size:11.5px}
.agenda-head .open{margin-left:auto}
.agenda-scroll{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 20px}
.ag-item{display:flex;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line2);width:100%}
.ag-time{width:42px;flex:none;font-size:10.5px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums;line-height:1.3}
.ag-main{min-width:0;flex:1}
.ag-t{font-size:12.5px;font-weight:600;line-height:1.35;display:flex;align-items:center;gap:5px}
.ag-t .sq{width:9px;height:9px;border:1.2px solid var(--cat);border-radius:2px;flex:none}
.ag-m{font-size:10.5px;color:var(--muted);margin-top:2px;display:flex;gap:5px;align-items:center}
.ag-empty{padding:24px 4px;font-size:12px;color:var(--muted);line-height:1.7}
.ag-empty b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}
.ag-empty .btn{margin-top:8px;height:28px;font-size:11.5px}

/* mobile week: seven-day context strip + selected day timeline */
.wk{position:sticky;top:0;z-index:6;background:var(--bg);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;padding:2px 0 7px;border-bottom:1px solid var(--line)}
.wk-d{min-width:0;min-height:60px;padding:6px 0 7px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px}
.wk-d .w{font-size:10.5px;line-height:1.3;color:var(--muted)}
.wk-d .n{font-size:16px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.wk-d.today .n{color:var(--accent)}
.wk-d.sel{background:var(--surf3)}
.wk-d.sel .n{color:var(--ink)}
.wk-d.sel .w{color:var(--ink2)}
.wk-d .mks{display:flex;align-items:center;justify-content:center;gap:2px;height:6px;margin-top:1px}
.wk-d .mk{display:block;width:4px;height:4px;border-radius:50%}
.wk-d .mk.al{width:5px;height:5px;border-radius:1px;background:transparent;border:1px solid var(--faint)}
.wk-d .mk.du{width:7px;height:2px;border-radius:0;background:var(--warn)}
.wk-d .mk.none{width:3px;height:3px;background:transparent}
.wk-dayh{display:flex;align-items:baseline;gap:8px;padding:11px 0 3px}
.wk-dayh b{font-size:13.5px;font-weight:650;letter-spacing:0}
.wk-dayh span{font-size:11px;color:var(--muted)}

/* ---------- inspector ---------- */
.insp{width:404px;flex:none;border-left:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0;z-index:9}
.insp-top{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-bottom:1px solid var(--line)}
.insp-top .kind{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.insp-top .ml{margin-left:auto;display:flex;gap:2px}
.insp-scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 32px;scrollbar-width:thin}
.insp-scroll::-webkit-scrollbar{width:9px}
.insp-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:3px solid transparent;background-clip:content-box}
.ins-title{display:flex;align-items:flex-start;gap:10px;padding-bottom:10px}
.ins-title .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;margin-top:5px;flex:none;color:var(--surface)}
.ins-title .ck.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ins-title .ck .i{--s:9px}
.ins-title .tt{flex:1;min-width:0;border:0;background:transparent;font-size:24px;font-weight:650;line-height:1.28;padding:0;border-radius:4px;width:100%;font-family:var(--font);color:var(--ink);resize:none}
.ins-title .tt:hover{background:var(--surf2)}
.ins-title .tt:focus{background:var(--surf2);outline:none;box-shadow:inset 0 -1px 0 var(--ink)}
.ins-facts{display:flex;flex-direction:column;gap:0;padding:2px 0 6px}
.fact{display:flex;align-items:center;gap:9px;min-height:36px;width:100%;border-radius:5px;padding:0 6px;margin-left:-6px;font-size:12.5px;color:var(--ink2)}
.fact:hover{background:var(--surf2)}
.fact .i{--s:13px;color:var(--muted)}
.fact b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.fact .sub{color:var(--muted);font-variant-numeric:tabular-nums}
.fact .arr{margin-left:auto;--s:11px;color:var(--faint)}
.fact.due b{color:var(--warn)}
.fact.due.red b{color:var(--err)}
.fact.alloc b{color:var(--ink)}
.fact.plan-line{gap:8px;padding-top:2px;padding-bottom:2px;min-height:30px;color:var(--muted);font-size:12px}
.fact.plan-line .sq{width:12px;height:12px;border:1.3px solid var(--ink2);border-radius:2px;flex:none}
.fact.plan-line .tm{color:var(--ink2);font-variant-numeric:tabular-nums}
.fact.plan-line .rm{margin-left:auto;--s:11px;color:var(--faint);opacity:0}
.fact.plan-line:hover .rm{opacity:1}
.pri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:3px;background:var(--surf3);border-radius:7px}
.pri button{height:30px;border-radius:5px;font-size:12px;color:var(--muted);text-align:center}
.m-detail .pri button{height:40px;font-size:13px}
.m-detail .tagadd{height:34px}
.m-detail .m-row2{min-height:54px}
.pri button:hover{color:var(--ink)}
.pri button.on{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:var(--shadow-sm)}
.pri button[data-p="3"].on{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.tag{display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 4px 0 8px;border-radius:5px;background:var(--surf2);font-size:11.5px;color:var(--ink2)}
.tag .x{width:20px;height:20px;border-radius:3px;display:grid;place-items:center;color:var(--faint)}
.tag .x:hover{background:var(--surf3);color:var(--ink)}
.tag .i{--s:9px}
.tagadd{height:26px;padding:0 8px;border:1px dashed var(--line);border-radius:5px;color:var(--muted);font-size:11.5px}
.tagadd:hover{border-color:var(--faint);color:var(--ink)}
.subs{display:flex;flex-direction:column}
.sub{display:flex;align-items:center;gap:9px;min-height:38px;padding:0 2px;border-bottom:1px solid var(--line2)}
.sub .ck{width:16px;height:16px;border-radius:50%;border:1.4px solid var(--line);display:grid;place-items:center;flex:none;color:var(--surface)}
.sub .ck.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sub .ck .i{--s:8px}
.sub input{flex:1;min-width:0;border:0;background:transparent;font-size:12.5px;padding:6px 0;color:var(--ink)}
.sub input.done{color:var(--muted);text-decoration:line-through}
.sub .del{width:24px;height:24px;display:grid;place-items:center;color:var(--faint);opacity:0}
.sub:hover .del{opacity:1}
.sub .del:hover{color:var(--err)}
.subadd{display:flex;align-items:center;gap:7px;height:34px;color:var(--muted);font-size:12px;padding-left:2px}
.subadd:hover{color:var(--ink)}
.subadd .i{--s:11px}
.notes{width:100%;min-height:64px;border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:12.5px;line-height:1.55;background:var(--surface);color:var(--ink);resize:vertical;font-family:var(--font)}
.notes:hover{border-color:var(--faint)}
.notes:focus{outline:none;border-color:var(--ink2)}
.attach{display:flex;align-items:center;gap:8px;height:34px;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line2)}
.attach .i{--s:12px;color:var(--muted)}
.attach .rm{margin-left:auto;color:var(--faint);font-size:11px}
.attach .rm:hover{color:var(--err)}
.ins-foot{padding:18px 0 0;font-size:10.5px;color:var(--faint);line-height:1.7}

/* ---------- composer ---------- */
.cmpwrap{flex:none;position:relative;padding:10px 30px 16px;display:flex;justify-content:center;background:var(--bg);z-index:12}
.cmp-closed{display:flex;align-items:center;gap:9px;height:48px;width:min(700px, 100%);padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--muted);font-size:12.5px}
.cmp-closed:hover{border-color:var(--faint);background:var(--surface);color:var(--ink2)}
.cmp-closed .i{--s:13px;color:var(--faint)}
.cmp-closed .hint{margin-left:auto;font-size:10px;letter-spacing:.06em;color:var(--faint)}
.cmp{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:min(700px, calc(100% - 48px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:13;padding:10px 12px 11px}
.cmp-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cmp-types{display:flex;gap:2px;padding:2px;background:var(--surf3);border-radius:6px}
.cmp-types button{height:26px;padding:0 10px;border-radius:4px;font-size:11.5px;color:var(--muted)}
.cmp-types button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.cmp-close{margin-left:auto;width:26px;height:26px;display:grid;place-items:center;color:var(--faint);border-radius:5px}
.cmp-close:hover{background:var(--surf2);color:var(--ink)}
.cmp-input{width:100%;border:0;background:transparent;font-size:17px;font-weight:520;padding:4px 2px 6px;color:var(--ink);font-family:var(--font)}
.cmp-input::placeholder{color:var(--faint);font-weight:400}
.cmp-input:focus{outline:none}
.cmp-suggest{min-height:0}
.sug{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 8px;font-size:11.5px;color:var(--muted)}
.sug .id{color:var(--ink2);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}
.sug .btn{height:26px;font-size:11px}
.cmp-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:2px}
.cmp-chips .sp{flex:1}
.cmp-more{margin-top:8px;padding-top:9px;border-top:1px solid var(--line2);display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp-more .fld,.cmp .fld{display:flex;align-items:center;justify-content:space-between;gap:8px;height:36px;border:1px solid var(--line);border-radius:6px;padding:0 9px;font-size:11.5px;color:var(--muted);text-align:left;min-width:0}
.cmp .fld b,.cmp-more .fld b{color:var(--ink2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58%}
.cmp .fld:hover,.cmp-more .fld:hover{border-color:var(--faint);color:var(--ink)}
.cmp-more .fld b{color:var(--ink2);font-weight:500}
.cmp-more .fld:hover{border-color:var(--faint)}
.cmp-err{font-size:11.5px;color:var(--err);padding:2px 2px 6px}
.cmp-err input{border-color:var(--err)}

/* ---------- overlays ---------- */
#layer{position:fixed;inset:0;pointer-events:none;z-index:80}
#layer.on{pointer-events:auto}
#app .scrim{position:fixed;inset:0;z-index:72}
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px}
.scrim.sheet{align-items:flex-end;padding:0}
.scrim.clear{background:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:min(460px,100%);max-height:min(86vh,760px);display:flex;flex-direction:column;overflow:hidden}
.panel.wide{width:min(620px,100%)}
.panel.sheet{width:100%;max-width:560px;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom);max-height:92dvh;box-shadow:0 -8px 40px rgba(25,26,23,.18)}
.panel.modal{width:min(420px,100%)}
.ph{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line2)}
.ph b{font-size:13.5px;font-weight:650}
.ph .sub{font-size:11px;color:var(--muted);margin-left:2px}
.ph .x{margin-left:auto;width:30px;height:30px;display:grid;place-items:center;border-radius:5px;color:var(--muted)}
.ph .x:hover{background:var(--surf2);color:var(--ink)}
.pb{flex:1;min-height:0;overflow-y:auto;padding:14px 16px}
.pf{flex:none;display:flex;align-items:center;gap:8px;padding:11px 16px;border-top:1px solid var(--line2);background:var(--surface)}
.pf .sp{flex:1}
.pf .btn{min-width:64px;justify-content:center}
.pf .btn.primary{background:var(--ink);color:var(--bg)}
.pf .danger{color:var(--err)}
.mob-sheet .pf{padding-bottom:calc(11px + env(safe-area-inset-bottom))}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--ink)}
.opt:hover{background:var(--surf2)}
.opt .i{--s:14px;color:var(--muted)}
.opt .ck{width:16px;height:16px;border-radius:50%;border:1.4px solid var(--line);display:grid;place-items:center;flex:none;color:var(--surface)}
.opt .ck.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt .ck .i{--s:8px}
.opt.dis{color:var(--faint);pointer-events:none}
.opt .sub{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.optgroup{padding:12px 0 4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.quickrow{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 10px}
.quickrow .chip{height:30px;font-size:12px;padding:0 10px}
.mini-cal{padding:4px 0 0}
.mc-head{display:flex;align-items:center;gap:6px;padding:4px 0 8px}
.mc-head b{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.mc-nav{margin-left:auto;display:flex;gap:2px}
.mc-nav button{width:26px;height:26px;display:grid;place-items:center;border-radius:5px;color:var(--muted)}
.mc-nav button:hover{background:var(--surf2);color:var(--ink)}
.mc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mc-wd{height:22px;display:grid;place-items:center;font-size:10px;color:var(--muted)}
.mc-day{height:32px;border-radius:5px;display:grid;place-items:center;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.mc-day:hover{background:var(--surf2)}
.mc-day.out{color:var(--faint)}
.mc-day.today{color:var(--accent);font-weight:600}
.mc-day.on{background:var(--ink);color:var(--bg);font-weight:600}
.timeset{display:flex;align-items:center;gap:8px;padding:8px 0}
.timeset label{flex:1;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:10px;color:var(--muted)}
.timeset label:focus-within{border-color:var(--ink2)}
.timeset input{border:0;background:transparent;font-size:15px;color:var(--ink);padding:0;font-variant-numeric:tabular-nums;width:100%}
.timeset input:focus{outline:none}
.timeset .dur{flex:none;width:64px;display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--muted);padding:6px 0}
.timeset .dur b{font-size:12.5px;color:var(--ink2);font-weight:500;font-variant-numeric:tabular-nums}
.rowedit{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12px}
.rowedit .d{width:88px;flex:none;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rowedit input[type=time]{width:64px;border:1px solid var(--line);border-radius:5px;padding:4px 5px;font-size:11px;background:var(--surface);color:var(--ink)}
.rowedit .rm{width:26px;height:26px;display:grid;place-items:center;color:var(--faint);margin-left:auto;border-radius:4px}
.rowedit .rm:hover{background:var(--err-soft);color:var(--err)}
.rowedit .sep{color:var(--faint)}
.addrow{display:flex;align-items:center;gap:6px;height:34px;color:var(--muted);font-size:12px;padding:0 2px}
.addrow:hover{color:var(--ink)}
.banner{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border-radius:7px;background:var(--accent-soft);color:var(--ink);font-size:11.5px;line-height:1.5;margin:0 0 10px}
.banner.warn{background:var(--warn-soft)}
.banner.err{background:var(--err-soft)}
.banner b{font-weight:600}
.banner .i{--s:13px;color:var(--accent);margin-top:1px}
.fieldlabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 0 6px}
.input{width:100%;height:38px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:13px;background:var(--surface);color:var(--ink)}
.input:focus{outline:none;border-color:var(--ink2)}
.input.err{border-color:var(--err)}
.formerr{font-size:11px;color:var(--err);padding:5px 2px 0}
.hintline{font-size:11px;color:var(--muted);line-height:1.55;padding:4px 0}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;border-bottom:1px solid var(--line2);font-size:12.5px}
.sw{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;transition:background .12s}
.sw.on{background:var(--ink)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .12s}
.sw.on::after{left:18px}
.warnbox{padding:12px;border:1px solid var(--warn-soft);background:var(--warn-soft);border-radius:8px;font-size:11.5px;line-height:1.6;color:var(--ink)}
.warnbox b{display:block;margin-bottom:3px}

/* search */
.searchlayer{position:absolute;inset:0;background:var(--scrim);display:flex;justify-content:center;padding:8vh 20px 20px}
.searchbox{width:min(660px,100%);height:fit-content;max-height:min(76vh,660px);background:var(--surface);border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.sb-input{display:flex;align-items:center;gap:10px;padding:0 14px;height:52px;border-bottom:1px solid var(--line2);flex:none}
.sb-input .i{--s:15px;color:var(--muted)}
.sb-input input{flex:1;border:0;background:transparent;font-size:15px;color:var(--ink);min-width:0}
.sb-input input:focus{outline:none}
.sb-input .kbd{flex:none}
.sb-results{overflow-y:auto;padding:8px 8px 12px}
.sb-group{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 8px 6px}
.sb-row{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 8px;border-radius:6px;text-align:left}
.sb-row:hover{background:var(--surf2)}
.sb-row .i{--s:14px;color:var(--muted)}
.sb-main{min-width:0;flex:1}
.sb-t{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-m{font-size:10.5px;color:var(--muted);display:flex;gap:6px}
.sb-side{font-size:10.5px;color:var(--muted);flex:none}
.sb-row mark{background:var(--accent-soft);color:var(--ink);border-radius:2px;padding:0 1px}
.sb-empty{padding:18px 10px 10px}
.sb-empty b{font-size:14px}
.sb-empty p{font-size:11.5px;color:var(--muted);margin:6px 0 12px;line-height:1.6}
.sb-empty .acts2{display:flex;gap:8px}

/* toasts */
#toasts{position:fixed;left:0;right:0;bottom:96px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:120;padding:0 16px}
#toasts > *{pointer-events:auto}
.toast{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 6px 0 14px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:12px;box-shadow:var(--shadow);max-width:min(520px,92vw)}
.toast .msg{line-height:1.45}
.toast .undo{height:32px;padding:0 9px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--bg);background:rgba(255,255,255,.14);display:flex;align-items:center;gap:5px;white-space:nowrap}
html[data-theme="dark"] .toast{background:var(--surf3);color:var(--ink);border:1px solid var(--line)}
html[data-theme="dark"] .toast .undo{background:var(--surf2);color:var(--ink)}
.toast .undo:hover{background:rgba(255,255,255,.22)}
.toast .x{width:28px;height:28px;display:grid;place-items:center;color:inherit;opacity:.7}
.toast .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);animation:toastbar 6s linear forwards}
@keyframes toastbar{from{width:100%}to{width:0}}
.toast{position:relative;overflow:hidden}

/* ---------- mobile ---------- */
.m-shell{height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;width:100%;max-width:100%}
.m-top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 18px 6px;min-height:56px}
.m-top .t{font-size:13px;font-weight:600}
.m-top .ml{margin-left:auto;display:flex;gap:4px}
.m-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 18px 132px;-webkit-overflow-scrolling:touch}
.m-pagehead{padding:12px 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.m-pagehead h1{margin:0;font-size:21px;font-weight:650;line-height:1.15}
.m-pagehead .s{font-size:11.5px;color:var(--muted);padding-bottom:2px;text-align:right;line-height:1.5}
.m-zone{display:flex;align-items:center;gap:8px;min-height:34px;font-size:10px;font-weight:650;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.m-zone::after{content:"";flex:1;height:1px;background:var(--line)}
.m-zone.err{color:var(--err)}
.m-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:66px;padding:6px 0;border-bottom:1px solid var(--line2)}
.m-row .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--surface);flex:none}
.m-row .ck.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.m-row .ck .i{--s:10px}
.m-row .t{font-size:16px;font-weight:520;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.m-row .m{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px;min-width:0;overflow:hidden;white-space:nowrap}
.m-row .side{display:flex;align-items:center;gap:2px}
.m-row .due{font-size:10.5px;padding:2px 5px}
.m-iconbtn{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);border-radius:6px;flex:none;margin:-9px -6px -9px 0}
.m-iconbtn:active{background:var(--surf2)}
.m-iconbtn .i{--s:16px}
.m-weak{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;margin-top:12px;padding:0 12px;border:1px dashed var(--line);border-radius:8px;font-size:12px;color:var(--muted)}
.m-weak b{color:var(--ink2)}
.m-weak .i{--s:13px}
.m-weak .go{margin-left:auto;color:var(--ink2)}
.m-cmpbar{position:fixed;left:12px;right:12px;bottom:calc(var(--dock-h) + 10px + env(safe-area-inset-bottom));height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);font-size:12.5px;z-index:30;box-shadow:var(--shadow-sm)}
.m-dock{position:fixed;left:0;right:0;bottom:0;height:calc(var(--dock-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);z-index:31}
.m-dock button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--muted);position:relative}
.m-dock button .i{--s:19px}
.m-dock button.on{color:var(--ink);font-weight:600}
.m-dock button.on::before{content:"";position:absolute;top:0;left:50%;width:27px;height:2px;background:var(--ink);transform:translateX(-50%)}
.m-seg{display:flex;gap:2px;padding:3px;background:var(--surf3);border-radius:8px;margin:2px 0 10px}
.m-seg button{flex:1;height:32px;border-radius:6px;font-size:12px;color:var(--muted);text-align:center}
.m-seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.m-calhead{display:flex;align-items:center;gap:6px;padding:10px 0 10px}
.m-calhead .t{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.m-calhead .n{display:flex;gap:2px}
.m-calhead .n button{width:30px;height:30px;display:grid;place-items:center;border-radius:5px;color:var(--muted)}
.m-calhead .n button:hover{background:var(--surf2)}
.m-calhead .ml{margin-left:auto;display:flex;gap:6px}
.m-calhead .btn{height:30px;font-size:11.5px;padding:0 9px}
.m-mo{border-top:1px solid var(--line);border-left:1px solid var(--line2);display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.m-mo .wd{height:24px;display:grid;place-items:center;font-size:9.5px;color:var(--muted);border-right:1px solid var(--line2);border-bottom:1px solid var(--line);background:var(--bg)}
.m-mo .cell{min-width:0;min-height:48px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:4px 5px;display:flex;flex-direction:column;gap:3px;background:var(--surface);text-align:left}
.m-mo .cell.out{background:var(--bg);color:var(--faint)}
.m-mo .cell.sel{background:var(--surf2);box-shadow:inset 0 0 0 1.5px var(--ink)}
.m-mo .cell .dn{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink2)}
.m-mo .cell.out .dn{color:var(--faint);font-weight:400}
.m-mo .cell.today .dn{color:var(--accent)}
.m-mo .cell .dots{display:flex;gap:2px;flex-wrap:wrap;min-height:6px}
.m-mo .cell .dots i{width:5px;height:5px;border-radius:50%;background:var(--faint)}
.m-mo .cell .dots i.due{height:2px;width:8px;border-radius:0}
.m-mo .cell .n{font-size:9px;color:var(--muted);line-height:1.1}
.m-agenda{margin-top:12px}
.m-agenda .h{display:flex;align-items:baseline;gap:7px;padding:2px 0 8px}
.m-agenda .h b{font-size:14px;font-weight:600}
.m-agenda .h span{font-size:11px;color:var(--muted)}
.m-agenda .h .open{margin-left:auto;font-size:11.5px;color:var(--muted);display:flex;gap:4px;align-items:center}
.m-ag{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.m-ag .tm{width:40px;flex:none;font-size:10.5px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.m-ag .t{font-size:13.5px;font-weight:600;display:flex;gap:5px;align-items:center}
.m-ag .m{font-size:11px;color:var(--muted);margin-top:2px}
.m-ag .sq{width:8px;height:8px;border:1.2px solid var(--cat);border-radius:2px}
.m-daylist{display:flex;flex-direction:column}
.m-tl{display:grid;grid-template-columns:44px 12px minmax(0,1fr);gap:8px;padding:3px 0}
.m-tl .tm{font-size:10.5px;color:var(--muted);padding-top:9px;font-variant-numeric:tabular-nums}
.m-tl .rail{padding-top:13px;display:flex;justify-content:center}
.m-tl .rail .dot{width:5px;height:5px;border-radius:50%;background:var(--cat)}
.m-tl .blk2{border-radius:7px;padding:8px 10px;min-height:46px;background:var(--cat-bg);color:var(--cat-ink);border-left:3px solid var(--cat)}
.m-tl .blk2 .bt{font-size:14px;font-weight:600;display:flex;gap:5px;align-items:center}
.m-tl .blk2 .bm{font-size:11px;opacity:.85;margin-top:2px}
.m-tl .blk2.alloc{background:var(--surface);border:1px dashed var(--line);border-left:3px solid var(--cat);color:var(--ink)}
.m-tl .blk2.alloc .bm{color:var(--muted);opacity:1}
.m-tl .blk2 .sq{width:9px;height:9px;border:1.2px solid var(--cat);border-radius:2px}
.m-due{display:grid;grid-template-columns:44px 12px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border:0;background:transparent;width:100%;text-align:left}
.m-nowmark{display:grid;grid-template-columns:44px 12px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0}
.m-nowmark .tm{font-size:10.5px;font-weight:650;color:var(--accent);font-variant-numeric:tabular-nums}
.m-nowmark .line{height:2px;background:var(--accent);opacity:.8;border-radius:1px}
.m-nowmark .tx{font-size:10.5px;color:var(--accent);font-weight:600}
.m-due .tm{font-size:10.5px;color:var(--warn);font-weight:600;font-variant-numeric:tabular-nums}
.m-due .line{height:1px;background:var(--warn);opacity:.5}
.m-due .tx{font-size:13px;color:var(--warn);border-top:1px solid transparent;line-height:1.4}
.m-due .tx b{font-weight:600}
.m-free{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center;min-height:48px;border-top:1px solid var(--line2);color:var(--muted);font-size:11px;width:100%;text-align:left}
.m-daysub{font-size:10.5px;color:var(--faint);line-height:1.6;padding:12px 0 0}
.m-free .tm{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.m-free .add{display:flex;align-items:center;gap:6px}
.m-free .i{--s:11px;color:var(--faint)}
.m-me{display:flex;flex-direction:column;gap:14px;padding:6px 0 20px}
.m-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.m-card-row{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-bottom:1px solid var(--line2);font-size:13px;width:100%;text-align:left}
.m-card-row:last-child{border-bottom:0}
.m-card-row .i{--s:15px;color:var(--muted)}
.m-card-row .sub{margin-left:auto;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.m-card-row:hover{background:var(--surf2)}
.m-card-h{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 2px 6px}
.m-detail{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overscroll-behavior:contain}
.m-detail .bar{flex:none;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 6px;border-bottom:1px solid var(--line)}
.m-detail .bar .bk{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);border-radius:6px}
.m-detail .bar .bk .i{--s:18px}
.m-detail .bar .kind{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.m-detail .bar .ml{margin-left:auto;display:flex}
.m-detail .scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 18px calc(32px + env(safe-area-inset-bottom))}
.m-detail .tt{font-size:24px;font-weight:650;line-height:1.28;margin:2px 0 12px;width:100%;border:0;background:transparent;color:var(--ink);font-family:var(--font);resize:none}
.m-detail .tt:focus{outline:none}
.m-detail .m-row2{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;border-bottom:1px solid var(--line2);width:100%;font-size:13px;text-align:left}
.m-detail .m-row2 .k{color:var(--muted);font-size:12px}

    });

  function lanes(blocks) {
