      }
      case 'clear-remind': { var rm2 = eventById(id) || todoById(id); if (rm2) rm2.remind = null; closeLayer(); render(true); break; }
      case 'go-edit-due': { var gd = todoById(id); closeLayer(); if (gd) setTimeout(function () { openDueEditor(gd); }, 0); break; }
      case 'remind-absolute': closeLayer(); toast('绝对提醒：需要具体日期与时刻；不会假定默认 09:00', null); break;
      case 'set-cal': {
        var cc = eventById(id) || todoById(id); if (!cc) break;
        var old = cc.cal; cc.cal = btn.dataset.cal; closeLayer(); render(true);
        toast('已移到「' + CAL[cc.cal].name + '」', '撤销', function () { cc.cal = old; render(true); });
        break;
      }

      /* context menu */
      case 'row-more': {
        var item = eventById(id) || todoById(id);
        if (item) openMenu(item, eventById(id) ? 'event' : 'todo');
        break;
      }
      case 'open-menu': {
        var item2 = btn.dataset.kind === 'event' ? eventById(id) : todoById(id);
        if (item2) openMenu(item2, btn.dataset.kind);
        break;
      }
      case 'm-arrange': { var ma = todoById(id); closeLayer(); if (ma) setTimeout(function () { openArrange(ma); }, 0); break; }
      case 'm-due': { var md1 = todoById(id); closeLayer(); if (md1) setTimeout(function () { openDueEditor(md1); }, 0); break; }
      case 'm-cal': { var mc = eventById(id) || todoById(id); closeLayer(); if (mc) setTimeout(function () { calendarEditor(mc, eventById(id) ? 'event' : 'todo'); }, 0); break; }
      case 'm-tags': { var mt = todoById(id); closeLayer(); if (mt) setTimeout(function () { tagsEditor(mt); }, 0); break; }
      case 'm-dup': closeLayer(); if (eventById(id)) duplicateEvent(id); else duplicateTodo(id); break;
      case 'm-del': closeLayer(); if (eventById(id)) removeEvent(id); else removeTodo(id); break;
      case 'm-evtime': { var me = eventById(id); closeLayer(); if (me) setTimeout(function () { eventTimeEditor(me); }, 0); break; }

      /* search create */
      case 'search-new-todo': case 'search-new-event': {
        var q = btn.dataset.title || st.q || '';
        st.open = false; S.mobileDetail = null;
        S.composer = blankComposer(act === 'search-new-event' ? 'event' : 'todo');
        S.composer.open = true; S.composer.title = q;
        render(); focusComposer(); break;
      }

      /* sync */
      case 'sync-now': S.sync = 'ok'; S.pending = 0; render(); toast('已同步 · 刚刚', null); break;
      case 'sync-offline': S.sync = 'offline'; S.pending = 3; closeLayer(); render(); break;
      case 'sync-lapsed': S.sync = 'lapsed'; closeLayer(); render(); break;
      case 'sync-conflict': closeLayer(); openConflict(); break;
      case 'conflict-use': closeLayer(); S.sync = 'ok'; render(); toast('已使用' + (btn.dataset.side === 'local' ? '本机' : '服务器') + '版本 · 其余字段已合并', null); break;

      /* trash */
      case 'trash-restore': {
        var tr = S.trash.filter(function (x) { return x.id === id; })[0];
        S.trash = S.trash.filter(function (x) { return x.id !== id; });
        if (tr && tr.snap) { if (tr.snap.start || tr.snap.date || tr.snap.startDate) EVENTS.push(tr.snap); else TODOS.push(tr.snap); }
        openSettings('trash'); toast('已恢复「' + (tr ? tr.title : '') + '」', null); break;
      }
      case 'trash-purge': {
        var tp = S.trash.filter(function (x) { return x.id === id; })[0];
        openLayer(panelHtml({
          title: '永久删除「' + (tp ? tp.title : '') + '」？', sub: '回收站',
          body: '<div style="font-size:13px;color:var(--ink);line-height:1.7">删除后无法恢复。</div>',
          foot: '<button class="btn" data-act="close-layer">取消</button><span class="sp"></span><button class="btn danger" data-act="trash-purge-do" data-id="' + id + '">永久删除</button>',
          modal: true
        }));
        break;
      }
      case 'trash-purge-do': S.trash = S.trash.filter(function (x) { return x.id !== id; }); closeLayer(); openSettings('trash'); break;

      case 'go-cal-week': S.screen = 'calendar'; S.calView = 'week'; S.planOpen = !isMobile(); S.mobileDetail = null; render(); save(); break;
      case 'go-cal-plan': S.screen = 'calendar'; S.calView = 'week'; S.planOpen = !isMobile(); S.mobileDetail = null; render(); save(); break;
      default: break;
    }
  }

  /* -------- action helpers -------- */
  function stepCal(n) {
    if (S.calView === 'month') {
      var p = S.calDate.split('-').map(Number);
      var d = new Date(Date.UTC(p[0], p[1] - 1 + n, 1));
      S.calDate = isoOf(d); S.selDate = S.calDate;
    } else if (S.calView === 'week') S.calDate = addD(S.calDate, n * 7);
    else S.calDate = addD(S.calDate, n);
    S.selDate = S.calDate;
    render(); save();
  }
  function setDue(id, date, time) {
    var t = todoById(id); if (!t) return;
    t.due = date || null;
    t.dueTime = (time || '').trim() || null;
    if (!t.dueTime) t.remind = null;
    closeLayer(); render(true);
  }
  function arrangeSubmit(id) {
    var t = todoById(id); if (!t) return;
    var lay = $('#layer');
    var d = lay.dataset.date || TODAY;
    var s = $('#arr-start').value, e = $('#arr-end').value;
    if (mins(e) <= mins(s)) { toast('结束时间要晚于开始时间', null); return; }
    t.allocs = t.allocs || [];
    t.allocs.push({ id: 'a-' + Date.now(), date: d, start: s, end: e });
    closeLayer(); render(true);
    toast('已新增计划执行 · ' + mds(d) + ' ' + s + '–' + e + ' · 截止不变', '撤销', function () {
      t.allocs = t.allocs.filter(function (a) { return a.date !== d || a.start !== s || a.end !== e; });
      render(true);
    });
  }
  function eventApply(id) {
    var ev = eventById(id); if (!ev) return;
    var s = $('#ev-start'), e = $('#ev-end');
    if (s && e) {
      if (mins(e.value) <= mins(s.value)) { toast('结束时间要晚于开始时间', null); return; }
      ev.start = s.value; ev.end = e.value;
    }
    closeLayer(); render(true);
  }

  /* -------- block move / resize inside the time grid -------- */
  var gridDrag = null;
  function bindGridDrag() {
    document.addEventListener('pointerdown', function (e) {
      var blk = e.target.closest('[data-grid] .blk');
      if (!blk || !e.target.closest('[data-date]')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      var col = blk.closest('[data-col]');
      if (!col) return;
      var b = blockFor(blk.dataset.id, blk.dataset.date, blk.classList.contains('alloc'), blk);
      if (!b) return;
      var rect = col.getBoundingClientRect();
      gridDrag = {
        mode: e.target.closest('[data-resize]') ? 'resize' : 'move',
        kind: blk.classList.contains('alloc') ? 'alloc' : 'event',
        id: blk.dataset.id, date: blk.dataset.date, col: col, rect: rect,
        pointerId: e.pointerId, x0: e.clientX, y0: e.clientY,
        start: b.start, end: b.end, moved: false
      };
      blk.setPointerCapture && blk.setPointerCapture(e.pointerId);
      e.preventDefault();
    }, false);

    document.addEventListener('pointermove', function (e) {
      if (!gridDrag) return;
      var dx = e.clientX - gridDrag.x0, dy = e.clientY - gridDrag.y0;
      if (!gridDrag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
      gridDrag.moved = true;
      var snap = Math.round(dy / gridDrag.rect.height * 96) * 15;
      var newStart = Math.max(0, Math.min(1425, gridDrag.start + snap));
      var len = gridDrag.end - gridDrag.start;
      var outStart, outEnd;
      if (gridDrag.mode === 'resize') {
        outStart = gridDrag.start;
        outEnd = Math.max(outStart + 15, Math.min(1440, gridDrag.end + snap));
      } else {
        outStart = newStart;
        outEnd = newStart + len;
        if (outEnd > 1440) { outEnd = 1440; outStart = 1440 - len; }
      }
      var under = document.elementFromPoint ? document.elementFromPoint(e.clientX, e.clientY) : null;
      var tc = under && under.closest ? under.closest('[data-col]') : null;
      gridDrag.targetDate = tc ? tc.dataset.col : gridDrag.date;
      var gcol = tc || gridDrag.col, grect = gcol.getBoundingClientRect();
      showGhost(gcol, grect.top + grect.height * (outStart / 1440), clock(outStart) + '–' + clock(outEnd) + (gridDrag.targetDate !== gridDrag.date ? ' → ' + mds(gridDrag.targetDate) : ''));
    }, false);

    document.addEventListener('pointerup', function (e) {
      if (!gridDrag) return;
      var g = gridDrag; gridDrag = null;
      hideGhost();
      if (!g.moved) return;
      suppressClick = true;
      setTimeout(function () { suppressClick = false; }, 60);
      applyBlockTime(g, g.mode, Math.round((e.clientY - g.y0) / g.rect.height * 96) * 15, g.targetDate || g.date);
    }, false);
    document.addEventListener('pointercancel', function () { gridDrag = null; hideGhost(); }, false);
  }
  function blockFor(id, date, isAlloc) {
    if (isAlloc) {
      var t = todoById(id);
      if (!t) return null;
      var a = (t.allocs || []).filter(function (x) { return x.date === date; })[0];
      if (!a) return null;
      return { start: mins(a.start), end: mins(a.end), alloc: a, todo: t };
    }
    var ev = eventById(id);
    if (!ev) return null;
    return { start: mins(ev.start), end: mins(ev.end), event: ev };
  }
  function applyBlockTime(g, mode, snap, toDate) {
    var b = blockFor(g.id, g.date, g.kind === 'alloc');
    if (!b) return;
    var len = b.end - b.start;
    var start, end;
    if (mode === 'resize') {
      start = b.start;
      end = Math.max(start + 15, Math.min(1440, b.end + snap));
    } else {
      start = Math.max(0, Math.min(1440 - len, b.start + snap));
      end = start + len;
    }
    var old = { start: b.start, end: b.end, date: g.date };
    var sTxt = clock(start), eTxt = clock(end);
    if (b.alloc) {
      // move between columns creates a second segment rather than silently moving across days
      var day = toDate && toDate !== g.date ? toDate : g.date;
      b.alloc.date = day; b.alloc.start = sTxt; b.alloc.end = eTxt;
      render(true);
      toast('已改计划执行 · ' + mds(day) + ' ' + sTxt + '–' + eTxt + ' · 截止不变', '撤销', function () {
        b.alloc.date = old.date; b.alloc.start = clock(old.start); b.alloc.end = clock(old.end); render(true);
      });
      return;
    }
    var ev = b.event;
    var oldDate = ev.date;
    ev.start = sTxt; ev.end = eTxt;
    if (toDate && toDate !== g.date && !ev.endDate) ev.date = toDate;
    render(true);
    toast('已改日程时间 · ' + mds(ev.date) + ' ' + sTxt + '–' + eTxt, '撤销', function () {
      ev.start = clock(old.start); ev.end = clock(old.end); ev.date = oldDate; render(true);
    });
  }
  var suppressClick = false;
  function bindGridDragLater() { bindGridDrag(); }

  /* -------- mini calendar -------- */
  function miniCalHtmlFor(y, m, sel, kind) {
    var first = isoOf(new Date(Date.UTC(y, m - 1, 1)));
    var st = weekStart(first), cells = '';
    for (var i = 0; i < 42; i++) {
      var d = addD(st, i), inM = Number(d.slice(5, 7)) === m;
      cells += '<button class="mc-day' + (inM ? '' : ' out') + (d === sel ? ' on' : '') + (d === TODAY ? ' today' : '') +
        '" data-act="mc-pick" data-date="' + d + '" data-kind="' + kind + '">' + Number(d.slice(-2)) + '</button>';
    }
    return '<div class="mini-cal" data-mc="' + m + '" data-mc-y="' + y + '">' +
      '<div class="mc-head"><b>' + y + ' 年 ' + m + ' 月</b><div class="mc-nav">' +
      '<button data-act="mc-prev" aria-label="上个月">' + ico('left', 12) + '</button>' +
      '<button data-act="mc-next" aria-label="下个月">' + ico('right', 12) + '</button></div></div>' +
      '<div class="mc-grid">' + DOW1.map(function (x) { return '<div class="mc-wd">' + x + '</div>'; }).join('') + cells + '</div></div>';
  }
  function swapMiniCal(sel, kind, deltaMonth) {
    var mc = $('.mini-cal', $('#layer'));
    if (!mc) return;
    var y = Number(mc.dataset.mcY), m = Number(mc.dataset.mc);
    if (deltaMonth) { m += deltaMonth; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } }
    var tmp = document.createElement('div');
    tmp.innerHTML = miniCalHtmlFor(y, m, sel, kind);
    mc.parentNode.replaceChild(tmp.firstElementChild, mc);
  }

  function pickMiniCal(btn) {
    var lay = $('#layer');
    if (!lay || !lay.classList.contains('on')) return false;
    var kind = btn.dataset.kind, date = btn.dataset.date;
    lay.dataset.date = date;
    if (kind === 'goto') {
      if (S.screen === 'todo') { S.todoDate = date; }
      else { S.calDate = date; S.selDate = date; }
      if (btn.closest('.sb-input')) {}
      closeLayer(); render(); save(); return true;
    }
    swapMiniCal(date, kind, 0);
    return true;
  }

  /* -------- inputs -------- */
  function onInput(e) {
    var t = e.target;
    if (t.id === 'ai-input') { S.ai.draft = t.value; return; }
    if (t.id === 'cmp-input' || t.id === 'm-cmp-input') {
      S.composer.title = t.value;
      S.composer.err = '';
      if (S.composer.noSug) return;
      updateSuggestion(t);
      return;
    }
    if (t.id === 'search-input') { paintSearch(t.value, t.selectionStart); return; }
    if (t.id === 'm-search-input') {
      searchState().q = t.value;
      var caret = t.selectionStart;
      var host = document.getElementById('app');
      var html = mobileScreen();
      host.outerHTML = html;
      var el = $('#m-search-input');
      if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (x) {} }
      return;
    }
    if (t.dataset && t.dataset.mfield === 'note') {
      var nt = todoById(t.dataset.id) || eventById(t.dataset.id);
      if (nt) nt.note = t.value;
      return;
    }
    if (t.dataset && t.dataset.mfield === 'sub') {
      var s2 = todoById(t.dataset.id);
      if (s2 && s2.subtasks[Number(t.dataset.i)]) s2.subtasks[Number(t.dataset.i)].t = t.value;
      return;
    }
    if (t.dataset && t.dataset.mfield === 'title') {
      var ref = S.drawer || S.mobileDetail;
      if (!ref) return;
      var it = ref.type === 'event' ? eventById(ref.id) : todoById(ref.id);
      if (it) it.title = t.value;
      autosize(t);
      return;
    }
  }
  function onChange(e) {
    var t = e.target;
    if (!t.dataset) return;
    if (t.dataset.act === 'alloc-start' || t.dataset.act === 'alloc-end') {
      var a = (todoById(t.dataset.id).allocs || []).filter(function (x) { return x.id === t.dataset.allocid; })[0];
      if (a) { if (t.dataset.act === 'alloc-start') a.start = t.value; else a.end = t.value; }
    }
  }
  function autosize(el) {
    el.style.height = 'auto';
    el.style.height = Math.max(24, el.scrollHeight) + 'px';
  }
  function updateSuggestion(t) {
    var host = t.parentNode.querySelector('.sug');
    if (host) host.remove();
    var sug = nlpSuggest(t.value);
    if (!sug) return;
    var c = S.composer;
    var div = document.createElement('div');
    div.className = 'sug';
    div.innerHTML = '<span class="id">' + ico('clock', 12) + '识别到：' + esc(sug.text) + '</span>' + (c.type === 'todo'
      ? '<button class="btn" data-act="apply-due" data-date="' + sug.date + '" data-time="' + (sug.time || '') + '">设为截止</button>' +
        '<button class="btn" data-act="apply-plan" data-date="' + sug.date + '" data-time="' + (sug.time || '') + '">安排到这个时间</button>'
      : '<button class="btn" data-act="apply-evtime" data-date="' + sug.date + '" data-time="' + (sug.time || '') + '">设为日程时间</button>');
    t.parentNode.insertBefore(div, t.nextSibling);
  }

  /* -------- keyboard -------- */
  function onKey(e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    var st = searchState();
    if (e.key === 'Escape') {
      if ($('#layer').classList.contains('on')) { e.preventDefault(); closeLayer(); return; }
      if (isMobile() && st.open) { e.preventDefault(); st.open = false; render(); return; }
      if (S.composer.open) { e.preventDefault(); S.composer = blankComposer(); render(); return; }
      if (S.mobileDetail) { e.preventDefault(); S.mobileDetail = null; render(); return; }
      if (S.drawer) { e.preventDefault(); S.drawer = null; render(); return; }
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); S.search = { open: true, q: '' }; render(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && S.composer.open) { e.preventDefault(); submitComposer(); return; }
    if (typing) return;
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); S.composer = blankComposer('todo'); S.composer.open = true; render(); focusComposer(); return; }
    if (e.key === 'e' || e.key === 'E') { e.preventDefault(); S.composer = blankComposer('event'); S.composer.open = true; render(); focusComposer(); return; }
    if ((e.key === 'c' || e.key === 'C') && S.drawer && S.drawer.type === 'todo') { e.preventDefault(); completeTodo(S.drawer.id, false); return; }
    if (S.screen === 'calendar') {
      if (e.key === 't' || e.key === 'T') { S.calDate = TODAY; S.selDate = TODAY; render(); save(); return; }
      if (e.key === 'm' || e.key === 'M') { S.calView = 'month'; render(); save(); return; }
      if (e.key === 'w' || e.key === 'W') { S.calView = 'week'; render(); save(); return; }
      if (e.key === 'd' || e.key === 'D') { S.calView = 'day'; render(); save(); return; }
      if (e.key === 'ArrowLeft') { e.preventDefault(); stepCal(-1); return; }
      if (e.key === 'ArrowRight') { e.preventDefault(); stepCal(1); return; }
    }
  }

  /* -------- drag from planning sidebar -------- */
  var dragId = null, ghost = null;
  function bindEvents() {
    document.addEventListener('click', function (e) {
      if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); return; }
      /* scrim click */
      var scrim = e.target.closest('[data-scrim]');
      if (scrim && scrim.dataset.scrim === 'yes' && !e.target.closest('.panel') && !e.target.closest('.searchbox')) {
        if (searchState().open && !isMobile()) { searchState().open = false; closeLayer(); render(); return; }
        closeLayer(); return;
      }
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      if (btn.dataset.act === 'mc-pick' && pickMiniCal(btn)) return;
      handleAction(btn);
    }, false);

    document.addEventListener('input', onInput, false);
    document.addEventListener('change', onChange, false);
    document.addEventListener('keydown', onKey, false);

    document.addEventListener('dragstart', function (e) {
      var el = e.target.closest('[data-drag-todo]');
      if (!el) return;
      dragId = el.dataset.dragTodo;
      try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'copy'; } catch (x) {}
    });
    document.addEventListener('dragend', function () { dragId = null; hideGhost(); });
    document.addEventListener('dragover', function (e) {
      if (!dragId) return;
      var col = e.target.closest('[data-col]');
      if (!col) return;
      e.preventDefault();
      showGhost(col, e.clientY);
    });
    document.addEventListener('drop', function (e) {
      if (!dragId) return;
      var col = e.target.closest('[data-col]');
      hideGhost();
      if (!col) { dragId = null; return; }
      e.preventDefault();
      var d = col.dataset.col, rect = col.getBoundingClientRect();
      var m = Math.max(0, Math.min(1425, Math.round(((e.clientY - rect.top) / rect.height) * 96) * 15));
      var t = todoById(dragId); dragId = null;
      if (!t) return;
      var aid = 'a-' + Date.now();
      t.allocs = t.allocs || [];
      t.allocs.push({ id: aid, date: d, start: clock(m), end: clock(m + 60) });
      render(true);
      toast('已新增计划执行 · ' + mds(d) + ' ' + clock(m) + '–' + clock(m + 60) + ' · 截止不变', '撤销', function () {
        t.allocs = t.allocs.filter(function (a) { return a.id !== aid; });
        render(true);
      });
    });

    /* empty grid click → slot picker */
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-act]') || e.target.closest('[data-drag-todo]') || e.target.closest('#layer') || e.target.closest('.blk')) return;
      var col = e.target.closest('[data-col]');
      if (!col) return;
      if (!e.target.closest('[data-grid]')) return;
      var rect = col.getBoundingClientRect();
      var m = Math.max(0, Math.min(1425, Math.floor(((e.clientY - rect.top) / rect.height) * 96) * 15));
      openSlot(col.dataset.col, clock(m), clock(m + 60), { x: e.clientX, y: e.clientY });
    }, false);

    window.addEventListener('resize', function () { render(); });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.target.id === 'cmp-input' || e.target.id === 'm-cmp-input')) {
        e.preventDefault(); submitComposer();
      }
      if (e.key === 'Enter' && e.target.id === 'ai-input') {
        e.preventDefault(); aiSend(S.ai.draft);
      }
    });
  }
  function showGhost(col, y, label) {
    if (!ghost) { ghost = document.createElement('div'); ghost.className = 'ghost'; document.body.appendChild(ghost); }
    var rect = col.getBoundingClientRect();
    var m = Math.max(0, Math.min(1425, Math.round(((y - rect.top) / rect.height) * 96) * 15));
    ghost.textContent = label || (clock(m) + '–' + clock(m + 60));
    ghost.style.top = (label ? y : rect.top + m / 1440 * rect.height) + 'px';
    ghost.style.left = (rect.left + 6) + 'px';
  }
  function hideGhost() { if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost); ghost = null; }

  /* -------- boot -------- */
  load();
  try {
    var qs = new URLSearchParams(window.location.search);
    if (qs.get('screen')) S.screen = qs.get('screen');
    if (qs.get('view')) S.calView = qs.get('view');
    if (qs.get('theme') === 'dark') S.dark = true;
    if (qs.get('device') === 'mobile') S.device = 'mobile';
    if (qs.get('tab')) S.todoTab = qs.get('tab');
    if (qs.get('drawer')) S.drawer = { type: 'todo', id: qs.get('drawer') };
    if (qs.get('event')) S.drawer = { type: 'event', id: qs.get('event') };
    if (qs.get('mdetail')) S.mobileDetail = { type: qs.get('mtype') || 'todo', id: qs.get('mdetail') };
    if (qs.get('mevent')) S.mobileDetail = { type: 'event', id: qs.get('mevent') };
    if (qs.get('composer') === '1') { S.composer = blankComposer(qs.get('type') || (qs.get('screen') === 'calendar' ? 'event' : 'todo')); S.composer.open = true; S.composer.title = qs.get('q') || ''; }
    if (qs.get('search') === '1') S.search = { open: true, q: qs.get('q') || '' };
  } catch (e) {}
  if (S.calView !== 'month' && S.calView !== 'week' && S.calView !== 'day') S.calView = 'week';
  applyTheme();
  render();
  bindEvents();
  bindGridDragLater();
  if (qs && qs.get('settings')) setTimeout(function () { openSettings(qs.get('settings')); }, 40);
  if (qs && qs.get('ai') === '1') setTimeout(function () { aiOpen(); }, 60);
})();

</script>
</body>
</html>
