    });
    out += '<div class="todo-list" data-scrollkey="todo-list" style="padding-top:0"><div class="todo-inner">';
    out += '<div class="todo-datehead">' + md(date) + ' · ' + wd(date) + '<span class="ct">' + arr.length + ' 项截止</span><span class="vl">' + (dayDiff(date, TODAY) === 0 ? '今天' : dayDiff(date, TODAY) > 0 ? dayDiff(date, TODAY) + ' 天后' : Math.abs(dayDiff(date, TODAY)) + ' 天前') + '</span></div>';
    if (!arr.length) out += '<div class="empty" style="padding-top:16px"><b>' + relDay(date) + '没有到期的待办</b><p>这里只看截止日期。计划执行在日历里；不会被当作今天必须处理的事。</p></div>';
    else out += arr.map(function (t) { return todoRow(t); }).join('');
    out += '<div class="note" style="margin-top:18px">截止是外部约束，不占时间轴。要从某个时间开始做，用每行的“安排”。</div>';
    out += '</div></div>';
    return out;
  }

  function todoDesktop() {
    var head = todoHeadDesktop();
    if (S.todoTab === 'due') {
      return '<div class="page" data-od-id="todo-due">' + head + todoDueDesktop() + composerBar() + '</div>';
    }
    return '<div class="page">' + head +
      '<div class="todo-page"><div class="todo-body">' + todoListDesktop() + '</div></div>' +
      composerBar() + '</div>';
  }

  function filteredEmpty() {
    return '<div class="empty"><b>没有符合条件的待办</b><p>' + esc(filterText()) + '</p><button class="btn" data-act="clear-filter">清除筛选</button></div>';
  }

  function planSidebar() {
    var arr = unscheduled();
    var out = '<div class="plan-side" data-od-id="todo-plan-sidebar"><div class="plan-head"><b>待安排</b><span>' + arr.length + '</span><span class="hint">拖到日历</span></div><div class="plan-list" data-scrollkey="plan-list">';
    if (!arr.length) out += '<div class="plan-empty">库存清空了。新建的待办会先出现在这里，直到你给它一个真实时间。</div>';
    else out += arr.map(function (t) {
      var c = catVars(t.cal);
      return '<div class="plan-item" draggable="true" data-drag-todo="' + t.id + '" data-id="' + t.id + '"><span class="dot" style="background:' + c.color + '"></span><span class="t">' + esc(t.title) + '</span>' + ico('arrow') + '</div>';
    }).join('');
    out += '</div><div class="plan-foot">拖入时间轴只会新增计划执行；截止和日程都不会被改写。</div></div>';
    return out;
  }

  /* ---------------- calendar ---------------- */
  function calRangeTitle() {
    if (S.calView === 'month') { var p = S.calDate.split('-').map(Number); return p[0] + ' 年 ' + p[1] + ' 月'; }
    if (S.calView === 'week') {
      var s = weekStart(S.calDate), e = addD(s, 6);
      var sp = s.split('-').map(Number), ep = e.split('-').map(Number);
      var range = sp[1] === ep[1] ? sp[1] + ' 月 ' + sp[2] + '–' + ep[2] + ' 日'
        : sp[1] + ' 月 ' + sp[2] + ' 日 – ' + ep[1] + ' 月 ' + ep[2] + ' 日';
      return range + ' · ' + (s <= TODAY && TODAY <= e ? '本周' : wd(s) + '起');
    }
    return md(S.calDate) + ' · ' + wd(S.calDate);
  }
  function calHead() {
    return '<div class="cal-head" data-od-id="calendar-head">' +
      '<div class="cal-nav"><button data-act="cal-prev" aria-label="上一段">' + ico('left') + '</button></div>' +
      '<button class="cal-title" data-act="open-datepicker">' + calRangeTitle() + ico('down') + '</button>' +
      '<div class="cal-nav"><button data-act="cal-next" aria-label="下一段">' + ico('right') + '</button></div>' +
      '<button class="btn" data-act="cal-today" style="height:28px">今天</button>' +
      '<span class="ml">' +
      '<div class="seg">' + [['month', '月'], ['week', '周'], ['day', '日']].map(function (v) {
        return '<button class="' + (S.calView === v[0] ? 'on' : '') + '" data-act="cal-view" data-view="' + v[0] + '">' + v[1] + '</button>';
      }).join('') + '</div>' +
      '<button class="btn" data-act="open-calfilter">' + ico('filter') + '显示日历</button>' +
      (S.calView === 'month' || S.drawer ? '' :
        '<button class="btn ' + (S.planOpen ? 'is-on' : '') + '" data-act="toggle-plan" aria-pressed="' + S.planOpen + '">' +
        ico('inbox') + (S.planOpen ? '收起待安排' : '待安排') + '</button>') +
      '</span></div>';
  }

  function monthDesktop() {
    var p = S.calDate.split('-').map(Number), y = p[0], m = p[1];
    var first = isoOf(new Date(Date.UTC(y, m - 1, 1)));
    var start = weekStart(first);
    var cells = '';
    for (var i = 0; i < 42; i++) {
      var d = addD(start, i);
      var dd = Number(d.slice(-2));
      var inMonth = Number(d.slice(5, 7)) === m;
      var sel = d === S.selDate;
      var today = d === TODAY;
      cells += '<button class="mo-cell' + (inMonth ? '' : ' out') + (sel ? ' sel' : '') + (today ? ' today' : '') + '" data-act="mo-pick" data-date="' + d + '">' +
        '<span class="dn">' + dd + '</span>' + monthCellItems(d) + '</button>';
    }
    var grid = '<div class="mo-grid">' + ['周一', '周二', '周三', '周四', '周五', '周六', '周日'].map(function (w) { return '<div class="mo-wd">' + w + '</div>'; }).join('') + cells + '</div>';
    var ag = agendaPanel(S.selDate);
    return '<div class="mo-wrap"><div class="mo-scroll" data-scrollkey="mo-scroll">' + grid + '</div>' + ag + '</div>';
  }
  function monthCellItems(d) {
    var items = [];
    evOnDate(d).forEach(function (e) { items.push({ k: e.allDay ? '全天 ' : e.start + ' ', t: e.title, type: 'event' }); });
    blocksOn(d).filter(function (b) { return b.kind === 'alloc'; }).forEach(function (b) { items.push({ k: b.start + ' ', t: b.title, type: 'alloc' }); });
    TODOS.filter(function (t) { return !isDone(t) && t.due === d; }).forEach(function (t) { items.push({ k: '', t: '截止 ' + t.title, type: 'due' }); });
    var shown = items.slice(0, 3).map(function (x) {
      return '<span class="ev ' + x.type + '"><i></i>' + (x.k ? '<span class="tm">' + esc(x.k) + '</span>' : '') + '<span style="overflow:hidden;text-overflow:ellipsis">' + esc(x.t) + '</span></span>';
    }).join('');
    if (items.length > 3) shown += '<span class="more">+' + (items.length - 3) + '</span>';
    return shown;
  }

  function agendaPanel(d) {
    var blocks = lanes(blocksOn(d));
    var allDay = evOnDate(d).filter(function (e) { return e.allDay; });
    var dues = TODOS.filter(function (t) { return !isDone(t) && t.due === d; });
    var out = '<div class="agenda" data-od-id="calendar-agenda"><div class="agenda-head"><div class="r1"><b>' + md(d) + '</b><span>' + wd(d) + '</span></div>' +
      '<div class="r2"><span class="note" style="padding:0">' + (blocks.length + allDay.length + dues.length) + ' 项</span><button class="btn primary open" data-act="open-day" data-date="' + d + '">打开日视图</button></div></div>' +
      '<div class="agenda-scroll" data-scrollkey="agenda-scroll">';
    if (!blocks.length && !allDay.length && !dues.length) {
      out += '<div class="ag-empty"><b>' + md(d) + '没有安排</b>可以新建日程，或从未安排待办里挑一件放到这天。<div><button class="btn" data-act="slot-create" data-date="' + d + '" data-start="09:00" data-end="10:00">' + ico('plus') + '新建</button></div></div>';
    } else {
      allDay.forEach(function (e) {
        var c = catVars(e.cal);
        out += '<button class="ag-item" data-act="open-event" data-id="' + e.id + '"><span class="ag-time">全天</span><span class="ag-main"><span class="ag-t">' + esc(e.title) + '</span><span class="ag-m">' + esc(c.name) + '</span></span></button>';
      });
      blocks.forEach(function (b) {
        var c = catVars(b.cal);
        out += '<button class="ag-item" data-act="' + (b.kind === 'alloc' ? 'open-todo' : 'open-event') + '" data-id="' + b.id + '"><span class="ag-time">' + clock(b.start) + '</span><span class="ag-main"><span class="ag-t">' + (b.kind === 'alloc' ? '<span class="sq" style="--cat:' + c.color + '"></span>' : '') + esc(b.title) + '</span><span class="ag-m">' + clock(b.start) + '–' + clock(b.end) + ' · ' + esc(c.name) + (b.kind === 'alloc' ? ' · 计划' : '') + '</span></span></button>';
      });
      dues.forEach(function (t) {
        var red = dueRed(t);
        out += '<button class="ag-item" data-act="open-todo" data-id="' + t.id + '"><span class="ag-time" style="color:' + (red ? 'var(--err)' : 'var(--warn)') + '">' + (t.dueTime || '截止') + '</span><span class="ag-main"><span class="ag-t" style="font-weight:500;color:' + (red ? 'var(--err)' : 'var(--warn)') + '">截止 · ' + esc(t.title) + '</span><span class="ag-m">不占时间轴</span></span></button>';
      });
    }
    out += '</div></div>';
    return out;
  }

  function gridDayHead(d, first) {
    return '<div class="tg-day' + (d === TODAY ? ' today' : '') + (d === S.selDate ? ' sel' : '') + '"><span class="d">' + Number(d.slice(-2)) + '</span><span class="w">' + wd(d) + '</span></div>';
  }
  function gridCol(d, extra) {
    var blocks = lanes(blocksOn(d));
    var html = blocks.map(function (b) {
      var c = catVars(b.cal);
      var top = b.start / 1440 * 100, h = Math.max(1.45, (b.end - b.start) / 1440 * 100);
      return '<div class="blk ' + b.kind + (b.end - b.start < 45 ? ' small' : '') + '" data-act="' + (b.kind === 'alloc' ? 'open-todo' : 'open-event') + '" data-id="' + b.id + '" data-kind="' + b.kind + '" data-date="' + d + '" style="top:' + top + '%;height:' + h + '%;left:calc(' + (b.lane / b.lanes * 100) + '% + ' + (b.lane ? 2 : 0) + 'px);width:calc(' + (100 / b.lanes) + '% - ' + (b.lanes > 1 ? 3 : 0) + 'px);--cat:' + c.color + ';--cat-bg:' + c.bg + ';--cat-ink:' + c.ink + '">' +
        '<div class="bin"><span class="bt">' + (b.kind === 'alloc' ? '<span class="sq"></span>' : '') + esc(b.title) + '</span><span class="bm">' + clock(b.start) + '–' + clock(b.end) + (b.kind === 'alloc' ? '<span class="plan">计划</span>' : b.repeat ? ' ' + ico('repeat', 9) : '') + '</span></div><span class="rz" data-resize="1"></span></div>';
    }).join('');
    var dues = TODOS.filter(function (t) { return !isDone(t) && t.due === d && t.dueTime; });
    var dueHtml = dues.map(function (t) {
      var red = dueRed(t), top = mins(t.dueTime) / 1440 * 100;
      return '<span class="due-mark' + (red ? ' red' : '') + '" style="top:' + top + '%"></span><span class="due-dot' + (red ? ' red' : '') + '" style="top:calc(' + top + '% - 2.5px)" data-act="open-todo" data-id="' + t.id + '"></span><span class="due-tag' + (red ? ' red' : '') + '" style="top:' + top + '%">' + esc(t.dueTime) + ' 截止</span>';
    }).join('');
    var now = d === TODAY ? '<span class="nowline" style="top:' + (NOWM / 1440 * 100) + '%"></span>' : '';
    return '<div class="tg-col' + (d === TODAY ? ' today' : '') + (d === S.selDate ? ' sel' : '') + (extra || '') + '" data-col="' + d + '">' + html + dueHtml + now + '</div>';
  }

  function timeGrid(days, opts) {
    opts = opts || {};
    var perDay = days.length > 4 ? 'minmax(122px,1fr)' : 'minmax(0,1fr)';
    if (days.length > 4) opts.wide = true;
    var head = '<div class="tg-head" style="--n:' + days.length + ';grid-template-columns:56px repeat(' + days.length + ',' + perDay + ')"><div class="gh"></div>' + days.map(function (d) { return gridDayHead(d); }).join('') + '</div>';
    var hours = '';
    for (var h = 0; h <= 23; h++) hours += '<span class="tg-hour" style="top:' + (h / 24 * 100) + '%">' + pad(h) + ':00</span>';
    var cols = days.map(function (d) { return gridCol(d); }).join('');
    return '<div class="tg" data-grid="1" data-scrollkey="tg" style="--n:' + days.length + '">' + head +
      '<div class="tg-body" style="height:1440px;--n:' + days.length + ';grid-template-columns:56px repeat(' + days.length + ',' + perDay + ')">' +
      '<div class="tg-gutter">' + hours + '</div>' + cols + '</div></div>';
  }

  function weekDesktop() {
    var s = weekStart(S.calDate);
    var days = [];
    for (var i = 0; i < 7; i++) days.push(addD(s, i));
    return '<div class="cal-main" data-od-id="calendar-week">' + timeGrid(days) + '</div>' + (S.planOpen && !S.drawer ? planSidebar() : '');
  }
  function dayAbove(d) {
    var allDay = evOnDate(d).filter(function (e) { return e.allDay; });
    var dues = TODOS.filter(function (t) { return !isDone(t) && t.due === d; });
    var out = '';
    if (allDay.length) {
      out += '<div class="allday" style="padding:8px 12px 2px"><span class="allday-label">全天</span>' + allDay.map(function (e) {
        var c = catVars(e.cal);
        return '<button class="allday-chip" data-act="open-event" data-id="' + e.id + '" style="--cat-bg:' + c.bg + ';--cat-ink:' + c.ink + '">' + esc(e.title) + '</button>';
      }).join('') + '</div>';
    }
    if (dues.length) {
      out += '<div class="allday" style="padding:2px 12px 8px"><span class="allday-label">截止</span>' + dues.map(function (t) {
        var red = dueRed(t);
        return '<button class="allday-chip" data-act="open-todo" data-id="' + t.id + '" style="--cat-bg:' + (red ? 'var(--err-soft)' : 'var(--warn-soft)') + ';--cat-ink:' + (red ? 'var(--err)' : 'var(--warn)') + '">' +
          (t.dueTime ? esc(t.dueTime) + ' ' : '') + esc(t.title) + '</button>';
      }).join('') + '</div>';
    }
    return out;
  }
  function dayDesktop() {
    var d = S.calDate;
    return '<div class="cal-main" data-od-id="calendar-day">' + dayAbove(d) + timeGrid([d]) + '</div>' + (S.planOpen && !S.drawer ? planSidebar() : '');
  }

  function calendarDesktop() {
    var body;
    if (S.calView === 'month') body = '<div class="cal-body">' + monthDesktop() + '</div>';
    else if (S.calView === 'week') body = '<div class="cal-body">' + weekDesktop() + '</div>';
    else body = '<div class="cal-body">' + dayDesktop() + '</div>';
    return '<div class="page">' + calHead() + body + composerBar() + '</div>';
  }

  function composerBar() {
    var c = S.composer;
    if (!c.open) {
      return '<div class="cmpwrap" data-od-id="composer"><button class="cmp-closed" data-act="open-composer">' +
        '<span>' + ico('plus', 13) + '</span><span>记一件事……</span><span class="hint">N</span></button></div>';
    }
    var sug = S.composer.noSug ? null : nlpSuggest(c.title);
    var tagText = (c.tags || []).join('、') || '无';
    return '<div class="cmpwrap" data-od-id="composer">' +
      '<button class="cmp-closed" data-act="open-composer" aria-hidden="true" style="visibility:hidden">' +
        '<span>' + ico('plus', 13) + '</span><span>记一件事……</span></button>' +
      '<div class="cmp" role="dialog" aria-label="记一件事">' +
      '<div class="cmp-top">' +
        '<div class="cmp-types">' +
          '<button class="' + (c.type === 'todo' ? 'on' : '') + '" data-act="cmp-type" data-type="todo">待办</button>' +
          '<button class="' + (c.type === 'event' ? 'on' : '') + '" data-act="cmp-type" data-type="event">日程</button>' +
        '</div>' +
        '<span class="sub-note">' + (c.type === 'todo' ? '先记下来，时间可以之后再定' : '会占用一段时间') + '</span>' +
        '<button class="cmp-close" data-act="close-composer" aria-label="关闭">' + ico('x') + '</button>' +
      '</div>' +
      (c.err ? '<div class="cmp-err">' + esc(c.err) + '</div>' : '') +
      '<input class="cmp-input" id="cmp-input" placeholder="' + (c.type === 'todo' ? '写下要做的事……' : '写下要发生的事……') + '" value="' + esc(c.title) + '" aria-label="标题">' +
      (sug ? '<div class="sug"><span class="id">' + ico('clock', 12) + '识别到：' + esc(sug.text) + '</span>' +
        (c.type === 'todo'
          ? '<button class="btn" data-act="apply-due" data-date="' + sug.date + '" data-time="' + (sug.time || '') + '">设为截止</button>' +
            '<button class="btn" data-act="apply-plan" data-date="' + sug.date + '" data-time="' + (sug.time || '') + '">安排到这个时间</button>'
          : '<button class="btn" data-act="apply-evtime" data-date="' + sug.date + '" data-time="' + (sug.time || '') + '">设为日程时间</button>') +
        '<button class="btn ghost" data-act="dismiss-sug">不用</button></div>' : '') +
      '<div class="cmp-chips">' +
        (c.type === 'todo'
          ? '<button class="chip' + (c.due ? ' on' : '') + '" data-act="cmp-due">' + ico('flag', 11) + (c.due ? esc(relDay(c.due) + (c.dueTime ? ' ' + c.dueTime : '')) + ' 截止' : '无截止') + '</button>' +
            '<button class="chip' + (c.planDate ? ' on' : '') + '" data-act="cmp-plan">' + ico('clock', 11) + (c.planDate ? esc(mds(c.planDate) + ' ' + (c.planStart || '')) + '–' + esc(c.planEnd || '') : '未安排') + '</button>'
          : '<button class="chip' + (c.planDate ? ' on' : '') + '" data-act="cmp-evtime">' + ico('clock', 11) + (c.planDate ? esc(mds(c.planDate) + ' ' + (c.planStart || '') + '–' + (c.planEnd || '')) : '时间') + '</button>' +
            '<button class="chip' + (c.allDay ? ' on' : '') + '" data-act="cmp-allday">全天</button>') +
        '<button class="chip' + (c.cal ? ' on' : '') + '" data-act="cmp-cal"><span class="dot" style="background:' + catVars(c.cal || 'personal').color + '"></span>' + esc(catVars(c.cal || 'personal').name) + '</button>' +
        '<button class="chip" data-act="cmp-more">' + (c.more ? '收起字段' : '••• 更多') + '</button>' +
        '<span class="sp"></span>' +
        '<button class="btn primary" data-act="cmp-add" style="height:30px">添加' + (c.type === 'todo' ? '待办' : '日程') + '</button>' +
      '</div>' +
      (c.more ? '<div class="cmp-more">' +
        '<button class="fld" data-act="cmp-pri"><span>优先级</span><b>' + ['无', '低', '中', '高'][c.pri || 0] + '</b></button>' +
        '<button class="fld" data-act="cmp-tags"><span>标签</span><b>' + esc(tagText) + '</b></button>' +
        (c.type === 'todo' ? '<button class="fld" data-act="cmp-remind"><span>提醒</span><b>无</b></button>' : '<button class="fld" data-act="cmp-loc"><span>地点</span><b>无</b></button>') +
        '<button class="fld" data-act="cmp-repeat"><span>重复</span><b>不重复</b></button>' +
        '</div>' : '') +
      '</div></div>';
  }

  function applySuggestion(kind, d, tm) {
    var c = S.composer;
    if (kind === 'due') { c.due = d; c.dueTime = tm || null; toast('已设为截止 · 不占时间轴'); }
    if (kind === 'plan') { c.planDate = d; c.planStart = tm || '09:00'; c.planEnd = clock(mins(tm || '09:00') + 60); toast('会新建一段计划执行，不改截止'); }
    if (kind === 'event') { c.type = 'event'; c.planDate = d; c.planStart = tm || '09:00'; c.planEnd = clock(mins(tm || '09:00') + 60); toast('已设为日程时间；类型由你保持为日程'); }
    render();
    focusComposer();
  }

  function inspector(ref) {
    if (!ref) return '';
    var isEvent = ref.type === 'event';
    var item = isEvent ? eventById(ref.id) : todoById(ref.id);
    if (!item) return '';
    var out = '<aside class="insp" data-od-id="inspector"><div class="insp-top">' +
      '<span class="kind">' + (isEvent ? '日程' : '待办') + '</span>' +
      '<span class="ml"><button class="iconbtn" data-act="open-menu" data-id="' + item.id + '" data-kind="' + ref.type + '" aria-label="更多操作">' + ico('more') + '</button>' +
      '<button class="iconbtn" data-act="close-inspector" aria-label="关闭详情">' + ico('x') + '</button></span></div>' +
      '<div class="insp-scroll" data-scrollkey="insp-scroll">';
    if (isEvent) {
      var ev = item, ec = catVars(ev.cal);
      out += '<div class="ins-title"><textarea class="tt" id="ins-title" rows="1" data-mfield="title" aria-label="标题">' + esc(ev.title) + '</textarea></div>';
      out += '<div class="ins-facts">' +
        '<button class="fact" data-act="edit-evtime" data-id="' + ev.id + '"><span>' + ico('cal') + '</span><span class="sub">' + md(ev.date) + '</span>' +
          '<b>' + (ev.allDay ? '全天' : esc(ev.start) + '–' + esc(ev.end)) + '</b><span class="arr">' + ico('right') + '</span></button>' +
        (ev.allDay ? '' : '<div class="fact plan-line" style="pointer-events:none;padding-left:26px"><span class="tm">' + durTxt(ev.start, ev.end) + ' · 占用时间</span></div>') +
        (ev.repeat ? '<button class="fact plan-line" data-act="edit-repeat" data-id="' + ev.id + '"><span>' + ico('repeat') + '</span>' +
          '<span class="tm">' + esc(ev.repeat) + (ev.instance ? ' · ' + esc(ev.instance) : '') + '</span><span class="rm">' + ico('right') + '</span></button>' : '') +
        '</div>';
      out += '<div class="section"><div class="section-h"><b>日历与地点</b></div>' +
        '<button class="field" data-act="pick-cal" data-id="' + ev.id + '"><span class="fk"><span class="dot" style="background:' + ec.color + ';display:inline-block;margin-right:7px"></span>' + esc(ec.name) + '</span><span class="fv">' + ico('right') + '</span></button>' +
        '<button class="field" data-act="edit-evloc" data-id="' + ev.id + '"><span class="fk">地点</span><span class="fv">' + (ev.loc ? esc(ev.loc) : '<span style="color:var(--faint)">添加</span>') + ico('right') + '</span></button>' +
        '<button class="field" data-act="pick-remind" data-id="' + ev.id + '"><span class="fk">提醒</span><span class="fv">' + (ev.remind ? esc(ev.remind) : '<span style="color:var(--faint)">无</span>') + ico('right') + '</span></button></div>';
      out += notesSection(ev) + attachSection(ev);
    } else {
      var t = item, done = isDone(t), dl = dueLabel(t);
      out += '<div class="ins-title"><button class="ck' + (done ? ' on' : '') + '" data-act="toggle-done" data-id="' + t.id + '" role="checkbox" aria-checked="' + done + '" aria-label="完成 ' + esc(t.title) + '">' + (done ? ico('check') : '') + '</button>' +
        '<textarea class="tt" id="ins-title" rows="1" data-mfield="title" aria-label="标题">' + esc(t.title) + '</textarea></div>';
      out += '<div class="ins-facts">' +
        '<button class="fact due' + (dl && dl.red ? ' red' : '') + '" data-act="edit-due" data-id="' + t.id + '"><span>' + ico('flag') + '</span><span class="sub">截止</span>' +
          '<b>' + (dl ? esc(dl.full) : '无') + '</b><span class="arr">' + ico('right') + '</span></button>' +
        (liveAllocs(t).filter(function (a) { return a.date === TODAY; }).map(function (a) {
          return '<div class="fact plan-line" style="pointer-events:none;padding-left:26px"><span class="sq"></span><span class="tm">' + esc(a.start) + '–' + esc(a.end) + ' 已安排</span></div>';
        }).join('')) +
        '<button class="fact alloc" data-act="edit-alloc" data-id="' + t.id + '"><span>' + ico('clock') + '</span><span class="sub">计划执行</span>' +
          '<b style="font-size:12px">' + planSummary(t) + '</b><span class="arr">' + ico('right') + '</span></button>' +
        (t.repeat ? '<button class="fact plan-line" data-act="edit-repeat" data-id="' + t.id + '"><span>' + ico('repeat') + '</span>' +
          '<span class="tm">' + esc(t.repeat) + '</span><span class="rm">' + ico('right') + '</span></button>' : '') +
        '</div>';
      out += '<div class="section"><div class="pri" aria-label="优先级">' + ['无', '低', '中', '高'].map(function (p, i) {
        return '<button class="' + ((t.pri || 0) === i ? 'on' : '') + '" data-act="set-pri" data-id="' + t.id + '" data-p="' + i + '">' + p + '</button>';
      }).join('') + '</div></div>';
      out += '<div class="section"><div class="section-h"><b>标签</b></div><div class="tags">' + (t.tags || []).map(function (tg) {
        return '<span class="tag">' + esc(tg) + '<button class="x" data-act="del-tag" data-id="' + t.id + '" data-tag="' + esc(tg) + '" aria-label="移除 ' + esc(tg) + '">' + ico('x', 9) + '</button></span>';
      }).join('') + '<button class="tagadd" data-act="pick-tags" data-id="' + t.id + '">' + ico('plus', 9) + ' 添加</button></div></div>';
      out += '<div class="section"><div class="section-h"><b>归属</b></div>' +
        '<button class="field" data-act="pick-cal" data-id="' + t.id + '"><span class="fk"><span class="dot" style="background:' + catVars(t.cal).color + ';display:inline-block;margin-right:7px"></span>' + esc(catVars(t.cal).name) + '</span><span class="fv">' + ico('right') + '</span></button>' +
        '<button class="field" data-act="pick-remind" data-id="' + t.id + '"><span class="fk">提醒</span><span class="fv">' +
          (t.remind ? esc(t.remind) : '<span style="color:var(--faint)">' + (t.dueTime ? '无' : '无 · 先给截止加时间') + '</span>') + ico('right') + '</span></button></div>';
      out += subtaskSection(t) + notesSection(t) + attachSection(t);
      out += '<div class="ins-foot">' + (done ? '已完成 · ' + (t.doneAt || '') + ' · 撤销可从底部提示' : '改动立即生效；没有“编辑全部”，也没有整单保存。') + '</div>';
    }
    out += '</div></aside>';
    return out;
  }

  function planSummary(t) {
    var a = liveAllocs(t);
    if (!a.length) return '未安排';
    if (a.length === 1) return esc(mds(a[0].date) + ' ' + a[0].start + '–' + a[0].end);
    return esc(mds(a[0].date) + ' ' + a[0].start) + ' +' + (a.length - 1) + ' 段';
  }
  function subtaskSection(t) {
    if (!t.subtasks) t.subtasks = [];
    var n = t.subtasks.filter(function (s) { return s.done; }).length;
    return '<div class="section"><div class="section-h"><b>子任务</b><span class="note" style="padding:0">' + n + '/' + t.subtasks.length + '</span></div><div class="subs">' +
      t.subtasks.map(function (s, i) {
        return '<div class="sub"><button class="ck' + (s.done ? ' on' : '') + '" data-act="toggle-sub" data-id="' + t.id + '" data-i="' + i + '" role="checkbox" aria-checked="' + s.done + '">' + (s.done ? ico('check') : '') + '</button>' +
          '<input class="' + (s.done ? 'done' : '') + '" value="' + esc(s.t) + '" data-mfield="sub" data-id="' + t.id + '" data-i="' + i + '" aria-label="子任务"><button class="del" data-act="del-sub" data-id="' + t.id + '" data-i="' + i + '" aria-label="删除子任务">' + ico('x', 11) + '</button></div>';
      }).join('') + '</div><button class="subadd" data-act="add-sub" data-id="' + t.id + '">' + ico('plus', 11) + '添加子任务</button></div>';
  }
  function notesSection(t) {
    return '<div class="section"><div class="section-h"><b>备注</b></div><textarea class="notes" data-mfield="note" data-id="' + t.id + '" placeholder="写给自己看的话……" aria-label="备注">' + esc(t.note || '') + '</textarea></div>';
  }
  function attachSection(t) {
    var a = t.attachments || [];
    return '<div class="section"><div class="section-h"><b>附件</b></div>' + a.map(function (x, i) {
      return '<div class="attach">' + ico('paperclip') + '<span>' + esc(x.name) + '</span><button class="rm" data-act="del-attach" data-id="' + t.id + '" data-i="' + i + '">移除</button></div>';
    }).join('') + '<button class="subadd" data-act="add-attach" data-id="' + t.id + '">' + ico('plus', 11) + '添加附件</button></div>';
  }

  /* ================= mobile surfaces ================= */
  function dock(active) {
    if (S.composer && S.composer.open) return '';
    var items = [['today', '今天', 'sun'], ['todo', '待办', 'check'], ['calendar', '日历', 'cal'], ['me', '我的', 'user']];
    return '<nav class="m-dock" aria-label="主导航">' + items.map(function (x) {
      return '<button class="' + (active === x[0] ? 'on' : '') + '" data-act="go" data-screen="' + x[0] + '">' + ico(x[2], 19) + '<span>' + x[1] + '</span></button>';
    }).join('') + '</nav>';
  }
  function mTop(title) {
    return '<div class="m-top"><span class="t">' + esc(title) + '</span><span class="ml">' +
      '<button class="m-iconbtn" data-act="open-search" aria-label="搜索">' + ico('search', 16) + '</button></span></div>';
  }
  function mComposerBar() {
    if (S.composer && S.composer.open) return '';
    return '<button class="m-cmpbar" data-act="open-composer"><span>' + ico('plus', 13) + '</span><span>记一件事……</span></button>';
  }

  function mRow(t) {
    var done = isDone(t);
    return '<div class="m-row" data-act="open-todo" data-id="' + t.id + '" role="button" tabindex="0">' +
      '<button class="ck' + (done ? ' on' : '') + '" data-act="toggle-done" data-id="' + t.id + '" role="checkbox" aria-checked="' + done + '" aria-label="' + (done ? '恢复' : '完成') + ' ' + esc(t.title) + '">' + (done ? ico('check') : '') + '</button>' +
      '<span style="min-width:0"><span class="t">' + esc(t.title) + '</span><span class="m">' + mMeta(t) + '</span></span>' +
      '<span class="side">' + (done ? '' : dueChip(t)) + '<button class="m-iconbtn" data-act="row-more" data-id="' + t.id + '" aria-label="更多操作">' + ico('more', 16) + '</button></span></div>';
  }
  function mMeta(t) {
    var c = catOf(t);
    var bits = ['<span class="dot" style="background:' + (S.dark ? c.dcolor : c.color) + '"></span><span>' + esc(c.name) + '</span>'];
    if (t.repeat) bits.push('<span class="sep">·</span><span>' + esc(t.repeat) + '</span>');
    if (t.missed) bits.push('<span class="sep">·</span><span style="color:var(--err)">已遗漏 ' + t.missed + '</span>');
    var plan = allocsOn(t);
    if (plan.length) bits.push('<span class="sep">·</span><span style="color:var(--ink2)">' + esc(plan[0].start) + '–' + esc(plan[0].end) + ' 已安排</span>');
    return bits.join('');
  }
  function mBlock(b) {
    var c = catVars(b.cal);
    var isAlloc = b.kind === 'alloc';
    return '<button class="m-tl" data-act="' + (isAlloc ? 'open-todo' : 'open-event') + '" data-id="' + b.id + '">' +
      '<span class="tm">' + clock(b.start) + '</span><span class="m-rail"><span class="dot" style="background:' + c.color + '"></span></span>' +
      '<span class="blk2' + (isAlloc ? ' alloc' : '') + '" style="--cat:' + c.color + ';--cat-bg:' + c.bg + ';--cat-ink:' + c.ink + '">' +
      '<span class="bt">' + (isAlloc ? '<span class="sq"></span>' : '') + esc(b.title) + '</span>' +
      '<span class="bm">' + clock(b.start) + '–' + clock(b.end) + (isAlloc ? ' · 计划' : b.ref.loc ? ' · ' + esc(b.ref.loc) : '') + '</span></span></button>';
  }
  function mDue(t) {
    var red = mins(t.dueTime) < NOWM;
    return '<button class="m-due" data-act="open-todo" data-id="' + t.id + '">' +
      '<span class="tm" style="color:' + (red ? 'var(--err)' : 'var(--warn)') + '">' + esc(t.dueTime) + '</span>' +
      '<span class="line" style="background:' + (red ? 'var(--err)' : 'var(--warn)') + '"></span>' +
      '<span class="tx" style="color:' + (red ? 'var(--err)' : 'var(--warn)') + '"><b>截止 · ' + esc(t.title) + '</b></span></button>';
  }

  function mobileToday() {
    var od = overdueGroup(), td = todaysDueGroup();
    var blocks = lanes(blocksOn(TODAY));
    var dues = TODOS.filter(function (t) { return !isDone(t) && t.due === TODAY && t.dueTime; }).sort(function (a, b) { return mins(a.dueTime) - mins(b.dueTime); });
    var items = blocks.map(function (b) { return { at: b.start, html: mBlock(b) }; });
    dues.forEach(function (t) { items.push({ at: mins(t.dueTime), html: mDue(t) }); });
    items.sort(function (a, b) { return a.at - b.at; });

    var upcoming = items.filter(function (x) { return x.at >= NOWM - 60; });
    var focus = (upcoming.length ? upcoming : items).slice(0, 2);
    var nowCard = '<div class="m-nowcard"><div class="h"><span>现在 ' + clock(NOWM) + '</span><i></i></div>' +
      (focus.map(function (x) { return x.html; }).join('') || '<div class="quiet">接下来没有安排。</div>') +
      '<button class="more" data-act="go" data-screen="calendar">今天 ' + blocks.length + ' 段安排 · 查看全部 ' + ico('arrow', 11) + '</button></div>';

    var out = '<div class="m-scroll" data-scrollkey="m-scroll" data-od-id="mobile-today">' +
      '<div class="m-pagehead"><h1>' + md(TODAY) + '</h1><div class="s">' + wd(TODAY) + '<br>' + (od.length ? od.length + ' 逾期 · ' : '') + td.length + ' 今天截止</div></div>' +
      nowCard;
    if (od.length) out += '<div class="m-zone err" style="margin-top:18px">已逾期 ' + od.length + '</div>' + od.map(mRow).join('');
    if (td.length) out += '<div class="m-zone" style="margin-top:16px">今天截止 ' + td.length + '</div>' + td.map(mRow).join('');
    if (!od.length && !td.length) out += '<div class="empty" style="margin-top:18px"><b>今天没有必须处理的待办</b><p>可以从未安排里挑一件放到今天。</p></div>';
    out += '<button class="m-weak" data-act="pick-unscheduled"><span>' + ico('inbox', 13) + '</span><span>还有 <b>' + unscheduled().length + '</b> 个未安排待办 · 挑一件安排到今天</span><span class="go">' + ico('arrow', 11) + '</span></button>';
    out += '<div style="margin-top:14px"><button class="m-zone" style="width:100%;border:0" data-act="toggle-doneopen">已完成 ' + TODOS.filter(isDone).length +
      '<span style="flex:1"></span>' + ico(S.doneOpen ? 'down' : 'right', 12) + '</button>';
    if (S.doneOpen) out += TODOS.filter(isDone).map(mRow).join('');
    out += '</div></div>';
    return '<div class="m-shell">' + mTop('今天') + out + mComposerBar() + dock('today') + '</div>';
  }

  function mobileTodo() {
    var tabs = [['unsched', '未安排'], ['all', '全部'], ['due', '截止']];
    var out = '<div class="m-scroll" data-scrollkey="m-scroll" data-od-id="mobile-todo">' +
      '<div class="m-pagehead"><h1 style="font-size:20px">待办</h1><div class="s">' + unscheduled().length + ' 未安排<br>' + TODOS.filter(function (t) { return !isDone(t); }).length + ' 未完成</div></div>' +
      '<div class="m-seg">' + tabs.map(function (x) { return '<button class="' + (S.todoTab === x[0] ? 'on' : '') + '" data-act="todo-tab" data-tab="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
    if (S.todoTab === 'due') {
      out += mDateRail();
      var date = S.todoDate, arr = TODOS.filter(function (t) { return !isDone(t) && t.due === date; });
      out += '<div style="display:flex;align-items:baseline;gap:8px;padding:12px 0 6px"><b style="font-size:13px">' + md(date) + ' · ' + wd(date) + '</b>' +
        '<span style="font-size:11px;color:var(--muted)">' + arr.length + ' 项截止</span></div>';
      out += arr.length ? arr.map(mRow).join('') : '<div class="empty" style="padding:10px 0"><b>' + relDay(date) + '没有到期的待办</b><p>截止是约束，不占时间轴。</p></div>';
    } else if (S.todoTab === 'unsched') {
      var uns = unscheduled();
      out += '<div class="m-zone" style="margin-top:8px">没有计划执行 ' + uns.length + '</div>';
      out += uns.length ? uns.map(mRow).join('') : '<div class="empty"><b>所有待办都已安排</b><p>没有有效计划执行的任务会回到这里。</p></div>';
      out += '<button class="m-weak" data-act="go-cal-week"><span>' + ico('cal', 13) + '</span><span>把任务安排到时间里</span><span class="go">' + ico('arrow', 11) + '</span></button>';
    } else {
      [['已逾期', overdueGroup(), true], ['今天截止', todaysDueGroup()], ['之后', afterGroup()], ['无截止', noDueGroup()]].forEach(function (g) {
        if (!g[1].length) return;
        out += '<div class="m-zone" ' + (g[2] ? 'style="color:var(--err);margin-top:8px"' : 'style="margin-top:16px"') + '>' + g[0] + ' ' + g[1].length + '</div>' + g[1].map(mRow).join('');
      });
      out += '<div style="margin-top:16px"><button class="m-zone" style="width:100%;border:0" data-act="toggle-doneopen">已完成 ' + TODOS.filter(isDone).length +
        '<span style="flex:1"></span>' + ico(S.doneOpen ? 'down' : 'right', 12) + '</button>';
      if (S.doneOpen) out += TODOS.filter(isDone).map(mRow).join('');
      out += '</div>';
    }
    out += '</div>';
    return '<div class="m-shell">' + mTop('待办') + out + mComposerBar() + dock('todo') + '</div>';
  }
  function mDateRail() {
    if (!S.mRailStart) S.mRailStart = addD(S.todoDate, -2);
    var off = dayDiff(S.todoDate, S.mRailStart);
    if (off < 0) S.mRailStart = addD(S.todoDate, -1);
    else if (off > 4) S.mRailStart = addD(S.todoDate, -3);
    var cells = '';
    for (var i = 0; i < 5; i++) {
      var d = addD(S.mRailStart, i);
      var has = TODOS.some(function (x) { return !isDone(x) && x.due === d; });
      cells += '<button class="rd' + (d === S.todoDate ? ' on' : '') + (d === TODAY ? ' is-today' : '') + (has ? ' has' : '') +
        '" data-act="rail-pick" data-date="' + d + '" style="height:54px">' +
        '<span class="n">' + wd(d).replace('周', '') + '</span><span class="d">' + Number(d.slice(-2)) + '</span><span class="m"></span></button>';
    }
    return '<div class="rail" style="padding:2px 0 0;max-width:none">' +
      '<div class="rail-top"><button class="rail-title" data-act="open-datepicker" style="height:30px;font-size:13.5px"><span class="t">' + md(S.todoDate) + '</span><span class="w">· ' + wd(S.todoDate) + '</span>' + ico('down') + '</button>' +
      '<div class="n" style="margin-left:auto;display:flex;gap:2px">' +
      '<button class="iconbtn" data-act="rail-prev" aria-label="前一天">' + ico('left', 13) + '</button>' +
      '<button class="iconbtn" data-act="rail-next" aria-label="后一天">' + ico('right', 13) + '</button></div>' +
      '<button class="btn" data-act="rail-today" style="height:28px;font-size:11.5px">今天</button></div>' +
      '<div class="rail-days" style="grid-template-columns:repeat(5,1fr)">' + cells + '</div></div>';
  }
  function mobileCalendar() {
    var out = '<div class="m-scroll" data-scrollkey="m-scroll" data-od-id="mobile-calendar">' +
      '<div class="m-calhead"><span class="t">' + mCalTitle() + '</span>' +
      '<div class="n"><button data-act="cal-prev" aria-label="上一段">' + ico('left', 14) + '</button>' +
      '<button data-act="cal-next" aria-label="下一段">' + ico('right', 14) + '</button></div>' +
      '<span class="ml"><button class="btn" data-act="cal-today">今天</button>' +
      '<button class="btn" data-act="open-datepicker" aria-label="选择日期">' + ico('cal', 12) + '</button></span></div>' +
      '<div class="m-seg">' + [['month', '月'], ['week', '周'], ['day', '日']].map(function (v) {
        return '<button class="' + (S.calView === v[0] ? 'on' : '') + '" data-act="cal-view" data-view="' + v[0] + '">' + v[1] + '</button>';
      }).join('') + '</div>';
    if (S.calView === 'month') out += mobileMonth();
    else if (S.calView === 'week') out += mobileWeek();
    else out += mobileDay();
    out += '</div>';
    return '<div class="m-shell">' + mTop('日历') + out + mComposerBar() + dock('calendar') + '</div>';
  }
  function mCalTitle() {
    if (S.calView === 'month') return calRangeTitle();
    if (S.calView === 'week') {
      var ws = weekStart(S.calDate);
      return mds(ws) + ' – ' + mds(addD(ws, 6));
    }
    return md(S.calDate);
  }

  /* seven-day context strip; the selected day's timeline renders below it */
  function mobileWeek() {
    var ws = weekStart(S.calDate), days = [], i;
    for (i = 0; i < 7; i++) days.push(addD(ws, i));
    var cells = days.map(function (d) {
      var evs = evOnDate(d);
      var allocs = blocksOn(d).filter(function (b) { return b.kind === 'alloc'; });
      var dues = TODOS.filter(function (t) { return !isDone(t) && t.due === d; });
      var n = evs.length + allocs.length + dues.length;
      var marks = evs.slice(0, 2).map(function (e) {
        return '<i class="mk ev" style="background:' + catVars(e.cal).color + '"></i>';
      }).join('');
      if (allocs.length) marks += '<i class="mk al"></i>';
      if (dues.length) marks += '<i class="mk du"></i>';
      if (!marks) marks = '<i class="mk none"></i>';
      return '<button class="wk-d' + (d === S.calDate ? ' sel' : '') + (d === TODAY ? ' today' : '') +
        '" data-act="wk-pick" data-date="' + d + '" aria-pressed="' + (d === S.calDate) + '"' +
        ' aria-label="' + md(d) + ' ' + wd(d) + '，' + n + ' 项">' +
        '<span class="w">' + wd(d).replace('周', '') + '</span>' +
        '<span class="n">' + Number(d.slice(-2)) + '</span>' +
        '<span class="mks">' + marks + '</span></button>';
    }).join('');
    var blocks = blocksOn(S.calDate);
    var allDay = evOnDate(S.calDate).filter(function (e) { return e.allDay; });
    var dues = TODOS.filter(function (t) { return !isDone(t) && t.due === S.calDate; });
    var total = blocks.length + allDay.length + dues.length;
    return '<div class="wk" role="group" aria-label="本周七天">' + cells + '</div>' +
      '<div class="wk-dayh"><b>' + wd(S.calDate) + ' ' + Number(S.calDate.slice(-2)) + '</b>' +
      '<span>' + (total ? total + ' 项' : '没有安排') + '</span></div>' +
      mobileDay(S.calDate);
  }

  function mobileMonth() {
    var p = S.calDate.split('-').map(Number), y = p[0], m = p[1];
    var first = isoOf(new Date(Date.UTC(y, m - 1, 1)));
    var st = weekStart(first), cells = '';
    for (var i = 0; i < 42; i++) {
      var d = addD(st, i), inM = Number(d.slice(5, 7)) === m;
      var evs = evOnDate(d);
      var allocs = blocksOn(d).filter(function (b) { return b.kind === 'alloc'; });
      var dues = TODOS.filter(function (t) { return !isDone(t) && t.due === d; });
      var dots = evs.slice(0, 3).map(function (e) { return '<i style="background:' + catVars(e.cal).color + '"></i>'; }).join('') +
        dues.slice(0, 2).map(function () { return '<i class="due" style="background:var(--warn)"></i>'; }).join('');
      var n = evs.length + allocs.length + dues.length;

  function mAgenda(d) {

        '<span class="m">' + clock(b.start) + '–' + clock(b.end) + ' · ' + esc(c.name) + (b.kind === 'alloc' ? ' · 计划' : '') + '</span></span></button>';
    });
    dues.forEach(function (t) {
      out += '<button class="m-ag" data-act="open-todo" data-id="' + t.id + '"><span class="tm" style="color:' + (dueRed(t) ? 'var(--err)' : 'var(--warn)') + '">' + (t.dueTime || '截止') + '</span>' +
        '<span style="min-width:0"><span class="t" style="color:' + (dueRed(t) ? 'var(--err)' : 'var(--warn)') + '">截止 · ' + esc(t.title) + '</span>' +
        '<span class="m">不占时间轴</span></span></button>';

  }
  function mobileDay(dayIso) {
    var d = dayIso || S.calDate;
    var blocks = lanes(blocksOn(d));
    var dues = TODOS.filter(function (t) { return !isDone(t) && t.due === d; });
    var allDay = evOnDate(d).filter(function (e) { return e.allDay; });
    var out = '<div class="m-daylist">';
    allDay.forEach(function (e) {
      var c = catVars(e.cal);
      out += '<button class="m-ag" style="border-bottom:1px solid var(--line2)" data-act="open-event" data-id="' + e.id + '"><span class="tm">全天</span>' +
        '<span style="min-width:0"><span class="t">' + esc(e.title) + '</span><span class="m">' + esc(c.name) + '</span></span></button>';
    });
    var items = blocks.map(function (b) { return { at: b.start, endAt: b.end, html: mBlock(b) }; });
    dues.forEach(function (t) { var m = mins(t.dueTime); items.push({ at: m || 1439, endAt: m || 1439, due: true, html: mDue(t) }); });
    items.sort(function (a, b) { return a.at - b.at; });
    var nowShown = false;
    var lastEnd = items.length ? Math.max(0, Math.min(items[0].at, blocks.length ? blocks[0].start : 1440)) : 0;
    items.forEach(function (it) {
      if (!nowShown && d === TODAY && it.at > NOWM) {
        out += '<div class="m-nowmark"><span class="tm">' + clock(NOWM) + '</span><span class="line"></span><span class="tx">现在</span></div>';
        nowShown = true;
      }
      if (!it.due && it.at - lastEnd >= 120 && lastEnd >= 7 * 60 && it.at - lastEnd <= 360) {
        out += '<button class="m-free" data-act="slot-free" data-date="' + d + '" data-start="' + clock(lastEnd) + '" data-end="' + clock(Math.min(lastEnd + 60, it.at)) + '">' +
          '<span class="tm">' + clock(lastEnd) + '</span><span class="add">' + ico('plus', 11) + '空闲 ' + durTxt(clock(lastEnd), clock(it.at)) + ' · 新建</span></button>';
      }
      out += it.html;
      lastEnd = Math.max(lastEnd, it.endAt || it.at);
    });
    if (!nowShown && d === TODAY) {
      out += '<div class="m-nowmark"><span class="tm">' + clock(NOWM) + '</span><span class="line"></span><span class="tx">现在</span></div>';
    }
    if (!blocks.length && !dues.length && !allDay.length) {
      out += '<div class="empty"><b>' + md(d) + '没有安排</b><p>点空白时间可以新建日程，或从未安排待办挑一件。</p></div>';
    } else {
      out += '<div class="m-daysub">点任何空白时间可以新建日程，或安排一件未安排待办。</div>';
    }
    out += '</div>';
    return out;
  }

  /* -------- complete flows -------- */
  function completeTodo(id, force) {
    var t = todoById(id);
    if (!t) return;
    if (t.repeat && !force) { occurrencePicker(t); return; }
    var future = (t.allocs || []).filter(function (a) { return a.date > TODAY || (a.date === TODAY && mins(a.start) > NOWM); });
    t.done = true; t.doneAt = clock(NOWM);
    t.allocs = (t.allocs || []).filter(function (a) { return future.indexOf(a) < 0; });
    render(true);
    if (future.length) {
      toast('已完成「' + t.title + '」 · ' + future.length + ' 个未来计划已取消', '撤销', function () {
        t.done = false; t.doneAt = null;
        render(true);
        toast('已恢复待办 · 之前取消的 ' + future.length + ' 个计划没有自动恢复', '重新安排', function () { openArrange(t); });
      });
    } else {
      toast('已完成「' + t.title + '」', '撤销', function () { t.done = false; t.doneAt = null; render(true); });
    }
  }

  /* -------- toast -------- */
  function toast(msg, undoLabel, undoFn) {
    var host = $('#toasts');
    while (host.children.length >= 2) host.removeChild(host.firstElementChild);
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<span class="msg">' + esc(msg) + '</span>' +
      (undoLabel ? '<button class="undo" data-toast-undo>' + esc(undoLabel) + '</button>' : '') +
      '<button class="x" data-toast-x aria-label="关闭">' + ico('x', 12) + '</button><span class="bar"></span>';
    host.appendChild(el);
    var settled = false;
    function remove() { settled = true; if (el.parentNode) el.parentNode.removeChild(el); }
    if (undoLabel) {
      el.querySelector('[data-toast-undo]').addEventListener('click', function () { if (settled) return; settled = true; remove(); undoFn && undoFn(false); });
      el.querySelector('.bar').addEventListener('animationend', function () { if (settled) return; settled = true; remove(); });
    } else {
      el.querySelector('.bar').style.animation = 'toastbar 4s linear forwards';
      el.querySelector('.bar').addEventListener('animationend', remove);
    }
    el.querySelector('[data-toast-x]').addEventListener('click', function () { if (!settled) remove(); });
  }

    S.trash.push({ id: 'tr-' + t.id, title: t.title, sub: '待办 · ' + mds(TODAY) + ' 移到回收站', snap: t });
    render();
    toast('已移到回收站 · ' + t.title, '撤销', function () { TODOS.splice(idx, 0, t); S.trash = S.trash.filter(function (x) { return x.id !== 'tr-' + t.id; }); render(); });
  }
  function removeEvent(id) {

  /* ================= AI assistant =================
     An optional tool, not a first-level destination. It only ever produces
     a proposal; nothing is written until the user presses 应用 N 项. */
  S.ai = { enabled: true, open: false, draft: '', msgs: [], pending: null };

  function aiSeed() {
    if (S.ai.msgs.length) return;
    var p = aiProposal('整理实验图片周五前弄完，明天下午三点到四点写论文');
    S.ai.msgs.push({ id: 'ai-m0', role: 'me', text: '帮我把这周剩下的理一下：整理实验图片周五前弄完，明天下午三点到四点写论文。' });
    S.ai.msgs.push({ id: 'ai-m1', role: 'ai', text: '可以。我拆成 2 项，先给你看具体改动，确认后才写入：', plan: p });
    S.ai.pending = p;
  }
  var AI_STARTERS = [
    { label: '整理实验图片 + 安排写作', q: '整理实验图片周五前弄完，明天下午三点到四点写论文' },
    { label: '和客户开个会', q: '安排一个和客户的对齐会，明天下午四点，半小时' },
    { label: '拆写论文的子任务', q: '把写论文拆成几个子任务' },
    { label: '记一笔物业费', q: '记一下：交物业费，下周一截止' }
  ];

  function aiNormNum(s) {
    var cn = { '零': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10, '十一': 11, '十二': 12 };
    return s.replace(/十[一二]?|[零一二两三四五六七八九]/g, function (x) { return cn[x] !== undefined ? String(cn[x]) : x; });
  }
  function aiMins(h, m, pre, inherit) {
    var p = pre || inherit || '';
    var hh = Number(h), mm = Number(m || 0);
    if ((p === '下午' || p === '晚上') && hh < 12) hh += 12;
    if (p === '中午' && hh < 12) hh = 12;
    if (hh > 23) hh = 23;
    return hh * 60 + Math.min(59, mm);
  }
  function aiRange(text) {
    var s = aiNormNum(text);
    var m = /(上午|下午|中午|晚上|早上)?\s*(\d{1,2})(?:[:：点](\d{1,2})?分?)?\s*(?:到|至|[-–—~])\s*(上午|下午|中午|晚上|早上)?\s*(\d{1,2})(?:[:：点](\d{1,2})?)?/.exec(s);
    if (m) {
      var st = aiMins(m[2], m[3], m[1], '');
      var en = aiMins(m[5], m[6], m[4], m[1]);
      if (en <= st) en += 12 * 60;
      return { start: clock(st), end: clock(Math.min(st + 12 * 60, en)) };
    }
    var one = /(上午|下午|中午|晚上|早上)?\s*(\d{1,2})\s*(?:[:：]\s*(\d{1,2})|点\s*(\d{1,2})?分?)/.exec(s);
    if (!one) return null;
    var st2 = aiMins(one[2], one[3] || one[4], one[1], '');
    var len = 60;
    if (/半\s*个?\s*小时/.test(s)) len = 30;
    else {
      var mm2 = /(\d{1,2})\s*个?\s*小时/.exec(s);
      if (mm2) len = Math.max(30, Number(mm2[1]) * 60);
      var mm3 = /(\d{1,2})\s*分钟/.exec(s);
      if (mm3) len = Math.max(15, Number(mm3[1]));
    }
    return { start: clock(st2), end: clock(Math.min(23 * 60 + 59, st2 + len)) };
  }
  function aiFindTodo(text) {
    var best = null, score = 0;
    TODOS.forEach(function (t) {
      if (t.done) return;
      var title = t.title, L = 0;
      for (var i = 0; i < title.length; i++) {
        for (var j = i + 2; j <= title.length; j++) {
          var sub = title.slice(i, j);
          if (text.indexOf(sub) >= 0 && sub.length > L) L = sub.length;
        }
      }
      if (L > score) { score = L; best = t; }
    });
    return score >= 2 ? best : null;
  }
  function aiTitle(c) {
    var t = String(c).trim();
    t = t.replace(/(上午|下午|中午|晚上|早上)?\s*\d{1,2}\s*[:：点]\s*\d{0,2}\s*分?/g, ' ');
    t = t.replace(/(到|至|[-–—~])\s*(上午|下午|中午|晚上|早上)?\s*\d{1,2}\s*[:：点]?\s*\d{0,2}\s*分?/g, ' ');
    t = t.replace(/(上午|下午|中午|晚上|早上)?\s*[零一二两三四五六七八九十]{1,3}\s*[点:：]\s*[零一二两三四五六七八九十]{0,3}\s*分?/g, ' ');
    t = t.replace(/(半\s*个?\s*小时|\d{1,2}\s*个?\s*小时|\d{1,2}\s*分钟)/g, ' ');
    t = t.replace(/(今天|明天|后天|大后天|下周[一二三四五六日天]|周[一二三四五六日天])(之前|以前|前)?/g, ' ');
    t = t.replace(/(截止|之前|以前|前完成|弄完|做完|完成)/g, ' ');
    t = t.replace(/^(帮我|请|麻烦|我想|我要|再|然后|另外|顺便|并且|并|和|把)\s*/, '');
    t = t.replace(/^(记一下|记录一下|记下|创建待办|新建待办|创建|新建|添加|加一个|加个|安排一个|安排一下|安排|排一个|提醒我|提醒)\s*/, '');
    t = t.replace(/^[一个]?\s*/, '');
    t = t.replace(/[：:，,、\s]+$/g, '').replace(/^[：:，,、\s]+/g, '');
    return t.trim();
  }
  function aiCal(title, kind) {
    if (kind === 'event') return /客户|会|评审|面试|同步/.test(title) ? 'work' : 'personal';
    if (/论文|实验|课|读|学/.test(title)) return 'study';
    if (/物业|费|缴|买|修|房租/.test(title)) return 'home';
    return 'personal';
  }
  function aiSubtaskTitles(clause, target) {
    var m = /拆(?:成|分为|分到)[：:]?\s*(.+)$/.exec(clause);
    if (m) {
      var parts = m[1].split(/[、,，和及]/).map(function (x) { return x.trim(); }).filter(Boolean);
      if (parts.length && !/^(几个|一些|若干|多个)?\s*(子任务|步骤|阶段|部分|小步骤)$/.test(parts[0])) return parts;
    }
    return ['列出提纲', '写完初稿', '通读并修改'];
  }
  function aiClause(c, inheritedDate) {
    var date = (nlpSuggest(c) || {}).date || inheritedDate || TODAY;
    var range = aiRange(c);
    var target = aiFindTodo(c);
    if (/拆|子任务|分解/.test(c) && target) {
      return { kind: 'subtask', targetId: target.id, targetTitle: target.title, titles: aiSubtaskTitles(c, target) };
    }
    var isEvent = /会议|开会|日程|面试|看病|复诊|约|聚|见面|上课|对齐会/.test(c) && !/待办|任务/.test(c);
    var title = aiTitle(c);
    if (isEvent) {
      var r = range || { start: '09:00', end: '10:00' };
      return { kind: 'event', title: title || '新日程', date: date, start: r.start, end: r.end, cal: aiCal(title, 'event'), loc: '' };
    }
    if (target && (range || /安排|排到|计划/.test(c))) {
      var r2 = range || { start: '09:00', end: '10:00' };
      return { kind: 'alloc', targetId: target.id, targetTitle: target.title, date: date, start: r2.start, end: r2.end };
    }
    if (!title) return null;
    var sug = nlpSuggest(c);
    return {
      kind: 'todo', title: title, cal: aiCal(title, 'todo'), pri: 0, tags: [],
      due: (sug && sug.date) || null, dueTime: (sug && sug.time) || null
    };
  }
  function aiProposal(text) {
    var clauses = String(text).split(/[，。；;、\n]|并且|然后|另外|顺便/).map(function (x) { return x.trim(); }).filter(Boolean);
    var merged = [];
    clauses.forEach(function (c) {
      var prev = merged[merged.length - 1];
      if (prev && c.length <= 8 && /^(明天|今天|后天|上午|下午|中午|晚上|早上|半?个小时|\d+分钟|半小时)/.test(c)) merged[merged.length - 1] = prev + '，' + c;
      else merged.push(c);
    });
    var gDate = (nlpSuggest(text) || {}).date || TODAY;
    var items = [];
    merged.forEach(function (c) {
      var it = aiClause(c, gDate);
      if (it) items.push(it);
    });
    if (!items.length) {
      var single = aiClause(String(text), TODAY);
      if (single) items.push(single);
    }
    if (!items.length) return null;
    return { id: 'p-' + Date.now(), items: items, state: 'pending' };
  }

  function aiItemLine(it) {
    if (it.kind === 'todo') {
      return {
        k: '创建待办', main: '「' + it.title + '」',
        meta: (it.due ? '截止 ' + relDay(it.due) + (it.dueTime ? ' ' + it.dueTime : '') : '无截止') + ' · ' + catVars(it.cal).name
      };
    }
    if (it.kind === 'event') {

    var q = String(text || S.ai.draft || '').trim();

  function aiApply() {
    var p = S.ai.pending;
    if (!p || p.state !== 'pending') return;
    var snap = JSON.stringify({ t: TODOS, e: EVENTS });
    var n = 0;
    p.items.forEach(function (it) {
      if (it.kind === 'todo') {
        TODOS.unshift({
          id: 't-ai-' + Date.now() + '-' + n, title: it.title, cal: it.cal || 'personal',
          due: it.due || null, dueTime: it.dueTime || null, pri: it.pri || 0,
          remind: null, repeat: null, tags: (it.tags || []).slice(), note: '', subtasks: [], allocs: []
        });
        n++;
      } else if (it.kind === 'event') {
        EVENTS.push({
          id: 'e-ai-' + Date.now() + '-' + n, title: it.title, cal: it.cal || 'personal',
          date: it.date, start: it.start, end: it.end, allDay: false, loc: it.loc || '', repeat: null
        });
        n++;
      } else if (it.kind === 'subtask') {
        var tt = todoById(it.targetId);
        if (tt) {
          it.titles.forEach(function (x) { tt.subtasks.push({ t: x, done: false }); });
          n++;
        }
      } else if (it.kind === 'alloc') {
        var ta = todoById(it.targetId);
        if (ta) {
          ta.allocs = ta.allocs || [];
          ta.allocs.push({ id: 'a-ai-' + Date.now() + '-' + n, date: it.date, start: it.start, end: it.end });
          n++;
        }
      }
    });
    p.state = 'applied';
    S.ai.pending = null;
    S.ai.msgs.push({ id: 'ai-' + Date.now() + 'd', role: 'ai', text: '已应用 ' + n + ' 项。页面上已经能看到；要退回可以点撤销。' });
    render();

    toast('AI 已应用 ' + n + ' 项', '撤销', function () {
      var back = JSON.parse(snap);
      TODOS.length = 0; Array.prototype.push.apply(TODOS, back.t);
      EVENTS.length = 0; Array.prototype.push.apply(EVENTS, back.e);
      p.state = 'pending';
      render(); renderAi();
    });
  }

    setTimeout(function () {

  function nlpSuggest(title) {
    var t = String(title || '');
    if (!t) return null;
    var date = null, time = null;
    var dayMap = [['今天', TODAY], ['明天', addD(TODAY, 1)], ['后天', addD(TODAY, 2)]];
    var named = { '周一': 1, '周二': 2, '周三': 3, '周四': 4, '周五': 5, '周六': 6, '周日': 0, '周天': 0 };
    Object.keys(named).forEach(function (word) {
      if (t.indexOf(word) >= 0) dayMap.push([word, nearestWeekday(TODAY, named[word])]);
    });
    for (var i = 0; i < dayMap.length; i++) {
      if (t.indexOf(dayMap[i][0]) >= 0) { date = dayMap[i][1]; break; }
    }
    var mt = /(\d{1,2})[:：](\d{2})/.exec(t);
    if (mt) time = pad(Number(mt[1])) + ':' + pad(Number(mt[2]));
    if (!time) {
      var cn = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10, '十一': 11, '十二': 12 };
      var m2 = /(上午|下午|中午|晚上)?\s*(\d{1,2}|十[一二]?|[一二三四五六七八九十])\s*点(半|\d{1,2}分?)?/.exec(t);
      if (m2) {
        var hh = cn[m2[2]] || Number(m2[2]);
        if (m2[1] === '下午' || m2[1] === '晚上') hh = hh < 12 ? hh + 12 : hh;
        if (m2[1] === '中午') hh = 12;
        var mm = 0;
        if (m2[3] === '半') mm = 30; else if (m2[3]) mm = Number(m2[3].replace('分', ''));
        time = pad(hh) + ':' + pad(mm);
      }
    }
    if (!date && !time) return null;
    return { date: date || TODAY, time: time, text: (date ? relDay(date) : '今天') + (time ? ' ' + time : '') };
  }
  function submitComposer() {

  function render(keepFocus) {
    applyTheme();
    var saved = isMobile() ? null : captureScroll();
    var host = document.getElementById('app');
    var html;
    if (isPhone()) {
      var inner = mobileScreen();
      if (S.device === 'mobile' && window.innerWidth >= 900) {
        html = '<div id="app" class="device-stage"><div class="device-bar"><span>手机预览 · 390×844 · 不是桌面缩小版</span>' +

      } else {
        html = '<div id="app">' + inner + '</div>';
      }
    } else {
      html = desktopScreen();
    }
    if (host && host.outerHTML) host.outerHTML = html; else {
      var stale = document.getElementById('app');
      if (stale) stale.parentNode.removeChild(stale);
      document.body.insertAdjacentHTML('afterbegin', html);
    }
    if (saved) restoreScroll(saved);
    $$('[data-grid]').forEach(function (g) { if (!g.dataset.scrolled) { g.dataset.scrolled = '1'; g.scrollTop = 420; } });

  function captureScroll() {
    var map = {};
    $$('[data-scrollkey]').forEach(function (el) { map[el.dataset.scrollkey] = el.scrollTop; });
    return map;
  }
  function restoreScroll(map) {
    $$('[data-scrollkey]').forEach(function (el) {
      if (map[el.dataset.scrollkey] != null) el.scrollTop = map[el.dataset.scrollkey];
    });
  }
  function positionToasts() {
    var host = $('#toasts');
    if (!host) return;
    if (isMobile()) {
      host.style.bottom = S.composer.open ? 'auto' : 'calc(var(--dock-h) + 118px + env(safe-area-inset-bottom))';
      host.style.top = S.composer.open ? 'calc(14px + env(safe-area-inset-top))' : 'auto';
    } else {
      var wrap = $('.cmpwrap');
      var h = wrap ? wrap.getBoundingClientRect().height : 72;
      host.style.bottom = Math.max(20, Math.round(h) + 6) + 'px';
      host.style.top = 'auto';
    }
  }

  /* -------- action router -------- */
  function handleAction(btn) {
    var act = btn.dataset.act, id = btn.dataset.id, kind = btn.dataset.kind;
    var st = searchState();
    if (st.open && !isMobile() && act.indexOf('search') !== 0 && act !== 'close-search' && act !== 'open-search') {
      st.open = false;
      closeLayer();
    }

    switch (act) {
      /* navigation */
      case 'go':
        S.screen = btn.dataset.screen; S.mobileDetail = null; S.composer.open = false; S.drawer = null;
        render(); save(); break;
      case 'toggle-theme': S.dark = !S.dark; render(); break;
      case 'device-set':
        S.device = btn.dataset.device;
        S.composer.open = false; S.drawer = null; S.mobileDetail = null;
        render(); break;
      case 'open-search': S.search = { open: true, q: '' }; render(); break;
      case 'close-search': st.open = false; render(); break;
      case 'open-settings': openSettings('account'); break;
      case 'settings-sec': S.settingsSec = btn.dataset.sec; openSettings(S.settingsSec); break;
      case 'close-layer': closeLayer(); break;

      /* AI assistant — proposes, never writes until applied */
      case 'ai-open': aiOpen(); break;
      case 'ai-send': aiSend(S.ai.draft); break;
      case 'ai-starter': aiSend(btn.dataset.q); break;
      case 'ai-cancel': aiCancel(); break;
      case 'ai-apply': aiApply(); break;
      case 'ai-toggle':
        S.ai.enabled = !S.ai.enabled;
        if (!S.ai.enabled) { S.ai.open = false; closeLayer(); }
        render(); openSettings('general'); break;

      /* todo surface */
      case 'todo-tab': S.todoTab = btn.dataset.tab; render(); save(); break;
      case 'toggle-doneopen': S.doneOpen = !S.doneOpen; render(); break;
      case 'toggle-plan': S.planOpen = !S.planOpen; render(); break;
      case 'open-filter': openFilter(); break;
      case 'filter-set': {
        S.filter = S.filter || {};
        var fk = btn.dataset.kind, fv = btn.dataset.value;
        if (fk === 'pri') S.filter.pri = Number(fv); else S.filter[fk] = fv;
        closeLayer(); render(); break;
      }
      case 'filter-clear': S.filter = null; closeLayer(); render(); break;
      case 'clear-filter': S.filter = null; render(); break;

      /* open objects */
      case 'open-todo':
        if (isMobile()) { S.mobileDetail = { type: 'todo', id: id }; render(); }
        else { S.drawer = { type: 'todo', id: id }; render(); }
        break;
      case 'open-event':
        if (isMobile()) { S.mobileDetail = { type: 'event', id: id }; render(); }
        else { S.drawer = { type: 'event', id: id }; render(); }
        break;
      case 'close-inspector': S.drawer = null; render(); break;
      case 'close-mdetail': S.mobileDetail = null; render(); break;

      /* completion */
      case 'toggle-done': completeTodo(id, false); break;
      case 'complete-occur': closeLayer(); completeTodo(id, true); break;

      /* composer */
      case 'open-composer': S.composer = blankComposer(defaultComposerType()); S.composer.open = true; render(); focusComposer(); break;
      case 'cmp-type': S.composer.type = btn.dataset.type; render(); focusComposer(); break;
      case 'close-composer': S.composer = blankComposer(); render(); break;
      case 'cmp-add': submitComposer(); break;
      case 'cmp-more': cmpMoreFields(); break;
      case 'cmp-due': cmpDuePicker(); break;
      case 'cmp-plan': cmpPlanPicker(); break;
      case 'cmp-evtime': cmpEventTimePicker(); break;
      case 'cmp-cal': cmpCalPicker(); break;
      case 'cmp-pri': {
        var cP = S.composer;
        openLayer(panelHtml({ title: '优先级', body: ['无', '低', '中', '高'].map(function (p, i) {
          return '<button class="opt" data-act="cmp-pri-set" data-p="' + i + '"><span class="ck' + ((cP.pri || 0) === i ? ' on' : '') + '">' + ((cP.pri || 0) === i ? ico('check') : '') + '</span>' + p + '</button>';
        }).join('') + '<div class="hintline">优先级只是一击切换的字段，不改变截止或安排。</div>' }));
        break;
      }
      case 'cmp-pri-set': S.composer.pri = Number(btn.dataset.p); closeLayer(); render(); focusComposer(); break;
      case 'cmp-tags': {
        var cT = S.composer;
        openLayer(panelHtml({ title: '标签', body: TAGS.map(function (tg) {
          var on = (cT.tags || []).indexOf(tg) >= 0;
          return '<button class="opt" data-act="cmp-tag-toggle" data-tag="' + esc(tg) + '"><span class="ck' + (on ? ' on' : '') + '">' + (on ? ico('check') : '') + '</span>' + esc(tg) + '</button>';
        }).join('') }));

      }

          foot: '<button class="btn" data-act="close-layer">取消</button><span class="sp"></span><button class="btn primary" data-act="cmp-loc-apply">应用</button>' }), { after: function (root) {
            var inp = root.querySelector('#cmp-loc-input'); if (inp) { inp.focus(); inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { S.composer.loc = inp.value.trim(); closeLayer(); render(); focusComposer(); } }); }

            '<div class="fieldlabel">服务器</div><input class="input" value="https://sync.dayspark.local" style="margin-bottom:10px">' +
            '<div class="fieldlabel">邮箱</div><input class="input" value="chang@local" style="margin-bottom:10px">' +

      /* arrange */
      case 'arrange': { var ar1 = todoById(id); if (ar1) openArrange(ar1); break; }
      case 'arrange-submit': arrangeSubmit(id); break;
      case 'slot-new-event': {
        var sd = btn.dataset.date;
        closeLayer();
        S.composer = blankComposer('event'); S.composer.open = true;
        S.composer.planDate = sd; S.composer.planStart = btn.dataset.start; S.composer.planEnd = btn.dataset.end;
        render(); focusComposer(); break;
      }
      case 'slot-assign-todo': openPickTodoForSlot(btn.dataset.date, btn.dataset.start, btn.dataset.end); break;
      case 'slot-assign-one': {

          closeLayer(); render(true);
          toast('已新增计划执行 · ' + mds(btn.dataset.date) + ' ' + btn.dataset.start + '–' + btn.dataset.end + ' · 截止不变', '撤销', function () {
            sa.allocs = sa.allocs.filter(function (a) { return a.id !== sa.allocs[sa.allocs.length - 1].id; });
            render(true);
          });
        }
        break;
      }
      case 'pick-unscheduled': openPickTodoForSlot(TODAY, '15:00', '16:00'); break;

      /* event time */
      case 'ev-apply': eventApply(id); break;
      case 'ev-allday': { var ea = eventById(id); if (ea) { ea.allDay = !ea.allDay; eventTimeEditor(ea); } break; }
      case 'loc-apply': {
