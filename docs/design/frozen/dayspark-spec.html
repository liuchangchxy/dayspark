<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DaySpark · 视觉与交互规格母版</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only. Product CSS outside the layer wins ordinary layout rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

:root{
  --paper:#ffffff;
  --ink:#191918;
  --ink-2:#45453f;
  --muted:#6e6e66;
  --faint:#8b8b82;
  --hair:#ecece6;
  --hair-2:#deded7;
  --wash:#f7f7f4;
  --red:#c92a1e;
  --red-soft:#fdf3f1;
  --amber:#9a6a18;
  --amber-soft:#f7eedb;
  --work:#5f7183;
  --work-soft:#f1f3f4;
  --shadow:0 18px 50px rgba(24,24,22,.10);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#e8e8e1;color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
svg.od-icon{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ============ spec shell ============ */
.spec{height:100dvh;display:flex;min-height:0;background:#e8e8e1}
.spec-nav{flex:none;width:238px;min-height:0;background:#f7f7f2;border-right:1px solid #dbdbd3;display:flex;flex-direction:column;padding:18px 12px 12px}
.spec-brand{display:flex;align-items:center;gap:9px;padding:0 8px;font-size:14px;font-weight:650;letter-spacing:.01em}
.spec-mark{width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.spec-meta{padding:3px 8px 16px;font-size:10px;color:#8a8a80;letter-spacing:.06em}
.spec-nav-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 0 8px;scrollbar-width:thin;scrollbar-color:#d7d7cf transparent}
.spec-nav-scroll::-webkit-scrollbar{width:8px}
.spec-nav-scroll::-webkit-scrollbar-thumb{background:#d7d7cf;border-radius:4px;border:2px solid #f7f7f2}
.spec-group{padding:14px 8px 5px;font-size:9.5px;letter-spacing:.12em;color:#9a9a90;font-weight:600}
.spec-link{display:flex;align-items:center;gap:9px;width:100%;min-height:31px;padding:0 9px;border-radius:5px;text-align:left;font-size:12px;color:#56564e;letter-spacing:.01em}
.spec-link:hover{background:#efefe8;color:var(--ink)}
.spec-link.is-on{background:#e9e9e1;color:var(--ink);font-weight:600}
.spec-link .dot{width:5px;height:5px;border-radius:50%;background:#b5b5aa;flex:none}
.spec-link.is-on .dot{background:var(--ink)}
.spec-foot{padding:11px 8px 2px;border-top:1px solid #e2e2da;font-size:10px;color:#8d8d83;line-height:1.5}
.spec-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.spec-bar{flex:none;min-height:78px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:15px 24px 12px;border-bottom:1px solid #dbdbd3;background:#f2f2ec}
.spec-heading{min-width:0}
.spec-title{font-size:19px;font-weight:650;letter-spacing:.01em;line-height:1.3;margin:0}
.spec-desc{margin:3px 0 0;font-size:11.5px;color:#77776d;line-height:1.45;max-width:760px}
.spec-tools{display:flex;align-items:center;gap:8px;flex:none;padding-top:2px}
.device-toggle{display:flex;padding:2px;border:1px solid #d8d8d0;border-radius:7px;background:#fbfbf8}
.device-toggle button{height:26px;padding:0 10px;border-radius:5px;font-size:11px;color:#79796f}
.device-toggle button.is-on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.spec-variants{flex:none;display:flex;align-items:center;gap:6px;padding:8px 24px;border-bottom:1px solid #e2e2da;background:#f7f7f2;min-height:40px;overflow-x:auto;scrollbar-width:none}
.spec-variants::-webkit-scrollbar{display:none}
.spec-variants .v-label{font-size:9.5px;letter-spacing:.1em;color:#a0a096;margin-right:3px;flex:none}
.v-chip{flex:none;height:25px;padding:0 9px;border:1px solid #dcdcd4;border-radius:5px;background:#fff;font-size:10.5px;color:#6f6f66}
.v-chip:hover{border-color:#bcbcb2;color:var(--ink)}
.v-chip.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.spec-canvas{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:22px;overflow:hidden;background:#e8e8e1}
.frame-wrap{position:relative;transition:width .18s ease,height .18s ease}
.frame-wrap::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:0 24px 70px rgba(24,24,22,.16);pointer-events:none}
.product{position:relative;width:1440px;height:900px;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;overflow:hidden;transform-origin:top left;border-radius:10px}
.product.mobile{width:410px;height:864px;padding:10px;background:#202226;border-radius:54px}
.product.mobile .m-app{width:390px;height:844px;border-radius:45px;overflow:hidden;background:#fff;position:relative;display:flex;flex-direction:column}
.product.narrow{width:1180px;height:800px}
.product.narrow .drawer.inline,.product.narrow .drawer.overlay{position:absolute;top:0;right:0;bottom:0;width:360px;border-left:1px solid var(--hair);box-shadow:-16px 0 46px rgba(25,25,24,.10)}
.product.narrow .todo-body.has-drawer,.product.narrow .cal-body.has-drawer{grid-template-columns:minmax(0,1fr)}
.product.narrow .capture.is-shifted,.product.narrow .capture-panel.is-shifted{left:calc(50% - 180px)}

/* ============ product shell ============ */
.p-top{flex:none;height:52px;display:flex;align-items:center;gap:26px;padding:0 24px;border-bottom:1px solid var(--hair);background:var(--paper);position:relative;z-index:30}
.p-brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650;flex:none;letter-spacing:.01em}
.p-mark{width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.p-nav{display:flex;align-items:center;gap:20px;height:100%}
.p-nav button{position:relative;height:52px;font-size:12.5px;color:var(--muted)}
.p-nav button:hover{color:var(--ink-2)}
.p-nav button.is-on{color:var(--ink);font-weight:600}
.p-nav button.is-on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.p-actions{margin-left:auto;display:flex;align-items:center;gap:13px}
.p-search{display:flex;align-items:center;gap:6px;height:29px;padding:0 9px;border:1px solid var(--hair-2);border-radius:6px;font-size:11px;color:var(--muted)}
.p-search:hover{background:var(--wash);color:var(--ink-2)}
.p-search .od-icon{--od-icon-size:12px}
.p-search kbd{font-family:var(--font);font-size:9px;color:var(--faint);border:1px solid var(--hair);border-radius:3px;padding:0 4px;line-height:1.5}
.p-clock{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.p-avatar{width:27px;height:27px;border-radius:50%;border:1px solid var(--hair-2);display:grid;place-items:center;font-size:10px;color:var(--muted);background:#fbfbf8}
.p-avatar:hover{color:var(--ink);border-color:#bfbfb6}
.p-main{height:calc(100% - 52px);min-height:0;position:relative}
.page{height:100%;display:flex;flex-direction:column;min-height:0;position:relative}
.page-head{flex:none;padding:20px 28px 13px;border-bottom:1px solid var(--hair);display:flex;align-items:flex-end;justify-content:space-between;gap:22px;background:var(--paper)}
.ph-left{min-width:0}
.ph-title-row{display:flex;align-items:baseline;gap:10px;min-width:0}
.ph-title{font-size:26px;font-weight:650;letter-spacing:.01em;line-height:1.22;margin:0;white-space:nowrap}
.ph-sub{font-size:11.5px;color:var(--muted);white-space:nowrap}
.ph-sum{margin-top:5px;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.ph-right{display:flex;align-items:center;gap:8px;flex:none;padding-bottom:2px}
.tool{height:29px;padding:0 9px;border:1px solid var(--hair-2);border-radius:6px;font-size:11px;color:var(--ink-2);background:#fff;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tool.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.tool:hover{background:var(--wash)}
.tool .od-icon{--od-icon-size:12px;color:var(--muted)}
.tool.is-on{background:var(--wash)}
.mode-switch{display:inline-flex;align-items:center;gap:2px;margin-top:10px;padding:3px;background:var(--wash);border-radius:7px}
.mode-switch button{height:27px;padding:0 12px;border-radius:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.mode-switch button:hover{color:var(--ink-2)}
.mode-switch button.is-on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(25,25,24,.06)}
.view-switch{display:inline-flex;gap:2px;padding:3px;background:var(--wash);border-radius:7px}
.view-switch button{height:27px;padding:0 11px;border-radius:5px;font-size:11.5px;color:var(--muted)}
.view-switch button.is-on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(25,25,24,.06)}

/* ============ today ============ */
.today-grid{flex:1;min-height:0;display:grid;grid-template-columns:380px minmax(0,1fr)}
.task-col{min-height:0;overflow-y:auto;border-right:1px solid var(--hair);padding:8px 20px 118px;scrollbar-width:thin;scrollbar-color:#deded7 transparent}
.zone-label{display:flex;align-items:center;gap:8px;min-height:25px;padding:0 3px;font-size:9px;font-weight:650;letter-spacing:.13em;color:var(--faint);text-transform:uppercase}
.zone-label::after{content:"";height:1px;flex:1;background:var(--hair)}
.task-col::-webkit-scrollbar{width:8px}
.task-col::-webkit-scrollbar-thumb{background:#deded7;border-radius:4px;border:2px solid #fff}
.time-col{min-height:0;overflow-y:auto;padding:14px 30px 118px;scrollbar-width:thin;scrollbar-color:#deded7 transparent}
.time-col::-webkit-scrollbar{width:8px}
.time-col::-webkit-scrollbar-thumb{background:#deded7;border-radius:4px;border:2px solid #fff}
.group-head{display:flex;align-items:center;gap:7px;width:100%;min-height:31px;padding:0 3px;margin-top:10px;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-align:left}
.group-head .count{margin-left:2px;font-size:10px;font-weight:400;color:var(--faint);font-variant-numeric:tabular-nums}
.group-head .chev{margin-left:auto;--od-icon-size:11px;color:var(--faint);transition:transform .15s ease}
.group-head[aria-expanded="true"] .chev{transform:rotate(90deg)}
.group-head.is-red{color:var(--red)}
.group-head.is-red .count{color:#c98078}
.task-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;min-height:55px;padding:7px 3px;border-bottom:1px solid #f3f3ee;border-radius:5px;text-align:left}
.task-row:hover{background:var(--wash)}
.task-row.is-done .task-title{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.check{width:16px;height:16px;border-radius:50%;border:1.4px solid #cfcfc7;background:#fff;display:grid;place-items:center;color:#fff;flex:none;position:relative}
/* 15px circle, 44px touch target: the ring stays small, the invisible hit slop
   grows to 44 on the phone only (a mouse does not need it on desktop). */
.m-app .check::after{content:'';position:absolute;inset:-15px}
.m-app .row-act{width:44px;height:44px;min-width:44px;min-height:44px;flex:none;margin:-9px 0}
/* Same rule for every icon-only control: visual size stays, hit area is 44. */
.m-app .m-icon,.m-app .m-back,.m-app .cap-send,.m-app .drawer-close,.m-app .cmd-x{position:relative}
.m-app .m-icon::after,.m-app .m-back::after,.m-app .cap-send::after,.m-app .drawer-close::after{content:'';position:absolute;inset:-9px}
.m-app .f-chip{height:32px;padding:0 10px;display:inline-flex;align-items:center}
.check:hover{border-color:#a9a9a0}
.check.is-on{background:var(--ink);border-color:var(--ink)}
.check .od-icon{--od-icon-size:8px;stroke-width:2.8}
.task-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.task-title{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.task-meta{display:flex;align-items:center;gap:5px;min-width:0;font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden}
.cal-dot{width:5px;height:5px;border-radius:50%;flex:none}
.sep{color:#c7c7bd}
.plan-meta{display:inline-flex;align-items:center;gap:3px;color:var(--work);font-variant-numeric:tabular-nums}
.plan-meta .od-icon{--od-icon-size:9px}
.mini-row .missed{margin-left:5px}
.missed{color:var(--red);font-weight:600;background:transparent;border-bottom:1px dotted #d9a39d;border-radius:0;padding:0;line-height:15px}
.task-side{display:flex;align-items:center;gap:5px;flex:none}
.due-pill{font-size:9.5px;color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--amber-soft);border-radius:4px;padding:2px 5px}
.due-pill.is-red{color:var(--red);background:transparent}
.row-act{width:25px;height:25px;border-radius:5px;display:grid;place-items:center;color:var(--faint);opacity:.55}
.task-row:hover .row-act,.row-act:focus-visible{opacity:1}
.row-act:hover{background:#efefe8;color:var(--ink)}
.row-act .od-icon{--od-icon-size:12px}
.more-row{display:flex;align-items:center;gap:7px;min-height:34px;padding:0 3px 0 33px;font-size:10.5px;color:var(--muted);text-align:left}
.more-row:hover{color:var(--ink)}
.more-row .od-icon{--od-icon-size:10px}

.time-head{display:flex;align-items:center;gap:7px;min-height:30px;margin-top:12px;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.time-head .count{font-size:10px;font-weight:400;color:var(--faint)}
.time-head .th-time{margin-left:auto;font-size:10px;font-weight:400;color:var(--faint);font-variant-numeric:tabular-nums}
.time-head.is-now{color:var(--red)}
.time-head.is-now .th-time{color:var(--red)}
.time-head.is-muted{color:var(--faint)}
.allday-strip{display:flex;align-items:center;gap:8px;padding:7px 0 8px;border-bottom:1px solid var(--hair);margin-bottom:4px}
.allday-label{flex:none;width:48px;font-size:9.5px;color:var(--faint);letter-spacing:.04em;text-align:right}
.allday-chip{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:100%;height:24px;padding:0 8px;border-radius:4px;background:var(--ev-bg);color:var(--ev-ink);border-left:2px solid var(--ev-bar);font-size:10.5px;font-weight:500}
.allday-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-row{display:grid;grid-template-columns:52px 12px minmax(0,1fr);gap:10px;align-items:stretch;min-height:54px;padding:3px 0}
.tl-time{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right;padding-top:13px;white-space:nowrap}
.tl-rail{position:relative;display:flex;justify-content:center}
.tl-rail::before{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--hair)}
.tl-dot{position:relative;z-index:1;width:5px;height:5px;border-radius:50%;margin-top:15px;background:var(--faint);box-shadow:0 0 0 3px #fff}
.tl-content{min-width:0;padding-bottom:5px}
.tl-block{width:100%;min-width:0;border-radius:6px;padding:8px 10px;border-left:3px solid var(--bar);background:var(--bg);color:var(--ink);text-align:left;display:block}
.tl-block:hover{filter:brightness(.985)}
.tl-block.event{--bg:var(--ev-bg);--bar:var(--ev-bar)}
.tl-block.plan{--bg:#f1f0ea;--bar:var(--work);border-left-width:2px}
.tl-block-title{font-size:12.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.tl-block-meta{margin-top:2px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.plan-tag{flex:none;font-size:8.5px;font-weight:600;letter-spacing:.05em;color:var(--work);background:#e6e9eb;border-radius:3px;padding:0 4px;line-height:15px}
.live-tag{flex:none;font-size:8.5px;font-weight:700;letter-spacing:.04em;color:var(--red)}
.now-line{display:flex;align-items:center;gap:8px;height:28px;margin:3px 0 3px 52px;color:var(--red);font-size:9px;font-weight:700;letter-spacing:.05em;font-variant-numeric:tabular-nums}
.now-line::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--red);flex:none}
.now-line::after{content:"";flex:1;height:1.5px;background:var(--red)}
.time-empty{padding:70px 12px;text-align:center;color:var(--faint);font-size:11.5px}

/* ============ todo ============ */
.todo-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.todo-body.has-drawer{grid-template-columns:minmax(0,1fr) 380px}
.todo-list-col{min-height:0;overflow-y:auto;padding:8px 28px 118px;scrollbar-width:thin;scrollbar-color:#deded7 transparent}
.todo-list-col::-webkit-scrollbar{width:8px}
.todo-list-col::-webkit-scrollbar-thumb{background:#deded7;border-radius:4px;border:2px solid #fff}
.todo-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:11px;align-items:center;min-height:54px;padding:7px 4px;border-bottom:1px solid #f2f2ed;border-radius:5px;text-align:left;width:100%}
.todo-row:hover{background:var(--wash)}
.todo-row.is-done .todo-title{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.todo-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.todo-title{font-size:13.5px;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-meta{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden}
.todo-side{display:flex;align-items:center;gap:7px;flex:none}
.todo-side .due-pill{font-size:10px}
.todo-side .row-act{opacity:.55}
.todo-row:hover .row-act{opacity:1}
.date-strip{flex:none;display:flex;align-items:center;gap:12px;padding:12px 0 14px;border-bottom:1px solid var(--hair);margin-bottom:4px}
.ds-month{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px;border:1px solid var(--hair-2);border-radius:6px;font-size:10.5px;color:var(--ink-2);background:#fff;white-space:nowrap}
.ds-month .od-icon{--od-icon-size:10px;color:var(--faint)}
.ds-days{display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.ds-days::-webkit-scrollbar{display:none}
.ds-day{flex:none;width:44px;height:48px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);border:1px solid transparent}
.ds-day:hover{background:var(--wash)}
.ds-day span{font-size:9px;letter-spacing:.02em}
.ds-day b{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.ds-day.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.ds-day.is-today:not(.is-on) b{color:var(--red)}
.product.mobile .date-strip{gap:8px}
.product.mobile .ds-day{width:34px;height:44px}
.product.mobile .ds-days{gap:2px}
.product.mobile .ds-month{font-size:10px}
.bg-band{flex:none;padding:10px 0 12px;border-bottom:1px solid var(--hair)}
.bg-band-head{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.bg-band-head span{font-weight:400;color:var(--faint)}
.bg-chips{display:flex;gap:6px;margin-top:7px;min-width:0;overflow-x:auto;scrollbar-width:none}
.bg-chips::-webkit-scrollbar{display:none}
.bg-chip{flex:none;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 7px;border:1px solid var(--hair);border-radius:4px;background:#fbfbf8;font-size:10px;color:var(--ink-2);white-space:nowrap}
/* The strip is a background hint, not a carousel: a chip sliced by the right
   edge reads as a layout bug. On the phone it wraps to a second row instead. */
.m-app .bg-chips{flex-wrap:wrap;overflow-x:visible;row-gap:6px}
.bg-chip i{width:5px;height:5px;border-radius:50%;flex:none}
.empty-state{padding:76px 20px;text-align:center;border-bottom:1px solid var(--hair)}
.empty-state .od-icon{--od-icon-size:27px;color:#b5b5ab;margin-bottom:10px}
.empty-title{font-size:15px;font-weight:600;color:var(--ink)}
.empty-sub{margin-top:4px;font-size:11.5px;color:var(--muted)}
.empty-action{margin-top:13px;font-size:11.5px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* ============ calendar ============ */
.cal-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.cal-body.has-drawer{grid-template-columns:minmax(0,1fr) 380px}
.cal-main{min-width:0;min-height:0;overflow:auto;padding:0 24px;scrollbar-width:thin;scrollbar-color:#deded7 transparent}
.cal-main::-webkit-scrollbar{width:9px;height:9px}
.cal-main::-webkit-scrollbar-thumb{background:#deded7;border-radius:5px;border:2px solid #fff}
.week{min-width:820px}
.week-head{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border-left:1px solid var(--hair);border-top:1px solid var(--hair)}
.axis-spacer{border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.day-head{height:46px;display:flex;align-items:center;justify-content:center;gap:7px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);background:#fff;font-size:10.5px;color:var(--muted)}
.day-head:hover{background:#fbfbf8}
.day-head b{font-size:13px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.day-head.is-today{color:var(--red)}
.day-head.is-today b{background:var(--red);color:#fff;width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:11px}
.allday-row{display:grid;grid-template-columns:56px minmax(0,1fr);border-left:1px solid var(--hair)}
.axis-label{display:flex;align-items:center;justify-content:flex-end;padding-right:8px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);font-size:9px;color:var(--faint);letter-spacing:.04em;background:#fff}
.allday-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--hair);min-height:30px;background:#fff}
.allday-cell{border-right:1px solid var(--hair);padding:3px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.allday-cell .allday-chip{height:21px;padding:0 5px;font-size:9.5px}
.deadline-row{display:grid;grid-template-columns:56px minmax(0,1fr);border-left:1px solid var(--hair)}
.deadline-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--hair);min-height:30px;background:#fff}
.deadline-cell{border-right:1px solid var(--hair);padding:3px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
mark{background:var(--amber-soft);color:inherit;border-radius:2px;padding:0 1px}
.dl-chip{display:block;width:100%;text-align:left;font-size:9px;line-height:1.35;color:var(--amber);background:var(--amber-soft);border-radius:3px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-chip.is-red{color:var(--red);background:transparent;border-left:2px solid #d9a39d;border-radius:0;padding-left:3px}
.week-body{display:grid;grid-template-columns:56px minmax(0,1fr);border-left:1px solid var(--hair)}
.time-axis{position:relative;height:648px;border-right:1px solid var(--hair);background:#fff}
.time-axis span{position:absolute;right:8px;transform:translateY(-50%);font-size:9px;color:var(--faint);font-variant-numeric:tabular-nums}
.week-cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:648px}
.day-col{position:relative;border-right:1px solid var(--hair);background-image:repeating-linear-gradient(to bottom,transparent 0 53px,var(--hair) 53px 54px);min-width:0;cursor:pointer}
.day-col:hover{background-color:#fdfdfb}
.cal-block{position:absolute;z-index:2;display:flex;flex-direction:column;justify-content:flex-start;min-width:0;overflow:hidden;padding:3px 4px;border:0;border-left:3px solid var(--bar);border-radius:4px;background:var(--bg);color:var(--ink);text-align:left}
.overdue-dot{position:absolute;top:3px;right:3px;width:4px;height:4px;border-radius:50%;background:var(--red);z-index:3}
.cal-block:hover{filter:brightness(.975)}
.cal-block .cb-title{font-size:9.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-block .cb-meta{margin-top:1px;font-size:8.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.cal-block.is-short{padding:1px 4px;justify-content:center}
.cal-block.is-short .cb-meta{display:none}
.cal-block.is-plan{--bg:#f1f0ea;--ink:#3b3b33;--bar:var(--work);border-left-width:2px}
.dl-marker{position:absolute;left:0;right:0;z-index:5;height:0;border-top:1.5px solid var(--amber);pointer-events:none}
.dl-marker.is-red{border-top-color:var(--red)}
.dl-marker .dl-dot{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.dl-marker.is-red .dl-dot{background:var(--red)}
.dl-marker .dl-label{position:absolute;right:3px;top:-8px;background:#fff;border:1px solid var(--hair-2);border-radius:3px;padding:0 4px;font-size:8px;line-height:14px;color:var(--amber);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.dl-marker.is-red .dl-label{color:var(--red)}
.now-line-cal{position:absolute;left:0;right:0;z-index:6;height:0;border-top:1.5px solid var(--red);pointer-events:none}
.now-line-cal .nd{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.slot-ghost{position:absolute;left:4%;right:4%;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 7px;border:1px dashed #a9b8c4;border-radius:4px;background:#f7fafb;color:#456b8a;font-size:9px;text-align:left}
.slot-ghost:hover{background:#eef4f7;border-color:#7b99ad}
.slot-ghost span{font-size:8px;color:#7a92a3;font-variant-numeric:tabular-nums}
.drag-ghost{position:absolute;left:4%;right:4%;z-index:3;display:flex;align-items:center;padding:0 6px;border:1.5px dashed #8b9eac;border-radius:4px;background:#f4f8fa;color:#456b8a;font-size:8.5px;font-weight:600;pointer-events:none;box-shadow:0 2px 8px rgba(69,107,138,.10)}
.month{min-width:760px}
.month-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:30px;align-items:center;border:1px solid var(--hair);border-bottom:0;background:#fbfbf8;font-size:9.5px;color:var(--faint);text-align:center;letter-spacing:.04em}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(104px,1fr);border-left:1px solid var(--hair);border-top:1px solid var(--hair)}
.mcell{position:relative;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:6px 7px;text-align:left;background:#fff;min-width:0;vertical-align:top}
.mcell:hover{background:#fbfbf8}
.mcell.is-out{background:#fbfbf8}
.mcell.is-out .mnum{color:#c3c3ba}
.mnum{display:inline-grid;place-items:center;min-width:20px;height:20px;font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mnum.is-today{background:var(--red);color:#fff;border-radius:10px}
.mchip{display:flex;align-items:center;gap:4px;margin-top:3px;min-width:0;font-size:9px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip i{width:3px;height:9px;border-radius:1px;flex:none;background:var(--bar)}
.mchip span{overflow:hidden;text-overflow:ellipsis}
.mchip.is-plan i{background:var(--work)}
.mchip.is-plan.is-red{color:var(--red)}
.mchip.is-dl{color:var(--amber)}
.mchip.is-dl i{background:var(--amber)}
.mchip.is-dl.is-red{color:var(--red)}
.mchip.is-dl.is-red i{background:var(--red)}
.mmore{margin-top:3px;font-size:8.5px;color:var(--faint)}
.day-view{min-width:580px}
.day-headbar{display:flex;align-items:center;justify-content:space-between;height:42px;padding:0 12px;border:1px solid var(--hair);border-bottom:0;background:#fbfbf8;font-size:10.5px;color:var(--muted)}
.day-headbar b{font-size:12px;color:var(--ink-2);font-weight:500}
.day-allday{display:grid;grid-template-columns:56px minmax(0,1fr);border-left:1px solid var(--hair)}
.day-allday .allday-grid{grid-template-columns:1fr;border-left:0}
.day-allday .allday-cell{border-left:0}
.day-deadline{display:grid;grid-template-columns:56px minmax(0,1fr);border-left:1px solid var(--hair)}
.day-deadline .deadline-grid{grid-template-columns:1fr;border-left:0}
.day-deadline .deadline-cell{border-left:0;min-height:30px;flex-direction:row;gap:6px;flex-wrap:wrap}
.day-body{display:grid;grid-template-columns:56px minmax(0,1fr);border-left:1px solid var(--hair)}
.day-body .day-col{height:648px}
.day-body .time-axis{height:648px}

/* ============ drawer / detail ============ */
.drawer{background:#fff;display:flex;flex-direction:column;min-height:0;z-index:60}
.drawer.overlay{position:absolute;top:0;right:0;bottom:0;width:380px;border-left:1px solid var(--hair);box-shadow:-16px 0 46px rgba(25,25,24,.10)}
.drawer.inline{position:relative;border-left:1px solid var(--hair);width:380px;flex:none}
.drawer-head{flex:none;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px;border-bottom:1px solid var(--hair)}
.drawer-kind{font-size:9.5px;letter-spacing:.09em;color:var(--faint);font-weight:600}
.drawer-close{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.drawer-close:hover{background:var(--wash);color:var(--ink)}
.drawer-close .od-icon{--od-icon-size:13px}
.drawer-body{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 26px;scrollbar-width:thin;scrollbar-color:#deded7 transparent}
.drawer-body::-webkit-scrollbar{width:8px}
.drawer-body::-webkit-scrollbar-thumb{background:#deded7;border-radius:4px;border:2px solid #fff}
.d-eyebrow{font-size:9.5px;letter-spacing:.06em;color:var(--faint);display:flex;align-items:center;gap:5px}
.d-title{font-size:21px;font-weight:650;line-height:1.3;margin:5px 0 0;letter-spacing:.01em}
.d-title.is-done{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.d-sub{margin-top:5px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.d-complete{display:flex;align-items:center;gap:9px;width:100%;margin-top:15px;padding:8px 10px;border:1px solid var(--hair);border-radius:7px;font-size:12px;color:var(--ink-2);text-align:left;background:#fbfbf8}
.d-complete:hover{background:var(--wash)}
.d-complete .check{width:17px;height:17px}
.d-complete .check .od-icon{--od-icon-size:9px}
.field-list{margin-top:14px;border-top:1px solid var(--hair)}
.field-row{display:grid;grid-template-columns:74px minmax(0,1fr) 9px;gap:10px;align-items:center;min-height:38px;border-bottom:1px solid #f2f2ed;font-size:11.5px;cursor:pointer;border-radius:4px;padding:0 4px;margin:0 -4px}
.field-row:hover{background:var(--wash)}
.field-row::after{content:"";width:4px;height:4px;border-right:1px solid #c3c3ba;border-top:1px solid #c3c3ba;transform:rotate(45deg);justify-self:end}
.field-row .f-label{color:var(--faint);font-size:10.5px}
.field-row .f-value{display:flex;align-items:center;gap:6px;min-width:0;color:var(--ink-2);flex-wrap:wrap}
.field-row .f-value .od-icon{--od-icon-size:12px;color:var(--faint)}
.field-row .f-value.is-due{color:var(--amber)}
.field-row .f-value.is-due .od-icon{color:var(--amber)}
.field-row .f-value.is-plan{color:var(--work)}
.field-row .f-value.is-plan .od-icon{color:var(--work)}
.field-row .f-value.is-red{color:var(--red)}
.field-row .f-value.is-red .od-icon{color:var(--red)}
.f-chip{display:inline-flex;align-items:center;height:23px;padding:0 7px;border:1px solid var(--hair-2);border-radius:4px;background:#fff;font-size:10px;color:var(--ink-2);white-space:nowrap}
.f-chip.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:4px;background:var(--wash);font-size:10px;color:var(--muted)}
.tag i{width:5px;height:5px;border-radius:50%;background:#a9a9a0}
.d-sec{margin-top:16px;padding-top:12px;border-top:1px solid var(--hair)}
.d-sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:9.5px;letter-spacing:.08em;color:var(--faint);font-weight:600}
.d-sec-head button{font-size:10px;letter-spacing:0;color:var(--muted);font-weight:400}
.d-note{font-size:12px;line-height:1.65;color:var(--ink-2);margin-top:8px;white-space:pre-wrap}
.subtask{display:flex;align-items:center;gap:7px;min-height:30px;font-size:11.5px;color:var(--ink-2)}
.subtask .check{width:14px;height:14px}
.subtask .check .od-icon{--od-icon-size:7px}
.subtask.is-done span{color:var(--faint);text-decoration:line-through}
.attach{display:flex;align-items:center;gap:7px;min-height:30px;font-size:11px;color:var(--muted)}
.attach .od-icon{--od-icon-size:13px;color:var(--faint)}
.d-foot{display:flex;align-items:center;gap:16px;margin-top:18px;padding-top:13px;border-top:1px solid var(--hair);font-size:11px;color:var(--muted);flex-wrap:wrap}
.d-foot .danger{color:var(--red)}
.d-foot .primary{color:var(--ink);font-weight:600}
.drawer > .d-foot,.m-app > .d-foot{flex:none;margin:0;padding:12px 20px;border-top:1px solid var(--hair);background:#fff}
.m-app > .d-foot{padding:12px 18px}
.d-act{padding:0;font-size:11px;color:var(--muted)}
.d-act:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.d-act.danger{color:var(--red)}
.d-act.primary{color:var(--ink);font-weight:600}

.confirm-scrim{position:fixed;inset:0;z-index:95;background:rgba(25,25,24,.22);display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-modal{width:min(320px,100%);background:#fff;border-radius:10px;padding:14px;box-shadow:0 20px 60px rgba(25,25,24,.22)}
.confirm-modal h3{margin:0 0 5px;font-size:13px}
.confirm-modal p{margin:0;color:var(--muted);font-size:10.5px;line-height:1.5}
.confirm-modal .cf-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.confirm-modal .cf-actions button{height:28px;padding:0 10px;border:1px solid var(--hair-2);border-radius:5px;background:#fff;font-size:10px}
.confirm-modal .cf-actions .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.confirm-modal .cf-actions .cf-danger{background:var(--red);color:#fff;border-color:var(--red)}
.filter-actions .primary.is-danger{background:var(--red);border-color:var(--red);color:#fff}
.confirm{margin-top:10px;padding:10px 11px;border-left:2px solid var(--red);background:#fbfbf8;font-size:10.5px;color:#7c231b;line-height:1.5}
.confirm .cf-actions{display:flex;gap:8px;margin-top:7px}
.confirm button{height:24px;padding:0 8px;border:1px solid #e7c8c3;border-radius:4px;background:#fff;font-size:10px;color:#7c231b}
.confirm button.primary{background:var(--red);border-color:var(--red);color:#fff}

/* ============ capture ============ */
.capture{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:560px;height:54px;z-index:45;display:flex;align-items:center;gap:8px;padding:0 8px 0 15px;background:#fff;border:1px solid #e1e1d9;border-radius:27px;box-shadow:0 8px 28px rgba(25,25,24,.08)}
.capture.is-shifted{left:calc(50% - 190px)}
.capture:focus-within{border-color:#bdbdb5;box-shadow:0 0 0 3px rgba(25,25,24,.04),0 8px 28px rgba(25,25,24,.08)}
.cap-type{flex:none;height:25px;padding:0 8px;border-radius:5px;background:var(--wash);font-size:10px;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px}
.cap-type .od-icon{--od-icon-size:10px;color:var(--muted)}
.cap-date{flex:none;font-size:10px;color:var(--muted);padding:0 2px;white-space:nowrap}
.cap-date.is-empty{color:var(--faint)}
.cap-input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:13.5px;color:var(--ink);line-height:1.4}
.cap-input::placeholder{color:#8e8e84}
input::placeholder,textarea::placeholder{color:#8e8e84;opacity:1}
.cap-kbd{flex:none;font-family:var(--font);font-size:9px;color:var(--faint);border:1px solid var(--hair-2);background:#fafaf7;border-radius:3px;padding:1px 5px}
.cap-send{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.cap-send:hover{background:#000}
.cap-send .od-icon{--od-icon-size:15px;stroke-width:2}
.capture-panel{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);width:620px;z-index:44;background:#fff;border:1px solid #e1e1d9;border-radius:10px;box-shadow:0 18px 55px rgba(25,25,24,.13);overflow:hidden}
.capture-panel.is-shifted{left:calc(50% - 190px)}
.cp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--hair)}
.cp-title{font-size:11.5px;font-weight:600;color:var(--ink)}
.cp-sub{font-size:9.5px;color:var(--faint);margin-top:1px}
.cp-body{padding:11px 14px 13px}
.cp-line{display:flex;align-items:flex-start;gap:9px;padding:7px 0}
.cp-line .od-icon{--od-icon-size:13px;color:var(--muted);margin-top:1px}
.cp-line-main{flex:1;min-width:0}
.cp-line-title{font-size:11.5px;color:var(--ink-2)}
.cp-line-sub{margin-top:2px;font-size:10px;color:var(--faint);line-height:1.45}
.cp-line-action{flex:none;font-size:10px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.cp-suggest{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid #dfe3e5;border-radius:7px;background:var(--work-soft)}
.cp-suggest .od-icon{--od-icon-size:13px;color:var(--work)}
.cp-suggest-main{flex:1;min-width:0}
.cp-suggest-title{font-size:11.5px;font-weight:600;color:var(--ink)}
.cp-suggest-sub{font-size:9.5px;color:var(--muted);margin-top:1px}
.cp-suggest-actions{display:flex;align-items:center;gap:9px;flex:none}
.cp-suggest-actions button{font-size:10px;color:var(--work);text-decoration:underline;text-underline-offset:2px}
.cp-fields{padding:2px 14px 13px}
.cp-field{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:37px;border-top:1px solid #f3f3ee;font-size:11px}
button.cp-field{width:100%;text-align:left;background:transparent}
.cp-field .k{color:var(--muted)}
.cp-field .v{color:var(--ink-2);display:flex;align-items:center;gap:5px}
.cp-field .v.is-due{color:var(--amber)}
.cp-field .v.is-plan{color:var(--work)}
.cp-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--hair);background:#fbfbf8}
.cp-hint{font-size:9.5px;color:var(--faint);line-height:1.45}
.cp-actions{display:flex;gap:8px}
.cp-actions .btn{height:29px;padding:0 11px;border:1px solid var(--hair-2);border-radius:5px;background:#fff;font-size:10.5px;color:var(--ink)}
.cp-actions .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.cp-actions .btn:hover{filter:brightness(.97)}

/* ============ plan picker ============ */
.scrim{position:absolute;inset:0;z-index:80;background:rgba(25,25,24,.26);display:grid;place-items:center}
.plan-card{width:430px;background:#fff;border-radius:10px;box-shadow:0 26px 80px rgba(20,20,18,.26);overflow:hidden}
.plan-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--hair)}
.plan-head b{font-size:12px;font-weight:600}
.plan-body{padding:14px 15px}
.plan-date{font-size:15px;font-weight:600}
.plan-date input{border:0;background:transparent;font:inherit;color:inherit;width:100%;padding:0;outline:none}
.plan-sub{font-size:10px;color:var(--faint);margin-top:2px}
.plan-time{display:flex;align-items:center;gap:8px;margin-top:13px}
.plan-time .box{flex:1;border:1px solid var(--hair-2);border-radius:6px;padding:7px 9px;font-size:12px;font-variant-numeric:tabular-nums}
.plan-time .box small{display:block;font-size:8.5px;color:var(--faint);margin-bottom:1px;letter-spacing:.04em}
.plan-time .box input{border:0;background:transparent;font:inherit;font-variant-numeric:tabular-nums;color:inherit;width:100%;padding:0;outline:none}
.plan-context{margin-top:13px;padding:9px 10px;background:#fbfbf8;border:1px solid var(--hair);border-radius:6px;font-size:10px;color:var(--muted);line-height:1.55}
.plan-context b{color:var(--ink-2);font-weight:500}
.plan-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 15px;border-top:1px solid var(--hair);background:#fbfbf8}

/* ============ command ============ */
.cmd-scrim{position:absolute;inset:0;z-index:85;background:rgba(25,25,24,.24);display:flex;justify-content:center;align-items:flex-start;padding-top:94px}
.cmd{width:620px;background:#fff;border-radius:10px;box-shadow:0 30px 90px rgba(20,20,18,.28);overflow:hidden}
.cmd-input{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid var(--hair)}
.cmd-input .od-icon{--od-icon-size:15px;color:var(--faint)}
.cmd-input input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:14px;color:var(--ink)}
.cmd-input input::placeholder{color:#8e8e84}
.cmd-input kbd{font-family:var(--font);font-size:9px;color:var(--faint);border:1px solid var(--hair-2);border-radius:3px;padding:1px 5px}
.cmd-body{max-height:390px;overflow:auto;padding:5px 0}
.cmd-group{padding:8px 16px 4px;font-size:9px;letter-spacing:.1em;color:var(--faint);font-weight:600}
.cmd-row{display:flex;align-items:center;gap:10px;width:100%;min-height:43px;padding:0 16px;text-align:left}
.cmd-row:hover,.cmd-row.is-sel{background:var(--wash)}
.cmd-row .od-icon{--od-icon-size:14px;color:var(--muted)}
.cmd-row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cmd-row-t{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-row-m{font-size:9.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-row-side{font-size:9.5px;color:var(--faint);white-space:nowrap}
.cmd-empty{padding:52px 20px;text-align:center}
.cmd-empty .od-icon{--od-icon-size:23px;color:#b5b5ab;margin-bottom:8px}
.cmd-empty p{margin:0;font-size:12px;color:var(--muted)}
.cmd-foot{display:flex;align-items:center;gap:14px;height:32px;padding:0 16px;border-top:1px solid var(--hair);font-size:9px;color:var(--faint)}

/* ============ settings ============ */
.settings-body{flex:1;min-height:0;display:flex;gap:46px;padding:24px 30px 80px;overflow:hidden}
.set-nav{flex:none;width:176px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow-y:auto;scrollbar-width:none}
.set-nav::-webkit-scrollbar{display:none}
.set-nav button{text-align:left;height:31px;padding:0 9px;border-radius:5px;font-size:11.5px;color:var(--muted)}
.set-nav button:hover{background:var(--wash);color:var(--ink-2)}
.set-nav button.is-on{background:var(--wash);color:var(--ink);font-weight:600}
.set-content{flex:1;min-width:0;max-width:700px;min-height:0;overflow-y:auto;padding-bottom:40px;scrollbar-width:thin;scrollbar-color:#deded7 transparent}
.set-content::-webkit-scrollbar{width:8px}
.set-content::-webkit-scrollbar-thumb{background:#deded7;border-radius:4px;border:2px solid #fff}
.set-h{font-size:13px;font-weight:650;margin:2px 0 4px}
.set-desc{font-size:11px;color:var(--faint);margin:0 0 12px;line-height:1.55}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:55px;border-top:1px solid var(--hair)}
.set-row:last-child{border-bottom:1px solid var(--hair)}
.set-label{font-size:12px;color:var(--ink)}
.set-label small{display:block;margin-top:2px;font-size:10px;color:var(--faint);line-height:1.45}
.set-value{font-size:10.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.set-value .od-icon{--od-icon-size:11px;color:var(--faint)}
.set-value:hover{color:var(--ink)}
.badge-default{display:inline-flex;align-items:center;height:18px;padding:0 5px;border-radius:3px;background:var(--wash);font-size:8.5px;color:var(--muted);letter-spacing:.04em}
.cal-list-row{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--hair);width:100%;text-align:left}
.cal-list-row:last-child{border-bottom:1px solid var(--hair)}
.cal-swatch{width:8px;height:8px;border-radius:50%;flex:none}
.cal-list-name{font-size:12px;color:var(--ink)}
.cal-list-count{margin-left:auto;font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.add-row{display:flex;align-items:center;gap:7px;min-height:42px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--hair)}
.add-row:hover{color:var(--ink)}
.add-row .od-icon{--od-icon-size:12px}
.io-card{border:1px solid var(--hair-2);border-radius:8px;padding:14px;margin-bottom:10px;background:#fbfbf8}
.io-card h3{font-size:12px;font-weight:600;margin:0 0 4px}
.io-card p{font-size:10.5px;color:var(--muted);margin:0 0 10px;line-height:1.55}
.io-actions{display:flex;gap:8px;flex-wrap:wrap}
.io-actions .btn{height:28px;padding:0 10px;border:1px solid var(--hair-2);border-radius:5px;background:#fff;font-size:10.5px}
.io-actions .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.tag-row{display:flex;align-items:center;gap:9px;min-height:42px;border-top:1px solid var(--hair);font-size:11.5px}
.tag-row:last-child{border-bottom:1px solid var(--hair)}
.tag-dot{width:7px;height:7px;border-radius:50%;flex:none}
.tag-count{margin-left:auto;font-size:9.5px;color:var(--faint)}
.trash-row{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--hair);font-size:11.5px}
.trash-row:last-child{border-bottom:1px solid var(--hair)}
.trash-main{flex:1;min-width:0}
.trash-sub{font-size:9.5px;color:var(--faint);margin-top:1px}
.trash-actions{display:flex;gap:9px;flex:none}
.trash-actions button{font-size:10px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.trash-actions .danger{color:var(--red)}

/* ============ spec sheet ============ */
.spec-sheet{height:100%;overflow:auto;padding:32px 42px 50px;background:#fff}
.spec-sheet-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--hair);padding-bottom:16px;margin-bottom:20px}
.spec-sheet-head h1{font-size:28px;font-weight:650;margin:0;letter-spacing:.01em}
.spec-sheet-head p{margin:4px 0 0;font-size:11px;color:var(--muted)}
.spec-sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.spec-card{border:1px solid var(--hair);border-radius:9px;padding:16px;background:#fff;min-width:0}
.spec-card h2{font-size:10px;font-weight:650;letter-spacing:.1em;color:var(--muted);margin:0 0 12px}
.swatch-row{display:flex;align-items:center;gap:10px;min-height:32px;font-size:10.5px;color:var(--ink-2)}
.swatch{width:22px;height:14px;border-radius:3px;flex:none;border-left:3px solid var(--bar);background:var(--bg)}
.type-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:1px solid #f3f3ee;padding:6px 0;font-size:10.5px;color:var(--muted)}
.type-sample{color:var(--ink);white-space:nowrap}
.t26{font-size:26px;font-weight:650}.t20{font-size:20px;font-weight:650}.t15{font-size:15px;font-weight:500}.t13{font-size:13px}.t11{font-size:11px}.t95{font-size:9.5px;letter-spacing:.05em}
.comp-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #f3f3ee;font-size:10px;color:var(--faint)}
.comp-chip{height:22px;padding:0 7px;border:1px solid var(--hair-2);border-radius:4px;background:#fff;font-size:9px;color:var(--ink-2);display:inline-flex;align-items:center}
.comp-block{width:100%;border-left:3px solid var(--bar);background:var(--bg);border-radius:4px;padding:5px 7px;font-size:9px;color:var(--ink)}
.rule-list{margin:0;padding:0;list-style:none}
.rule-list li{position:relative;padding:6px 0 6px 13px;font-size:10.5px;color:var(--ink-2);line-height:1.5;border-top:1px solid #f3f3ee}
.rule-list li::before{content:"";position:absolute;left:0;top:12px;width:4px;height:4px;border-radius:50%;background:#b5b5ab}
.mini-swatch{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}

/* ============ toast ============ */
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);z-index:95;background:#1b1b1a;color:#fff;font-size:11px;padding:7px 12px;border-radius:6px;box-shadow:0 6px 22px rgba(0,0,0,.16);white-space:nowrap;max-width:80%}

/* ============ mobile ============ */
.m-app{background:#fff;color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;position:relative;display:flex;flex-direction:column;height:100%}
.m-status{flex:none;height:40px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px 4px;font-size:11px;font-weight:600;color:var(--ink);letter-spacing:.01em}
.m-status-icons{display:flex;gap:4px;align-items:center;color:var(--ink)}
.m-status-icons i{display:block;width:12px;height:8px;border:1px solid currentColor;border-radius:2px;opacity:.7}
.m-status-icons i:first-child{width:14px;border:0;background:currentColor;height:1px;box-shadow:0 -3px currentColor,0 3px currentColor;opacity:.5}
.m-top{flex:none;height:50px;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--hair)}
.m-title{font-size:15px;font-weight:650;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-actions{margin-left:auto;display:flex;align-items:center;gap:5px;flex:none}
.m-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.m-icon:hover{background:var(--wash);color:var(--ink)}
.m-icon .od-icon{--od-icon-size:15px}
.m-back{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);margin-left:-4px}
.m-back .od-icon{--od-icon-size:16px}
.m-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 118px;scrollbar-width:none}
.m-scroll::-webkit-scrollbar{display:none}
.m-date{font-size:25px;font-weight:650;line-height:1.2;letter-spacing:.01em}
.m-sub{font-size:10.5px;color:var(--muted);margin-top:3px}
.m-sum{font-size:9.5px;color:var(--faint);margin-top:4px}
.m-group{display:flex;align-items:center;gap:6px;min-height:28px;margin-top:12px;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.m-group .count{font-size:9.5px;font-weight:400;color:var(--faint)}
.m-group.is-red{color:var(--red)}
.m-task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:7px;align-items:center;min-height:50px;padding:6px 0;border-bottom:1px solid #f3f3ee;width:100%;text-align:left}
.m-task .task-title{font-size:12.5px}
.m-task .task-meta{font-size:9.5px}
.m-task .due-pill{font-size:9px}
.m-task .check{width:15px;height:15px}
.m-task.is-done .task-title{color:var(--faint);text-decoration:line-through}
.m-time-head{display:flex;align-items:center;gap:6px;min-height:28px;margin-top:12px;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.m-time-head.is-now{color:var(--red)}
.m-time-row{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;padding:4px 0}
.m-time-row .tt{font-size:9px;color:var(--faint);padding-top:7px;font-variant-numeric:tabular-nums;text-align:right}
.m-block{border-left:3px solid var(--bar);background:var(--bg);border-radius:5px;padding:6px 8px;min-width:0;width:100%;text-align:left;display:block;position:relative}
.m-block.is-plan{border-left-width:2px}
.m-block-title{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-block-meta{font-size:9px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-capture{position:absolute;left:12px;right:12px;bottom:62px;height:48px;z-index:40;display:flex;align-items:center;gap:7px;padding:0 7px 0 12px;background:#fff;border:1px solid #e1e1d9;border-radius:24px;box-shadow:0 8px 26px rgba(25,25,24,.10)}
.m-capture .cap-type{height:23px;font-size:9px}
.m-capture .cap-input{font-size:12.5px}
.m-capture .cap-send{width:32px;height:32px}
.m-dock{flex:none;height:56px;border-top:1px solid var(--hair);display:flex;background:#fbfbf8;z-index:41}
.m-dock button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;color:var(--faint)}
.m-dock button.is-on{color:var(--ink);font-weight:600}
.m-dock .od-icon{--od-icon-size:18px}
.m-sheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:60;background:#fff;border:1px solid #e1e1d9;border-radius:14px;box-shadow:0 20px 60px rgba(25,25,24,.18);overflow:hidden}
.m-sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--hair)}
.m-sheet-head b{font-size:12px}
.m-sheet-body{padding:11px 14px 14px}
.m-detail-scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 40px}
.m-detail-title{font-size:21px;font-weight:650;line-height:1.3;margin:5px 0 0}
.m-detail-sub{font-size:10px;color:var(--muted);margin-top:4px}
.m-field{border-top:1px solid #f2f2ed;padding:9px 0;font-size:11px}
.m-field .k{font-size:9.5px;color:var(--faint);display:block;margin-bottom:2px}
.m-field .v{color:var(--ink-2);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.m-cal-strip{display:flex;gap:5px;overflow-x:auto;padding:3px 0 10px;scrollbar-width:none}
.m-cal-strip::-webkit-scrollbar{display:none}
.m-cal-day{flex:none;width:42px;height:46px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9px;color:var(--muted)}
.m-cal-day b{font-size:12px;font-weight:500}
.m-cal-day.is-on{background:var(--ink);color:#fff}
.m-cal-day.is-today:not(.is-on) b{color:var(--red)}
.m-allday{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--hair);min-width:0;overflow-x:auto;scrollbar-width:none}
.m-allday::-webkit-scrollbar{display:none}
.m-allday .allday-label{width:32px;font-size:9px}
.m-overlap-band{margin:8px 0 10px;border:1px solid #deded6;border-radius:8px;background:#fbfbf8;padding:8px}
.m-overlap-head{display:flex;align-items:center;justify-content:space-between;font-size:9px;color:var(--faint);margin-bottom:6px}
.m-overlap-head b{color:var(--amber);font-size:9px}
.m-overlap-lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.m-overlap-lane{min-width:0;text-align:left;border:0;border-left:2px solid var(--bar);border-radius:4px;background:var(--bg);padding:5px 4px;font-size:8.5px;line-height:1.35;color:var(--ink)}
.m-overlap-lane b{display:block;font-size:9px;font-weight:600;white-space:normal;overflow-wrap:anywhere}
.m-overlap-lane small{display:block;color:var(--muted);font-size:8px;margin-top:2px}
.m-overlap-note{font-size:8px;color:var(--faint);margin-top:5px}
.m-series-card{margin:8px 0 10px;padding:8px;border:1px solid #deded6;border-left:3px solid var(--work);border-radius:7px;background:#fff}
.m-series-head{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:600}
.m-series-sub{font-size:8.5px;color:var(--muted);margin-top:3px}
.m-block.is-series{outline:1px dashed var(--work);outline-offset:1px}
.series-badge{display:inline-block;font-size:7px;line-height:12px;padding:0 3px;border-radius:2px;background:#e9edf0;color:var(--work);margin-left:3px;vertical-align:1px}
.m-deadline-marker{position:relative;flex:1;display:flex;align-items:center;gap:5px;min-height:22px;color:var(--amber);font-size:8.5px;border-top:1px dashed #d8b77b;margin-top:5px}
.m-deadline-marker i{width:5px;height:5px;border-radius:50%;background:var(--amber)}
.m-deadline-marker span{background:#fff;padding:0 4px}
.m-deadline-marker.is-strong{font-weight:600;border-top-width:1.5px}
.m-deadline-note{font-size:8px;color:var(--faint);padding:2px 0 4px 38px}
.m-deadline-focus{position:relative;flex:1;display:flex;gap:8px;align-items:flex-start;padding:6px 0 8px;border-top:1.5px dashed #d8b77b;color:var(--amber);margin-top:4px}
.m-deadline-focus i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px #f3e5c8;margin-top:2px;flex:none}
.m-deadline-focus b{display:block;font-size:9.5px;line-height:1.4}
.m-deadline-focus span{display:block;font-size:8px;color:var(--muted);margin-top:1px}
.dl-marker.is-focus{border-top:1.5px dashed var(--amber)}
.dl-marker.is-focus .dl-dot{width:9px;height:9px;box-shadow:0 0 0 4px #f3e5c8}

.set-modal-scrim{position:absolute;inset:0;z-index:83;background:rgba(25,25,24,.26);display:grid;place-items:center}
.set-modal{width:430px;max-height:calc(100% - 60px);overflow:auto;background:#fff;border-radius:10px;box-shadow:0 26px 80px rgba(20,20,18,.26)}

.m-app .set-modal-scrim{align-items:flex-end;padding:0 10px 10px}

.set-modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:11px 15px;border-top:1px solid var(--hair);background:#fbfbf8}

function mins(t){if(!t)return 0;const a=t.split(':').map(Number);return a[0]*60+a[1];}
function fmt(m){m=Math.max(0,Math.min(1439,Math.round(m)));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function addDays(iso,n){const [y,m,d]=iso.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d+n));return dt.toISOString().slice(0,10);}
function weekday(iso){const [y,m,d]=iso.split('-').map(Number);return ['周日','周一','周二','周三','周四','周五','周六'][new Date(Date.UTC(y,m-1,d)).getUTCDay()];}
function md(iso){const [,m,d]=iso.split('-').map(Number);return m+' 月 '+d+' 日';}
function mdShort(iso){const [,m,d]=iso.split('-').map(Number);return m+'/'+d;}
function dayNum(iso){return Number(iso.split('-')[2]);}
function calOf(id){return CAL[id]||CAL.personal;}
function allTodos(){return TODOS.concat(state.localTodos).filter(t=>!state.deletedTodos.includes(t.id));}
function todoById(id){return allTodos().find(t=>t.id===id);}
function eventById(id){return EVENTS.find(e=>e.id===id&&!state.deletedEvents.includes(e.id));}
function detailSource(ref){if(!ref)return null;return ref.type==='event'?eventById(ref.id):todoById(ref.id);}
function draftFor(ref){
  const src=detailSource(ref);
  if(!src)return null;
  const key=ref.type+':'+ref.id;
  if(!state.draft||state.draftKey!==key){
    state.draft=JSON.parse(JSON.stringify(src));
    state.draftKey=key;
  }
  return state.draft;
}
function clearDraft(){state.draft=null;state.draftKey=null;}
function draftRef(){
  if(!state.draftKey)return null;
  const i=state.draftKey.indexOf(':');
  return {type:state.draftKey.slice(0,i),id:state.draftKey.slice(i+1)};
}
function activeEditRef(){return state.drawer||draftRef()||activeDetailRef();}
function commitDraft(){
  const ref=activeEditRef();
  if(!ref||!state.draft||state.draftKey!==ref.type+':'+ref.id)return false;
  const target=detailSource(ref);
  if(!target)return false;

}
function restorePlan(){

function planMeta(t,base){
  if(!t.plan)return '';
  const time=fmt(mins(t.plan.start))+'–'+fmt(mins(t.plan.end));
  return (base&&t.plan.date===base?'':mdShort(t.plan.date)+' ')+time;
}
function planDeadline(t){
  if(!t)return '';
  let out='';
  if(t.due)out+=` · <span class="due-pill ${isOverdue(t)?'is-red':''}">${isOverdue(t)?'已逾期 · ':''}截止 ${dueText(t)}</span>`;

}
function pickTodoId(pref){const t=todoById(pref)||allTodos().find(x=>!isDone(x))||allTodos()[0];return t?t.id:'';}
function pickEventId(pref){const e=eventById(pref)||EVENTS.find(x=>!state.deletedEvents.includes(x.id));return e?e.id:'';}
function isDone(t){return t.status==='done'||state.done?.has?.(t.id);}
function isOverdue(t){return !isDone(t)&&t.due&&t.due<TODAY;}
function hasPlanToday(t){return t.plan&&t.plan.date===TODAY;}
function hasPlanOn(t,day){return t.plan&&t.plan.date===day;}
function noDateTodos(){return allTodos().filter(t=>!isDone(t)&&!t.plan&&!t.due&&!isOverdue(t)&&!t.missed).sort((a,b)=>Number(b.id.startsWith('local-'))-Number(a.id.startsWith('local-')));}
function isMultiDay(e){return e.startDate&&e.endDate&&e.startDate!==e.endDate;}
function calHidden(id){return (state.hiddenCals||[]).includes(id);}
function calIdByName(n){return Object.keys(CAL).find(k=>CAL[k].name===n)||'personal';}
function calCount(id){return EVENTS.filter(e=>e.cal===id&&!state.deletedEvents.includes(e.id)).length+allTodos().filter(t=>t.cal===id).length;}
function calIds(){return Object.keys(CAL).filter(id=>!state.deletedCals.includes(id));}
function hiddenCalCount(){return EVENTS.filter(e=>!state.deletedEvents.includes(e.id)&&calHidden(e.cal)).length+allTodos().filter(t=>calHidden(t.cal)).length;}
function hiddenCalNames(){return (state.hiddenCals||[]).map(id=>'「'+calOf(id).name+'」').join('');}
function eventsOn(day){
  return EVENTS.filter(e=>!state.deletedEvents.includes(e.id)).filter(e=>!calHidden(e.cal)).filter(e=>{
    if(e.date===day)return true;
    if(e.startDate&&e.endDate)return day>=e.startDate&&day<=e.endDate;
    return false;
  });
}
function allDayOn(day){return eventsOn(day).filter(e=>e.allDay||isMultiDay(e));}
function timedEventsOn(day){return eventsOn(day).filter(e=>!e.allDay&&!isMultiDay(e));}
function plansOn(day){return allTodos().filter(t=>!isDone(t)&&!calHidden(t.cal)&&t.plan&&t.plan.date===day).map(t=>({todo:t,start:mins(t.plan.start),end:mins(t.plan.end)}));}
function deadlinesOn(day){return allTodos().filter(t=>!isDone(t)&&!calHidden(t.cal)&&t.due===day);}
function timedDeadlinesOn(day){return deadlinesOn(day).filter(t=>t.dueTime);}
function dateDeadlinesOn(day){return deadlinesOn(day).filter(t=>!t.dueTime);}
function packBlocks(items){
  const sorted=items.slice().sort((a,b)=>a.start-b.start||a.end-b.end);
  const out=[];let cluster=[];let clusterEnd=-1;
  function flush(){
    if(!cluster.length)return;
    const laneEnds=[];
    cluster.forEach(it=>{
      let lane=laneEnds.findIndex(end=>end<=it.start);
      if(lane<0){lane=laneEnds.length;laneEnds.push(it.end);}else{laneEnds[lane]=it.end;}
      it.lane=lane;
    });
    cluster.forEach(it=>it.lanes=laneEnds.length);
    out.push(...cluster);cluster=[];clusterEnd=-1;
  }
  sorted.forEach(it=>{
    if(cluster.length&&it.start>=clusterEnd)flush();
    cluster.push(it);clusterEnd=Math.max(clusterEnd,it.end);
  });
  flush();
  return out;
}
function timeBlocks(day){
  const items=[];
  timedEventsOn(day).forEach(e=>items.push({kind:'event',id:e.id,title:e.title,cal:e.cal,start:mins(e.start),end:mins(e.end),loc:e.loc,live:e.live,repeat:e.repeat,instance:e.instance}));
  plansOn(day).forEach(p=>items.push({kind:'plan',id:p.todo.id,title:p.todo.title,cal:p.todo.cal,start:p.start,end:p.end,todo:p.todo}));
  return packBlocks(items);
}
function pct(m){return Math.max(0,Math.min(100,(m-480)/720*100));}
function dueText(t){if(!t.due)return '';return t.dueTime?mdShort(t.due)+' '+t.dueTime:mdShort(t.due);}

}

function todayTaskSections(){
  const all=allTodos().filter(t=>!isDone(t));

  const hideMissed=state.variant==='missed';
  let overdue=all.filter(t=>!hasPlanToday(t)&&(isOverdue(t)||t.missed)&&!(hideMissed&&t.missed));
  if(state.variant==='overdue')overdue=overdue.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
  const due=all.filter(t=>!hasPlanToday(t)&&t.due===TODAY);
  const plannedDue=all.filter(t=>hasPlanToday(t)&&t.due===TODAY);
  const plannedOverdue=all.filter(t=>hasPlanToday(t)&&(isOverdue(t)||t.missed));
  const unplanned=noDateTodos();
  const done=allTodos().filter(t=>isDone(t));
  let out='';

  if(plannedOverdue.length)plannedBits.push(`${plannedOverdue.length} 项已逾期 / 已遗漏`);

  if(plannedBits.length)out+=`<div class="state-note" style="margin:2px 0 8px">另有 ${plannedBits.join('、')}，显示在右侧时间区。</div>`;

  }

function todayTimeSections(){

function inboxList(){
  if(state.variant==='empty')return emptyState('未安排是空的','从今天或这里捕获的待办会先落到这里。');
  if(state.inboxNoDate){
    const rows=noDateTodos();
    return groupHead('无日期',rows.length)+(rows.map(t=>todoRow(t)).join('')||emptyState('没有无日期的待办','所有未安排项都带截止日期。'));
  }
  const rows=allTodos().filter(t=>!t.plan&&!isDone(t));
  const withDue=rows.filter(t=>t.due);
  const noDue=rows.filter(t=>!t.due);
  let out='';
  if(withDue.length)out+=groupHead('带截止 · 未安排',withDue.length)+withDue.map(t=>todoRow(t)).join('');
  if(noDue.length)out+=groupHead('无截止',noDue.length)+noDue.map(t=>todoRow(t)).join('');
  return out||emptyState('未安排是空的','从今天或这里捕获的待办会先落到这里。');
}
function allList(){
  const rows=allTodos().filter(t=>!isDone(t));
  const dueToday=rows.filter(t=>t.due===TODAY);
  const past=rows.filter(t=>t.due&&t.due<TODAY);
  const missed=rows.filter(t=>!t.due&&t.missed);
  const later=rows.filter(t=>t.due&&t.due>TODAY);
  const noDue=rows.filter(t=>!t.due&&!t.missed);
  const done=allTodos().filter(t=>isDone(t));
  if(!rows.length&&!done.length)return emptyState('这里还没有待办','从捕获条记一件事，它会先进未安排。');
  let out='';
  if(dueToday.length)out+=groupHead('今天截止',dueToday.length)+dueToday.map(t=>todoRow(t,{planBase:TODAY})).join('');
  const overdue=[...past,...missed];
  if(overdue.length)out+=groupHead('已逾期 / 已遗漏',overdue.length,{red:true})+overdue.map(t=>todoRow(t)).join('');
  if(later.length)out+=groupHead('之后',later.length)+later.map(t=>todoRow(t)).join('');
  if(noDue.length)out+=groupHead('无截止',noDue.length)+noDue.map(t=>todoRow(t,{planBase:TODAY})).join('');
  out+=`<button type="button" class="group-head completed-group" data-action="toggle-completed" aria-expanded="${state.completedOpen||state.variant==='completed'}"><span>已完成</span><span class="count">${done.length}</span><span class="chev">${ico('chevron-right',11)}</span></button>`;
  if(state.completedOpen||state.variant==='completed')out+=done.map(t=>todoRow(t,{planBase:TODAY})).join('');
  return out;
}

function weekStart(day){const dt=new Date(day+'T00:00:00');const dow=(dt.getDay()+6)%7;return addDays(day,-dow);}
function shiftMonth(day,delta){const dt=new Date(day+'T00:00:00');dt.setDate(1);dt.setMonth(dt.getMonth()+delta);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-01';}

function weekAllDay(days){
  const chips=[];
  EVENTS.filter(e=>!state.deletedEvents.includes(e.id)&&!calHidden(e.cal)&&(e.allDay||isMultiDay(e))).forEach(e=>{
    const start=e.date||e.startDate;
    const end=e.date||e.endDate;
    const from=Math.max(0,days.indexOf(start));
    const to=Math.min(6,days.indexOf(end));
    if(days.indexOf(start)<0&&days.indexOf(end)<0)return;
    if(to<from)return;
    const c=calOf(e.cal);
    chips.push(`<button type="button" class="allday-chip" data-action="open-event" data-id="${e.id}" style="grid-column:${from+1} / span ${to-from+1};--ev-bg:${c.bg};--ev-ink:${c.ink};--ev-bar:${c.color}"><span>${esc(e.title)}${state.variant==='allday'&&isMultiDay(e)?' · '+mdShort(e.startDate)+'–'+mdShort(e.endDate):''}</span></button>`);
  });
  return `<div class="allday-row"><div class="axis-label">全天</div><div class="allday-grid">${chips.join('')}</div></div>`;
}

    ${state.variant==='slot'&&day==='2026-11-21'?`<button type="button" class="slot-ghost" style="top:${pct(600)}%;height:${pct(660)-pct(600)}%" data-action="open-slot">＋ 新建日程 <span>10:00–11:00</span></button>`:''}
    ${blocks.map(b=>calBlock(b)).join('')}

function calBlock(b){
  const c=calOf(b.cal);
  const isPlan=b.kind==='plan';
  const isSeries=state.variant==='recurring'&&b.repeat;
  const h=pct(b.end)-pct(b.start);
  const short=h<6;
  const planDue=isPlan&&b.todo&&b.todo.due?` · <span style="color:${isOverdue(b.todo)?'var(--red)':'var(--amber)'}">截止 ${dueText(b.todo)}</span>`:'';
  const planMissed=isPlan&&b.todo&&b.todo.missed?` · <span class="missed">已遗漏 ${b.todo.missed}</span>`:'';
  return `<button type="button" class="cal-block ${isPlan?'is-plan':''} ${short?'is-short':''} ${isSeries?'is-series':''}" data-action="${isPlan?'open-todo':'open-event'}" data-id="${b.id}" style="top:${pct(b.start)}%;height:${Math.max(2.4,h)}%;left:${b.lane/b.lanes*100}%;width:${100/b.lanes}%;${isPlan?`--bar:${c.color}`:`--bar:${c.color};--bg:${c.bg}`}">
    <span class="cb-title">${esc(b.title)}${isSeries?'<span class="series-badge">系列</span>':b.repeat?' <span class="repeat-badge">'+ico('repeat',8)+'</span>':''}</span><span class="cb-meta">${isPlan?'计划 · ':''}${fmt(b.start)}–${fmt(b.end)}${planDue}${planMissed}</span>
    ${isPlan&&(isOverdue(b.todo)||b.todo.missed)?'<span class="overdue-dot" aria-label="已逾期"></span>':''}
  </button>`;
}
function monthView(){
  const sel=state.selectedDate||TODAY;
  const first=sel.slice(0,7)+'-01';
  const start=weekStart(first);
  const cells=[];
  for(let i=0;i<42;i++)cells.push(monthCell(addDays(start,i),first));
  const isCurrentMonth=first.slice(0,7)===TODAY.slice(0,7);
  return `<div class="month">${state.variant==='recurring'&&isCurrentMonth?seriesContext(TODAY):''}${state.variant==='allday'?monthSpanBand(first.slice(0,7)):''}<div class="month-week">${['周一','周二','周三','周四','周五','周六','周日'].map(d=>`<span>${d}</span>`).join('')}</div><div class="month-grid">${cells.join('')}</div></div>`;
}
function monthItems(day){
  const items=[];
  eventsOn(day).forEach(e=>items.push({type:'event',id:e.id,title:e.title,cal:e.cal,allDay:e.allDay||isMultiDay(e),time:e.start||'',repeat:e.repeat}));
  plansOn(day).forEach(p=>items.push({type:'plan',id:p.todo.id,title:p.todo.title,cal:p.todo.cal,allDay:false,time:p.todo.plan.start,red:isOverdue(p.todo),missed:p.todo.missed}));
  deadlinesOn(day).forEach(t=>items.push({type:'deadline',id:t.id,title:t.title,cal:t.cal,allDay:!t.dueTime,time:t.dueTime||'',red:isOverdue(t)}));
  return items.sort((a,b)=>(b.allDay?1:0)-(a.allDay?1:0)||(a.time||'').localeCompare(b.time||''));
}
function monthCell(day,firstMonth){
  const items=monthItems(day);
  const out=day.slice(0,7)!==firstMonth.slice(0,7);
  const limit=state.variant==='overflow'?3:2;
  return `<button type="button" class="mcell ${out?'is-out':''}" data-action="cal-day" data-date="${day}">
    <span class="mnum ${day===TODAY?'is-today':''}">${dayNum(day)}</span>
    ${items.slice(0,limit).map(it=>monthChip(it)).join('')}
    ${items.length>limit?`<span class="mmore">+${items.length-limit}</span>`:''}
  </button>`;
}
function monthChip(it){
  const c=calOf(it.cal);
  if(it.type==='deadline')return `<span class="mchip is-dl ${it.red?'is-red':''}"><i></i><span>截止 ${it.time?esc(it.time)+' ':''}${esc(it.title)}</span></span>`;
  return `<span class="mchip ${it.type==='plan'?'is-plan':''} ${it.red?'is-red':''}"><i style="background:${c.color}"></i><span>${esc(it.title)}${it.missed?' · 已遗漏 '+it.missed:''}${it.repeat?' ↻':''}</span></span>`;
}
function dayView(){
  const day=state.selectedDate||TODAY;
  const allDay=allDayOn(day);
  const dls=dateDeadlinesOn(day);
  const series=state.variant==='recurring'?timeBlocks(day).find(b=>b.repeat):null;
  return `<div class="day-view">
    <div class="day-headbar"><span><b>${weekday(day)}</b> · ${md(day)}</span><span>${timeBlocks(day).length} 项时间安排</span></div>
    ${series?seriesStrip(series):''}
    <div class="day-allday"><div class="axis-label">全天</div><div class="allday-grid"><div class="allday-cell">${allDay.map(e=>{const c=calOf(e.cal);return `<button type="button" class="allday-chip" data-action="open-event" data-id="${e.id}" style="--ev-bg:${c.bg};--ev-ink:${c.ink};--ev-bar:${c.color}"><span>${esc(e.title)}${state.variant==='allday'&&isMultiDay(e)?' · '+mdShort(e.startDate)+'–'+mdShort(e.endDate):''}</span></button>`;}).join('')}</div></div></div>
    ${state.variant==='allday'?monthSpanBand():''}
    <div class="day-deadline"><div class="axis-label">截止</div><div class="deadline-grid"><div class="deadline-cell">${dls.map(t=>`<button type="button" class="dl-chip ${isOverdue(t)?'is-red':''}" data-action="open-todo" data-id="${t.id}">${esc(t.title)}</button>`).join('')}</div></div></div>
    <div class="day-body"><div class="time-axis">${hourLabels()}</div><div class="day-col ${state.variant==='slot'?'is-slot':''}" data-action="cal-day" data-date="${day}">
      ${state.variant==='overlap'?`<div class="overlap-zone" style="top:${pct(915)}%;height:${pct(1020)-pct(915)}%"><span>3 项重叠</span></div>`:''}
      ${state.variant==='slot'?`<button type="button" class="slot-ghost" style="top:${pct(660)}%;height:${pct(720)-pct(660)}%" data-action="open-slot">＋ 新建日程 <span>11:00–12:00</span></button>`:''}
      ${timeBlocks(day).map(b=>calBlock(b)).join('')}
      ${timedDeadlinesOn(day).map(t=>`<div class="dl-marker ${isOverdue(t)?'is-red':''} ${state.variant==='deadline'?'is-focus':''}" style="top:${pct(mins(t.dueTime))}%"><span class="dl-dot"></span><span class="dl-label">${t.dueTime} 截止 · ${esc(t.title)}${state.variant==='deadline'?' · 不占时间':''}</span></div>`).join('')}
      ${day===TODAY?`<div class="now-line-cal" style="top:${pct(NOW)}%"><span class="nd"></span></div>`:''}
    </div></div>
  </div>`;
}

/* ---------------- detail ---------------- */
function durationText(item){
  if(item.allDay)return '全天';
  if(item.startDate&&item.endDate){const days=Math.round((new Date(item.endDate+'T00:00:00')-new Date(item.startDate+'T00:00:00'))/86400000)+1;return days+' 天';}
  if(item.start&&item.end){const d=mins(item.end)-mins(item.start);if(d>=60)return Math.floor(d/60)+' 小时'+(d%60?' '+d%60+' 分钟':'');return d+' 分钟';}
  return '—';
}
function todoStatusLine(t){
  if(t.repeat)return `当前实例 ${md(TODAY)}${t.missed?` · 已遗漏 ${t.missed} 次`:''}`;
  if(isDone(t))return '已完成';
  if(isOverdue(t))return '已逾期';
  if(t.due===TODAY)return '今天截止';
  if(t.due)return '截止 '+md(t.due);
  return '无日期';
}
function deleteCopy(item,isEvent){
  return item.repeat?`这是重复${isEvent?'日程':'任务'}，会删除整个系列并进回收站。`:'会进回收站，可以恢复。';
}
function priorityChips(item,interactive=false){
  return ['无','低','中','高'].map((p,i)=>{
    const value=i===0?0:i===1?9:i===2?5:1;
    const on=(item.priority===0&&i===0)||(item.priority===9&&i===1)||(item.priority===5&&i===2)||(item.priority===1&&i===3);
    return interactive?`<button type="button" class="f-chip ${on?'is-on':''}" data-action="set-priority" data-id="${item.id}" data-value="${value}">${p}</button>`:`<span class="f-chip ${on?'is-on':''}">${p}</span>`;
  }).join('');
}
function planDuration(start,end){
  const d=mins(end)-mins(start);
  if(!(d>0))return '—';
  if(d>=60)return Math.floor(d/60)+' 小时'+(d%60?' '+d%60+' 分钟':'');
  return d+' 分钟';
}
function planContextText(date,start,end,overlap=false){
  const blocks=timeBlocks(date).filter(b=>b.id!==state.planTodoId);
  const s=mins(start),e=mins(end);
  const hits=blocks.filter(b=>b.start<e&&b.end>s);
  if(overlap&&hits.length)return `<b style="color:var(--amber)">${start}–${end} 有 ${hits.length} 项重叠</b><br>${hits.map(b=>`${fmt(b.start)} ${esc(b.title)}`).join(' · ')}<br>允许重叠；不会把截止当成占用。`;
  if(!blocks.length)return '<b>当天还没有安排</b><br>允许重叠；不会把截止当成占用。';
  return `<b>当天已有</b><br>${blocks.slice(0,3).map(b=>`${fmt(b.start)} ${esc(b.title)}`).join(' · ')}<br>允许重叠；不会把截止当成占用。`;
}
function repeatOptions(current){return [...new Set(['',current||'','每天','每周五','每月'])].filter((v,i,a)=>a.indexOf(v)===i);}
function repeatSummary(item){
  if(!item||!item.repeat)return '不重复';
  const end=item.repeatEnd||'永不结束';
  if(end==='在日期')return `${item.repeat} · 至 ${mdShort(item.repeatUntil||TODAY)}`;
  if(end==='在次数')return `${item.repeat} · ${item.repeatCount||10} 次`;
  return item.repeat;
}
function repeatEndOptions(current){return ['永不结束','在日期','在次数'].map(v=>`<option value="${v}" ${(current||'永不结束')===v?'selected':''}>${v}</option>`).join('');}
function repeatDesktop(item){
  const end=item.repeatEnd||'永不结束';
  return `<div class="form-row full"><label class="form-label">重复</label><select class="form-select" data-mfield="repeat">${repeatOptions(item.repeat).map(r=>`<option value="${esc(r)}" ${item.repeat===r?'selected':''}>${r?esc(r):'不重复'}</option>`).join('')}</select></div>
  ${item.repeat?`<div class="form-row"><label class="form-label">结束</label><select class="form-select" data-mfield="repeatEnd">${repeatEndOptions(end)}</select></div>
  ${end==='在日期'?`<div class="form-row"><label class="form-label">结束日期</label><input type="date" class="form-input" data-mfield="repeatUntil" value="${item.repeatUntil||TODAY}"></div>`:''}
  ${end==='在次数'?`<div class="form-row"><label class="form-label">次数</label><input type="number" min="1" class="form-input" data-mfield="repeatCount" value="${item.repeatCount||10}"></div>`:''}
  <div class="state-note form-row full">修改频率或结束会应用到整个系列。</div>`:''}`;
}
function repeatMobile(item){
  const end=item.repeatEnd||'永不结束';
  return `<div class="m-form-row"><span class="m-form-label">重复</span><select class="m-form-input" data-mfield="repeat">${repeatOptions(item.repeat).map(r=>`<option value="${esc(r)}" ${item.repeat===r?'selected':''}>${r?esc(r):'不重复'}</option>`).join('')}</select></div>
  ${item.repeat?`<div class="m-form-row"><span class="m-form-label">结束</span><select class="m-form-input" data-mfield="repeatEnd">${repeatEndOptions(end)}</select></div>
  ${end==='在日期'?`<div class="m-form-row"><span class="m-form-label">结束日期</span><input type="date" class="m-form-input" data-mfield="repeatUntil" value="${item.repeatUntil||TODAY}"></div>`:''}
  ${end==='在次数'?`<div class="m-form-row"><span class="m-form-label">次数</span><input type="number" min="1" class="m-form-input" data-mfield="repeatCount" value="${item.repeatCount||10}"></div>`:''}
  <div class="state-note">修改规则会应用到整个系列。</div>`:''}`;
}
function remindOptions(current){return [...new Set(['不提醒',current||'不提醒','15 分钟前','1 小时前','1 天前'])].filter((v,i,a)=>a.indexOf(v)===i);}
function calOptions(current){return calIds().map(id=>`<option value="${id}" ${current===id?'selected':''}>${calOf(id).name}</option>`).join('');}

          <div class="field-row"><span class="f-label">全天</span><span class="f-value">${item.allDay?'是':'否'}</span></div>
          <div class="field-row"><span class="f-label">日历</span><span class="f-value"><span class="cal-dot" style="background:${c.color}"></span>${c.name}</span></div>
