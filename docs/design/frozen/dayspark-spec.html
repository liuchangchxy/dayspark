          <div class="field-row"><span class="f-label">提醒</span><span class="f-value">${item.remind?esc(item.remind):'不提醒'}</span></div>
        </div>
        <div class="d-sec"><div class="d-sec-head"><span>标签</span><button type="button" data-action="noop">添加</button></div><div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap"><span class="tag"><i style="background:${c.color}"></i>${c.name}</span></div></div>
        <div class="d-sec"><div class="d-sec-head"><span>备注</span></div><div class="d-note">${item.note?esc(item.note):'—'}</div></div>
      </div>

      ${state.confirmDelete||state.variant==='delete'?`<div class="confirm-scrim"><div class="confirm-modal" role="dialog" aria-modal="true" aria-label="确认删除"><h3>删除「${esc(item.title)}」？</h3><p>${deleteCopy(item,true)}</p><div class="cf-actions"><button type="button" data-action="cancel-delete">取消</button><button type="button" class="cf-danger" data-action="confirm-delete">删除</button></div></div></div>`:''}

  </aside>`;
}

/* ---------------- capture ---------------- */
function detailEditor(ref,inline=false){
  const isEvent=ref.type==='event';
  const src=detailSource(ref);
  if(!src)return `<aside class="drawer ${inline?'inline':'overlay'}"><header class="drawer-head"><span class="drawer-kind">${isEvent?'日程':'待办'} · 编辑</span><button type="button" class="drawer-close" data-action="close-drawer" aria-label="关闭">${ico('x',13)}</button></header><div class="drawer-body"><div class="empty-state"><div class="empty-title">这一项已在回收站</div><div class="empty-sub">可以从设置 · 回收站恢复，或换一项查看。</div></div></div></aside>`;
  const item=draftFor(ref);
  if(!item)return '';
  const c=calOf(item.cal);
  const v=state.variant;
  const done=!isEvent&&isDone(item);
  const title=isEvent?item.title:item.title;
  const titleError=v==='validation'&&!isEvent;
  const timeError=v==='validation'&&isEvent;
  const fields=isEvent?`
    <div class="form-grid">
      ${item.startDate&&item.endDate?`<div class="form-row"><label class="form-label">开始日期</label><input type="date" class="form-input" data-mfield="startDate" value="${item.startDate}"></div><div class="form-row"><label class="form-label">结束日期</label><input type="date" class="form-input" data-mfield="endDate" value="${item.endDate}"></div><div class="form-row full"><label class="form-label">时间</label><input class="form-input" value="跨天 · 全天" disabled></div>`:`<div class="form-row"><label class="form-label">日期</label><input type="date" class="form-input" data-mfield="date" value="${item.date||TODAY}"></div><div class="form-row"><label class="form-label">全天</label><select class="form-select" data-mfield="allDay"><option value="0" ${!item.allDay?'selected':''}>否</option><option value="1" ${item.allDay?'selected':''}>是</option></select></div><div class="form-row"><label class="form-label">开始</label><input type="time" class="form-input" data-mfield="start" value="${item.start||''}" ${item.allDay?'disabled':''}></div><div class="form-row"><label class="form-label">结束</label><input type="time" class="form-input" data-mfield="end" value="${item.end||''}" ${item.allDay?'disabled':''}></div>`}
      ${timeError?'<div class="form-error form-row full">结束时间必须晚于开始时间。</div>':''}
      <div class="form-row"><label class="form-label">日历</label><select class="form-select" data-mfield="cal">${calOptions(item.cal)}</select></div>
      <div class="form-row"><label class="form-label">地点</label><input class="form-input" data-mfield="loc" value="${esc(item.loc||'')}" placeholder="添加地点"></div>
      ${repeatDesktop(item)}
      <div class="form-row"><label class="form-label">提醒</label><select class="form-select" data-mfield="remind">${remindOptions(item.remind).map(r=>`<option value="${r}" ${(item.remind||'不提醒')===r?'selected':''}>${r}</option>`).join('')}</select></div>
    </div>`:`
    <div class="form-grid">
      <div class="form-row"><label class="form-label">截止日期</label><input type="date" class="form-input" data-mfield="due" value="${item.due||''}"></div>
      <div class="form-row"><label class="form-label">截止时间</label><input type="time" class="form-input" data-mfield="dueTime" value="${item.dueTime||''}"></div>
      <div class="form-row full"><label class="form-label">计划执行</label><button type="button" class="form-input" data-action="plan-todo" data-id="${item.id}" style="text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px">${item.plan?md(item.plan.date)+' '+fmt(mins(item.plan.start))+'–'+fmt(mins(item.plan.end)):'未安排'}${ico('chevron-right',11)}</button></div>
      ${repeatDesktop(item)}
      <div class="form-row"><label class="form-label">提醒</label><select class="form-select" data-mfield="remind">${remindOptions(item.remind).map(r=>`<option value="${r}" ${(item.remind||'不提醒')===r?'selected':''}>${r}</option>`).join('')}</select></div>
      <div class="form-row full"><label class="form-label">日历</label><select class="form-select" data-mfield="cal">${calOptions(item.cal)}</select></div>
    </div>`;
  return `<aside class="drawer ${inline?'inline':'overlay'}" role="dialog" aria-label="${isEvent?'日程':'待办'}编辑">
    <header class="drawer-head"><span class="drawer-kind">${isEvent?'日程':'待办'} · 编辑</span><button type="button" class="drawer-close" data-action="close-drawer" aria-label="关闭">${ico('x',13)}</button></header>
    <div class="drawer-body">
      <div class="d-eyebrow"><span class="cal-dot" style="background:${c.color}"></span>${c.name}${done?' · 已完成':''}</div>

      <label class="form-label" for="detail-title">标题</label>
      <input class="form-input" id="detail-title" data-mfield="title" value="${esc(title)}" style="font-size:17px;font-weight:600;margin-top:4px" aria-invalid="${titleError}">
      ${titleError?'<div class="form-error" style="margin-top:4px">标题不能为空。</div>':''}
      ${!isEvent?`<button type="button" class="d-complete" data-action="toggle-done" data-id="${item.id}"><span class="check ${done?'is-on':''}">${done?ico('check',9):''}</span>${done?'本次已完成':item.repeat?'完成这一次':'标记完成'}</button>`:''}
      ${!isEvent&&item.repeat&&item.missed&&!done?`<div class="state-note" style="margin:2px 0 8px">当前实例 ${md(TODAY)} · 已遗漏 ${item.missed} 次。</div>`:''}

      ${!isEvent?`<div class="d-sec"><div class="d-sec-head"><span>优先级</span></div><div class="filter-chip-row" style="margin-top:6px">${priorityChips(item,true)}</div></div>`:''}

      <div class="d-sec"><div class="d-sec-head"><span>备注</span></div><textarea class="form-textarea" data-mfield="note" style="margin-top:7px">${esc(item.note||'')}</textarea></div>
      ${!isEvent?`<div class="d-sec"><div class="d-sec-head"><span>子任务 ${(item.subtasks||[]).filter(s=>s.done).length}/${(item.subtasks||[]).length}</span><button type="button" data-action="noop">添加</button></div>${(item.subtasks||[]).map(s=>`<div class="subtask ${s.done?'is-done':''}"><span class="check ${s.done?'is-on':''}">${s.done?ico('check',7):''}</span><span>${esc(s.title)}</span></div>`).join('')||'<div class="subtask">还没有子任务</div>'}</div>`:''}
      <div class="d-sec"><div class="d-sec-head"><span>附件</span><button type="button" data-action="noop">上传</button></div><div class="attach">${ico('folder',13)} ${item.attach?esc(item.attach):'没有附件'}</div></div>
    </div>
    <div class="d-foot"><button type="button" class="d-act primary" data-action="${v==='save-error'?'retry-save':'save-detail'}">${v==='save-error'?'重试保存':'保存'}</button><button type="button" class="d-act" data-action="close-drawer">取消</button><button type="button" class="d-act danger" data-action="delete">删除到回收站</button></div>
    ${state.confirmDelete||state.variant==='delete'?`<div class="confirm-scrim"><div class="confirm-modal" role="dialog" aria-modal="true" aria-label="确认删除"><h3>删除「${esc(title)}」？</h3><p>${deleteCopy(item,isEvent)}</p><div class="cf-actions"><button type="button" data-action="cancel-delete">取消</button><button type="button" class="cf-danger" data-action="confirm-delete">删除到回收站</button></div></div></div>`:''}
  </aside>`;
}
/* 新建：整页表单，与详情编辑器同一套字段行和同一套校验。
   入口（捕获“创建”、日历时间槽、Cmd+K、小组件深链）都落到这里，
   所以标题、默认日历和“保存前可见”的规则只写一次。 */
function newItemPage(isEvent){
  // 这是 Capture 的「整页宿主」：字段、类型、默认值与浮动捕获完全同一套，
  // 只是当它由深链（小组件、Cmd+K 动作）打开时占满一页，而不是浮在页面上。
  // 它不引入第二套创建模型，也不带详情编辑器才有的标签/子任务/附件。
  const v=state.variant;
  const expanded=v==='template';
  const titleError=v==='validation';
  const saving=v==='save-error';
  const title=expanded?(isEvent?'和设计团队评审方案':'交季度总结'):'';
  const cal=isEvent?'work':(state.defaultCal||'personal');
  const allDay=isEvent&&v==='allday';
  const facts=isEvent
    ? `<span class="new-fact"><i class="cal-dot" style="background:${calOf(cal).color}"></i>${calOf(cal).name}</span><span class="new-fact">${ico('clock',10)} ${allDay?'全天 · 11/20':'11/20 11:00–12:00'}</span><span class="new-fact">${ico('bell',10)} 15 分钟前</span>`
    : `<span class="new-fact is-empty">无日期</span><span class="new-fact"><i class="cal-dot" style="background:${calOf(cal).color}"></i>${calOf(cal).name}</span><span class="new-fact is-empty">无截止</span>`;
  const fields=isEvent?`
      <div class="cp-field"><span class="k">时间</span><span class="v">${allDay?'全天':(expanded?'11/21 10:00–11:00':'11/20 11:00–12:00')}</span></div>
      <div class="cp-field"><span class="k">全天</span><span class="v">${allDay?'是':'否'}</span></div>
      <div class="cp-field"><span class="k">日历</span><span class="v">${calOf(cal).name}</span></div>
      <div class="cp-field"><span class="k">地点</span><span class="v">${expanded?'会议室 B':'未填写'}</span></div>
      <div class="cp-field"><span class="k">重复</span><span class="v">不重复</span></div>
      <div class="cp-field"><span class="k">提醒</span><span class="v">15 分钟前</span></div>`:`
      <div class="cp-field"><span class="k">截止</span><span class="v ${expanded?'is-due':''}">${expanded?ico('flag',11)+' 11/21 18:00':'无截止'}</span></div>
      <div class="cp-field"><span class="k">计划执行</span><span class="v ${expanded?'is-plan':''}">${expanded?ico('clock',11)+' 11/21 15:00–16:00':'未安排'}</span></div>
      <div class="cp-field"><span class="k">提醒</span><span class="v">不提醒</span></div>
      <div class="cp-field"><span class="k">日历</span><span class="v">${calOf(cal).name}${cal===(state.defaultCal||'personal')?' · 默认':''}</span></div>
      <div class="cp-field"><span class="k">优先级</span><span class="v">中</span></div>`;
  return `<div class="page new-page">
    ${pageHead({title:isEvent?'新建日程':'记一件事',sub:'Capture 的整页形态：字段和浮动捕获完全一致；不点开的字段不写入。',right:`<button type="button" class="tool" data-action="noop">取消</button><button type="button" class="tool primary" data-action="noop">${saving?'重试保存':(isEvent?'创建日程':'记下待办')}</button>`})}
    <div class="new-body"><div class="new-wrap">
      ${saving?`<div class="inline-alert is-red"><b>保存失败 · 未写入。</b> 这一页的内容还在；检查网络后重试。</div>`:''}
      ${v==='dirty'?`<div class="inline-alert"><b>还没有保存。</b><br>离开会丢弃这次输入；也可以留下继续编辑。</div>`:''}
      <div class="new-type">
        <button type="button" class="new-type-btn ${isEvent?'':'is-on'}" data-action="noop">${ico('check',10)} 待办</button>
        <button type="button" class="new-type-btn ${isEvent?'is-on':''}" data-action="noop">${ico('calendar',10)} 日程</button>
        <span class="new-type-note">${isEvent?'从时间槽进入，所以是日程。':'默认是待办；只有主动切到日程才会变。'}</span>
      </div>
      <label class="form-label" for="new-title" style="margin:12px 0 4px;display:block">标题</label>
      <input class="form-input" id="new-title" value="${esc(title)}" placeholder="${isEvent?'给这段日程起个名字':'写一个明天能看懂的动作'}" style="font-size:17px;font-weight:600;width:100%" aria-invalid="${titleError}">
      ${titleError?'<div class="form-error">标题不能为空。</div>':''}
      <div class="new-facts">${facts}</div>
      <div class="cp-fields new-fields">${fields}</div>
      <div class="new-from">${isEvent?'地点和备注可以创建后再加。':'标签、子任务、附件可以创建后再加；它们不属于捕获必填项。'}</div>
    </div></div>
    ${v==='dirty'?`<div class="confirm-scrim"><div class="confirm-modal" role="dialog" aria-modal="true" aria-label="未保存离开"><h3>离开这张表单？</h3><p>还没有创建；标题和已填内容会丢失。</p><div class="cf-actions"><button type="button" data-action="noop">留下</button><button type="button" class="cf-danger" data-action="noop">丢弃</button></div></div></div>`:''}
  </div>`;
}

function captureChoicePanel(title,sub,body,footer){
  return `<div class="capture-panel" style="width:430px;bottom:82px">
    <div class="cp-head"><div><div class="cp-title">${title}</div><div class="cp-sub">${sub}</div></div><button type="button" class="drawer-close" data-action="capture-compact" aria-label="收起">${ico('x',12)}</button></div>

    <div class="cp-foot"><div class="cp-hint">${footer||'只改这一项；其他事实保持不变。'}</div><div class="cp-actions"><button type="button" class="btn" data-action="capture-compact">取消</button><button type="button" class="btn primary" data-action="capture-expanded">应用</button></div></div>
  </div>`;
}

const AI_THREAD = [
  {role:'user', text:'把这周的周报整理成三条要点，周五 18:00 前发出去。'},
  {role:'ai', text:'1. 本周完成了 11 月版本的三处交互收敛，计划页与今天页的时间语义已统一。\n2. 待处理：导入 ICS 时第 14 行的日期格式仍会失败，需要一份容错报告。\n3. 下周三前给林总一版 Q4 提案框架，先列结构再补数据。\n\n要我把它记成一条周五截止的待办吗？', actions:true}
];
function aiEmptyState(icon,title,msg,label,action){
  return `<div class="ai-empty">${ico(icon,26)}<b>${esc(title)}</b><p>${esc(msg)}</p>${label?`<button type="button" class="mini-btn primary" data-action="${action}">${esc(label)}</button>`:''}</div>`;
}
function aiBubble(m,i,last){
  const isUser=m.role==='user';
  if(m.role==='error')return `<div class="ai-msg is-error" style="align-self:flex-start"><div class="ai-msg-head">${ico('alert',9)} 出错</div>${esc(m.text)}${last?`<div><button type="button" class="ai-retry" data-action="ai-retry">重试上一条</button></div>`:''}</div>`;
  return `<div class="ai-msg ${isUser?'is-user':''}"><div class="ai-msg-head">${isUser?'你':'AI 助手'}</div>${esc(m.text)}${(!isUser&&m.actions&&last)?`<div class="ai-actions"><button type="button" class="ai-chip" data-action="ai-insert">${ico('plus',10)}新建待办</button><button type="button" class="ai-chip" data-action="ai-insert">${ico('calendar',10)}新建日程</button><button type="button" class="ai-chip" data-action="ai-insert">${ico('clock',10)}安排时间</button><button type="button" class="ai-chip" data-action="ai-insert">${ico('list',10)}拆成子任务</button></div>`:''}</div>`;
}
function aiChatPage(){
  const v=state.variant;
  const enabled=state.aiEnabled&&v!=='disabled';
  const configured=state.aiConfigured&&v!=='empty';
  const busy=v==='sending';
  const thread=AI_THREAD.concat(v==='error'?[{role:'error',text:'没有连上模型服务：401 Unauthorized。Key 可能已失效，回复没有保存。'}]:[]);
  const lastIdx=thread.length-1;
  let body='';
  if(!enabled)body=aiEmptyState('chat','AI 助手已关闭','这是一个可选功能；打开开关并配置模型后，才会出现对话入口。','打开设置','ai-open-settings');
  else if(!configured)body=aiEmptyState('key','还没有配置模型','填一个 OpenAI 兼容的 Base URL 和 API Key；Key 只保存在本机，不会上传到 DaySpark 服务器。','配置模型','ai-open-config');
  else if(v==='ready')body=aiEmptyState('sparkles','问点什么，或让它帮你整理','可以问「今天还剩什么」「把这周的会议整理成纪要」，也可以让它把一段话拆成待办。','','');
  else body=`<div class="ai-wrap">${thread.map((m,i)=>aiBubble(m,i,i===lastIdx)).join('')}${busy?`<div class="ai-msg" style="align-self:flex-start;display:flex;align-items:center;gap:8px;color:var(--muted)"><span class="ai-spin"></span>正在回复…</div>`:''}</div>`;
  return `<div class="page ai-page">
    <header class="ai-head"><div><h1>AI 助手</h1><p>${enabled&&configured?'已连接 · 模型 gpt-4o-mini · 仅在本机保存 Key':'对话是内容页；不是搜索，也不是命令框。'}</p></div><div class="ai-head-actions">${enabled&&configured&&v!=='ready'?`<button type="button" class="tool" data-action="ai-clear">${ico('trash',12)}清空对话</button>`:''}<button type="button" class="tool" data-action="ai-open-config">${ico('sliders',12)}模型</button></div></header>
    <div class="ai-body">${body}</div>
    <div class="ai-composer"><div class="ai-composer-in"><input id="ai-input" value="${esc(state.aiInput)}" placeholder="${enabled&&configured?'问点什么，回车发送':'配置模型后才能发送'}" aria-label="输入消息" ${enabled&&configured?'':'disabled'}><button type="button" class="ai-send ${busy?'is-busy':''}" data-action="ai-send" aria-label="发送" ${enabled&&configured?'':'disabled'}>${busy?'<span class="ai-spin"></span>':ico('send',15)}</button></div></div>
    ${v==='clear'?`<div class="pk-scrim" data-action="ai-clear-cancel"><div class="pk-card" role="dialog" aria-label="清空对话"><div class="set-modal-head"><b>清空这段对话？</b><button type="button" class="drawer-close" data-action="ai-clear-cancel">${ico('x',12)}</button></div><div class="set-modal-body" style="font-size:11px;line-height:1.6;color:var(--muted)">消息会从这台设备移除，不能撤销；已经创建到待办或日程里的内容不受影响。</div><div class="pk-foot"><button type="button" data-action="ai-clear-cancel">取消</button><button type="button" class="primary" data-action="ai-clear-confirm">清空</button></div></div></div>`:''}
    ${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}
  </div>`;

/* ---------------- 日期 / 时间选择器 ---------------- */
function monthCells(month){
  const first=month+'-01';
  const [y,m]=month.split('-').map(Number);
  const startDow=new Date(Date.UTC(y,m-1,1)).getUTCDay();
  const back=(startDow+6)%7;
  const start=addDays(first,-back);
  return Array.from({length:42},(_,i)=>addDays(start,i));
}
function monthLabel(month){const [y,m]=month.split('-').map(Number);return `${y} 年 ${m} 月`;}
function datePickerCard(){
  const v=state.variant;
  const month=v==='nav'?'2026-12':(state.pickerMonth||'2026-11');
  const cells=monthCells(month);
  const sel=v==='nav'?'2026-12-03':(state.pickerDate||TODAY);
  return `<div class="pk-scrim" data-action="picker-cancel"><div class="pk-card" role="dialog" aria-label="选择日期">
    <div class="pk-head"><button type="button" class="pk-nav" data-action="picker-prev" aria-label="上个月">${ico('chevron-left',12)}</button><b>${monthLabel(month)}</b><button type="button" class="pk-nav" data-action="picker-next" aria-label="下个月">${ico('chevron-right',12)}</button></div>
    <div class="pk-week">${['一','二','三','四','五','六','日'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="pk-grid">${cells.map(d=>{
      const out=d.slice(0,7)!==month;
      const off=v==='off'&&d<TODAY;
      return `<button type="button" class="pk-cell ${out?'is-out':''} ${d===sel?'is-on':''} ${off?'is-off':''} ${d===TODAY?'is-today':''}" data-action="picker-pick" data-date="${d}" ${off?'disabled':''}><i>${dayNum(d)}</i></button>`;
    }).join('')}</div>
    <div class="pk-foot"><button type="button" data-action="picker-cancel">取消</button><button type="button" class="primary" data-action="picker-ok">确定</button></div>
  </div></div>`;
}

function mobileAi(){

  }).join('')}${busy?`<div class="ai-msg" style="align-self:flex-start;display:flex;align-items:center;gap:8px;color:var(--muted)"><span class="ai-spin"></span>正在回复…</div>`:''}</div>`;

function render(){
  if(!state.drawer&&!state.screen.startsWith('detail-')&&state.variant!=='detail')state.drawerEdit=false;
  if(state.screen.startsWith('cal-'))state.calView=state.screen.split('-')[1];
  const meta=SCREENS[state.screen]||SCREENS.today;
  // The AI config dialog is a property of the variant, not of how the variant
  // was reached. Deriving it here keeps deep links and chip clicks identical.
  if(state.screen==='settings-ai')state.aiConfigOpen=['config','detecting','config-error'].includes(state.variant);
  document.getElementById('spec-title').textContent=meta.title;
  document.getElementById('spec-desc').textContent=meta.desc;
  const navBox=document.getElementById('spec-nav');
  const navTop=navBox?navBox.scrollTop:0;
  renderNav();
  if(navBox)navBox.scrollTop=navTop;
  renderVariants();
  const frame=document.getElementById('frame');
  frame.className='product '+(state.device==='mobile'?'mobile':state.device==='narrow'?'narrow':'desktop');
  frame.innerHTML=state.device==='mobile'?mobileScreen():desktopScreen();
  if(state.device==='desktop'&&state.screen==='todo-all'&&state.variant==='completed'){
    requestAnimationFrame(()=>{
      const col=frame.querySelector('.todo-list-col'); const target=frame.querySelector('.todo-list-col .completed-group');
      if(col&&target){const top=target.getBoundingClientRect().top-col.getBoundingClientRect().top+col.scrollTop-8;col.scrollTop=Math.max(0,top);}
    });
  }
  if(state.device==='mobile'&&(state.screen==='today'||state.screen.startsWith('todo-'))&&(state.variant==='completed'||state.completedOpen)){
    requestAnimationFrame(()=>{
      const sc=frame.querySelector('.m-scroll'); const target=frame.querySelector('.m-completed-group');
      if(sc&&target){const top=target.getBoundingClientRect().top-sc.getBoundingClientRect().top+sc.scrollTop-8;sc.scrollTop=Math.max(0,top);}
    });
  }
  requestAnimationFrame(fitFrame);
}
function fitFrame(){
  const canvas=document.getElementById('spec-canvas');
  const frame=document.getElementById('frame');
  const wrap=document.getElementById('frame-wrap');
  if(!canvas||!frame||!wrap)return;
  const w=frame.offsetWidth,h=frame.offsetHeight;
  const pad=44;
  const scale=Math.min((canvas.clientWidth-pad*2)/w,(canvas.clientHeight-pad*2)/h,1);
  frame.style.transform='scale('+scale+')';
  wrap.style.width=(w*scale)+'px';
  wrap.style.height=(h*scale)+'px';
}

/* ---------------- interactions ---------------- */
function activeDetailRef(){
  if(state.drawer)return state.drawer;
  if(state.variant==='detail'){
    if(state.screen==='today')return {type:'todo',id:pickTodoId('report')};
    if(state.screen.startsWith('todo-'))return {type:'todo',id:pickTodoId(state.screen==='todo-all'?'recurring':'report')};
    if(state.screen.startsWith('cal-'))return {type:'event',id:pickEventId('dentist')};
  }
  if(state.screen==='detail-todo')return {type:'todo',id:pickTodoId(state.variant==='recurring'?'recurring':state.variant==='long'?'long':'report')};
  if(state.screen==='detail-event')return {type:'event',id:pickEventId(state.variant==='allday'?'sprint':state.variant==='recurring'?'weekly':'dentist')};
  return null;
}

  if(screen==='picker-date'||screen==='picker-time'){state.cmdReturn='today';state.variant='normal';}
  if(screen==='settings-ai')state.variant='normal';

  if(screen==='plan-picker'){state.variant='normal';state.planReturn='today';state.planDate=TODAY;state.planStart='15:15';state.planEnd='16:00';}

  render();
}

  }
  if(act==='trash-restore'){
    const id=a.dataset.id;state.trashId=id;const t=trashItems().find(x=>x.id===id);state.trashName=t?t.title:'';
    state.deletedTodos=state.deletedTodos.filter(x=>x!==id);
    state.deletedEvents=state.deletedEvents.filter(x=>x!==id);
    state.trashExtra=state.trashExtra.filter(x=>x.id!==id);
    if(id.startsWith('trash-')&&!state.trashRemoved.includes(id))state.trashRemoved.push(id);
    if(id==='trash-books')addLocalTodo({title:'整理旧照片，把重复的删掉',cal:'home'});
    if(id==='trash-template')addLocalTodo({title:'旧版周报模板',cal:'work'});
    if(id==='trash-review'){state.localNo++;EVENTS.push({id:'local-event-'+state.localNo,title:'产品评审',cal:'work',date:TODAY,start:'10:00',end:'11:00'});}
    state.variant='restored';render();return;
  }
  if(act==='trash-delete'){state.trashId=a.dataset.id;const t=trashItems().find(x=>x.id===state.trashId);state.trashName=t?t.title:'';state.variant='delete-confirm';render();return;}
  if(act==='trash-cancel'){state.variant='normal';render();return;}
  if(act==='trash-confirm'){const id=state.trashId;state.trashExtra=state.trashExtra.filter(x=>x.id!==id);if(id&&id.startsWith('trash-')&&!state.trashRemoved.includes(id))state.trashRemoved.push(id);state.variant='deleted';render();return;}
  if(act==='trash-clear'){state.trashExtra=[];state.trashRemoved=['trash-books','trash-template','trash-review'];state.variant='cleared';render();return;}
  if(act==='edit-detail'){clearDraft();state.drawerEdit=true;render();return;}
  if(act==='retry-save'){commitDraft();clearDraft();if(state.variant!=='detail')state.variant='normal';setToast('已重新保存');return;}
  if(act==='save-detail'){
    if(!String((state.draft||{}).title||'').trim()){state.variant='validation';setToast('先修正标红的字段');return;}
    commitDraft();clearDraft();if(state.variant!=='detail')state.variant='normal';setToast('已保存');return;
  }
  if(act==='noop'){setToast('这是设计状态；真实写入由实现阶段接入。');return;}
  if(act==='open-feedback'){state.screen='feedback';state.variant='normal';render();return;}
  if(act==='fb-copy'){state.fbCopied=true;state.variant='copied';setToast('已复制反馈内容');return;}
  if(act==='fb-github'){state.variant='link-error';render();return;}
  if(act==='ai-toggle'){state.aiEnabled=!state.aiEnabled;state.variant='normal';render();return;}
  if(act==='ai-config-open'){state.aiConfigOpen=true;state.variant=state.variant==='config-error'?'config-error':'normal';render();return;}
  if(act==='ai-config-close'){state.aiConfigOpen=false;render();return;}
  if(act==='ai-config-save'){state.aiConfigOpen=false;state.aiConfigured=true;state.aiEnabled=true;state.variant='normal';setToast('已保存模型配置');return;}
  if(act==='ai-config-remove'){state.aiConfigOpen=false;state.aiConfigured=false;state.variant='unconfigured';setToast('已移除模型配置');return;}
  if(act==='ai-detect'){state.variant='detecting';render();setTimeout(()=>{state.variant='normal';render();},1400);return;}
  if(act==='ai-open-settings'){go('settings-ai');return;}
  if(act==='ai-open-config'){state.aiConfigOpen=true;render();return;}
  if(act==='ai-open-chat'){go('ai-chat');state.variant='normal';render();return;}
  if(act==='ai-send'){state.aiSent=true;state.variant='sending';render();setTimeout(()=>{state.variant='normal';render();},1500);return;}
  if(act==='ai-retry'){state.variant='sending';render();setTimeout(()=>{state.variant='normal';render();},1500);return;}
  if(act==='ai-insert'){setToast('已作为草稿打开捕获；确认后才写入');return;}
  if(act==='ai-clear'){state.variant='clear';render();return;}
  if(act==='ai-clear-cancel'){state.variant='normal';render();return;}
  if(act==='ai-clear-confirm'){state.variant='normal';setToast('对话已清空');return;}
  if(act==='picker-prev'||act==='picker-next'){
    const base=state.variant==='nav'?'2026-12':(state.pickerMonth||'2026-11');
    const [y,m]=base.split('-').map(Number);
    const d=new Date(Date.UTC(y,m-1+(act==='picker-next'?1:-1),1));
    state.pickerMonth=d.toISOString().slice(0,7);state.variant='normal';render();return;
  }
  if(act==='picker-pick'){state.pickerDate=a.dataset.date;state.pickerMonth=a.dataset.date.slice(0,7);state.variant='normal';render();return;}
  if(act==='picker-cancel'||act==='time-cancel'){
    if(e.target.classList&&e.target.classList.contains('pk-scrim')&&e.target!==a)return;
    state.screen=state.cmdReturn||'today';state.variant='normal';render();return;
  }
  if(act==='picker-ok'){state.screen=state.cmdReturn||'today';state.variant='normal';setToast('已选择 '+md(state.pickerDate||TODAY));return;}
  if(act==='time-ok'){state.screen=state.cmdReturn||'today';state.variant='normal';setToast('已选择 '+(state.timeValue||'15:15'));return;}
  if(act==='oauth-allow'){state.variant='normal';setToast('已授权；可以回到客户端');return;}
  if(act==='oauth-deny'){state.variant='denied';render();return;}
  if(act==='filter'){state.variant='filter';state.drawer=null;state.confirmDelete=false;clearDraft();render();return;}
  if(act==='back'){
    if(state.drawer){clearDraft();state.drawer=null;state.confirmDelete=false;state.variant='normal';render();return;}
    if(state.screen==='plan-picker'){restorePlan();render();return;}
    if(state.screen==='detail-todo'){go('today');return;}
    if(state.screen==='detail-event'){go('cal-day');return;}
    if(state.screen.startsWith('todo-')||state.screen.startsWith('cal-')){state.variant='normal';render();return;}
    if(state.screen.startsWith('settings-')&&state.screen!=='settings-home')go('settings-home');else go('today');return;
  }
});
document.addEventListener('change',(e)=>{
  const t=e.target;
  if(!t)return;
  if(t.id==='plan-date'){state.planDate=t.value||TODAY;render();return;}
  if(t.id==='plan-start'||t.id==='plan-end'){
    if(t.id==='plan-start')state.planStart=t.value||state.planStart;else state.planEnd=t.value||state.planEnd;
    const dur=document.getElementById('plan-duration');if(dur)dur.textContent=planDuration(state.planStart,state.planEnd);
    return;
  }
  const field=t.dataset&&t.dataset.mfield;
  if(!field)return;
  const ref=activeEditRef();
  if(!ref)return;
  const item=draftFor(ref);
  if(!item)return;
  if(field==='allDay')item.allDay=(t.value==='1'||t.checked===true);
  else if(field==='cal')item.cal=t.value;
  else if(field==='repeat'){
    item.repeat=t.value;
    if(item.repeat&&!item.repeatEnd)item.repeatEnd='永不结束';
  }
  else if(field==='repeatEnd'){
    item.repeatEnd=t.value;
    if(t.value==='在日期'&&!item.repeatUntil)item.repeatUntil=TODAY;
    if(t.value==='在次数'&&!item.repeatCount)item.repeatCount=10;
  }
  else item[field]=t.value;
  render();
});
window.addEventListener('keydown',(e)=>{
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.matches&&e.target.matches('[role="button"][data-action]')){
    e.preventDefault();e.target.click();return;
  }
  if(e.key==='Enter'&&state.screen==='command'){
    const row=document.querySelector('.cmd-row.is-sel')||document.querySelector('.cmd-row');
    if(row){e.preventDefault();row.click();return;}
  }
  if(e.key==='Enter'&&e.target&&e.target.id==='cap-input'){
    e.preventDefault();
    if(state.capture==='event'){
      const evTitle=e.target.value.trim()||'和设计团队评审方案';
      state.localNo++;
      EVENTS.push({id:'local-event-'+state.localNo,title:evTitle,cal:'work',date:'2026-11-21',start:'10:00',end:'11:00'});
      state.capture='compact';state.screen='cal-week';state.variant='normal';
      state.toast='已创建日程 · 11/21 10:00–11:00';
      render();setTimeout(()=>{state.toast=null;render();},2200);
      return;
    }
    const title=e.target.value.trim()||'新待办';
    if(state.capture==='parsed'){
      addLocalTodo(state.suggestionRemoved?{title:'交报告'}:{title:'交报告',plan:{date:addDays(TODAY,1),start:'15:00',end:'16:00'}});
      state.toast=state.suggestionRemoved?'已记下待办 · 无日期':'已记下待办 · 明天 15:00 计划';
    }else if(state.capture==='expanded'){
      addLocalTodo({title:'交季度总结',due:'2026-11-21',dueTime:'18:00',plan:{date:'2026-11-21',start:'15:00',end:'16:00'}});
      state.toast='已记下待办 · 11/21 18:00 截止';
    }else{
      addLocalTodo({title});
      state.toast='已加入「未安排」· 继续输入';
    }
    const backScreen=state.screen==='capture'?'today':state.screen;
    state.capture='compact';state.screen=backScreen;state.variant='normal';
    render();setTimeout(()=>{state.toast=null;render();},2200);
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(state.screen!=='command')state.cmdReturn=state.screen;state.screen='command';state.variant='result';state.cmdQuery='周报';render();}
  if(e.key==='Escape'){
    if(document.querySelector('.confirm-modal')){state.confirmDelete=false;state.deleteRef=null;if(state.variant==='delete')state.variant='normal';render();return;}
    if(state.screen==='command'){state.screen=state.cmdReturn||'today';state.variant='normal';state.drawer=null;render();return;}
    if(state.screen==='plan-picker'){restorePlan();render();return;}
    if(['filter','filter-empty','date-picker','plan','calendars','slot'].includes(state.variant)){state.variant='normal';render();return;}
    if(state.drawer||state.screen.startsWith('detail-')||state.variant==='detail'){
      state.drawer=null;
      state.confirmDelete=false;
      if(state.screen==='detail-todo')state.screen='today';
      if(state.screen==='detail-event')state.screen='cal-day';
      state.variant='normal';
      render();
    }
  }
});
window.addEventListener('resize',fitFrame);
render();
</script>
