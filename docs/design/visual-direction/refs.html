<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual reference board — 2026-11-19</title>
<style>
  :root {
    --bg: #f6f6f7;
    --panel: #ffffff;
    --text: #16181d;
    --muted: #6b7078;
    --line: #d9dce1;
    --accent: #2f5bd7;
    --like: #1c7c4a;
    --dislike: #a33a2c;
    --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214;
      --panel: #1a1c20;
      --text: #e9eaec;
      --muted: #9aa0a8;
      --line: #31343a;
      --accent: #7c9cf5;
      --like: #57c98c;
      --dislike: #ef8b7d;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 12px;
  }
  .head-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  .counts { display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
  .counts b { font-weight: 650; }
  .counts .like b { color: var(--like); }
  .counts .dislike b { color: var(--dislike); }
  .spacer { flex: 1 1 auto; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filters + .filters { margin-top: 8px; }
  .filter-label { font-size: 12px; color: var(--muted); min-width: 40px; }
  button {
    font: inherit; color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 11px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button small { color: var(--muted); font-size: 11px; margin-left: 4px; }
  button[aria-pressed="true"] small { color: inherit; opacity: .8; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .hint kbd {
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
    background: var(--panel);
  }
  main { padding: 18px 20px 40px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 8px;
    cursor: pointer;
    min-width: 0;
  }
  .card.current { outline: 2px solid var(--accent); outline-offset: 1px; }
  .shot {
    height: 560px;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 65%, var(--panel));
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .shot img {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    display: block;
  }
  .meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .num { font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .app { font-weight: 650; font-size: 14px; }
  .screen { font-size: 13px; color: var(--muted); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 6px;
  }
  .source { font-size: 12px; color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  .source:hover { text-decoration: underline; }
  .actions { display: flex; gap: 8px; margin-top: auto; }
  .actions button { flex: 1 1 0; padding: 8px 10px; font-size: 16px; line-height: 1.2; }
  .actions button.liked { border-color: var(--like); color: var(--like); background: color-mix(in srgb, var(--like) 12%, var(--panel)); }
  .actions button.disliked { border-color: var(--dislike); color: var(--dislike); background: color-mix(in srgb, var(--dislike) 12%, var(--panel)); }
  .empty { color: var(--muted); padding: 40px 4px; font-size: 14px; }
  #storage-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .export-panel { margin-top: 22px; }
  .export-panel textarea {
    width: 100%; min-height: 160px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 10px;
    resize: vertical;
  }

  /* quick mode */
  .quick {
    position: fixed; inset: 0; z-index: 50;
    background: var(--bg);
    display: flex; flex-direction: column;
    padding: 12px 16px 18px;
  }
  .quick[hidden] { display: none; }
  .quick-top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    font-size: 13px; color: var(--muted);
  }
  .quick-top .title { font-weight: 650; color: var(--text); }
  .quick-top b { color: var(--text); font-weight: 650; }
  .quick-top .like b { color: var(--like); }
  .quick-top .dislike b { color: var(--dislike); }
  .quick-stage {
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 10px 0;
  }
  .quick-figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; max-height: 100%; min-width: 0; }
  .quick-img-wrap {
    height: 70vh; max-width: min(92vw, 900px);
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 60%, var(--panel));
    border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden;
  }
  .quick-img-wrap img { max-height: 100%; max-width: 100%; width: auto; height: auto; display: block; }
  .quick-caption { font-size: 13px; color: var(--muted); min-height: 20px; text-align: center; }
  .quick-caption .app { color: var(--text); }
  .quick-bottom { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .quick-bottom button { padding: 9px 16px; font-size: 15px; }
  .quick-bottom .skip { color: var(--muted); }
  .quick-bottom .liked { border-color: var(--like); color: var(--like); }
  .quick-bottom .disliked { border-color: var(--dislike); color: var(--dislike); }
  .quick-done { text-align: center; padding: 24px; }
  .quick-done h2 { font-size: 18px; margin: 0 0 10px; }
  .quick-done p { color: var(--muted); margin: 0 0 18px; }
  .quick-error { color: var(--dislike); font-size: 13px; padding: 20px; text-align: center; }

  @media (max-width: 640px) {
    header { padding: 12px 14px 10px; }
    main { padding: 14px 14px 32px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .shot { height: 430px; }
    .counts { font-size: 12px; gap: 8px; }
    .quick { padding: 10px 10px 14px; }
    .quick-img-wrap { height: 62vh; max-width: 100%; }
    .quick-top { font-size: 12px; gap: 6px 10px; }
    .quick-bottom button { padding: 10px 12px; font-size: 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>Visual reference board — 2026-11-19</h1>
    <div class="counts" aria-live="polite">
      <span class="like">喜欢 <b id="count-liked">0</b></span>
      <span class="dislike">讨厌 <b id="count-disliked">0</b></span>
      <span>未评 <b id="count-unrated">0</b></span>
    </div>
    <span class="spacer"></span>
    <button id="quick-btn" type="button">快速模式</button>
    <button id="export-btn" type="button">导出 JSON</button>
  </div>
  <div class="filters" id="filters">
    <span class="filter-label">状态</span>
    <button data-filter="all" aria-pressed="true">全部 <small data-count></small></button>
    <button data-filter="unrated" aria-pressed="false">只看未评 <small data-count></small></button>
    <button data-filter="liked" aria-pressed="false">只看喜欢 <small data-count></small></button>
    <button data-filter="disliked" aria-pressed="false">只看讨厌 <small data-count></small></button>
  </div>
  <div class="filters" id="category-filters">
    <span class="filter-label">类型</span>
    <button data-category="all" aria-pressed="true">全部 <small data-count></small></button>
    <button data-category="today" aria-pressed="false">today <small data-count></small></button>
    <button data-category="calendar" aria-pressed="false">calendar <small data-count></small></button>
    <button data-category="detail" aria-pressed="false">detail <small data-count></small></button>
    <button data-category="composer" aria-pressed="false">composer <small data-count></small></button>
    <button data-category="search" aria-pressed="false">search <small data-count></small></button>
    <button data-category="empty" aria-pressed="false">empty <small data-count></small></button>
  </div>
  <div class="filters" id="platform-filters">
    <span class="filter-label">平台</span>
    <button data-platform="all" aria-pressed="true">全部 <small data-count></small></button>
    <button data-platform="phone" aria-pressed="false">手机 <small data-count></small></button>
    <button data-platform="web" aria-pressed="false">Web/桌面 <small data-count></small></button>
  </div>
  <div class="filters" id="theme-filters">
    <span class="filter-label">主题</span>
    <button data-theme="all" aria-pressed="true">全部 <small data-count></small></button>
    <button data-theme="light" aria-pressed="false">浅色 <small data-count></small></button>
    <button data-theme="dark" aria-pressed="false">深色 <small data-count></small></button>
  </div>
  <div class="hint">
    网格：<kbd>1</kbd> 喜欢 · <kbd>2</kbd> 讨厌 · <kbd>←</kbd><kbd>→</kbd> 切换当前卡片 · 快速模式：<kbd>1</kbd>/<kbd>2</kbd> 评分并前进 · <kbd>空格</kbd> 跳过 · <kbd>←</kbd> 上一张 · <kbd>Esc</kbd> 退出
  </div>
  <div id="storage-note" hidden></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty-msg" hidden>当前筛选下没有图片。</div>
  <section class="export-panel" id="export-panel" hidden>
    <p id="export-msg" class="hint"></p>
    <textarea id="export-area" readonly aria-label="导出的 JSON"></textarea>
  </section>
</main>

<div class="quick" id="quick" hidden role="dialog" aria-modal="true" aria-label="快速评分">
  <div class="quick-top">
    <span class="title">快速模式</span>
    <span>当前 <b id="quick-pos">0</b> / <b id="quick-total">0</b></span>
    <span class="like">已评 <b id="quick-rated">0</b></span>
    <span class="dislike">未评 <b id="quick-unrated">0</b></span>
    <span class="spacer"></span>
    <button id="quick-brand" type="button" aria-pressed="false">显示品牌</button>
    <button id="quick-close" type="button">退出</button>
  </div>
  <div class="quick-stage" id="quick-stage">
    <figure class="quick-figure" id="quick-figure">
      <div class="quick-img-wrap">
        <img id="quick-img" alt="">
      </div>
      <figcaption class="quick-caption" id="quick-caption"></figcaption>
    </figure>
    <div class="quick-done" id="quick-done" hidden>
      <h2>已评 <span id="done-rated">0</span> / 未评 <span id="done-unrated">0</span></h2>
      <p>全部看完了。可以退出并导出 JSON。</p>
      <button id="done-export" type="button">导出 JSON</button>
    </div>
  </div>
  <div class="quick-bottom" id="quick-bottom">
    <button type="button" data-quick="dislike" class="disliked" title="不喜欢 (2)">👎 2</button>
    <button type="button" data-quick="skip" class="skip" title="跳过 (空格)">跳过</button>
    <button type="button" data-quick="like" class="liked" title="喜欢 (1)">👍 1</button>
  </div>
</div>

<script src="refs-data.js"></script>
<script>
const STORAGE_KEY = 'dayspark-refs-choices-v1';
const CHOICES = { like: 'like', dislike: 'dislike' };
let storageOk = true;
let state = {};
let filter = 'all';
let categoryFilter = 'all';
let platformFilter = 'all';
let themeFilter = 'all';
let currentId = null;

let quickOpen = false;
let quickIndex = 0;
let quickShowBrand = false;
let quickAdvanceTimer = null;
let quickList = [];

function loadState() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        for (const [id, v] of Object.entries(parsed)) {
          if (v === 'like' || v === 'dislike') state[id] = v;
        }
      }
    }
  } catch (err) {
    storageOk = false;
    state = {};
  }
}

function saveState() {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    storageOk = false;
    updateStorageNote();
  }
}

function updateStorageNote() {
  const note = document.getElementById('storage-note');
  if (storageOk) {
    note.hidden = true;
    return;
  }
  note.hidden = false;
  note.textContent = '当前浏览器在 file:// 下禁用了 localStorage，本次选择只保存在页面内存中，请用“导出 JSON”保存结果。';
}

function counts() {
  let liked = 0, disliked = 0;
  for (const ref of REFS) {
    if (state[ref.id] === 'like') liked += 1;
    else if (state[ref.id] === 'dislike') disliked += 1;
  }
  return { liked, disliked, unrated: REFS.length - liked - disliked };
}

function renderCounts() {
  const c = counts();
  document.getElementById('count-liked').textContent = c.liked;
  document.getElementById('count-disliked').textContent = c.disliked;
  document.getElementById('count-unrated').textContent = c.unrated;
  document.querySelectorAll('#filters button').forEach((b) => {
    const key = b.dataset.filter;
    const n = key === 'all' ? REFS.length
      : key === 'liked' ? c.liked
      : key === 'disliked' ? c.disliked
      : c.unrated;
    const slot = b.querySelector('[data-count]');
    if (slot) slot.textContent = n;
  });
  document.querySelectorAll('#category-filters button').forEach((b) => {
    const key = b.dataset.category;
    const n = key === 'all' ? REFS.length : REFS.filter((r) => r.category === key).length;
    const slot = b.querySelector('[data-count]');
    if (slot) slot.textContent = n;
  });
  document.querySelectorAll('#platform-filters button').forEach((b) => {
    const key = b.dataset.platform;
    const n = key === 'all' ? REFS.length : REFS.filter((r) => r.platform === key).length;
    const slot = b.querySelector('[data-count]');
    if (slot) slot.textContent = n;
  });
  document.querySelectorAll('#theme-filters button').forEach((b) => {
    const key = b.dataset.theme;
    const n = key === 'all' ? REFS.length : REFS.filter((r) => r.theme === key).length;
    const slot = b.querySelector('[data-count]');
    if (slot) slot.textContent = n;
  });
}

function visibleRefs() {
  return REFS.filter((ref) => {
    const c = state[ref.id];
    if (filter === 'liked' && c !== 'like') return false;
    if (filter === 'disliked' && c !== 'dislike') return false;
    if (filter === 'unrated' && c) return false;
    if (categoryFilter !== 'all' && ref.category !== categoryFilter) return false;
    if (platformFilter !== 'all' && ref.platform !== platformFilter) return false;
    if (themeFilter !== 'all' && ref.theme !== themeFilter) return false;
    return true;
  });
}

function makeImage(ref) {
  const img = document.createElement('img');
  img.src = 'refs/' + ref.file;
  img.alt = ref.app + ' — ' + ref.screen;
  img.loading = 'lazy';
  img.decoding = 'async';
  if (ref.width && ref.height) {
    img.width = ref.width;
    img.height = ref.height;
  }
  return img;
}

function render() {
  const grid = document.getElementById('grid');
  const visible = visibleRefs();
  grid.textContent = '';
  visible.forEach((ref) => {
    const card = document.createElement('article');
    card.className = 'card' + (ref.id === currentId ? ' current' : '');
    card.dataset.id = ref.id;
    card.setAttribute('aria-label', ref.app + ' ' + ref.screen);

    const shot = document.createElement('div');
    shot.className = 'shot';
    shot.appendChild(makeImage(ref));

    const meta = document.createElement('div');
    meta.className = 'meta';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = '#' + String(REFS.indexOf(ref) + 1).padStart(2, '0');
    const app = document.createElement('span');
    app.className = 'app';
    app.textContent = ref.app;
    const screen = document.createElement('span');
    screen.className = 'screen';
    screen.textContent = ref.screen;
    const tags = document.createElement('div');
    tags.className = 'tags';
    for (const label of [ref.category, ref.platform === 'web' ? 'Web' : 'Phone', ref.theme]) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = label;
      tags.appendChild(tag);
    }
    const source = document.createElement('a');
    source.className = 'source';
    source.href = ref.sourceUrl;
    source.target = '_blank';
    source.rel = 'noopener noreferrer';
    source.textContent = '来源页面';
    source.addEventListener('click', (e) => e.stopPropagation());
    meta.append(num, app, screen, tags, source);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const likeBtn = document.createElement('button');
    likeBtn.type = 'button';
    likeBtn.dataset.action = 'like';
    likeBtn.textContent = '👍';
    likeBtn.title = '喜欢 (1)';
    if (state[ref.id] === 'like') likeBtn.classList.add('liked');
    likeBtn.setAttribute('aria-pressed', state[ref.id] === 'like' ? 'true' : 'false');
    likeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentId = ref.id;
      setChoice(ref.id, 'like');
    });
    const dislikeBtn = document.createElement('button');
    dislikeBtn.type = 'button';
    dislikeBtn.dataset.action = 'dislike';
    dislikeBtn.textContent = '👎';
    dislikeBtn.title = '讨厌 (2)';
    if (state[ref.id] === 'dislike') dislikeBtn.classList.add('disliked');
    dislikeBtn.setAttribute('aria-pressed', state[ref.id] === 'dislike' ? 'true' : 'false');
    dislikeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentId = ref.id;
      setChoice(ref.id, 'dislike');
    });
    actions.append(likeBtn, dislikeBtn);

    card.append(shot, meta, actions);
    card.addEventListener('click', () => {
      currentId = ref.id;
      updateCurrentCard();
    });
    grid.appendChild(card);
  });

  document.getElementById('empty-msg').hidden = visible.length !== 0;
  if (visible.length && !visible.some((r) => r.id === currentId)) {
    currentId = visible[0].id;
  }
  updateCurrentCard();
  renderCounts();
  updateStorageNote();
}

function updateCurrentCard() {
  const cards = document.querySelectorAll('.card');
  cards.forEach((card) => {
    card.classList.toggle('current', card.dataset.id === currentId);
  });
  const current = document.querySelector('.card.current');
  if (current && current.scrollIntoView) {
    const rect = current.getBoundingClientRect();
    const outside = rect.top < 80 || rect.bottom > window.innerHeight;
    if (outside) current.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function setChoice(id, choice, options = {}) {
  if (state[id] === choice) {
    delete state[id];
  } else {
    state[id] = choice;
  }
  saveState();
  if (options.rerender === false) {
    renderCounts();
    updateStorageNote();
  } else {
    render();
  }
}

function moveCurrent(delta) {
  const visible = visibleRefs();
  if (!visible.length) return;
  let idx = visible.findIndex((r) => r.id === currentId);
  if (idx === -1) idx = 0;
  idx = (idx + delta + visible.length) % visible.length;
  currentId = visible[idx].id;
  updateCurrentCard();
}

function setFilter(next) {
  filter = next;
  document.querySelectorAll('#filters button').forEach((b) => {
    b.setAttribute('aria-pressed', b.dataset.filter === next ? 'true' : 'false');
  });
  render();
}

function setCategoryFilter(next) {
  categoryFilter = next;
  document.querySelectorAll('#category-filters button').forEach((b) => {
    b.setAttribute('aria-pressed', b.dataset.category === next ? 'true' : 'false');
  });
  render();
}

function setPlatformFilter(next) {
  platformFilter = next;
  document.querySelectorAll('#platform-filters button').forEach((b) => {
    b.setAttribute('aria-pressed', b.dataset.platform === next ? 'true' : 'false');
  });
  render();
}

function setThemeFilter(next) {
  themeFilter = next;
  document.querySelectorAll('#theme-filters button').forEach((b) => {
    b.setAttribute('aria-pressed', b.dataset.theme === next ? 'true' : 'false');
  });
  render();
}

function buildExport() {
  const c = counts();
  return {
    exportedAt: new Date().toISOString(),
    board: 'docs/design/visual-direction/refs.html',
    counts: c,
    choices: REFS.map((ref) => ({
      id: ref.id,
      app: ref.app,
      screen: ref.screen,
      category: ref.category,
      platform: ref.platform,
      theme: ref.theme,
      choice: state[ref.id] || null
    }))
  };
}

function exportJson() {
  const json = JSON.stringify(buildExport(), null, 2);
  const panel = document.getElementById('export-panel');
  const area = document.getElementById('export-area');
  const msg = document.getElementById('export-msg');
  let downloaded = false;
  try {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'refs-choices.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    downloaded = true;
  } catch (err) {
    downloaded = false;
  }
  if (!downloaded) {
    panel.hidden = false;
    area.value = json;
    area.focus();
    area.select();
    msg.textContent = '下载不可用，已把 JSON 放在下方，请手动复制。';
    return;
  }
  panel.hidden = false;
  area.value = json;
  msg.textContent = '已尝试下载 refs-choices.json；若浏览器拦截了下载，可直接复制下方内容。';
}

function quickSnapshot() {
  const c = counts();
  document.getElementById('quick-total').textContent = quickList.length;
  document.getElementById('quick-rated').textContent = c.liked + c.disliked;
  document.getElementById('quick-unrated').textContent = c.unrated;
}

function quickPreload(index) {
  for (const i of [index + 1, index + 2]) {
    const ref = quickList[i];
    if (!ref) continue;
    const im = new Image();
    im.src = 'refs/' + ref.file;
  }
}

function renderQuick() {
  quickSnapshot();
  const done = document.getElementById('quick-done');
  const figure = document.getElementById('quick-figure');
  const bottom = document.getElementById('quick-bottom');
  if (quickIndex >= quickList.length) {
    done.hidden = false;
    figure.hidden = true;
    bottom.hidden = true;
    const c = counts();
    document.getElementById('done-rated').textContent = c.unrated === REFS.length ? 0 : c.liked + c.disliked;
    document.getElementById('done-unrated').textContent = c.unrated;
    document.getElementById('quick-pos').textContent = quickList.length;
    return;
  }
  done.hidden = true;
  figure.hidden = false;
  bottom.hidden = false;
  const ref = quickList[quickIndex];
  const img = document.getElementById('quick-img');
  img.alt = ref.app + ' — ' + ref.screen;
  img.src = 'refs/' + ref.file;
  document.getElementById('quick-pos').textContent = quickIndex + 1;
  const caption = document.getElementById('quick-caption');
  const choice = state[ref.id];
  if (quickShowBrand) {
    caption.textContent = '#' + String(REFS.indexOf(ref) + 1).padStart(2, '0') + ' · ' + ref.app + ' · ' + ref.screen;
  } else {
    caption.textContent = '#' + String(REFS.indexOf(ref) + 1).padStart(2, '0') + (choice ? ' · 已评' : '');
  }
  const likeBtn = bottom.querySelector('[data-quick="like"]');
  const dislikeBtn = bottom.querySelector('[data-quick="dislike"]');
  likeBtn.setAttribute('aria-pressed', choice === 'like' ? 'true' : 'false');
  dislikeBtn.setAttribute('aria-pressed', choice === 'dislike' ? 'true' : 'false');
  quickPreload(quickIndex);
}

function openQuick() {
  quickOpen = true;
  quickList = REFS.slice();
  const start = quickList.findIndex((r) => !state[r.id]);
  quickIndex = start === -1 ? 0 : start;
  document.getElementById('quick').hidden = false;
  document.body.style.overflow = 'hidden';
  renderQuick();
}

function closeQuick() {
  quickOpen = false;
  if (quickAdvanceTimer) {
    clearTimeout(quickAdvanceTimer);
    quickAdvanceTimer = null;
  }
  document.getElementById('quick').hidden = true;
  document.body.style.overflow = '';
  render();
}

function quickStep(delta) {
  if (quickAdvanceTimer) {
    clearTimeout(quickAdvanceTimer);
    quickAdvanceTimer = null;
  }
  quickIndex = Math.max(0, Math.min(quickList.length, quickIndex + delta));
  renderQuick();
}

function quickRate(choice) {
  if (quickIndex >= quickList.length) return;
  const ref = quickList[quickIndex];
  state[ref.id] = choice;
  saveState();
  renderCounts();
  updateStorageNote();
  quickSnapshot();
  if (quickAdvanceTimer) clearTimeout(quickAdvanceTimer);
  quickAdvanceTimer = setTimeout(() => {
    quickAdvanceTimer = null;
    quickStep(1);
  }, 190);
}

function quickSkip() {
  quickStep(1);
}

document.getElementById('filters').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-filter]');
  if (!btn) return;
  setFilter(btn.dataset.filter);
});
document.getElementById('category-filters').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-category]');
  if (!btn) return;
  setCategoryFilter(btn.dataset.category);
});
document.getElementById('platform-filters').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-platform]');
  if (!btn) return;
  setPlatformFilter(btn.dataset.platform);
});
document.getElementById('theme-filters').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-theme]');
  if (!btn) return;
  setThemeFilter(btn.dataset.theme);
});

document.getElementById('export-btn').addEventListener('click', exportJson);
document.getElementById('quick-btn').addEventListener('click', openQuick);
document.getElementById('quick-close').addEventListener('click', closeQuick);
document.getElementById('done-export').addEventListener('click', exportJson);
document.getElementById('quick-brand').addEventListener('click', (e) => {
  quickShowBrand = !quickShowBrand;
  e.currentTarget.setAttribute('aria-pressed', quickShowBrand ? 'true' : 'false');
  renderQuick();
});
document.getElementById('quick-bottom').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-quick]');
  if (!btn) return;
  if (btn.dataset.quick === 'like') quickRate('like');
  else if (btn.dataset.quick === 'dislike') quickRate('dislike');
  else quickSkip();
});

document.addEventListener('keydown', (e) => {
  const target = e.target;
  if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (quickOpen) {
    if (e.key === '1') {
      quickRate('like');
      e.preventDefault();
    } else if (e.key === '2') {
      quickRate('dislike');
      e.preventDefault();
    } else if (e.key === ' ') {
      quickSkip();
      e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
      quickStep(-1);
      e.preventDefault();
    } else if (e.key === 'ArrowRight') {
      quickStep(1);
      e.preventDefault();
    } else if (e.key === 'Escape') {
      closeQuick();
      e.preventDefault();
    }
    return;
  }
  if (e.key === '1') {
    if (currentId) setChoice(currentId, 'like');
    e.preventDefault();
  } else if (e.key === '2') {
    if (currentId) setChoice(currentId, 'dislike');
    e.preventDefault();
  } else if (e.key === 'ArrowLeft') {
    moveCurrent(-1);
    e.preventDefault();
  } else if (e.key === 'ArrowRight') {
    moveCurrent(1);
    e.preventDefault();
  } else if (e.key === 'Enter') {
    moveCurrent(1);
    e.preventDefault();
  }
});

loadState();
const visibleAtStart = visibleRefs();
currentId = visibleAtStart.length ? visibleAtStart[0].id : null;
render();
</script>
</body>
</html>
