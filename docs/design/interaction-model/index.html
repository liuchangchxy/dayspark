<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DaySpark 交互模型</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-mark">灵光</div>
    <div class="boot-bar"><span></span></div>
  </div>

  <div id="app" class="shell" hidden>
    <aside id="rail" class="rail" aria-label="主导航"></aside>
    <main id="main" class="app-main">
      <div id="view" class="view"></div>
      <nav id="bottomnav" class="bottomnav" aria-label="主导航"></nav>
    </main>
  </div>

  <div id="overlay" class="overlay-root"></div>
  <div id="toast" class="toast-root" role="status" aria-live="polite"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/quick-add.js"></script>
  <script src="js/event-ops.js"></script>
  <script src="js/todo-ops.js"></script>
  <script src="js/registry.js"></script>
  <script src="js/views/action.js"></script>
  <script src="js/views/quickadd.js"></script>
  <script src="js/views/todo.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/composer.js"></script>
  <script src="js/views/detail.js"></script>
  <script src="js/views/search.js"></script>
  <script src="js/views/library.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/chat.js"></script>
  <script src="js/views/misc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
