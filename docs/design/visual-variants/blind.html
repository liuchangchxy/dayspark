<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵光 DaySpark · 盲选</title>
<link rel="stylesheet" href="site.css">
</head>
<body class="site">

<header class="site-head">
  <div class="site-brand">
    <svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6 9.55 6.45 14.4 8 9.55 9.55 8 14.4 6.45 9.55 1.6 8 6.45 6.45Z"/></svg>
    灵光
    <span class="divider">/</span>
    <span class="sub">视觉方向受控变体</span>
  </div>
  <nav class="site-links">
    <a href="index.html">入口</a>
    <a href="compare.html">并排对比</a>
    <a href="blind.html" class="is-active">盲选</a>
  </nav>
</header>

<main class="site-main">
  <div class="blind-wrap">

    <div class="page-intro">
      <h1 class="page-title">盲选</h1>
      <p class="page-desc">每屏只出现一次，三张缩略图随机排序；版本名隐藏，选完再导出。</p>
    </div>

    <div class="blind-top">
      <span class="blind-progress" id="blind-progress">1 / 6</span>
      <span class="blind-board" id="blind-board">今天 · 桌面</span>
      <span class="blind-hint">按 1 / 2 / 3 选择，退格返回</span>
    </div>

    <div class="blind-thumbs" id="blind-thumbs"></div>

    <div class="blind-actions">
      <button class="btn" type="button" id="btn-back">上一屏</button>
      <button class="btn" type="button" id="btn-reset">重置</button>
      <button class="btn btn-primary" type="button" id="btn-export">导出 JSON</button>
      <span class="blind-note" id="blind-status"></span>
    </div>

    <div class="blind-log" id="blind-log"></div>

    <pre class="blind-json" id="blind-json" hidden></pre>
    <p class="blind-note">结果只存在本机 localStorage（键 ds-blind-v1）；导出内容包含固定 seed 与每屏的版本顺序，便于复核。</p>

  </div>
</main>

<script src="site.js"></script>
<script>
(function () {
  'use strict';

  var SEED = 20261115;
  var STORE = 'ds-blind-v1';
  var BOARDS = [
    { id: 'today-desktop', screen: 'today', platform: 'desktop', label: '今天 · 桌面' },
    { id: 'today-phone', screen: 'today', platform: 'phone', label: '今天 · 手机' },
    { id: 'todo-desktop', screen: 'todo', platform: 'desktop', label: '待办 · 桌面' },
    { id: 'todo-phone', screen: 'todo', platform: 'phone', label: '待办 · 手机' },
    { id: 'calendar-desktop', screen: 'calendar', platform: 'desktop', label: '日历 · 桌面' },
    { id: 'calendar-phone', screen: 'calendar', platform: 'phone', label: '日历 · 手机' },
  ];

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function orderFor(board) {
    var rand = mulberry32(SEED ^ hash(board.id));
    var arr = ['A', 'B', 'C'];
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  var state = { index: 0, picks: {} };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && typeof saved.index === 'number' && saved.picks) state = saved;
  } catch (e) {}

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  var els = {
    progress: document.getElementById('blind-progress'),
    board: document.getElementById('blind-board'),
    thumbs: document.getElementById('blind-thumbs'),
    back: document.getElementById('btn-back'),
    reset: document.getElementById('btn-reset'),
    exportBtn: document.getElementById('btn-export'),
    status: document.getElementById('blind-status'),
    log: document.getElementById('blind-log'),
    json: document.getElementById('blind-json'),
  };

  function pickedCount() {
    return Object.keys(state.picks).length;
  }

  function renderThumbs() {
    var board = BOARDS[state.index];
    var order = orderFor(board);
    var phone = board.platform === 'phone';
    var thumbW = phone ? 200 : 340;

    els.thumbs.textContent = '';
    order.forEach(function (variant, i) {
      var thumb = document.createElement('div');
      thumb.className = 'blind-thumb';
      var picked = state.picks[board.id];
      if (picked && picked.slot === i + 1) thumb.classList.add('is-picked');

      var wrap = document.createElement('div');
      wrap.className = 'frame-wrap';
      wrap.style.width = thumbW + 'px';
      wrap.style.maxWidth = '100%';
      thumb.appendChild(wrap);

      var slot = document.createElement('button');
      slot.type = 'button';
      slot.className = 'blind-slot';
      slot.textContent = String(i + 1);
      slot.setAttribute('aria-label', '选择第 ' + (i + 1) + ' 张');
      slot.addEventListener('click', function () { pick(i + 1); });
      thumb.appendChild(slot);

      els.thumbs.appendChild(thumb);

      Site.mountFrame(wrap, 'app.html?variant=' + variant + '&platform=' + board.platform + '&screen=' + board.screen, phone ? 390 : 1280, phone ? 844 : 800, {
        width: thumbW,
        maxScale: 1,
        title: '缩略图 ' + (i + 1),
      });
    });
  }

  function render() {
    var board = BOARDS[state.index];
    els.progress.textContent = (pickedCount()) + ' / ' + BOARDS.length;
    els.board.textContent = board.label;
    els.back.disabled = state.index === 0;
    renderThumbs();
    renderLog();
    els.json.hidden = true;
    els.status.textContent = state.picks[board.id] ? '本屏已选，可改选或继续' : '未选择';
  }

  function renderLog() {
    els.log.textContent = '';
    BOARDS.forEach(function (b) {
      var p = state.picks[b.id];
      if (!p) return;
      var row = document.createElement('div');
      row.className = 'log-row';
      var name = document.createElement('span');
      name.textContent = b.label;
      var order = document.createElement('span');
      order.textContent = '已选第 ' + p.slot + ' 张';
      var badge = document.createElement('span');
      badge.className = 'log-badge';
      badge.textContent = '完成';
      row.appendChild(name);
      row.appendChild(order);
      row.appendChild(badge);
      els.log.appendChild(row);
    });
  }

  function pick(slot) {
    var board = BOARDS[state.index];
    var order = orderFor(board);
    state.picks[board.id] = { slot: slot, variant: order[slot - 1] };
    save();

    var thumb = els.thumbs.children[slot - 1];
    if (thumb) thumb.classList.add('is-picked');
    els.status.textContent = '已选第 ' + slot + ' 张';

    setTimeout(function () {
      var next = -1;
      for (var i = state.index + 1; i < BOARDS.length; i++) {
        if (!state.picks[BOARDS[i].id]) { next = i; break; }
      }
      if (next === -1) {
        for (var j = 0; j < BOARDS.length; j++) {
          if (!state.picks[BOARDS[j].id]) { next = j; break; }
        }
      }
      if (next !== -1) {
        state.index = next;
        save();
        render();
      } else {
        save();
        render();
        els.status.textContent = '6 屏已全部选择，可导出';
      }
    }, 180);
  }

  function back() {
    if (state.index > 0) {
      state.index -= 1;
      save();
      render();
    }
  }

  function reset() {
    state = { index: 0, picks: {} };
    save();
    els.json.hidden = true;
    render();
  }

  function exportData() {
    return {
      seed: SEED,
      exportedAt: new Date().toISOString(),
      boards: BOARDS.map(function (b) {
        var p = state.picks[b.id] || null;
        return {
          board: b.id,
          label: b.label,
          order: orderFor(b),
          selectedSlot: p ? p.slot : null,
          selectedVariant: p ? p.variant : null,
        };
      }),
    };
  }

  function exportJson() {
    var data = exportData();
    var text = JSON.stringify(data, null, 2);
    els.json.hidden = false;
    els.json.textContent = text;

    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'dayspark-blind-picks.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {}

    els.status.textContent = '已导出 ' + Object.keys(state.picks).length + ' / ' + BOARDS.length + ' 屏';
  }

  els.back.addEventListener('click', back);
  els.reset.addEventListener('click', reset);
  els.exportBtn.addEventListener('click', exportJson);

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '1' || e.key === '2' || e.key === '3') {
      e.preventDefault();
      pick(parseInt(e.key, 10));
    } else if (e.key === 'Backspace' || e.key === 'ArrowLeft') {
      e.preventDefault();
      back();
    }
  });

  window.__BLIND__ = { state: state, exportData: exportData, boards: BOARDS };
  render();
  window.__READY__ = true;
})();
</script>

</body>
</html>
