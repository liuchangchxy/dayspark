name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  version-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version + tag guard / 版本与 tag 一致性门
        run: tool/check_version_consistency.sh --tag "$GITHUB_REF_NAME"

  build-web:
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - run: cd build/web && zip -r $GITHUB_WORKSPACE/dayspark-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dayspark-web.zip

  build-android:
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Setup Android signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/release-keystore.jks
          cat > android/app/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    needs: version-gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Create DMG
        run: |
          APP="build/macos/Build/Products/Release/DaySpark.app"
          DMG="$GITHUB_WORKSPACE/dayspark-macos.dmg"
          hdiutil create -volname "DaySpark" -srcfolder "$APP" -ov -format UDZO "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dayspark-macos.dmg

  build-windows:
    needs: version-gate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - name: Extract version for installer
        shell: pwsh
        run: |
          $version = Select-String -Path pubspec.yaml -Pattern 'version: (.+)' | % { $_.Matches.Groups[1].Value }
          echo "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build installer
        run: |
          iscc windows/app_installer.iss /DMyAppVersion=$env:APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/installer/DaySpark-*-Setup.exe

  build-linux:
    needs: version-gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tool/check_glibc_version.sh build/linux/x64/release/bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/

  release:
    needs: [build-web, build-android, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare assets
        run: |
          mkdir -p release-assets
          cp artifacts/android-apk/app-release.apk release-assets/dayspark-android.apk
          cp artifacts/macos-dmg/dayspark-macos.dmg release-assets/
          cp artifacts/web-build/dayspark-web.zip release-assets/
          cp artifacts/windows-installer/*.exe release-assets/
          cd artifacts/linux-build && zip -r $GITHUB_WORKSPACE/release-assets/dayspark-linux.zip . && cd $GITHUB_WORKSPACE
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ !startsWith(github.ref_name, 'v1.') }}
          files: release-assets/*
          generate_release_notes: true
