name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Resolve contracts package (root analyze scans its tests)
        working-directory: packages/dayspark_contracts
        run: dart pub get
      - name: Resolve server package (root analyze scans its tests)
        working-directory: server
        run: dart pub get
      - name: Resolve mcp_stdio_wrapper package (root analyze scans its tests)
        working-directory: tool/mcp_stdio_wrapper
        run: dart pub get
      - name: Resolve dayspark_cli package (root analyze scans its tests)
        working-directory: tool/dayspark_cli
        run: dart pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Contracts analyze + test
        working-directory: packages/dayspark_contracts
        run: |
          dart pub get
          dart analyze .
          dart test
      - name: Server analyze + test
        working-directory: server
        run: |
          dart pub get
          dart analyze .
          dart test

  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: cd build/macos/Build/Products/Release && zip -r $GITHUB_WORKSPACE/dayspark-macos.zip DaySpark.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dayspark-macos.zip

  build-windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tool/check_glibc_version.sh build/linux/x64/release/bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/
