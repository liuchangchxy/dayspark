name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Whitespace and line-ending check / 行尾空格与换行符检查
        run: python3 tool/check_whitespace.py

      - name: Hardcoded absolute path scan / 硬编码绝对路径扫描
        run: python3 tool/scan_hardcoded_paths.py

      - name: Version consistency guard / 版本一致性守卫
        run: |
          tool/check_version_consistency.sh
          tool/check_version_consistency.sh --selftest
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Resolve contracts package (root analyze scans its tests)
        working-directory: packages/dayspark_contracts
        run: dart pub get
      - name: Resolve server package (root analyze scans its tests)
        working-directory: server
        run: dart pub get
      - name: Resolve mcp_stdio_wrapper package (root analyze scans its tests)
        working-directory: tool/mcp_stdio_wrapper
        run: dart pub get
      - name: Resolve dayspark_cli package (root analyze scans its tests)
        working-directory: tool/dayspark_cli
        run: dart pub get
      - name: Recurrence package analyze + test
        working-directory: packages/dayspark_recurrence
        run: |
          dart pub get
          dart analyze .
          dart test
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  build-ios-simulator:
    needs: unit-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - name: Package iOS Simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app dayspark-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: dayspark-ios-simulator.zip

  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Contracts analyze + test
        working-directory: packages/dayspark_contracts
        run: |
          dart pub get
          dart analyze .
          dart test
      - name: Server analyze + test
        working-directory: server
        run: |
          dart pub get
          dart analyze .
          dart test
      - name: MCP stdio wrapper test
        working-directory: tool/mcp_stdio_wrapper
        run: |
          dart pub get
          dart test
      - name: dayspark_cli test
        working-directory: tool/dayspark_cli
        run: |
          dart pub get
          dart test

  build-web:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - name: Web smoke — 白屏即红 / fail if the page renders blank
        run: dart run tool/web_smoke.dart --dir build/web --screenshot build/web-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke-screenshot
          path: build/web-smoke.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  build-android:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Build installable QA APK (pull request)
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug
      - name: Verify QA APK signature
        if: github.event_name == 'pull_request'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: android-apk-qa
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Set up Android release signing (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > android/app/release-keystore.jks
          cat > android/app/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release-keystore.jks
          EOF
      - name: Build signed release APK (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flutter build apk --release
      - name: Verify release APK signature (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    needs: unit-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Run native UI integration flows
        run: tool/test_ui.sh
      - run: flutter build macos --release
      - name: Verify macOS bundle signature
        run: codesign --verify --deep --strict --verbose=2 build/macos/Build/Products/Release/DaySpark.app
      - name: Package macOS QA app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/DaySpark.app dayspark-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dayspark-macos.zip

  test:
    if: always()
    needs: [unit-test, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require unit and macOS checks
        env:
          UNIT_RESULT: ${{ needs.unit-test.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
        run: test "$UNIT_RESULT" = success && test "$MACOS_RESULT" = success

  build-windows:
    needs: unit-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows portable build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dayspark-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dayspark-windows-portable.zip

  build-linux:
    needs: unit-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tool/check_glibc_version.sh build/linux/x64/release/bundle/
      - name: Package Linux bundle preserving executable bits
        run: tar -C build/linux/x64/release -czf dayspark-linux.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dayspark-linux.tar.gz
