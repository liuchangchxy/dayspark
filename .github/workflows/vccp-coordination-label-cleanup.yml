name: Coordination Label Cleanup

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    name: Remove active coordination labels after Issue close
    runs-on: ubuntu-latest
    steps:
      - name: Remove active coordination labels and preserve terminal evidence
        uses: liuchangchxy/vibe-coding-control-plane/.github/actions/coordination-label-cleanup@697e68efefac1bb6ba1ce865cfa7da8bd4794a40
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
