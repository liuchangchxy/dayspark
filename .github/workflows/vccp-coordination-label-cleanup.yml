name: Coordination Label Cleanup

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    name: Remove active coordination labels after Issue close
    runs-on: ubuntu-latest
    steps:
      - name: Remove active coordination labels and preserve terminal evidence
        uses: liuchangchxy/vibe-coding-control-plane/.github/actions/coordination-label-cleanup@28698a297d12d09c379a1113f5d7314b2eb20036
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
